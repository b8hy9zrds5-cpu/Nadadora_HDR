-yo de-lli skia-VÓ-ni", "lat": 45.436184, "lng": 12.346003, "type": "visita", "meta": {"tiempo": "40-60 minutos"}, "sections": {"descripcion": ["La Scuola di San Giorgio degli Schiavoni es un pequeño edificio de confraternidad que conserva uno de los ciclos pictóricos más admirados de Vittore Carpaccio. La escala íntima permite contemplar las obras a poca distancia y seguir sus escenas como capítulos de una narración visual."], "historia": ["La confraternidad fue fundada en el siglo XV por dálmatas establecidos en Venecia, conocidos como schiavoni. Representaba a marineros, comerciantes y trabajadores vinculados a los territorios orientales de la República. A comienzos del siglo XVI encargó a Carpaccio escenas de san Jorge, san Trifón y san Jerónimo."], "arquitectura": ["El edificio presenta una fachada renacentista modesta y dos salas superpuestas. La planta baja concentra el ciclo de Carpaccio. La sencillez arquitectónica intensifica la atención sobre las pinturas y recuerda que las scuole nacionales eran instituciones comunitarias, religiosas y asistenciales."], "arte": ["Entre las escenas esenciales están San Jorge y el dragón, El triunfo de san Jorge, San Jerónimo conduciendo al monasterio al león y La visión de san Agustín. Carpaccio combina arquitectura imaginaria, animales, detalles cotidianos y paisajes con una extraordinaria capacidad narrativa."], "curiosidades": ["La escena de san Agustín incluye un pequeño perro y un estudio lleno de objetos, libros e instrumentos, convirtiéndose en una de las imágenes más evocadoras del humanismo veneciano. El ciclo permanece en su emplazamiento original, circunstancia excepcional."], "consejos": ["Es fácil pasar de largo por su fachada discreta. Reservar 45 minutos y comprobar el horario, que puede ser limitado. La cercanía a San Zaccaria y al Arsenal permite integrarla en un recorrido por Castello."]}}, {"name": "CAMPO SANTO STEFANO", "fonetica": "CÁM-po SÁN-to STÉ-fa-no", "lat": 45.433329, "lng": 12.330539, "type": "visita", "meta": {"tiempo": "20-40 minutos"}, "sections": {"descripcion": ["Campo Santo Stefano es uno de los espacios abiertos más amplios de Venecia y funciona como transición entre San Marco, la Accademia y el área de Sant’Angelo. Su tamaño permite percibir el trazado urbano con una amplitud poco habitual entre canales y callejones."], "historia": ["El campo se desarrolló junto a la iglesia agustina de Santo Stefano y estuvo rodeado por residencias aristocráticas. Durante siglos acogió ceremonias, fiestas y corridas de toros, práctica que se mantuvo en Venecia hasta comienzos del siglo XIX."], "arquitectura": ["La forma alargada queda definida por palacios de épocas diferentes, la iglesia gótica y el antiguo convento, hoy relacionado con el Instituto Veneto. El campanile de Santo Stefano presenta una inclinación visible. La estatua de Niccolò Tommaseo ocupa el centro."], "arte": ["Conviene observar Palazzo Loredan, Palazzo Morosini y los accesos hacia el Ponte dell’Accademia. La iglesia de Santo Stefano conserva un notable techo de madera en forma de quilla y obras de Tintoretto, aunque su entrada es un punto independiente."], "curiosidades": ["La estatua de Tommaseo recibe el apodo popular de “el cagalibri” por los libros amontonados detrás de la figura. El campo también fue escenario de uno de los violentos juegos y espectáculos populares de la ciudad."], "consejos": ["Es un buen lugar para descansar, pero las terrazas ocupan parte del espacio. Por la mañana resulta tranquilo; por la tarde actúa como cruce muy concurrido."]}}, {"name": "ARSENALE DI VENEZIA", "fonetica": "ar-se-NÁ-le di ve-NÉ-tsia", "lat": 45.434748, "lng": 12.349897, "type": "visita", "meta": {"tiempo": "30-60 minutos exterior; más con exposición"}, "sections": {"descripcion": ["El Arsenal fue el corazón industrial y militar de la República. Su escala permite corregir la imagen de Venecia como ciudad dedicada únicamente al comercio y al arte: aquí se construían, armaban y reparaban barcos mediante una organización del trabajo extraordinariamente avanzada para la Europa preindustrial."], "historia": ["Fundado tradicionalmente en el siglo XII y ampliado durante siglos, el Arsenal llegó a ocupar una extensa área de Castello. En momentos de máxima actividad empleó a miles de arsenalotti. La producción estandarizada de piezas y la secuencia de montaje permitían preparar galeras con gran rapidez. Tras la caída de la República continuó con usos navales."], "arquitectura": ["La Porta Magna, construida en el siglo XV, es considerada una de las primeras obras plenamente renacentistas de Venecia. Los leones de piedra proceden de distintos lugares del Mediterráneo oriental. Dentro se conservan dársenas, talleres, cordelerías y naves industriales, aunque gran parte pertenece a la Marina o se utiliza durante la Biennale."], "arte": ["Desde el exterior se observan la Porta Magna, las torres de entrada de agua y largos muros. Las Corderie, enormes naves para fabricar cabos, forman hoy parte de los espacios de la Biennale. El Museo Storico Navale, cercano, complementa la visita."], "curiosidades": ["Dante menciona el Arsenal en la Divina Comedia y compara la brea hirviente de los astilleros con una fosa infernal. Los leones de la puerta incluyen inscripciones antiguas y fueron trasladados como trofeos."], "consejos": ["No debe asumirse que todo el recinto es visitable. El acceso depende de actividades de la Biennale, eventos o visitas específicas. Recorrer el perímetro exterior y la zona de la Porta Magna ya permite comprender su dimensión."]}}, {"name": "PALAZZO CONTARINI DEL BOVOLO", "fonetica": "pa-LÁT-so con-ta-RÍ-ni del BÓ-vo-lo", "lat": 45.434858, "lng": 12.334534, "type": "visita", "meta": {"tiempo": "35-50 minutos"}, "sections": {"descripcion": ["El Palazzo Contarini del Bovolo es célebre por su escalera helicoidal exterior, una de las imágenes más singulares del Renacimiento veneciano. Oculto en una pequeña corte, combina la sorpresa del descubrimiento con una subida panorámica que permite leer tejados, campanarios y cúpulas desde una altura intermedia, más íntima que la del Campanile de San Marcos."], "historia": ["El palacio perteneció a una rama de la familia Contarini. La torre de la escalera fue añadida a finales del siglo XV, probablemente por Giovanni Candi. El término bovolo significa caracol en veneciano y acabó incorporándose al nombre de la familia. El edificio tuvo usos residenciales y más tarde alojó actividades diversas, incluida una pensión vinculada al pintor Tintoretto en la tradición local."], "arquitectura": ["La escalera se desarrolla en una torre cilíndrica abierta mediante una sucesión de logias ascendentes. Los arcos de medio punto, las columnas y la alternancia de ladrillo y piedra combinan tradición gótica veneciana y lenguaje renacentista. La solución no es solo decorativa: convierte la circulación vertical en fachada y crea una perspectiva rítmica muy fotogénica."], "arte": ["Además de la escalera, la visita incluye normalmente el pequeño belvedere y espacios expositivos. Desde arriba se distinguen el Campanile, las cúpulas de San Marcos, el perfil de Santa Maria della Salute y la masa irregular de cubiertas venecianas. Conviene mirar también el aljibe y la configuración de la corte."], "curiosidades": ["El palacio aparece en la película Otelo de Orson Welles, que utilizó distintos lugares venecianos para construir un espacio cinematográfico imaginario. La torre demuestra que algunos de los rincones más conocidos de Venecia no se descubren desde los canales principales, sino entrando por callejones casi anónimos."], "consejos": ["La corte es pequeña y puede saturarse. Conviene reservar entrada y acudir pronto. La escalera exige subir numerosos peldaños y puede resultar incómoda con lluvia. Hay un punto duplicado en el KML; ambas referencias corresponden al mismo edificio."]}}, {"name": "LEONARDO DA VINCI MUSEUM", "fonetica": "le-o-NÁR-do da VÍN-chi mu-SÉ-um", "lat": 45.433033, "lng": 12.325236, "type": "visita", "meta": {"tiempo": "60-90 minutos"}, "sections": {"descripcion": ["La exposición dedicada a Leonardo presenta reconstrucciones de máquinas, modelos, reproducciones de códices y recursos interactivos para explicar su método de observación. Puede resultar entretenida para familias o para quien quiera una introducción divulgativa, pero no debe confundirse con una colección de obras originales del artista."], "historia": ["Leonardo visitó Venecia en 1500 como experto militar y estudió sistemas defensivos frente a la amenaza otomana. La exposición utiliza esa conexión histórica para contextualizar sus proyectos de ingeniería, anatomía, vuelo, hidráulica y mecánica."], "arquitectura": ["El montaje suele organizarse en ámbitos temáticos con modelos manipulables. Su valor es didáctico más que arquitectónico; la experiencia depende de la calidad de las reconstrucciones y explicaciones."], "arte": ["Conviene distinguir entre facsímiles, reconstrucciones modernas y piezas originales. La muestra ayuda a comprender cómo Leonardo combinaba dibujo, escritura especular y experimentación."], "curiosidades": ["El nombre “museo de Leonardo” se utiliza en numerosas ciudades italianas para exposiciones diferentes. No todas pertenecen a una misma institución ni conservan originales."], "consejos": ["Priorizarla solo si interesa especialmente Leonardo o si se viaja con niños. Comprobar ubicación, horario y contenido vigente, porque estas exposiciones pueden cambiar de sede o formato."]}}, {"name": "COLLEZIONE PEGGY GUGGENHEIM", "fonetica": "col-le-TSIÓ-ne PÉ-gui GÚ-gue-naim", "lat": 45.430821, "lng": 12.331537, "type": "visita", "meta": {"tiempo": "90-150 minutos"}, "sections": {"descripcion": ["La Colección Peggy Guggenheim es uno de los museos esenciales de arte moderno en Italia. Su fuerza no reside en abarcar toda la historia del siglo XX, sino en ofrecer una selección muy personal reunida por una coleccionista que conoció a muchos de los artistas y convirtió su casa veneciana en un lugar de encuentro."], "historia": ["Peggy Guggenheim adquirió el Palazzo Venier dei Leoni en 1949 y vivió allí hasta su muerte en 1979. Había organizado en Londres la galería Guggenheim Jeune y en Nueva York Art of This Century, fundamental para la difusión de la vanguardia europea y el expresionismo abstracto. La colección pasó a la Solomon R. Guggenheim Foundation."], "arquitectura": ["El palacio es singular porque quedó inacabado y conserva una sola planta sobre el Gran Canal. Su fachada baja crea una relación directa con el agua. Los interiores domésticos, el jardín de esculturas y la terraza ofrecen una experiencia distinta de los grandes palacios-museo."], "arte": ["La colección incluye obras de Picasso, Braque, Duchamp, Kandinsky, Klee, Miró, Dalí, Magritte, Pollock y muchos otros. Destacan El ángel de la ciudad de Marino Marini en la terraza y la sala dedicada a Jackson Pollock. También se expone la colección Schulhof."], "curiosidades": ["Peggy Guggenheim está enterrada en el jardín junto a sus perros. Durante la Biennale de 1948 presentó su colección en el pabellón griego, ofreciendo a Europa una visión conjunta de las vanguardias y del nuevo arte estadounidense."], "consejos": ["Comprar entrada anticipada en temporada alta. Reservar al menos hora y media y dedicar tiempo al jardín y a la terraza. El museo cierra habitualmente los martes, dato importante para organizar los días."]}}, {"name": "BASILICA DI SANTA MARIA GLORIOSA DEI FRARI", "fonetica": "ba-SÍ-li-ca di SÁN-ta ma-RÍ-a glo-RIÓ-sa dei FRÁ-ri", "lat": 45.436986, "lng": 12.3266, "type": "visita", "meta": {"tiempo": "75-120 minutos"}, "sections": {"descripcion": ["Los Frari es una de las iglesias góticas más importantes de Venecia y un lugar imprescindible para comprender la relación entre espiritualidad franciscana, poder patricio y pintura veneciana. Su exterior de ladrillo es austero, pero el interior reúne obras maestras, monumentos funerarios y un espacio de enorme profundidad."], "historia": ["Los franciscanos se establecieron en la zona en el siglo XIII. La iglesia actual se construyó principalmente entre los siglos XIV y XV. Su proximidad a San Rocco convirtió el área en un importante foco religioso y asistencial. La basílica fue lugar de enterramiento de artistas, dogos y figuras políticas."], "arquitectura": ["La arquitectura gótica de ladrillo se organiza en tres naves, crucero y capillas. El coro de madera ocupa una posición central poco habitual y conserva una extraordinaria sillería. La gran fachada y el campanile expresan monumentalidad sin recurrir al revestimiento marmóreo de otras iglesias."], "arte": ["La Asunción de la Virgen de Tiziano domina el altar mayor y revolucionó la pintura veneciana por su escala y dinamismo. También destacan la Madonna di Ca’ Pesaro del mismo artista, el tríptico de Giovanni Bellini, el monumento piramidal de Canova, la tumba de Tiziano y numerosos sepulcros."], "curiosidades": ["El monumento a Canova fue diseñado originalmente por el escultor para Tiziano y adaptado después para custodiar su corazón. La tumba monumental de Tiziano se levantó siglos después de su muerte. La basílica condensa así proyectos, memorias y homenajes de épocas muy diferentes."], "consejos": ["Necesita al menos una hora. Empezar por la nave central y el altar de Tiziano, pero recorrer después capillas y transeptos. La iluminación puede ser tenue y conviene usar la guía del templo."]}}, {"name": "CA’ PESARO", "fonetica": "ca pe-SÁ-ro", "lat": 45.441063, "lng": 12.331632, "type": "visita", "meta": {"tiempo": "90-150 minutos"}, "sections": {"descripcion": ["Ca’ Pesaro es un gran palacio barroco sobre el Gran Canal que alberga la Galería Internacional de Arte Moderno y el Museo de Arte Oriental. La visita combina arquitectura, coleccionismo y una selección de obras de los siglos XIX y XX."], "historia": ["El palacio fue encargado por la familia Pesaro a Baldassare Longhena en el siglo XVII y concluido por Antonio Gaspari. Tras pasar por distintos propietarios, la duquesa Felicita Bevilacqua La Masa lo legó a la ciudad para apoyar a jóvenes artistas. En 1902 se instaló la galería de arte moderno."], "arquitectura": ["La fachada utiliza un orden monumental de columnas, ventanas profundas y piedra de Istria. Longhena intensificó el claroscuro mediante salientes y huecos, creando una versión poderosa del palacio barroco veneciano. El portego y la relación con el canal conservan la lógica de residencia patricia."], "arte": ["Las colecciones incluyen obras de Klimt, Rodin, Kandinsky, Klee, Bonnard y artistas italianos. El Museo de Arte Oriental reúne piezas japonesas, chinas e indonesias procedentes en gran parte de la colección del príncipe Enrique de Borbón."], "curiosidades": ["El museo de arte moderno nació en una ciudad asociada sobre todo al pasado, pero la Biennale y colecciones como esta muestran la voluntad veneciana de participar en la cultura contemporánea."], "consejos": ["Consultar plantas abiertas, porque los montajes pueden cambiar. La vista desde las ventanas sobre el Gran Canal forma parte de la visita. Suele cerrar los lunes, salvo cambios estacionales."]}}, {"name": "DAL NONO COLUSSI", "fonetica": "dal NÓ-no co-LÚS-si", "lat": 45.4326899, "lng": 12.3239793, "type": "restaurante", "meta": {"tiempo": "10-20 minutos"}, "sections": {"descripcion": ["Dal Nono Colussi es una panadería histórica conocida por la fugassa veneziana, un dulce fermentado emparentado con la focaccia y el panettone, aromatizado y cubierto con azúcar o almendra. Es una parada gastronómica que permite introducir una tradición local vinculada a celebraciones y desayunos."], "historia": ["La panadería familiar mantiene una actividad artesanal en Dorsoduro. La fugassa se asociaba tradicionalmente a Pascua y a celebraciones domésticas, aunque hoy puede encontrarse en distintos momentos del año."], "arquitectura": ["El interés no es arquitectónico, sino gastronómico y urbano: se integra en un área residencial próxima a San Sebastiano y la Toletta, lejos del eje más monumental."], "arte": ["Además de la fugassa, pueden encontrarse galletas y productos de horno venecianos. La disponibilidad depende de la producción del día."], "curiosidades": ["La fugassa no debe confundirse con la focaccia salada ligur. En el Véneto designa un dulce alto y esponjoso."], "consejos": ["Ir por la mañana para encontrar mayor variedad. Consultar apertura y no dar por garantizado un producto concreto al final del día."]}}, {"name": "SACCA DELLA TOLETTA", "fonetica": "SÁC-ca DÉL-la to-LÉT-ta", "lat": 45.4317083, "lng": 12.3262975, "type": "visita", "meta": {"tiempo": "20-40 minutos"}, "sections": {"descripcion": ["La Sacca della Toletta y las calles próximas forman un pequeño núcleo cotidiano de Dorsoduro, conocido por librerías, bares y locales de tramezzini. La parada tiene sentido como descanso dentro del itinerario entre Accademia, Zattere y San Barnaba."], "historia": ["El término sacca designa un espacio ganado o parcialmente cerrado sobre la laguna. La zona se consolidó con usos residenciales y comerciales vinculados a los recorridos internos de Dorsoduro."], "arquitectura": ["La arquitectura es doméstica: fachadas estrechas, pequeños puentes, comercios en planta baja y canales secundarios. Su interés está en la escala del barrio, no en un monumento aislado."], "arte": ["El tramezzino veneciano se caracteriza por el pan blando y una cantidad generosa de relleno, que crea su perfil abombado. Los sabores tradicionales incluyen atún y huevo, jamón y setas, cangrejo o combinaciones con alcachofa."], "curiosidades": ["La palabra tramezzino fue propuesta por Gabriele D’Annunzio como alternativa italiana a sandwich, aunque el estilo veneciano desarrolló una identidad propia."], "consejos": ["Usar la parada para comer algo rápido sin convertirla en una obligación rígida. Los locales pequeños pueden llenarse y algunos productos se agotan."]}}, {"name": "ANTICA OSTERIA RUGA RIALTO", "fonetica": "an-TÍ-ca os-te-RÍ-a RÚ-ga ri-ÁL-to", "lat": 45.4381599, "lng": 12.3338223, "type": "restaurante", "meta": {"tiempo": "60-90 minutos"}, "sections": {"descripcion": ["Antica Osteria Ruga Rialto es una referencia gastronómica en el entorno de Rialto, adecuada para probar cocina veneciana en una zona históricamente ligada al mercado y al abastecimiento de la ciudad."], "historia": ["Las osterie de Rialto nacieron en estrecha relación con comerciantes, trabajadores del mercado, barqueros y compradores. La cocina de la zona se apoya en pescado, verduras de la laguna, polenta, bacalao y preparaciones sencillas de producto."], "arquitectura": ["El local se integra en el tejido de calli y rughe del mercado. Ruga designa una calle con actividad comercial, término muy asociado a Rialto."], "arte": ["Conviene buscar platos venecianos como sarde in saor, baccalà mantecato, polenta, sepia en su tinta o pescado del día, según disponibilidad y carta."], "curiosidades": ["En Venecia, bacaro, osteria y trattoria no son categorías completamente rígidas. Algunos establecimientos combinan cicchetti, vino y comidas más completas."], "consejos": ["Reservar si se desea una comida formal. Comprobar horario y día de cierre. En zonas turísticas conviene revisar la carta y precios antes de sentarse."]}}, {"name": "AL MASCARON", "fonetica": "al mas-ca-RÓN", "lat": 45.43778, "lng": 12.34215, "type": "restaurante", "meta": {"horario": "Horario de cocina variable. Confirmar directamente con el restaurante y reservar, especialmente para la cena.", "precio": "Precio según carta. Restaurante de comida completa, con coste superior al de una parada de cicchetti."}, "sections": {"descripcion": [], "historia": ["El nombre “mascaron” alude a las máscaras grotescas talladas en piedra que aparecen en fachadas, claves de arco y fuentes. En Venecia estos rostros servían a veces como elementos apotropaicos, destinados simbólicamente a ahuyentar el mal. La elección del nombre encaja bien con una ciudad donde la máscara no pertenece solo al carnaval, sino también a la arquitectura y a la cultura visual cotidiana."], "arquitectura": ["Conviene valorar el restaurante como una parada de comida completa, no como un bacaro rápido. Los platos de pescado y marisco dependen de la disponibilidad y pueden variar. En establecimientos pequeños de Castello, la reserva evita llegar cuando la cocina está llena o cuando ya no quedan mesas. También es recomendable confirmar si el servicio es únicamente de cena o si abre al mediodía en la fecha concreta."], "arte": ["Para integrarlo en el itinerario, funciona bien después de visitar San Giovanni e Paolo, la Scuola Grande di San Marco o Santa Maria dei Miracoli. Desde el punto de vista práctico, no merece la pena atravesar media ciudad únicamente por una reserva si la jornada se encuentra en otra zona; su valor aumenta cuando forma parte de un recorrido por Castello."], "curiosidades": [], "consejos": []}}, {"name": "AL COVO", "fonetica": "al CÓ-vo", "lat": 45.434193, "lng": 12.347613, "type": "restaurante", "meta": {"horario": "Servicio de comida y cena en días concretos; suele cerrar varios turnos semanales. Consultar calendario oficial y reservar.", "precio": "Restaurante de gama media-alta/alta. Precio según carta o menú."}, "sections": {"descripcion": [], "historia": ["El proyecto nació en 1987 de la mano de Cesare Benelli y Diane Rankin. Su identidad combina sensibilidad veneciana y una cultura gastronómica internacional, pero evita convertir la cocina local en una sucesión de tópicos turísticos. El restaurante ha defendido durante años la trazabilidad del producto y la relación directa con pescadores, agricultores y pequeños proveedores."], "arquitectura": ["El espacio ocupa una antigua construcción de Castello y mantiene una escala íntima. La experiencia se apoya más en la hospitalidad, la vajilla, el ritmo del servicio y la calidad de la materia prima que en una arquitectura espectacular. Es especialmente interesante para comprender platos de la tradición lagunar como el pescado del Adriático, las moeche cuando están en temporada, las verduras de Sant’Erasmo o preparaciones con polenta."], "arte": ["La reserva es prácticamente imprescindible. Conviene avisar con antelación de alergias y comprobar el precio de menús o platos especiales. Por su duración y coste, debe considerarse una de las comidas principales del viaje y no colocarse entre dos visitas con hora cerrada."], "curiosidades": [], "consejos": []}}, {"name": "OSTERIA ALLA STAFFA", "fonetica": "os-te-RÍ-a ÁL-la STÁF-fa", "lat": 45.438392, "lng": 12.342813, "type": "restaurante", "meta": {"horario": "Horario variable, normalmente con servicio de comida y cena y días de descanso semanales. Confirmar y reservar.", "precio": "Precio según carta; gama media."}, "sections": {"descripcion": [], "historia": ["La palabra staffa significa estribo. El nombre transmite el carácter tradicional del establecimiento, aunque el local actual responde a una restauración contemporánea. Como ocurre en muchas osterie venecianas, el reducido número de mesas forma parte de la experiencia, pero también implica que llegar sin reserva puede ser arriesgado."], "arquitectura": ["Conviene preguntar por los platos del día y no limitarse a los nombres más conocidos. En la cocina veneciana, la disponibilidad del pescado, la estacionalidad de las verduras y el mercado condicionan la oferta. Preparaciones como sarde in saor, baccalà mantecato, pasta con marisco o pescado a la parrilla pueden aparecer según temporada."], "arte": ["El restaurante encaja bien después de un recorrido por Santa Maria Formosa, Libreria Acqua Alta, Santa Maria dei Miracoli o San Zanipolo. Hay que prever al menos hora y media y evitar reservas demasiado próximas a entradas con hora asignada."], "curiosidades": [], "consejos": []}}, {"name": "HOSTARIA DA FRANZ", "fonetica": "os-ta-RÍ-a da FRANTS", "lat": 45.435502, "lng": 12.346796, "type": "visita", "meta": {"horario": "Confirmar días de apertura y horarios de cocina. Reserva recomendable.", "precio": "Precio según carta; gama media-alta."}, "sections": {"descripcion": [], "historia": ["El término hostaria conserva la memoria de los locales donde se servían vino y comida sencilla. En la actualidad, el establecimiento funciona como restaurante de mesa y no como bacaro. La cocina de Castello estuvo históricamente ligada a trabajadores del Arsenal, marineros y actividades portuarias; esa relación con el mar sigue presente en la identidad gastronómica del barrio."], "arquitectura": ["Conviene consultar la carta y los platos fuera de carta, especialmente cuando se ofrecen pescados enteros cuyo precio depende del peso. Preguntar antes evita sorpresas. Como en otros restaurantes venecianos, el servicio, el cubierto y el vino pueden elevar el coste final respecto al precio visible de un plato."], "arte": ["La reserva es aconsejable y debe coordinarse con el recorrido. Funciona bien después de visitar San Giorgio degli Schiavoni o antes de adentrarse hacia el Arsenal. No es una opción apropiada para una parada de veinte minutos."], "curiosidades": [], "consejos": []}}, {"name": "OSTERIA OLIVA NERA", "fonetica": "os-te-RÍ-a o-LÍ-va NÉ-ra", "lat": 45.435617, "lng": 12.345244, "type": "restaurante", "meta": {"horario": "Apertura y turnos variables. Reserva muy recomendable.", "precio": "Precio según carta; gama media-alta."}, "sections": {"descripcion": [], "historia": ["El local se asocia a Isabella y Dino, anfitriones que han dado al restaurante una identidad muy personal. Esa escala familiar puede ser una ventaja, aunque también exige reservar: el número de mesas es limitado y el ritmo depende del servicio del día."], "arquitectura": ["La cocina suele incluir pescado, pasta fresca, marisco y especialidades del Véneto. Más que buscar una lista fija de platos, conviene escuchar las recomendaciones y preguntar qué producto ha llegado ese día. En Venecia, la calidad de un restaurante de pescado depende en gran medida de esa flexibilidad."], "arte": ["Hay que considerarlo una comida completa y reservar tiempo suficiente. Es recomendable verificar tanto la hora como las condiciones de cancelación, pues los pequeños restaurantes pueden organizar compras y personal según las reservas."], "curiosidades": [], "consejos": []}}, {"name": "RESTAURANT TERRAZZA DANIELI", "fonetica": "res-to-RÁNT te-RRÁT-sa da-ni-É-li", "lat": 45.433996, "lng": 12.342035, "type": "restaurante", "meta": {"horario": "Horarios distintos para desayuno, comida y cena. La terraza puede depender de la meteorología. Reserva imprescindible para asegurar disponibilidad.", "precio": "Restaurante de lujo. Precio elevado según carta y bebidas."}, "sections": {"descripcion": [], "historia": ["El Hotel Danieli integra varios edificios, entre ellos el antiguo Palazzo Dandolo, relacionado con una poderosa familia veneciana. Durante los siglos XIX y XX se convirtió en alojamiento de viajeros, escritores, artistas y figuras políticas. La terraza responde a la transformación de los palacios históricos en espacios de hotelería de lujo."], "arquitectura": ["El principal valor del restaurante es la posición. La luz cambia radicalmente entre el desayuno, el almuerzo y la cena. Al atardecer, la silueta de San Giorgio y el movimiento de la laguna adquieren especial protagonismo, pero es también el momento más solicitado. La cocina se presenta en clave contemporánea y el coste refleja la categoría del hotel y la ubicación."], "arte": ["Reservar con antelación y solicitar mesa exterior sin dar por hecho que estará garantizada. El viento, la lluvia o decisiones operativas pueden trasladar el servicio al interior. Para disfrutar de la vista sin asumir el coste de una cena completa, puede estudiarse la posibilidad de desayuno, aperitivo o bebida, siempre comprobando las condiciones vigentes."], "curiosidades": [], "consejos": []}}, {"name": "CHIESA DI SAN SIMEON PICCOLO", "fonetica": "KIÉ-sa di san si-me-ÓN PÍC-co-lo", "lat": 45.440301, "lng": 12.322437, "type": "visita", "meta": {"horario": "Apertura vinculada al culto y a la comunidad religiosa. La cripta puede tener acceso limitado. Confirmar antes de desplazarse expresamente.", "precio": "Acceso al culto gratuito; posible donativo o condiciones específicas para la cripta."}, "sections": {"descripcion": [], "historia": ["La iglesia actual fue levantada entre 1718 y 1738 según proyecto de Giovanni Antonio Scalfarotto, sustituyendo a un templo anterior. Se dedicó a los santos Simeón y Judas, aunque el uso cotidiano conserva el nombre de San Simeon Piccolo para diferenciarla de San Simeon Grande. La obra se sitúa en la etapa final de la gran arquitectura religiosa de la República."], "arquitectura": ["La fachada adopta la forma de un pórtico corintio rematado por frontón triangular, mientras que la gran cúpula se eleva sobre un tambor circular. La composición recuerda de manera libre al Panteón de Roma, pero adaptada a un solar veneciano y a una lectura frontal desde el canal. La desproporción aparente entre el pórtico y la cúpula forma parte de su singularidad."], "arte": ["Bajo la iglesia se extiende una cripta con corredores y pequeñas capillas decoradas con pinturas de tema funerario. Es una de las zonas más sorprendentes, aunque su acceso depende de la apertura y de las actividades religiosas. En años recientes el templo ha estado vinculado a la celebración de la liturgia tradicional en latín."], "curiosidades": ["La mejor vista exterior se obtiene desde la explanada de la estación o desde un vaporetto. Para fotografiarla conviene incluir el Gran Canal, las embarcaciones y el contexto urbano. El interior no siempre está abierto, por lo que debe tratarse como visita condicionada."], "consejos": []}}, {"name": "FONDAMENTE NOVE", "fonetica": "fon-da-MÉN-te NUÓ-ve", "lat": 45.442759, "lng": 12.341091, "type": "visita", "meta": {"horario": "Espacio público abierto permanentemente. Los embarcaderos funcionan según los horarios de ACTV.", "precio": "Paseo gratuito. Transporte público sujeto al billete o abono vigente."}, "sections": {"descripcion": [], "historia": ["El nombre significa “fundamentas nuevas” y recuerda las obras de acondicionamiento realizadas en este borde urbano. Durante siglos, la fachada norte fue un límite menos representativo que el frente de San Marcos, expuesto a vientos, mareas y actividades portuarias. La construcción de muelles continuos transformó la relación entre la ciudad y la laguna septentrional."], "arquitectura": ["La arquitectura no forma una escena unitaria: alterna edificios residenciales, hospitales, iglesias, embarcaderos y muros de conventos. Precisamente esa falta de monumentalidad homogénea ayuda a leer Venecia como una ciudad funcional. Desde algunos tramos se reconoce con claridad el recinto arbolado de San Michele y los perfiles de Murano."], "arte": ["Es un lugar especialmente atractivo al amanecer, cuando la luz llega desde el este, y al final del día, cuando disminuye el movimiento. El viento puede ser fuerte y la sensación térmica más baja que en calles interiores. Para desplazarse a Murano, Burano o San Francesco del Deserto, conviene localizar con antelación el embarcadero exacto, porque la denominación Fondamente Nove abarca varias plataformas."], "curiosidades": [], "consejos": []}}, {"name": "CHIESA DEI GESUITI", "fonetica": "KIÉ-sa dei ye-SU-Í-ti", "lat": 45.443364, "lng": 12.339134, "type": "visita", "meta": {"horario": "Horario de visita diurno, sujeto a celebraciones religiosas y posibles cierres al mediodía.", "precio": "Puede solicitarse entrada o contribución para la visita cultural; acceso al culto gratuito."}, "sections": {"descripcion": [], "historia": ["Los cruzados y posteriormente otras comunidades religiosas ocuparon la zona antes de la llegada definitiva de los jesuitas. Tras la readmisión de la orden en Venecia, la iglesia actual se levantó principalmente entre 1715 y 1729 según proyecto de Domenico Rossi, con financiación vinculada a la familia Manin. Su construcción pertenece a un momento tardío de la República, cuando el barroco se utilizaba para afirmar identidad religiosa y prestigio familiar."], "arquitectura": ["La planta se organiza en una gran nave con capillas laterales y transepto. El efecto más singular procede del mármol verde de Tesalia, cortado y dispuesto para imitar damascos. Esta técnica convierte un material pétreo en una superficie aparentemente textil. La fachada reúne apóstoles y esculturas de Giuseppe Torretti y otros autores."], "arte": ["Entre las obras fundamentales se encuentra el Martirio de san Lorenzo de Tiziano, una pintura dramática donde la iluminación nocturna dirige la escena. También destacan la Asunción de Tintoretto, el monumento de la familia Da Lezze y el altar mayor. Conviene acercarse a los revestimientos para comprobar cómo las vetas del mármol producen el dibujo de los pliegues."], "curiosidades": ["La iglesia se encuentra cerca de Fondamente Nove y puede integrarse antes de tomar un vaporetto hacia las islas. Al ser un espacio de culto, deben respetarse celebraciones y silencios. La iluminación interior puede ser tenue."], "consejos": []}}, {"name": "CALLE CONTARINI DEL BOVOLO", "fonetica": "CÁL-le con-ta-RÍ-ni del BÓ-vo-lo", "lat": 45.435077, "lng": 12.334594, "type": "visita", "meta": {"horario": "La calle y el patio exterior se pueden recorrer libremente; la escalera tiene horario y entrada propios.", "precio": "Exterior gratuito. Entrada de pago para subir a la Scala Contarini del Bovolo."}, "sections": {"descripcion": [], "historia": ["El término bovolo significa caracol en veneciano y hace referencia a la escalera de finales del siglo XV. La familia Contarini, una de las más influyentes de la República, añadió la torre al palacio para modernizarlo y reforzar su prestigio. La calle conserva el nombre del edificio y actúa como antesala."], "arquitectura": ["La mejor lectura se obtiene retrocediendo hasta encuadrar toda la sucesión de logias. Los arcos renacentistas, las columnas y la cubierta cónica se superponen a un palacio de tradición gótica. Desde el espacio público se aprecia gratuitamente la composición exterior; el acceso a la escalera y al mirador requiere entrada."], "arte": ["La zona puede saturarse porque el patio es pequeño. Conviene acudir a primera hora y no bloquear el paso de vecinos. El punto fotográfico más útil está ligeramente desplazado hacia el fondo del patio, evitando perspectivas excesivamente inclinadas."], "curiosidades": [], "consejos": []}}, {"name": "CHIESA DI SANTA MARIA DEI MIRACOLI", "fonetica": "KIÉ-sa di SÁN-ta ma-RÍ-a dei mi-RÁ-co-li", "lat": 45.4394, "lng": 12.339151, "type": "visita", "meta": {"horario": "Horario de visita según la red Chorus; puede variar por ceremonias y bodas.", "precio": "Incluida habitualmente en el Chorus Pass o entrada individual según tarifa vigente."}, "sections": {"descripcion": [], "historia": ["La iglesia fue construida entre 1481 y 1489 para albergar una imagen de la Virgen considerada milagrosa. Pietro Lombardo y su taller dirigieron el proyecto, financiado mediante donaciones. La necesidad de encajar el edificio en una parcela reducida junto al agua llevó a una solución compacta y muy refinada."], "arquitectura": ["Las fachadas están revestidas con mármoles de distintos colores dispuestos en paneles geométricos. Pilastras, medallones y arcos organizan una superficie que recuerda un relicario. El interior tiene una sola nave cubierta por bóveda de cañón decorada con casetones. Una escalinata conduce al presbiterio elevado, bajo el cual se encuentra la sacristía."], "arte": ["Conviene observar los relieves de profetas y patriarcas, la balaustrada, la decoración de la bóveda y la forma en que la luz se refleja en los mármoles. El edificio sufrió problemas graves por humedad y sales, y una restauración de gran alcance devolvió estabilidad y legibilidad a sus superficies."], "curiosidades": ["Es una iglesia muy solicitada para bodas, lo que puede alterar la visita. El exterior se fotografía bien desde el puente cercano o desde la fondamenta opuesta. Dedicar tiempo a rodearla permite entender cómo se adapta al canal y a las viviendas."], "consejos": []}}, {"name": "PALAZZO MOCENIGO A SAN STAE", "fonetica": "pa-LÁT-so mo-CHÉ-ni-go a san STÁ-e", "lat": 45.434722, "lng": 12.329506, "type": "visita", "meta": {"horario": "De abril a octubre: 10:00-18:00, último acceso 17:00. Cerrado los lunes. Viernes y sábados del 1 de mayo al 26 de septiembre de 2026: hasta las 20:00, último acceso 19:00.", "precio": "Entrada de pago. Puede estar incluida en billetes combinados o en el Museum Pass MUVE."}, "sections": {"descripcion": [], "historia": ["El edificio perteneció a una rama de la familia Mocenigo, que dio varios dogos a la República. La última propietaria, Alvise Nicolò Mocenigo, legó el palacio a la ciudad en 1945. Desde 1985 funciona como museo y centro de estudios dedicado a la historia del tejido y el traje. La sección del perfume recuerda el papel de Venecia como intermediaria entre Oriente y Europa en el comercio de materias aromáticas."], "arquitectura": ["La fachada hacia el canal es sobria y regular, resultado de remodelaciones de los siglos XVII y XVIII. En el piano nobile, las habitaciones se distribuyen alrededor de un gran salón central, según el modelo del portego veneciano. Los techos, estucos, lámparas, muebles y retratos crean una secuencia ambiental más doméstica que la de los grandes palacios oficiales."], "arte": ["Las colecciones muestran vestidos, chalecos, tejidos, encajes y accesorios, además de instrumentos y materias primas vinculadas a la perfumería. Conviene fijarse en cómo las prendas modificaban la postura y el movimiento, y en la relación entre moda, rango social y ceremonia. La instalación olfativa permite reconocer familias aromáticas e ingredientes históricos."], "curiosidades": ["En junio de 2026 abre de 10:00 a 18:00, con último acceso a las 17:00, y cierra los lunes. Los viernes y sábados comprendidos entre el 1 de mayo y el 26 de septiembre de 2026 tiene apertura ampliada hasta las 20:00, con último acceso a las 19:00. El edificio no dispone de ascensor para acceder a la planta principal, por lo que la accesibilidad debe comprobarse antes de la visita."], "consejos": []}}, {"name": "SQUERO DI SAN TROVASO", "fonetica": "SCUÉ-ro di san TRO-vá-so", "lat": 45.430271, "lng": 12.325889, "type": "visita", "meta": {"horario": "Taller en funcionamiento, visible desde el espacio público. Las visitas interiores, cuando se ofrecen, requieren acuerdo previo.", "precio": "Observación exterior gratuita."}, "sections": {"descripcion": [], "historia": ["Los squeri fueron instalaciones esenciales en una ciudad donde prácticamente todo el transporte dependía de embarcaciones. San Trovaso funciona desde el siglo XVII y mantiene una actividad artesanal real. La construcción de una góndola exige combinar diferentes maderas, ajustar curvaturas asimétricas y adaptar la embarcación a la postura de un único remero."], "arquitectura": ["El conjunto llama la atención por sus edificios de madera, cuya imagen recuerda construcciones alpinas. Esta relación suele explicarse por el origen de parte de los carpinteros y de la madera empleada en los astilleros. La rampa permite sacar las góndolas del agua para trabajar en el casco."], "arte": ["No es un museo de acceso libre. La observación debe hacerse desde la orilla contraria sin interferir con el trabajo. Con suerte pueden verse reparaciones, pintura o maniobras de entrada y salida. La mejor luz suele producirse por la mañana o a última hora, evitando el fuerte contraste del mediodía."], "curiosidades": ["El bacaro Osteria al Squero se encuentra enfrente y convierte el lugar en una parada popular. Esto puede generar aglomeración; conviene mantener libre el paso y no apoyar vasos en elementos privados."], "consejos": []}}, {"name": "CHIESA DI SAN PANTALON", "fonetica": "KIÉ-sa di san pan-ta-LÓN", "lat": 45.435588, "lng": 12.324649, "type": "visita", "meta": {"horario": "Apertura religiosa variable, con posibles cierres al mediodía. Confirmar el mismo día.", "precio": "Entrada habitualmente gratuita; puede solicitarse donativo o pago para iluminación."}, "sections": {"descripcion": [], "historia": ["El templo está dedicado a san Pantaleón, médico y mártir. La iglesia actual fue reconstruida en el siglo XVII sobre edificios anteriores. Gian Antonio Fumiani trabajó durante décadas en la decoración del techo, terminada a comienzos del siglo XVIII. La tradición afirma que murió al caer del andamio, aunque el relato no está plenamente documentado."], "arquitectura": ["La gran pintura, ejecutada sobre numerosos lienzos unidos, representa el martirio y la glorificación de san Pantaleón. Columnas fingidas, arquitecturas, figuras en escorzo y nubes prolongan visualmente el espacio real. A menudo se presenta como una de las mayores pinturas sobre lienzo del mundo, aunque su interés principal no depende del récord, sino de la integración entre imagen y arquitectura."], "arte": ["La iglesia conserva también obras atribuidas a Veronese, Palma il Giovane y otros artistas, además de una capilla con el llamado Santo Clavo. Conviene situarse en distintos puntos de la nave para comprobar cómo cambia la perspectiva del techo. La observación mejora con prismáticos pequeños o con el zoom del teléfono, siempre sin flash."], "curiosidades": ["El horario puede ser reducido y la iluminación requiere a veces una contribución. Debe mantenerse silencio y comprobar si hay celebraciones. Está cerca de Campo Santa Margherita y puede combinarse con San Nicolò dei Mendicoli o la Scuola Grande dei Carmini."], "consejos": []}}, {"name": "LIBRERIA ACQUA ALTA", "fonetica": "li-bre-RÍ-a ÁC-cua ÁL-ta", "lat": 45.438074, "lng": 12.342307, "type": "visita", "meta": {"horario": "Horario comercial variable. Consultar canales oficiales o información del establecimiento.", "precio": "Acceso gratuito; se agradece comprar o respetar el carácter comercial del espacio."}, "sections": {"descripcion": [], "historia": ["La librería fue creada por Luigi Frizzo en 2004. Su nombre alude a la marea alta que puede inundar las plantas bajas venecianas. En lugar de ocultar esa vulnerabilidad, el negocio la incorporó a su identidad. Las fotografías de libros dañados, gatos, góndolas y salidas al canal difundieron rápidamente el lugar en redes sociales."], "arquitectura": ["El espacio se organiza como una secuencia estrecha y abarrotada. Al fondo hay una escalera formada con volúmenes deteriorados y una pequeña salida hacia el canal. Aunque el conjunto resulte pintoresco, sigue siendo un comercio: conviene mirar los libros, comprar si se encuentra algo interesante y no tratarlo únicamente como decorado."], "arte": ["En horas punta se forman colas y la visita puede resultar incómoda. Acudir al abrir o al final del día. No bloquear pasillos ni dedicar sesiones fotográficas largas. Durante episodios de acqua alta, el funcionamiento puede alterarse y algunos espacios quedar mojados."], "curiosidades": [], "consejos": []}}, {"name": "BASILICA DEI SANTI GIOVANNI E PAOLO", "fonetica": "ba-SÍ-li-ca dei SÁN-ti yo-VÁN-ni e PÁ-o-lo", "lat": 45.439379, "lng": 12.341713, "type": "visita", "meta": {"horario": "Horario de visita cultural sujeto a celebraciones. Confirmar en la web oficial.", "precio": "Entrada de pago para la visita cultural; acceso al culto gratuito."}, "sections": {"descripcion": [], "historia": ["La construcción dominica comenzó en el siglo XIII y se prolongó durante los siglos XIV y XV. Los funerales de Estado celebrados aquí reforzaron su función política. Los monumentos no forman una colección neutral: cada uno utiliza escultura, arquitectura, heráldica y epitafios para construir la memoria pública del difunto."], "arquitectura": ["Conviene recorrer el interior de forma pausada, observando cómo cambia el lenguaje funerario desde los sepulcros góticos hasta los grandes arcos triunfales renacentistas. Destacan los monumentos de los dogos Pietro Mocenigo y Andrea Vendramin, el políptico de san Vicente Ferrer de Giovanni Bellini y la capilla del Rosario, reconstruida tras el incendio de 1867."], "arte": ["En el campo exterior, la estatua ecuestre de Bartolomeo Colleoni de Verrocchio y la fachada de la Scuola Grande di San Marco completan uno de los conjuntos monumentales más intensos de Venecia. Para comprenderlo, conviene alternar la visita interior con una lectura del espacio urbano."], "curiosidades": [], "consejos": []}}, {"name": "SCUOLA GRANDE DI SAN MARCO", "fonetica": "SCUÓ-la GRÁN-de di san MÁR-co", "lat": 45.439653, "lng": 12.341467, "type": "visita", "meta": {"horario": "Exterior siempre visible. Salas históricas y museo/biblioteca con horarios específicos y posibles restricciones por la actividad hospitalaria.", "precio": "Exterior gratuito. Interior según modalidad de visita."}, "sections": {"descripcion": [], "historia": ["La confraternidad de San Marcos fue fundada en el siglo XIII. Tras un incendio en 1485, la sede se reconstruyó con participación de Pietro Lombardo, Mauro Codussi y otros maestros. Después de las supresiones napoleónicas, el complejo se integró en el hospital, uso que mantiene."], "arquitectura": ["La fachada combina mármoles policromos, relieves y recursos de perspectiva. Los paneles inferiores crean arquitecturas fingidas mediante una talla en bajorrelieve de enorme precisión. La composición dialoga con la estatua de Colleoni y la masa de San Zanipolo, formando un escenario donde asistencia, poder militar y memoria funeraria se superponen."], "arte": ["En el interior se conservan salas monumentales y una importante biblioteca médica histórica, con instrumentos, libros y documentos. El acceso a estas áreas no siempre coincide con el funcionamiento hospitalario y puede requerir horarios específicos. Incluso si no se entra, la fachada merece una observación lenta, especialmente los leones, los episodios de san Marcos y los efectos ópticos."], "curiosidades": ["Al tratarse de un hospital activo, hay que evitar bloquear accesos y respetar a pacientes y personal. La visita exterior puede hacerse a cualquier hora; para interiores, comprobar previamente."], "consejos": []}}, {"name": "BASILICA DI SAN PIETRO DI CASTELLO", "fonetica": "ba-SÍ-li-ca di san PIÉ-tro di cas-TÉL-lo", "lat": 45.43425, "lng": 12.360088, "type": "visita", "meta": {"horario": "Apertura religiosa limitada y variable. Consultar antes de desplazarse expresamente.", "precio": "Acceso al culto gratuito; posible entrada o donativo para visita cultural."}, "sections": {"descripcion": [], "historia": ["El lugar estuvo ocupado por una iglesia desde la Alta Edad Media. La sede episcopal se trasladó aquí y, con el tiempo, el obispo de Castello se convirtió en patriarca de Venecia. La iglesia actual incorpora fases de los siglos XVI y XVII. Palladio intervino en un proyecto inicial de fachada, aunque la ejecución definitiva y las transformaciones posteriores alteraron su concepción."], "arquitectura": ["La fachada clásica contrasta con el campanile revestido de piedra de Istria, iniciado por Mauro Codussi y visiblemente inclinado. El interior presenta planta basilical y conserva obras, altares y la llamada cátedra de san Pedro, asiento compuesto en parte con una antigua estela funeraria islámica inscrita en árabe."], "arte": ["El campo, el puente y las viviendas crean un ambiente muy distinto del centro. La visita interesa tanto por el edificio como por el desplazamiento hasta él, atravesando sectores residenciales de Castello. Es una excelente parada para quien quiera observar una Venecia silenciosa y con menos comercio turístico."], "curiosidades": ["Conviene comprobar la apertura porque el trayecto es largo. Puede combinarse con el Arsenal, Via Garibaldi y los Giardini. La mejor fotografía incluye el puente, la fachada y el campanile inclinado."], "consejos": []}}, {"name": "ISOLA DI SAN GIORGIO MAGGIORE", "fonetica": "Í-so-la di san YÓR-yo may-YÓ-re", "lat": 45.428869, "lng": 12.343802, "type": "visita", "meta": {"horario": "La basílica, el campanile y los espacios de la Fundación Cini tienen horarios y entradas diferentes. Comprobar antes de viajar.", "precio": "Acceso a la basílica normalmente gratuito; campanile y visitas de la Fundación Cini de pago."}, "sections": {"descripcion": [], "historia": ["La presencia benedictina está documentada desde el siglo X. El conjunto alcanzó gran importancia religiosa y cultural. Andrea Palladio proyectó el refectorio, la iglesia y otras dependencias durante el siglo XVI. Tras las supresiones napoleónicas, el monasterio perdió parte de sus funciones y en el siglo XX fue restaurado por la Fundación Giorgio Cini."], "arquitectura": ["La fachada de la basílica superpone dos frentes clásicos para resolver la diferencia de altura entre nave central y laterales. El interior, blanco y luminoso, expresa el ideal palladiano de proporción. En el presbiterio se conservan grandes lienzos de Tintoretto, entre ellos La última cena y La recogida del maná."], "arte": ["El campanile ofrece una vista extraordinaria de San Marcos, la Giudecca y la laguna. La Fundación Cini gestiona claustros, bibliotecas, exposiciones y jardines, entre ellos el laberinto Borges y las Vatican Chapels, accesibles mediante modalidades concretas de visita."], "curiosidades": ["No debe confundirse el punto general de la isla con la ficha específica de la basílica. Aquí conviene planificar el conjunto: trayectos de vaporetto, campanile, iglesia y posibles visitas culturales. Una estancia completa puede ocupar dos o tres horas."], "consejos": []}}, {"name": "FORTE DI SANT’ANDREA", "fonetica": "FÓR-te di san-tan-DRÉ-a", "lat": 45.434602, "lng": 12.381146, "type": "visita", "meta": {"horario": "Sin apertura turística regular garantizada. Acceso únicamente mediante servicios o visitas autorizadas.", "precio": "Variable según excursión o transporte."}, "sections": {"descripcion": [], "historia": ["La fortaleza fue construida en el siglo XVI, en buena parte según proyecto de Michele Sanmicheli, uno de los grandes especialistas en arquitectura militar del Renacimiento. Defendía la bocca di porto del Lido y actuaba como advertencia monumental a quienes entraban en la laguna. La tradición cuenta que se disparaban salvas para exigir respeto y controlar el acceso."], "arquitectura": ["El frente de piedra de Istria combina función militar y representación. Baterías bajas permitían disparar cerca de la superficie del agua, mientras que el relieve del león de San Marcos proclamaba la autoridad de la República. El conjunto se adapta a una isla baja y a un paisaje donde el canal era tan importante como los muros."], "arte": ["El acceso regular es complejo y no debe planificarse como una visita convencional sin comprobar transporte o excursiones autorizadas. Su lectura más frecuente se realiza desde el agua, durante recorridos por la laguna o viajes hacia Sant’Erasmo. Desde una embarcación se entiende mejor su relación con la boca del puerto."], "curiosidades": ["No confundirlo con iglesias dedicadas a san Andrés. En el mapa, este punto debe identificarse como fortaleza. Si no existe excursión confirmada, debe considerarse referencia paisajística y no visita interior."], "consejos": []}}, {"name": "SAN FRANCESCO DEL DESERTO", "fonetica": "san fran-CHÉS-co del de-SÉR-to", "lat": 45.473543, "lng": 12.417119, "type": "visita", "meta": {"horario": "Visitas guiadas todos los días excepto lunes, salvo decisiones de la fraternidad. Salidas oficiales: 9:00, 9:45, 10:30, 15:00, 15:45 y 16:30. Duración aproximada: 40 minutos.", "precio": "Se solicita normalmente una contribución/donativo. Confirmar al organizar el transporte."}, "sections": {"descripcion": [], "historia": ["La tradición afirma que san Francisco de Asís pasó por la isla en 1220 al regresar de Oriente, aunque la documentación histórica no permite demostrar todos los detalles del relato. En 1233 el propietario Michiel donó el lugar a los frailes menores. El nombre “del Deserto” se relaciona con un periodo de abandono provocado por condiciones insalubres y con la vocación retirada del convento."], "arquitectura": ["El conjunto conserva dos claustros, una iglesia sencilla, dependencias conventuales y jardines. La arquitectura no busca monumentalidad: muros de ladrillo, pórticos, pozos y árboles construyen un ambiente de retiro. La visita guiada por un fraile explica la historia, los espacios de oración y la relación de la comunidad con la laguna."], "arte": ["El convento solo se visita mediante recorrido guiado. Según la información oficial, abre todos los días excepto los lunes o jornadas que la comunidad decida cerrar. Las salidas guiadas se programan a las 9:00, 9:45, 10:30, 15:00, 15:45 y 16:30, duran unos 40 minutos y exigen puntualidad. Se recorren el claustro, la iglesia y parte del jardín."], "curiosidades": ["No hay vaporetto público directo. Es necesario organizar barco privado, taxi acuático o excursión desde Burano. Esta logística debe cerrarse antes de incluir la isla en el día. La visita no encaja bien como improvisación y debe respetar el carácter religioso y silencioso del lugar."], "consejos": []}}, {"name": "SAN LAZZARO DEGLI ARMENI", "fonetica": "san LÁT-sa-ro de-lli ar-MÉ-ni", "lat": 45.412332, "lng": 12.360872, "type": "visita", "meta": {"horario": "Solo mediante visita guiada y reserva. Confirmar hora directamente con el monasterio antes de organizar el vaporetto.", "precio": "Contribución o entrada asociada a la visita guiada; confirmar al reservar."}, "sections": {"descripcion": [], "historia": ["En 1717 la República cedió la isla a Mekhitar de Sebaste y a sus seguidores. La comunidad restauró los edificios, amplió el terreno y creó un centro religioso, intelectual y editorial. La imprenta del monasterio publicó obras en armenio y en otras lenguas, contribuyendo decisivamente a la conservación y difusión de la cultura armenia."], "arquitectura": ["El recorrido incluye la iglesia, claustros, biblioteca, salas museísticas y colecciones. Se conservan miles de manuscritos y libros, objetos arqueológicos, obras de arte, mapas y piezas relacionadas con la historia de la comunidad. Entre las curiosidades más conocidas figuran una momia egipcia y recuerdos de Lord Byron, que estudió armenio en la isla en 1816 y 1817."], "arte": ["La arquitectura combina estructuras conventuales venecianas con símbolos y memoria armenios. Los jardines, el campanario y las vistas hacia Venecia refuerzan la sensación de aislamiento. No se trata de un museo de libre circulación: la visita depende de un recorrido guiado y del funcionamiento de la comunidad."], "curiosidades": ["La información turística oficial indica que las visitas son guiadas y requieren reserva. Debe contactarse directamente con el monasterio mediante el teléfono o el correo de visitas. El acceso se realiza normalmente con la línea 20 desde San Zaccaria, pero es imprescindible comprobar horarios de ACTV y coordinar la llegada con la visita."], "consejos": []}}, {"name": "MURANO", "fonetica": "mu-RÁ-no", "lat": 45.456091, "lng": 12.352631, "type": "visita", "meta": {"horario": "La isla es de acceso libre. Museo, iglesias, hornos y tiendas tienen horarios propios.", "precio": "Paseo gratuito. Transporte, museo y algunas demostraciones de horno de pago."}, "sections": {"descripcion": [], "historia": ["En 1291 la República ordenó trasladar numerosos hornos desde Venecia a Murano, tanto por el riesgo de incendio como por la necesidad de controlar una industria estratégica. Los maestros disfrutaban de privilegios, pero también estaban sometidos a restricciones para evitar la difusión de secretos técnicos. Durante el Renacimiento, el vidrio de Murano se convirtió en producto de lujo exportado por toda Europa."], "arquitectura": ["El Museo del Vetro, instalado en Palazzo Giustinian, permite seguir la evolución técnica y artística desde piezas antiguas hasta diseño contemporáneo. La basílica de Santi Maria e Donato conserva un magnífico pavimento de mosaico y un ábside románico orientado al canal. También merece la pena recorrer el Canal Grande di Murano, Fondamenta dei Vetrai y zonas menos comerciales."], "arte": ["Las demostraciones de horno pueden ser interesantes, pero algunas se organizan principalmente para conducir a salas de venta. Conviene comprobar si existe tarifa, duración y libertad para salir sin comprar. Para adquirir vidrio auténtico, buscar marcas, firmas, certificados y establecimientos transparentes; la abundancia de imitaciones fabricadas fuera de la isla es un problema reconocido."], "curiosidades": ["Desde Venecia, el trayecto depende del punto de salida y de la línea. Reservar como mínimo medio día si se quieren ver museo, iglesia y talleres sin correr. A primera hora hay menos grupos. Los vaporetti de regreso pueden llenarse al final de la tarde."], "consejos": []}}, {"name": "BURANO", "fonetica": "bu-RÁ-no", "lat": 45.485391, "lng": 12.416656, "type": "visita", "meta": {"horario": "Espacio urbano abierto. Museo del Encaje, iglesia, comercios y transporte tienen horarios propios.", "precio": "Paseo gratuito. Vaporetto y Museo del Encaje de pago."}, "sections": {"descripcion": [], "historia": ["La comunidad se desarrolló en un territorio expuesto a mareas y ligado a la pesca. La tradición del merletto, el encaje de aguja, alcanzó fama internacional desde la Edad Moderna y recibió apoyo de escuelas y talleres. La explicación popular afirma que los colores ayudaban a los pescadores a reconocer sus casas entre la niebla; más allá de la leyenda, hoy las fachadas están reguladas y los propietarios deben solicitar autorización para determinados cambios cromáticos."], "arquitectura": ["La arquitectura es popular y de pequeña escala: casas estrechas de dos o tres plantas, patios, puentes y campi. El campanile de San Martino presenta una inclinación visible. Piazza Galuppi concentra la iglesia, el Museo del Merletto y edificios cívicos, mientras que las calles laterales permiten alejarse de los grupos."], "arte": ["Conviene visitar el Museo del Encaje si se desea comprender la diferencia entre trabajo artesanal y recuerdos industriales. También es recomendable cruzar el puente hacia Mazzorbo, donde el ambiente cambia rápidamente. En gastronomía, Burano es conocida por los bussolai, galletas de mantequilla en forma de anillo o de ese."], "curiosidades": ["La isla se llena entre media mañana y media tarde. Llegar temprano o quedarse cuando parten las excursiones mejora mucho la experiencia. El trayecto desde Venecia es largo; debe revisarse el horario de regreso y el embarcadero, especialmente si se combina con San Francesco del Deserto."], "consejos": []}}, {"name": "ENTREGA DEL COCHE DE ALQUILER", "fonetica": "", "lat": 45.482686, "lng": 12.233354, "type": "logistica", "meta": {}, "sections": {"descripcion": [], "historia": ["Hay que prever tiempo para repostar según la política contratada, retirar pertenencias, fotografiar exterior, interior, kilometraje y nivel de combustible, y conservar el justificante de entrega. Si la oficina está cerrada, comprobar de antemano el procedimiento de buzón de llaves y dónde debe estacionarse el coche."], "arquitectura": ["Las ZTL, peajes, cámaras y calles de acceso pueden generar cargos posteriores. No conviene seguir únicamente el nombre comercial en Google Maps: la ruta debe apuntar al acceso de “car rental return”. También es importante revisar si existe lanzadera o trayecto adicional hasta el alojamiento o el punto de entrada a Venecia."], "arte": ["No se añaden horarios ni precios genéricos porque dependen por completo de la reserva. Los datos válidos son los del contrato, el correo de confirmación y la oficina concreta."], "curiosidades": [], "consejos": []}}, {"name": "GELATOTECA SUSO", "fonetica": "ye-la-to-TÉ-ca SÚ-so", "lat": 45.4389856, "lng": 12.3371667, "type": "visita", "meta": {"horario": "Horario comercial amplio, sujeto a temporada y a la sucursal concreta.", "precio": "Precio según tamaño y formato."}, "sections": {"descripcion": [], "historia": ["En una heladería muy concurrida conviene distinguir entre la cola para pagar y la cola para recoger. Revisar primero el sistema del local evita perder el turno. Los sabores pueden cambiar y algunos incluyen alcohol, frutos secos o alérgenos; preguntar al personal si existe alguna restricción."], "arquitectura": ["La calidad del gelato se aprecia mejor en una porción pequeña con uno o dos sabores que permita comerlo antes de que se derrita. En verano, las calles estrechas pueden estar muy calurosas. No sentarse en escaleras de puentes ni bloquear portales mientras se come."], "arte": ["Al existir varias ubicaciones, el enlace del mapa debe comprobarse para no desplazarse a otra sucursal. Es una parada flexible y breve, no un punto que deba condicionar el resto del itinerario."], "curiosidades": [], "consejos": []}}, {"name": "PRONTO SOCCORSO — OSPEDALE SS. GIOVANNI E PAOLO", "fonetica": "PRÓN-to soc-CÓR-so", "lat": 45.4410504, "lng": 12.3435622, "type": "visita", "meta": {}, "sections": {"descripcion": [], "historia": ["En una emergencia grave debe llamarse al 112. El acceso al hospital puede realizarse a pie o mediante transporte sanitario acuático, según el caso. La entrada operativa del servicio no debe confundirse con la fachada monumental de la Scuola Grande di San Marco."], "arquitectura": ["Conviene llevar tarjeta sanitaria europea, documentación personal, lista de medicación y datos del seguro de viaje. Para problemas leves, una farmacia puede orientar sobre atención no urgente. Los tiempos de espera dependen del triaje clínico y no del orden de llegada."], "arte": ["No se incluyen horarios ni precios porque la atención de urgencias funciona de manera continua y las condiciones administrativas dependen de la cobertura sanitaria y del tratamiento requerido."], "curiosidades": [], "consejos": []}}, {"name": "DESPAR TEATRO ITALIA", "fonetica": "DÉS-par te-Á-tro i-TÁ-lia", "lat": 45.4440769, "lng": 12.3294959, "type": "visita", "meta": {"horario": "Horario comercial del supermercado, normalmente amplio. Confirmar en la ficha oficial de la tienda.", "precio": "Acceso gratuito; compras según precio de los productos."}, "sections": {"descripcion": [], "historia": ["El Teatro Italia abrió en 1916, en una etapa de expansión de los cines urbanos. El edificio fue proyectado en estilo neogótico y modernista, con decoración pictórica y elementos inspirados en la tradición veneciana. Tras perder su función original, fue restaurado y adaptado como supermercado, reabriendo con un uso completamente distinto."], "arquitectura": ["En el interior conviene levantar la vista hacia techos, balcones y pinturas. La intervención conserva buena parte de la envolvente decorativa, mientras que estanterías y cajas ocupan la antigua sala. El resultado genera debate: para algunos representa una adaptación pragmática que salvó el inmueble; para otros, el uso comercial reduce la dignidad del espacio."], "arte": ["Debe visitarse con la misma consideración que cualquier comercio: no bloquear pasillos ni realizar una sesión fotográfica prolongada. Es útil si se atraviesa Cannaregio hacia la estación o el gueto, pero no merece un desvío largo si el itinerario transcurre en otro barrio."], "curiosidades": [], "consejos": []}}, {"name": "CAMPO SAN ZACCARIA", "fonetica": "CÁM-po san dzac-ca-RÍ-a", "lat": 45.4343986, "lng": 12.3429312, "type": "visita", "meta": {}, "sections": {"descripcion": [], "historia": ["La historia del lugar está unida a uno de los monasterios femeninos más prestigiosos de la Venecia medieval. La tradición sitúa su fundación en el siglo IX, vinculada a los dogos Giustiniano y Giovanni Partecipazio y a reliquias de san Zacarías, padre de san Juan Bautista. Durante siglos, las abadesas procedieron de familias patricias y el convento mantuvo una relación estrecha con el poder ducal. El dogo acudía ceremonialmente a San Zaccaria en Pascua, una costumbre que expresaba la alianza entre la autoridad política y la comunidad religiosa."], "arquitectura": ["La plaza permite leer dos fases arquitectónicas de la iglesia: restos de la fábrica gótica anterior y la fachada renacentista iniciada por Antonio Gambello y concluida por Mauro Codussi. La composición de mármoles claros, arcos, frontones y órdenes clásicos anuncia el Renacimiento veneciano, aunque conserva una verticalidad heredada de soluciones precedentes. El conjunto monástico, parcialmente transformado con otros usos, recuerda la enorme extensión que llegaron a ocupar las instituciones religiosas en esta zona."], "arte": ["Conviene entrar en la iglesia para ver la Sacra Conversazione de Giovanni Bellini, una de las obras maestras de la pintura veneciana, y descender a la cripta, a menudo parcialmente inundada, donde se conservan sepulturas de dogos. El campo se disfruta mejor a primera hora, cuando la fachada recibe una luz suave y el espacio todavía no está ocupado por grupos. También es un buen punto de transición entre San Marcos, el Arsenal y el interior de Castello."], "curiosidades": [], "consejos": []}}, {"name": "CANNAREGIO", "fonetica": "can-na-RÉ-yo", "lat": 45.4439966, "lng": 12.3285677, "type": "visita", "meta": {}, "sections": {"descripcion": [], "historia": ["El origen del nombre se ha relacionado con el antiguo Canal Regio, la vía acuática que comunicaba la laguna con el interior, y también con los cañaverales que ocupaban parte de la zona. Cannaregio creció como área periférica de la ciudad medieval y fue incorporando conventos, hospitales, almacenes y residencias patricias. En 1516, la República estableció aquí el gueto judío, del que procede el término “ghetto” difundido después por numerosas lenguas."], "arquitectura": ["Urbanísticamente ofrece contrastes muy claros. La Strada Nova, abierta y ampliada entre los siglos XIX y XX, es una ruta comercial concurrida; las fondamente de la Misericordia y de los Ormesini conservan un ambiente de bares y vida vecinal; el Gueto Novo mantiene una plaza recogida y edificios inusualmente altos; el frente de Fondamente Nove se abre hacia San Michele y Murano. Iglesias como Madonna dell’Orto, Sant’Alvise o los Gesuiti guardan ciclos pictóricos y arquitecturas de enorme interés."], "arte": ["Para visitarlo bien conviene abandonar la ruta directa estación-Rialto y entrar en los canales laterales. La mañana permite ver mercados, comercios y actividad cotidiana; al atardecer las fondamente se animan con el aperitivo. En el gueto debe mantenerse una actitud respetuosa: es un lugar histórico, pero también un espacio vivo de memoria religiosa y comunitaria. Un recorrido completo puede ocupar medio día."], "curiosidades": [], "consejos": []}}, {"name": "PALAZZO CONTARINI DEL BOVOLO", "fonetica": "pa-LÁT-so con-ta-RÍ-ni del BÓ-vo-lo", "lat": 45.4348579, "lng": 12.3345337, "type": "visita", "meta": {"horario": "Consultar el calendario oficial; el acceso se organiza por franjas horarias y puede variar según temporada.", "precio": "Entrada de pago. Consultar tarifa general y reducida en la web oficial."}, "sections": {"descripcion": [], "historia": ["El palacio se formó a partir de varias construcciones góticas adquiridas por los Contarini. Hacia finales del siglo XV, Pietro Contarini encargó la escalera y las logias para modernizar la residencia y exhibir rango social. La obra se atribuye habitualmente a Giovanni Candi, aunque su autoría ha sido discutida. La familia Contarini fue una de las más poderosas de la República y dio varios dogos a Venecia."], "arquitectura": ["La torre combina una rampa helicoidal con cinco niveles de logias de arcos de medio punto. La sucesión rítmica de columnas crea una estructura ligera, casi transparente, que contrasta con la masa del palacio. El conjunto reúne tradición gótica, vocabulario renacentista y soluciones constructivas adaptadas a un patio de dimensiones reducidas. En la parte superior, el belvedere ofrece una vista de tejados, campanarios y cúpulas, con San Marcos como referencia dominante."], "arte": ["La subida exige numerosos peldaños y no es adecuada para todas las personas. El patio puede verse sin hacer la visita completa, pero la entrada permite apreciar la geometría interior y acceder al mirador. Conviene reservar en temporada alta y acudir a primera hora para evitar saturación. La fotografía exterior funciona mejor desde el extremo del patio, incluyendo las logias completas y parte del palacio."], "curiosidades": [], "consejos": []}}, {"name": "TRAGHETTO DELLA DOGANA", "fonetica": "tra-GUÉT-to DÉL-la do-GÁ-na", "lat": 45.4310046, "lng": 12.3362616, "type": "ferry", "meta": {"horario": "Servicio diurno variable y no garantizado. Puede interrumpirse por meteorología, marea o falta de demanda.", "precio": "Tarifa reducida por trayecto, normalmente abonada en efectivo; puede existir diferencia entre residentes y visitantes."}, "sections": {"descripcion": [], "historia": ["Los traghetti conservan una función histórica anterior a la construcción de varios puentes modernos. Durante siglos, la mayoría de los venecianos dependía de barcas para atravesar el canal. Las embarcaciones utilizadas son góndolas de mayor capacidad y suelen estar manejadas por dos gondoleros. Tradicionalmente, los pasajeros locales hacían la travesía de pie para agilizar el embarque, aunque el visitante puede sentarse si el personal lo indica."], "arquitectura": ["El servicio no debe confundirse con una góndola turística: no hay recorrido por canales secundarios, explicaciones ni duración prolongada. La operativa depende de la demanda, del estado de la marea, del tiempo y de la disponibilidad de gondoleros, por lo que puede suspenderse sin previo aviso. Es aconsejable llevar efectivo y seguir las instrucciones al subir y bajar, pues el embarcadero puede moverse con el oleaje."], "arte": ["Como experiencia breve permite observar el Gran Canal desde una cota muy baja y entender el equilibrio de la góndola. Conviene guardar el teléfono durante el embarque y fotografiar solo una vez estabilizado. Si el servicio no está activo, las alternativas son caminar hasta el puente de la Accademia o utilizar vaporetto."], "curiosidades": [], "consejos": []}}, {"name": "TRAGHETTO SAN MARCO VALLARESSO", "fonetica": "tra-GUÉT-to san MÁR-co val-la-RÉS-so", "lat": 45.432342, "lng": 12.337205, "type": "ferry", "meta": {"horario": "Funcionamiento diurno variable; no existe garantía de servicio continuo.", "precio": "Tarifa económica por cruce. Confirmar el importe en el embarcadero y llevar efectivo."}, "sections": {"descripcion": [], "historia": ["El embarcadero se encuentra en una de las zonas más transitadas de Venecia, cerca de la parada ACTV y de los accesos a Piazza San Marco. Puede haber confusión entre las plataformas de vaporetto, taxi acuático y traghetto, por lo que conviene comprobar el cartel exacto antes de hacer cola. La góndola puede aceptar varios pasajeros y el embarque se realiza rápidamente."], "arquitectura": ["La tarifa popularmente conocida como “góndola de dos euros” puede cambiar y no siempre coincide para residentes y no residentes. Además, algunos traghetti operan solo en determinadas franjas y pueden no funcionar durante jornadas de poca demanda. Es preferible considerarlo una opción oportunista y no basar una reserva o una visita con hora cerrada en su disponibilidad."], "arte": ["Para subir, hay que esperar a que el gondolero estabilice la embarcación, repartir el peso sin movimientos bruscos y llevar preparadas las monedas. Las mochilas deben mantenerse controladas y el teléfono guardado hasta completar el embarque."], "curiosidades": [], "consejos": []}}, {"name": "BACARO AE BRICOE", "fonetica": "bá-ca-ro ae BRÍ-co-e", "lat": 45.4453545, "lng": 12.3292389, "type": "restaurante", "meta": {}, "sections": {"descripcion": [], "historia": ["La palabra bricola o bricolae alude a los grupos de postes de madera que señalizan canales y rutas navegables en la laguna. El nombre conecta el establecimiento con el paisaje acuático veneciano. Como muchos bacari contemporáneos, combina recetas tradicionales con propuestas más creativas, panes, pescado, verduras y productos de temporada."], "arquitectura": ["El interés está en pedir pocas piezas, probar combinaciones distintas y continuar la ruta. No conviene interpretar el mostrador como una comida formal ni ocupar durante mucho tiempo un espacio reducido en horas punta. Preguntar el precio de cada cicchetto y de las bebidas antes de pedir ayuda a controlar el gasto."], "arte": ["La zona se anima especialmente al final de la tarde. En verano puede ser agradable sentarse junto al canal, aunque las mesas exteriores son limitadas. Para una experiencia menos concurrida, resulta mejor acudir antes del aperitivo nocturno."], "curiosidades": [], "consejos": []}}, {"name": "PONTE DEI SOSPIRI", "fonetica": "PÓN-te dei sos-PÍ-ri", "lat": 45.4340496, "lng": 12.3408544, "type": "visita", "meta": {"horario": "Visible permanentemente desde el exterior. El interior se visita con el horario y la entrada del Palazzo Ducale.", "precio": "Exterior gratuito. Interior incluido en la entrada del Palazzo Ducale."}, "sections": {"descripcion": [], "historia": ["Fue construido a comienzos del siglo XVII, generalmente fechado entre 1600 y 1603, según diseño de Antonio Contin. Su nombre romántico se popularizó mucho después, especialmente durante el siglo XIX. La interpretación según la cual los presos suspiraban al contemplar por última vez Venecia pertenece más a la literatura y al imaginario turístico que a una documentación histórica precisa."], "arquitectura": ["Exteriormente es un corredor cerrado de piedra de Istria, decorado con pilastras, volutas y escudos. Dos pequeñas ventanas con celosías pétreas permiten una visión fragmentada del canal. En el interior, el paso se divide en corredores separados para organizar movimientos distintos entre palacio y prisión. La arquitectura transforma una infraestructura de seguridad en un objeto monumental coherente con el lenguaje del Palazzo Ducale."], "arte": ["La visita interior forma parte del recorrido del Palacio Ducal. Desde dentro, la vista a través de las celosías es estrecha y oscura, lo que ayuda a comprender la experiencia del traslado. Para fotografiar el exterior, los puntos clásicos son el Ponte della Paglia, junto a la Riva degli Schiavoni, y el Ponte de Canonica, normalmente menos saturado. A primera hora se evita gran parte de la multitud."], "curiosidades": [], "consejos": []}}, {"name": "MUSEO CORRER", "fonetica": "mu-SÉ-o CÓR-rer", "lat": 45.4337924, "lng": 12.3372059, "type": "visita", "meta": {"horario": "Horario habitual diario de 10:00 a 18:00, con posibles ampliaciones estivales. En 2026, determinados viernes y sábados entre mayo y septiembre abren hasta las 23:00; última entrada una hora antes.", "precio": "Entrada general del Museo Correr o incluida en billetes combinados de los Museos de San Marco. Consultar tarifas y reducciones oficiales."}, "sections": {"descripcion": [], "historia": ["El núcleo de la colección procede del legado de Teodoro Correr, noble veneciano fallecido en 1830, que reunió pinturas, manuscritos, antigüedades y objetos de la vida urbana. El museo se instaló en distintos edificios antes de trasladarse a San Marcos. La sede actual incorpora los espacios creados durante la dominación napoleónica, cuando se cerró el extremo occidental de la plaza con una nueva ala palaciega."], "arquitectura": ["Las salas neoclásicas, relacionadas con Giuseppe Borsato y el programa decorativo del siglo XIX, incluyen el salón de baile y estancias concebidas para la corte. La colección de Antonio Canova permite observar dibujos, modelos y esculturas del gran maestro neoclásico. Otras secciones explican las instituciones de la Serenissima, la navegación, las fiestas públicas, la cartografía y la transformación de la imagen de Venecia."], "arte": ["Entre las obras más valiosas se encuentran pinturas de Giovanni Bellini, Carpaccio, Antonello da Messina y otros maestros. El museo conecta además con el Museo Arqueológico Nacional y las salas monumentales de la Biblioteca Marciana, según el itinerario habilitado. Conviene reservar al menos dos horas y seleccionar secciones si el día está cargado."], "curiosidades": ["En verano de 2026 existen aperturas nocturnas ampliadas determinados viernes y sábados, lo que puede aliviar la presión del itinerario. Antes de la visita debe comprobarse si alguna sala está cerrada por montaje, conservación o exposiciones temporales."], "consejos": []}}, {"name": "CALLE DE L’OGIO, 1777", "fonetica": "CÁL-le de LÓ-yo", "lat": 45.4401335, "lng": 12.3333278, "type": "visita", "meta": {}, "sections": {"descripcion": [], "historia": ["En Venecia, los nombres urbanos suelen conservar antiguos oficios, mercancías, familias o instituciones. Las calles próximas a Rialto estaban organizadas en torno al abastecimiento: pescado, especias, aceite, vino, frutas y productos llegados por el Gran Canal. Incluso una dirección aparentemente ordinaria puede revelar la memoria económica del barrio."], "arquitectura": ["El interés del punto está en observar la escala del tejido: soportales, almacenes en planta baja, puertas que se abren al agua y recorridos que conectan el mercado con las fondamente. No necesita una visita independiente; debe integrarse en el paseo por Rialto y utilizarse como referencia para localizar alojamiento, comercio o acceso concreto."], "arte": [], "curiosidades": [], "consejos": []}}, {"name": "ENTORNO DE RIALTO MERCATO", "fonetica": "en-TÓR-no de ri-ÁL-to mer-CÁ-to", "lat": 45.4400555555556, "lng": 12.3327777777778, "type": "visita", "meta": {}, "sections": {"descripcion": [], "historia": ["El área forma parte del antiguo corazón comercial de Venecia. Desde la Edad Media, Rialto concentró operaciones financieras, almacenamiento, venta mayorista y mercados de alimentos. Los edificios actuales mezclan reconstrucciones posteriores al incendio de 1514, intervenciones modernas y estructuras adaptadas constantemente a usos comerciales."], "arquitectura": ["Conviene conservar el punto si señala una entrada precisa, alojamiento o lugar de encuentro. Para la guía cultural no requiere un desvío específico: su contexto se comprende mejor junto con la Pescaria, Campo della Pescaria, Riva de l’Ogio y el puente de Rialto."], "arte": [], "curiosidades": [], "consejos": []}}, {"name": "CHIESA DI SAN STAE", "fonetica": "KIÉ-sa di san STÁ-e", "lat": 45.4414552, "lng": 12.330758, "type": "visita", "meta": {"horario": "Según el calendario de Chorus, puede abrir solo determinados días y franjas; comprobar la información actualizada antes de la visita.", "precio": "Entrada cultural de pago en determinados espacios; tarifa individual habitual del circuito Chorus. Acceso al culto gratuito."}, "sections": {"descripcion": [], "historia": ["Existe documentación de una iglesia en este lugar desde la Edad Media, pero el edificio actual fue reconstruido a partir de finales del siglo XVII. El proyecto interior se atribuye a Giovanni Grassi. La fachada fue levantada después, gracias al legado del dogo Alvise II Mocenigo, y diseñada por Domenico Rossi. Su posición frontal al canal convirtió el templo en un escenario funerario y de representación familiar."], "arquitectura": ["La fachada de piedra de Istria combina columnas, frontón quebrado, nichos y una abundante decoración escultórica. A pesar de su exuberancia, mantiene una organización clara de inspiración palladiana. En el interior, la nave única con capillas laterales dirige la mirada hacia el presbiterio. Allí se conserva un ciclo de martirios de los apóstoles con obras de Tiepolo, Piazzetta, Ricci y otros pintores."], "arte": ["Conviene observar especialmente el Martirio de san Bartolomé de Giambattista Tiepolo y comparar su luz y movimiento con las composiciones más densas de otros autores. La visita permite entender el momento en que la pintura veneciana del siglo
