as para paseo, jardines y exterior; más si hay exposición."}, "sections": {"descripcion": ["Villa Olmo es la gran residencia neoclásica del paseo occidental de Como. Su fachada se abre hacia el lago y está precedida por jardines formales, mientras la parte posterior conecta con un parque más amplio. Forma parte del llamado Kilómetro del Conocimiento, itinerario que enlaza villas y jardines de la ribera."], "historia": ["Fue construida a finales del siglo XVIII para la familia Odescalchi y diseñada por Simone Cantoni. Recibió a personajes como Napoleón Bonaparte, Ugo Foscolo y Giuseppe Garibaldi. En el siglo XX pasó al Ayuntamiento de Como y se convirtió en sede de exposiciones y acontecimientos culturales."], "arquitectura": ["La composición neoclásica se basa en simetría, volumen central destacado, columnas y frontón. Los interiores conservan salones de representación y decoraciones de distintas campañas. La relación axial entre villa, jardín y lago es esencial: el edificio fue pensado para ser contemplado desde el agua y para dominar el paisaje desde sus salas."], "arte": ["El parque reúne esculturas, especies ornamentales y perspectivas hacia la ciudad. Más que buscar un único objeto, conviene recorrer la secuencia desde la verja hasta la fachada y después mirar hacia el lago para reconstruir el punto de vista de los antiguos residentes."], "curiosidades": [], "consejos": ["Se llega caminando desde el centro por el paseo del lago. Antes de ir hay que comprobar si el interior está abierto o ocupado por una exposición. El exterior y los jardines justifican la visita, pero exigen tiempo adicional respecto al núcleo del Duomo."]}}, {"name": "VILLA SAPORITI", "fonetica": "VÍL-la sa-po-RÍ-ti", "lat": 45.81509, "lng": 9.068358, "type": "visita", "meta": {"tiempo": "15-25 minutos de observación exterior."}, "sections": {"descripcion": ["Villa Saporiti, conocida también como La Rotonda por la forma curva de su fachada hacia el lago, es una de las residencias neoclásicas más elegantes del paseo occidental de Como. Actualmente alberga dependencias institucionales de la Provincia."], "historia": ["Fue construida a finales del siglo XVIII para la marquesa Eleonora Villani y pasó después a la familia Saporiti. Su historia se inscribe en la competencia entre familias aristocráticas por levantar residencias representativas junto al lago."], "arquitectura": ["La fachada lacustre adopta una marcada curva central con columnas y ritmo regular de vanos. Esta solución crea una presencia escenográfica y aprovecha las vistas panorámicas. El lenguaje neoclásico es más contenido que el de Villa Olmo, pero extremadamente refinado."], "arte": [], "curiosidades": [], "consejos": ["El interior no debe darse por visitable. La villa se aprecia desde el paseo y especialmente desde el agua. Conviene integrarla en la caminata hacia Villa Olmo, observando la secuencia de residencias históricas de la ribera."]}}, {"name": "FUNICULAR COMO-BRUNATE", "fonetica": "bru-NÁ-te", "lat": 45.81808, "lng": 9.084814, "type": "transporte", "meta": {"tiempo": "15-25 minutos para observar la estación y organizar el acceso; 45-90 minutos si se realiza el viaje."}, "sections": {"descripcion": ["Este segundo marcador corresponde al acceso urbano del funicular y resulta útil para localizar la estación, las colas y la organización del embarque. Se encuentra al este del frente lacustre, a pocos minutos de Piazza Cavour."], "historia": [], "arquitectura": [], "arte": [], "curiosidades": [], "consejos": ["Antes de ponerse en la cola conviene comprobar visibilidad en Brunate y tiempo de espera. Los billetes y condiciones pueden cambiar; hay que seguir la información oficial. En horas punta, una visita que parece breve puede consumir más de una hora. Si el objetivo es únicamente obtener una vista elevada, hay que sumar el paseo desde la estación superior hasta los puntos panorámicos."]}}, {"name": "PALAZZO CERNEZZI, COMUNE DI COMO", "fonetica": "pa-LÁT-so cher-NÉT-si", "lat": 45.81002, "lng": 9.085187, "type": "visita", "meta": {"tiempo": "10-20 minutos de observación exterior."}, "sections": {"descripcion": ["La sede del Comune di Como se encuentra en Palazzo Cernezzi, un complejo histórico integrado en el centro urbano. Su presencia sirve para identificar la continuidad entre las antiguas residencias nobiliarias y los usos administrativos contemporáneos."], "historia": ["El palacio se formó a partir de edificios vinculados a familias notables y fue transformado antes de convertirse en sede municipal. Como ocurre con muchos ayuntamientos italianos, el valor patrimonial convive con una función diaria y no museística."], "arquitectura": ["El conjunto incluye patios, fachadas de distintas fases y espacios representativos. Desde el exterior se percibe mejor como parte del tejido histórico que como monumento aislado."], "arte": [], "curiosidades": [], "consejos": ["No debe planificarse una visita interior salvo evento o apertura institucional. Es suficiente observarlo durante el recorrido por el centro y continuar hacia otros puntos cercanos."]}}, {"name": "LECCO", "fonetica": "LÉC-co", "lat": 45.85241, "lng": 9.39517, "type": "visita", "meta": {"tiempo": "2-3 horas para centro y paseo; media jornada con Villa Manzoni y museos."}, "sections": {"descripcion": ["Lecco ocupa el extremo sudoriental del lago, donde el Lario vuelve a convertirse en río Adda. Su paisaje es más dramático que el de Como: las montañas se elevan muy cerca del casco urbano y encuadran el agua. La ciudad combina paseo lacustre, patrimonio industrial, memoria medieval y una identidad inseparable de Alessandro Manzoni y de Los novios."], "historia": ["El núcleo medieval creció en un punto estratégico de paso entre Milán, Bérgamo y los valles alpinos. Bajo los Visconti se reforzaron castillo, murallas y puente. En la Edad Moderna y contemporánea, la actividad del hierro, la seda y otras manufacturas impulsó una transformación industrial intensa. Manzoni pasó aquí parte de su juventud y utilizó el paisaje de Lecco y sus alrededores como escenario fundamental de su novela."], "arquitectura": ["El centro conserva pocos restos visibles de sus defensas, entre ellos la Torre Viscontea, pero mantiene una red de plazas y calles vinculadas al antiguo burgo. La basílica de San Nicolò, con su enorme campanario, domina la silueta. Los edificios del siglo XIX y XX reflejan la prosperidad comercial e industrial."], "arte": [], "curiosidades": ["La descripción inicial de Los novios sitúa de inmediato el lago y las montañas de Lecco. Muchos lugares del entorno se interpretan hoy a través de la novela, aunque no todos corresponden literalmente a edificios identificables. La ciudad evita en parte la imagen puramente turística de otros pueblos y mantiene un carácter urbano más cotidiano."], "consejos": ["El centro y el lungolago se recorren fácilmente a pie. Para comprender Lecco conviene mirar tanto hacia el lago como hacia las montañas, especialmente el Resegone, cuya silueta dentada es una referencia constante. Villa Manzoni queda algo separada del frente lacustre y requiere una visita específica."]}}, {"name": "BASILICA DI SAN NICOLÒ", "fonetica": "ba-SÍ-li-ca di san ni-co-LÓ", "lat": 45.856603, "lng": 9.38864, "type": "visita", "meta": {"tiempo": "30-50 minutos; subida al campanario solo con visita programada."}, "sections": {"descripcion": ["La basílica de San Nicolò es la principal iglesia de Lecco y se reconoce desde lejos por su campanario, uno de los más altos de Italia. Se levanta cerca del lago y sobre el área de las antiguas defensas del burgo."], "historia": ["El lugar de culto tiene origen medieval, pero el edificio actual fue profundamente reconstruido y ampliado entre los siglos XVIII y XIX. La dedicación a san Nicolás recuerda la relación de la ciudad con navegantes y barqueros. El campanario se levantó entre finales del siglo XIX y comienzos del XX sobre una antigua torre defensiva."], "arquitectura": ["La basílica presenta una arquitectura neoclásica de gran escala, con interior ordenado por columnas y capillas. El campanario, de más de noventa metros, combina una base histórica con una elevación moderna y constituye el gran hito vertical del frente urbano."], "arte": ["En el interior se conservan pinturas, altares y decoraciones de distintas épocas. El interés principal está en la amplitud espacial y en la relación con la historia urbana, más que en una única obra famosa."], "curiosidades": [], "consejos": ["La subida al campanario no es de acceso libre y requiere comprobar las visitas disponibles. Si no se puede subir, el mejor punto para fotografiarlo es desde el lungolago o desde Piazza Cermenati, donde se aprecia su escala respecto a la ciudad."]}}, {"name": "LUNGOLAGO DI LECCO", "fonetica": "lun-go-LÁ-go di LÉC-co", "lat": 45.857031, "lng": 9.384216, "type": "visita", "meta": {"tiempo": "45-75 minutos."}, "sections": {"descripcion": ["El lungolago de Lecco recorre la orilla urbana desde el centro hacia distintos jardines y embarcaderos. A diferencia de los paseos de pueblos más pequeños, aquí la ribera se relaciona con una ciudad activa, tráfico, plazas y edificios institucionales, pero mantiene vistas muy amplias hacia el lago y las montañas."], "historia": ["La forma actual es resultado de obras de regulación de la orilla y modernización urbana. El frente lacustre tuvo funciones portuarias, comerciales e industriales antes de convertirse también en espacio de paseo."], "arquitectura": ["Balaustradas, zonas verdes, embarcaderos y plazas forman una secuencia continua. El campanario de San Nicolò actúa como referencia vertical, mientras el macizo del Resegone y las montañas de la orilla opuesta construyen el fondo escénico."], "arte": [], "curiosidades": [], "consejos": ["La luz de última hora suele ser favorable y el paseo ofrece bancos y espacios de descanso. Para fotografía, conviene buscar reflejos y encuadrar el campanario con el agua. En días de viento el lago puede estar agitado y la sensación térmica bajar rápidamente."]}}, {"name": "PALAZZO DELLE PAURE", "fonetica": "pa-LÁT-so DÉL-le PÁU-re", "lat": 45.855226, "lng": 9.389436, "type": "visita", "meta": {"tiempo": "1-1,5 horas, según exposiciones."}, "sections": {"descripcion": ["El Palazzo delle Paure se encuentra en Piazza XX Settembre y es una de las principales sedes culturales de Lecco. Alberga la galería de arte moderno y contemporáneo, exposiciones temporales, la fototeca y espacios dedicados a la tradición alpinística local."], "historia": ["El edificio fue construido a comienzos del siglo XX para oficinas fiscales y aduaneras. Su nombre popular, “palacio de los miedos”, alude al temor que provocaban los trámites y obligaciones tributarias. La reconversión museística transformó un símbolo administrativo en espacio cultural."], "arquitectura": ["La arquitectura historicista incorpora elementos neomedievales y una torre que dialoga con la plaza. El edificio no pretende imitar un palacio antiguo concreto, sino expresar solidez institucional mediante piedra, arcos y una silueta reconocible."], "arte": ["Las colecciones y muestras permiten conocer artistas vinculados a Lombardía y a la evolución del arte italiano entre los siglos XIX y XX. El Museo dell’Alpinismo Lecchese explica además la relación extraordinaria de la ciudad con escaladores, grupos como los Ragni di Lecco y expediciones internacionales."], "curiosidades": [], "consejos": ["La utilidad de la visita depende de la exposición temporal. Conviene consultar la programación antes de reservar tiempo. La fachada se integra bien en un recorrido por Piazza XX Settembre y Piazza Cermenati."]}}, {"name": "VILLA MANZONI", "fonetica": "VÍL-la man-TSÓ-ni", "lat": 45.852764, "lng": 9.399135, "type": "visita", "meta": {"tiempo": "1-1,5 horas."}, "sections": {"descripcion": ["Villa Manzoni fue la residencia familiar donde Alessandro Manzoni pasó buena parte de su infancia y juventud. Hoy alberga el Museo Manzoniano y constituye el principal lugar para comprender la relación entre el escritor, Lecco y el paisaje de Los novios."], "historia": ["La propiedad perteneció a la familia Manzoni durante generaciones. Alessandro vivió aquí hasta comienzos del siglo XIX y conservó recuerdos profundos del territorio. La villa fue vendida posteriormente, pasó por otros propietarios y finalmente se convirtió en museo. El recorrido aborda tanto la biografía del autor como la fortuna editorial y cultural de su obra."], "arquitectura": ["Es una villa señorial lombarda organizada alrededor de patio, jardines y dependencias agrícolas. Su arquitectura es más doméstica que monumental, lo que ayuda a imaginar la vida cotidiana de una familia acomodada entre los siglos XVIII y XIX."], "arte": ["El museo conserva manuscritos, primeras ediciones, retratos, objetos, reconstrucciones y materiales relacionados con Los novios. Lo más valioso es entender cómo el paisaje real fue transformado literariamente y cómo la novela contribuyó a la formación de la lengua y la identidad italiana."], "curiosidades": [], "consejos": ["La visita resulta mucho más interesante con algún conocimiento previo de Los novios. Queda separada del lago, por lo que hay que calcular desplazamiento. Conviene confirmar qué salas están abiertas, ya que las restauraciones o reorganizaciones museográficas pueden afectar el recorrido."]}}, {"name": "TORRE VISCONTEA", "fonetica": "TÓR-re vis-con-TÉ-a", "lat": 45.854313, "lng": 9.389553, "type": "visita", "meta": {"tiempo": "30-50 minutos si está abierta."}, "sections": {"descripcion": ["La Torre Viscontea es el principal resto visible del castillo medieval de Lecco. Se encuentra integrada en el centro y su aspecto robusto recuerda que la ciudad fue un punto fortificado de gran importancia estratégica."], "historia": ["La torre formaba parte del castillo construido o reforzado por Azzone Visconti en el siglo XIV. El sistema defensivo controlaba el acceso al puente y las rutas del Adda. En el siglo XVII alojó a la guarnición española evocada en el contexto histórico de Los novios. Buena parte del castillo fue demolida, pero la torre sobrevivió y tuvo usos carcelarios y administrativos."], "arquitectura": ["La construcción de piedra presenta muros gruesos, vanos limitados y una imagen esencialmente militar. En la planta baja se conservan espacios del cuerpo de guardia y proyectiles pétreos. Las adaptaciones interiores permiten hoy utilizarla para exposiciones."], "arte": [], "curiosidades": [], "consejos": ["La apertura no siempre coincide con la de otros museos, así que debe comprobarse. Aunque esté cerrada, el exterior ayuda a reconstruir mentalmente el perímetro fortificado del antiguo Lecco."]}}, {"name": "PIAZZA MARIO CERMENATI", "fonetica": "PIÁT-sa MÁ-rio cher-me-NÁ-ti", "lat": 45.855891, "lng": 9.388946, "type": "visita", "meta": {"tiempo": "20-30 minutos."}, "sections": {"descripcion": ["Piazza Mario Cermenati se abre directamente hacia el lago y funciona como una de las principales plazas de paseo de Lecco. Está dedicada al naturalista y político local Mario Cermenati, cuya estatua ocupa el centro."], "historia": ["El espacio se configuró con la modernización del frente urbano y la progresiva transformación de áreas portuarias en lugares de representación y ocio. Su nombre recuerda la importancia de Cermenati en la vida cultural y científica de la ciudad."], "arquitectura": ["La plaza se define por la apertura hacia el agua, las fachadas urbanas y la cercanía del campanario de San Nicolò. La estatua central actúa como punto focal, pero el verdadero protagonista es el paisaje."], "arte": [], "curiosidades": [], "consejos": ["Es un buen lugar para orientarse y comenzar el lungolago. Para fotografiar el campanario y el lago, conviene desplazarse hacia los extremos y evitar que la estatua bloquee la perspectiva."]}}, {"name": "PONTE AZZONE VISCONTI", "fonetica": "PÓN-te at-TSÓ-ne vis-CÓN-ti", "lat": 45.845656, "lng": 9.393927, "type": "visita", "meta": {"tiempo": "20-40 minutos para observarlo desde la orilla y cruzarlo parcialmente."}, "sections": {"descripcion": ["El Ponte Azzone Visconti, conocido también como Ponte Vecchio, cruza el Adda a la salida del lago. Es uno de los monumentos que mejor explican la posición estratégica de Lecco y la necesidad histórica de controlar el paso entre ambas orillas."], "historia": ["Fue construido en el siglo XIV por orden de Azzone Visconti. El puente estaba ligado al sistema fortificado de Lecco y facilitaba tanto la circulación como el cobro de peajes y el control militar. Su estructura fue modificada varias veces: perdió torres, puertas y algunos elementos defensivos, y se adaptó a las necesidades del tráfico."], "arquitectura": ["La larga sucesión de arcos de piedra se apoya sobre pilas adaptadas a la corriente. El perfil actual es más abierto que el medieval, pero mantiene una gran fuerza paisajística. La relación entre puente, río, lago y montañas permite entender el territorio como un nudo de comunicaciones."], "arte": [], "curiosidades": ["El puente forma parte del paisaje manzoniano y se asocia al Lecco descrito en Los novios. Su apariencia actual no coincide exactamente con la que conoció el escritor, debido a reformas posteriores."], "consejos": ["La mejor vista suele obtenerse desde las riberas, no desde el propio tablero. El tráfico puede ser intenso y el recorrido peatonal poco agradable en algunos tramos. Conviene buscar un punto seguro junto al río para fotografiar la sucesión de arcos."]}}, {"name": "NIJI HOTEL & RESTAURANT", "fonetica": "", "lat": 45.723375, "lng": 9.554079, "type": "alojamiento", "meta": {}, "sections": {"descripcion": [], "historia": [], "arquitectura": [], "arte": [], "curiosidades": [], "consejos": ["Punto de alojamiento al final de la jornada. Antes de salir conviene guardar en el teléfono la confirmación, la hora límite de llegada, el procedimiento de check-in, el aparcamiento disponible y un número de contacto. Si la llegada se retrasa por tráfico o ferris, se debe avisar directamente. No se añaden datos históricos o arquitectónicos porque su función dentro de la guía es exclusivamente logística."]}}]}, {"name": "Día 3 · Iseo+Brescia", "color": "#558B2F", "points": [{"name": "SARNICO", "fonetica": "SÁR-ni-co", "lat": 45.667288, "lng": 9.958745, "type": "visita", "meta": {"tiempo": "1,5-2,5 horas para el paseo, el casco histórico y la arquitectura liberty."}, "sections": {"descripcion": ["Sarnico ocupa el extremo meridional del lago d’Iseo, justo donde el Oglio vuelve a salir del lago. Su posición de transición entre el agua, el río y las colinas de Valcalepio explica la animación del paseo, la presencia de embarcaderos y la mezcla de ambiente lacustre y pequeña ciudad comercial. Es una entrada especialmente útil al lago porque permite comprender su escala antes de internarse por la ribera occidental."], "historia": ["El asentamiento se desarrolló como punto de paso y puerto. Durante siglos la pesca, el transporte por agua, los mercados y las actividades artesanales articularon la economía local. Entre finales del siglo XIX y comienzos del XX, la prosperidad industrial y la presencia de familias empresariales impulsaron una transformación urbana visible en villas, jardines y edificios de gusto liberty. La historia contemporánea de Sarnico está además ligada a la construcción naval: los astilleros Riva, fundados aquí en 1842, convertirían sus lanchas de madera en símbolos internacionales del diseño italiano."], "arquitectura": ["El núcleo antiguo conserva calles estrechas y una trama que desciende hacia el agua, mientras el frente lacustre responde a ampliaciones y embellecimientos de época moderna. El rasgo arquitectónico más singular es la presencia de obras liberty relacionadas con el arquitecto Giuseppe Sommaruga y con la familia Faccanoni: volúmenes asimétricos, piedra trabajada, hierro, motivos vegetales y una concepción escenográfica de la vivienda burguesa. Esta capa modernista distingue a Sarnico de otros pueblos del lago."], "arte": ["Conviene alternar el lungolago con las calles interiores y buscar la relación entre edificios residenciales, pequeñas plazas, campanarios y el puerto. La lectura mejora al fijarse en los cambios de cota: el pueblo no es solo una fachada frente al agua, sino una sucesión de terrazas urbanas. También merece atención la tradición náutica, visible en el tipo de embarcaciones y en el prestigio asociado al nombre Riva."], "curiosidades": [], "consejos": ["La visita resulta más agradable a primera hora o al final de la tarde. En verano el paseo puede estar concurrido y el tráfico en la ribera es lento. Es preferible aparcar fuera del centro inmediato y completar el recorrido a pie. Para fotografía, funcionan bien la desembocadura del Oglio, los reflejos del puerto y las perspectivas diagonales del lungolago."]}}, {"name": "PUNTO PANORAMICO", "fonetica": "PÚN-to pa-no-RÁ-mi-co", "lat": 45.66665, "lng": 9.963593, "type": "visita", "meta": {"tiempo": "10-20 minutos."}, "sections": {"descripcion": ["Este mirador funciona como una pausa de lectura paisajística entre Sarnico y la ribera del lago. Desde una posición elevada o despejada se perciben mejor la forma alargada del lago d’Iseo, el cierre montañoso hacia el norte y la transición hacia las colinas más suaves del sur."], "historia": [], "arquitectura": [], "arte": ["La vista permite identificar tres elementos fundamentales del territorio: el agua como eje de comunicaciones, las laderas ocupadas por núcleos compactos y vegetación, y la estrecha carretera que obliga a adaptar pueblos e infraestructuras al relieve. La escala de Monte Isola suele dominar la composición cuando queda visible."], "curiosidades": [], "consejos": ["La parada debe hacerse únicamente donde exista espacio seguro y autorizado. No conviene detenerse en arcenes estrechos ni cruzar la calzada para obtener una fotografía. La luz suele ser más limpia por la mañana; al atardecer aparecen contraluces y reflejos más dramáticos."]}}, {"name": "LUNGOLAGO SARNICO", "fonetica": "lun-go-LÁ-go SÁR-ni-co", "lat": 45.667025, "lng": 9.963211, "type": "visita", "meta": {"tiempo": "30-60 minutos."}, "sections": {"descripcion": ["El lungolago es el gran salón urbano de Sarnico. Une jardines, embarcaderos, terrazas y perspectivas abiertas hacia el lago, y permite observar cómo el tejido histórico se relaciona con una franja pública creada para el paseo y el ocio."], "historia": ["Los paseos ribereños son, en buena medida, construcciones urbanas modernas. Sustituyeron o reorganizaron antiguos bordes de trabajo ocupados por barcas, almacenes y pequeñas actividades portuarias. En Sarnico, la consolidación del turismo y de la navegación recreativa convirtió la orilla en espacio representativo."], "arquitectura": ["El interés reside en la secuencia de pavimentos, arbolado, bancos, muelles y fachadas, más que en un único edificio. Los cambios de anchura y la proximidad del Oglio generan perspectivas variadas. Desde algunos tramos se aprecia la continuidad urbana con Paratico, en la orilla opuesta."], "arte": [], "curiosidades": [], "consejos": ["Es un paseo llano y cómodo. Conviene recorrerlo en ambos sentidos, porque las vistas hacia el norte y hacia la salida del lago son diferentes. Al amanecer hay menos gente y el agua suele estar más quieta; al final del día aumenta el ambiente de terrazas."]}}, {"name": "CENTRO STORICO DI SARNICO", "fonetica": "CHÉN-tro STÓ-ri-co di SÁR-ni-co", "lat": 45.66632, "lng": 9.957537, "type": "visita", "meta": {"tiempo": "45-75 minutos."}, "sections": {"descripcion": ["El centro histórico revela una Sarnico distinta de la fachada lacustre. Sus calles estrechas, pasos, pequeños ensanchamientos y casas adosadas conservan la escala de un núcleo mercantil y artesanal que creció protegido de las crecidas y muy cerca de los embarcaderos."], "historia": ["La forma urbana procede de una acumulación de siglos. Las familias locales construyeron viviendas y talleres en parcelas estrechas, y las vías principales conectaron el puerto con las rutas terrestres. Las torres y restos defensivos recuerdan que el control del paso entre lago y río tenía valor estratégico."], "arquitectura": ["Predominan edificios de varias plantas con muros revocados, portales de piedra, balcones y patios ocultos. La irregularidad de las alineaciones y los cambios de nivel producen encuadres inesperados. Es importante mirar hacia arriba: cornisas, chimeneas, campanarios y restos de fábrica antigua suelen pasar desapercibidos."], "arte": [], "curiosidades": [], "consejos": ["No requiere un itinerario rígido. Lo más interesante es entrar desde el lungolago, perder momentáneamente la vista del agua y regresar a ella por otra calle. Las primeras horas del día facilitan la observación de fachadas sin el flujo comercial y de restauración."]}}, {"name": "TORRE MEDIEVALE", "fonetica": "TÓR-re me-die-VÁ-le", "lat": 45.667276, "lng": 9.956096, "type": "visita", "meta": {"tiempo": "15-25 minutos para la observación exterior."}, "sections": {"descripcion": ["La torre medieval constituye una de las huellas más legibles del sistema defensivo y de control del antiguo Sarnico. Su masa vertical contrasta con la arquitectura doméstica y ayuda a reconstruir mentalmente un núcleo más compacto, cerrado y vigilado."], "historia": ["Las torres urbanas medievales cumplían funciones diversas: defensa, vigilancia, almacenamiento y representación del poder de una familia. En ciudades y villas lombardas, poseer una torre era también una declaración de rango. Con el paso del tiempo muchas fueron rebajadas, incorporadas a viviendas o privadas de sus coronamientos."], "arquitectura": ["Conviene observar el espesor aparente de los muros, la escasez de vanos originales en los niveles bajos y las modificaciones posteriores. Las diferencias de aparejo, ventanas y revocos permiten distinguir fases. Su valor no depende de una decoración abundante, sino de la claridad con la que conserva la lógica constructiva medieval."], "arte": [], "curiosidades": [], "consejos": ["La lectura se hace desde el espacio público. Hay que buscar una perspectiva que permita ver la base y el remate, evitando apoyarse en propiedades privadas. La luz lateral resalta mejor la textura de la fábrica."]}}, {"name": "RIVA DI SOLTO", "fonetica": "RÍ-va di SÓL-to", "lat": 45.774852, "lng": 10.039862, "type": "visita", "meta": {"tiempo": "1-1,5 horas para el núcleo y el frente lacustre."}, "sections": {"descripcion": ["Riva di Solto es uno de los pueblos más escénicos de la orilla bergamasca. Se dispone entre una ladera pronunciada y el agua, con un núcleo compacto que conserva pasajes, escaleras y perspectivas del lago. Su tamaño permite una visita breve, pero la calidad paisajística invita a detenerse."], "historia": ["Su posición protegida favoreció actividades de pesca, navegación y explotación de los recursos de la montaña. El pueblo mantuvo vínculos con las rutas lacustres y con pequeños puertos de la ribera. La estructura histórica refleja una comunidad obligada a concentrar sus viviendas en la estrecha franja disponible."], "arquitectura": ["La arquitectura es fundamentalmente vernácula: casas adosadas, muros de piedra, arcos, patios y calles de fuerte pendiente. La iglesia y las antiguas casas señoriales introducen una escala monumental limitada. El conjunto importa más que cualquier fachada aislada, porque la forma urbana se adapta con precisión al relieve."], "arte": ["El paseo por el borde del agua, los callejones que ascienden y las vistas hacia las paredes rocosas del Bogn forman la experiencia principal. En los detalles conviene buscar portales, escudos, pequeños elementos religiosos y la manera en que las casas enmarcan fragmentos del lago."], "curiosidades": [], "consejos": ["El aparcamiento es reducido y la carretera costera puede ser lenta. Conviene caminar sin prisas y respetar el carácter residencial. Para fotografía, las mejores imágenes suelen surgir desde los extremos del pueblo, donde se percibe el conjunto entre montaña y agua."]}}, {"name": "CHIESA DI SAN GAUDENZIO", "fonetica": "KIÉ-sa di san gau-DÉN-tsio", "lat": 45.789836, "lng": 10.026855, "type": "visita", "meta": {"tiempo": "20-35 minutos si está abierta."}, "sections": {"descripcion": ["La iglesia de San Gaudenzio es el principal hito religioso de Riva di Solto y concentra buena parte de la memoria artística de la comunidad. Su presencia domina el núcleo y ofrece un contrapunto monumental a la arquitectura doméstica."], "historia": ["El edificio actual es resultado de fases sucesivas, ampliaciones y renovaciones ligadas al crecimiento de la parroquia y a las posibilidades económicas locales. Como ocurre en muchas iglesias lombardas, una fábrica de origen antiguo fue actualizada en época moderna mediante altares, pinturas y decoración adaptados a la liturgia posterior al Concilio de Trento."], "arquitectura": ["La arquitectura combina una envolvente relativamente sobria con un interior de mayor riqueza. La organización de nave, presbiterio y capillas responde a la función parroquial. Merece atención el campanario como referencia visual desde el lago y la relación de la iglesia con las calles estrechas que la rodean."], "arte": ["En el interior conviene observar los altares laterales, pinturas, estucos y mobiliario litúrgico, evitando centrarse solo en el altar mayor. Las obras locales suelen documentar devociones, cofradías y encargos de familias del territorio."], "curiosidades": [], "consejos": ["Es un templo activo. Hay que entrar en silencio, evitar fotografías durante oficios y comprobar si la puerta está abierta sin forzar accesos. Si está cerrada, la visita exterior sigue siendo útil para entender la estructura del pueblo."]}}, {"name": "CERRETE", "fonetica": "cher-RÉ-te", "lat": 45.797124, "lng": 10.050241, "type": "visita", "meta": {"tiempo": "15-30 minutos."}, "sections": {"descripcion": ["Cerrete es una pequeña parada de carácter paisajístico y residencial en la ribera del lago. Su interés está en ofrecer una escala menor, alejada de los centros más visitados, y en mostrar cómo las aldeas se insertan entre la carretera, la pendiente y el agua."], "historia": ["Estos pequeños núcleos dependieron tradicionalmente de economías mixtas: pesca, cultivo en terrazas, aprovechamiento forestal y conexiones por barca. La transformación turística introdujo segundas residencias y servicios, pero la forma del asentamiento continúa condicionada por la topografía."], "arquitectura": [], "arte": [], "curiosidades": [], "consejos": ["La parada solo merece la pena si encaja naturalmente en el trayecto y existe estacionamiento seguro. No es necesario buscar un monumento concreto: basta con observar la costa, las casas y las vistas. Evitar invadir accesos privados."]}}, {"name": "LOVERE", "fonetica": "LÓ-ve-re", "lat": 45.816835, "lng": 10.075491, "type": "visita", "meta": {"tiempo": "2-3 horas para el casco histórico y el lungolago; más si se visita la Accademia Tadini o Santa Maria in Valvendra."}, "sections": {"descripcion": ["Lovere se extiende en anfiteatro en la cabecera noroccidental del lago. Su combinación de paseo elegante, puerto, calles medievales, iglesias y edificios culturales explica su inclusión entre los borghi più belli d’Italia. A diferencia de núcleos más pequeños, tiene suficiente densidad monumental para justificar varias horas."], "historia": ["La posición de Lovere, cerca de la entrada del valle Camonica, la convirtió en punto de intercambio entre el lago y las rutas alpinas. El núcleo medieval creció con torres y defensas, mientras la prosperidad mercantil y manufacturera impulsó iglesias y palacios. En los siglos XVIII y XIX, familias cultas como los Tadini consolidaron una identidad artística que culminó en una de las primeras galerías públicas de Lombardía."], "arquitectura": ["La ciudad superpone una trama medieval en pendiente con un frente lacustre de carácter más abierto y representativo. Las torres recuerdan el sistema defensivo; Santa Maria in Valvendra muestra formas renacentistas con influencias venecianas; la Accademia Tadini utiliza un lenguaje neoclásico adecuado a su función cultural."], "arte": ["Entre los grandes atractivos están la basílica de Santa Maria in Valvendra, cuyos paneles de órgano fueron pintados por Ferramola y Moretto; la Accademia Tadini, con obras de Antonio Canova; las torres del centro; Piazza XIII Martiri y el paseo del lago. La calidad de Lovere surge de enlazar estas piezas y no de tratarlas como visitas aisladas."], "curiosidades": [], "consejos": ["El casco tiene pendientes y pavimento irregular. Conviene aparcar en las áreas del frente lacustre y ascender a pie. Si solo se dispone de una hora, priorizar Piazza XIII Martiri, el lungolago y una incursión por las calles altas. Con más tiempo, entrar en la Accademia Tadini y Santa Maria in Valvendra."]}}, {"name": "PIAZZA TREDICI MARTIRI", "fonetica": "PIÁT-sa TRÉ-di-chi MÁR-ti-ri", "lat": 45.816915, "lng": 10.075085, "type": "visita", "meta": {"tiempo": "20-40 minutos."}, "sections": {"descripcion": ["Piazza XIII Martiri es el principal espacio abierto de Lovere frente al lago. Funciona como punto de llegada, lugar de encuentro y transición entre el puerto, el paseo y las calles interiores."], "historia": ["El nombre recuerda a trece partisanos fusilados en Lovere en 1943, de modo que la plaza combina su función cotidiana con una memoria explícita de la resistencia y de la violencia de la Segunda Guerra Mundial. La denominación transforma un espacio urbano agradable en lugar con contenido cívico."], "arquitectura": ["La plaza se define más por su relación con el agua y por las fachadas perimetrales que por una composición cerrada. Su apertura permite leer el anfiteatro urbano de Lovere y la montaña posterior."], "arte": [], "curiosidades": [], "consejos": ["Es un buen punto para orientarse antes de ascender al centro. Conviene detenerse también ante los elementos conmemorativos y no reducirla a una terraza panorámica. La luz de tarde favorece las fachadas y el perfil del puerto."]}}, {"name": "TORRE DEGLI ALGHISI", "fonetica": "TÓR-re de-lli al-GUÍ-si", "lat": 45.816122, "lng": 10.073227, "type": "visita", "meta": {"tiempo": "15-25 minutos para la lectura exterior."}, "sections": {"descripcion": ["Una de las torres vinculadas a las familias dominantes del lovere medieval. Su interés reside tanto en la antigüedad de la fábrica como en la manera en que quedó absorbida por viviendas, calles y transformaciones posteriores."], "historia": ["Las torres medievales de Lovere formaban parte de un sistema de defensa y de representación familiar. En un núcleo conectado con el comercio hacia el valle Camonica, controlar accesos y afirmar rango tenía importancia política. Con la pérdida de su función militar, muchas torres fueron rebajadas o reutilizadas."], "arquitectura": ["Hay que observar la mampostería, el tamaño y posición de los vanos, las uniones con construcciones adyacentes y cualquier diferencia que revele ampliaciones. La austeridad es parte de su carácter: son estructuras diseñadas para resistir y dominar visualmente, no para ofrecer una fachada palaciega."], "arte": [], "curiosidades": [], "consejos": ["La visita es exterior y breve, integrada en el paseo por el casco. Resulta más útil comparar varias torres que valorar una sola de manera aislada, porque juntas permiten imaginar el perfil vertical de la ciudad medieval."]}}, {"name": "TORRICELLA", "fonetica": "tor-ri-CHÉL-la", "lat": 45.816705, "lng": 10.07089, "type": "visita", "meta": {"tiempo": "15-25 minutos para la lectura exterior."}, "sections": {"descripcion": ["Un resto urbano que ayuda a comprender la antigua organización defensiva y la densidad del núcleo. Su interés reside tanto en la antigüedad de la fábrica como en la manera en que quedó absorbida por viviendas, calles y transformaciones posteriores."], "historia": ["Las torres medievales de Lovere formaban parte de un sistema de defensa y de representación familiar. En un núcleo conectado con el comercio hacia el valle Camonica, controlar accesos y afirmar rango tenía importancia política. Con la pérdida de su función militar, muchas torres fueron rebajadas o reutilizadas."], "arquitectura": ["Hay que observar la mampostería, el tamaño y posición de los vanos, las uniones con construcciones adyacentes y cualquier diferencia que revele ampliaciones. La austeridad es parte de su carácter: son estructuras diseñadas para resistir y dominar visualmente, no para ofrecer una fachada palaciega."], "arte": [], "curiosidades": [], "consejos": ["La visita es exterior y breve, integrada en el paseo por el casco. Resulta más útil comparar varias torres que valorar una sola de manera aislada, porque juntas permiten imaginar el perfil vertical de la ciudad medieval."]}}, {"name": "TORRE SOCA", "fonetica": "TÓR-re SÓ-ca", "lat": 45.817227, "lng": 10.074642, "type": "visita", "meta": {"tiempo": "15-25 minutos para la lectura exterior."}, "sections": {"descripcion": ["Un hito vertical integrado en la trama histórica de lovere. Su interés reside tanto en la antigüedad de la fábrica como en la manera en que quedó absorbida por viviendas, calles y transformaciones posteriores."], "historia": ["Las torres medievales de Lovere formaban parte de un sistema de defensa y de representación familiar. En un núcleo conectado con el comercio hacia el valle Camonica, controlar accesos y afirmar rango tenía importancia política. Con la pérdida de su función militar, muchas torres fueron rebajadas o reutilizadas."], "arquitectura": ["Hay que observar la mampostería, el tamaño y posición de los vanos, las uniones con construcciones adyacentes y cualquier diferencia que revele ampliaciones. La austeridad es parte de su carácter: son estructuras diseñadas para resistir y dominar visualmente, no para ofrecer una fachada palaciega."], "arte": [], "curiosidades": [], "consejos": ["La visita es exterior y breve, integrada en el paseo por el casco. Resulta más útil comparar varias torres que valorar una sola de manera aislada, porque juntas permiten imaginar el perfil vertical de la ciudad medieval."]}}, {"name": "PISOGNE", "fonetica": "pi-SÓ-nie", "lat": 45.806264, "lng": 10.10953, "type": "visita", "meta": {"tiempo": "1,5-2,5 horas."}, "sections": {"descripcion": ["Pisogne se sitúa en el extremo norte del lago, donde la llanura del Oglio y el acceso al valle Camonica abren el paisaje. El pueblo combina un frente lacustre agradable, una plaza histórica presidida por una torre y un patrimonio artístico de primer orden asociado a Romanino."], "historia": ["La localidad fue un centro de paso entre el lago y el valle. Su historia estuvo vinculada al obispado de Brescia, a las disputas territoriales y a la economía de mercado. La gran plaza y la torre reflejan la importancia cívica del núcleo. En el siglo XVI, la iglesia de Santa Maria della Neve recibió un ciclo de frescos de Girolamo Romanino que hoy constituye uno de los grandes motivos para visitar Pisogne."], "arquitectura": ["El centro histórico reúne arquitectura civil de origen medieval y transformaciones posteriores. La Torre del Vescovo domina Piazza Corna Pellegrini; el tejido circundante conserva soportales, casas estrechas y calles que conectan con el lago. Santa Maria della Neve, más apartada, presenta una arquitectura relativamente contenida que intensifica el impacto de su interior pintado."], "arte": ["El ciclo de Romanino en Santa Maria della Neve se distingue por figuras vigorosas, expresividad popular y una narración de la Pasión alejada de la idealización cortesana. En el centro conviene observar la torre, los pórticos y la continuidad entre plaza y calles comerciales."], "curiosidades": [], "consejos": ["La visita debe coordinarse con el horario de Santa Maria della Neve, que puede ser limitado. El lungolago es llano, pero el centro incluye pavimento irregular. Para una parada corta, combinar plaza, torre y paseo; para una visita cultural completa, reservar al menos hora y media e incluir los frescos."]}}, {"name": "PISOGNE", "fonetica": "pi-SÓ-nie", "lat": 45.80659, "lng": 10.10575, "type": "visita", "meta": {"tiempo": "30-60 minutos como segundo punto de orientación o acceso."}, "sections": {"descripcion": ["Este segundo marcador de Pisogne sirve para completar el recorrido por un núcleo que no se entiende desde una sola plaza. Permite enlazar el frente lacustre con las calles interiores y ajustar la visita según el punto real de aparcamiento o llegada."], "historia": ["La duplicidad del punto refleja las dos caras de Pisogne: puerto lacustre y puerta del valle Camonica. Durante siglos, mercancías y viajeros cambiaron aquí entre rutas de agua y caminos terrestres."], "arquitectura": [], "arte": [], "curiosidades": [], "consejos": ["Debe utilizarse como referencia de itinerario, no como una segunda visita independiente. Si ambos marcadores quedan muy próximos en el mapa final, puede conservarse solo el que mejor represente el acceso previsto."]}}, {"name": "MIRAD’OR", "fonetica": "mi-ra-DÓR", "lat": 45.802986, "lng": 10.105754, "type": "visita", "meta": {"tiempo": "20-45 minutos; más si alberga una exposición temporal."}, "sections": {"descripcion": ["Mirad’Or es un pequeño pabellón contemporáneo situado sobre el agua en Pisogne. Su nombre juega con la idea de mirador y con la condición dorada o preciosa de la vista. Funciona como espacio cultural y como objeto arquitectónico que reinterpreta la relación tradicional entre embarcadero, paseo y lago."], "historia": ["El edificio surge de la voluntad de dotar al frente lacustre de un espacio para arte contemporáneo. En lugar de imitar la arquitectura histórica, adopta una presencia deliberadamente actual y convierte el paisaje en parte de cualquier exposición."], "arquitectura": ["Su volumen ligero, geometría limpia y grandes superficies abiertas o acristaladas contrastan con la masa de las casas antiguas. La plataforma sobre el agua hace que el visitante perciba el lago como fondo, reflejo y elemento cambiante. La arquitectura es pequeña, pero muy consciente de la perspectiva."], "arte": [], "curiosidades": [], "consejos": ["Aunque esté cerrado, merece una breve observación exterior. Conviene rodearlo desde el paseo y comparar cómo cambia su imagen con la luz. No bloquear la entrada ni apoyarse en elementos de protección para fotografiar."]}}, {"name": "LUNGOLAGO PISOGNE", "fonetica": "lun-go-LÁ-go pi-SÓ-nie", "lat": 45.801118, "lng": 10.105062, "type": "visita", "meta": {"tiempo": "30-60 minutos."}, "sections": {"descripcion": ["El paseo lacustre de Pisogne ofrece una de las vistas más abiertas del extremo norte del lago. Desde aquí se entiende la transición entre el espejo de agua y la entrada del valle Camonica, con montañas más próximas y una atmósfera distinta de la cuenca meridional."], "historia": ["La orilla fue durante siglos un espacio de trabajo vinculado a barcas, mercancías y pesca. Su conversión en paseo público refleja el cambio hacia usos recreativos y turísticos, aunque el puerto mantiene la memoria de esas comunicaciones."], "arquitectura": [], "arte": [], "curiosidades": [], "consejos": ["Es apropiado para una pausa breve y accesible. La mañana suele ofrecer mejor visibilidad hacia las montañas; al atardecer, el agua y las fachadas adquieren tonos cálidos. Combinarlo con el centro histórico y no usarlo como sustituto de la visita a la plaza y a Santa Maria della Neve."]}}, {"name": "ISOLA DI LORETO", "fonetica": "Í-so-la di lo-RÉ-to", "lat": 45.727056, "lng": 10.085213, "type": "visita", "meta": {"tiempo": "Observación desde el barco o desde miradores de la costa."}, "sections": {"descripcion": ["La isla de Loreto es una pequeña isla privada al norte de Monte Isola, reconocible por el castillo neogótico que ocupa gran parte de su superficie. Su silueta arbolada y romántica constituye una de las imágenes más singulares del lago."], "historia": ["La isla tuvo usos religiosos desde la Edad Media y estuvo vinculada a comunidades monásticas. Tras cambios de propiedad, a comienzos del siglo XX fue transformada por la familia Richieri mediante una residencia de apariencia castellana, jardines, embarcadero y estructuras escenográficas."], "arquitectura": ["El edificio no es un castillo medieval, sino una creación historicista que combina torres, almenas, piedra y referencias neogóticas. Su efecto depende de la integración con la vegetación y el agua. Precisamente por esa apariencia convincente se confunde con frecuencia con una fortificación antigua."], "arte": [], "curiosidades": ["La isla es privada y no forma parte de las paradas regulares de visita. Muchas fotografías promocionales del lago la muestran como destino accesible, pero su contemplación habitual se realiza desde embarcaciones o desde la costa."], "consejos": ["No planificar un desembarco. La mejor perspectiva se obtiene desde un barco que pase por el norte de Monte Isola o desde puntos elevados de la ribera oriental. Un teleobjetivo ayuda a registrar los detalles sin invadir la privacidad."]}}, {"name": "FERRY A MONTE ISOLA · SALE MARASINO", "fonetica": "SÁ-le ma-ra-SÍ-no", "lat": 45.716132, "lng": 10.109863, "type": "ferry", "meta": {"tiempo": "Cruce breve; añadir margen de espera y embarque."}, "sections": {"descripcion": ["El embarcadero de Sale Marasino es uno de los accesos principales a Monte Isola. La travesía hacia Carzano es corta, pero forma parte esencial de la experiencia porque permite percibir la altura de la isla, sus aldeas ribereñas y la escala del lago."], "historia": ["Las conexiones regulares sustituyen y continúan una red secular de barcas locales. Monte Isola dependió siempre del agua para transporte de personas, pescado, redes, madera y productos agrícolas. El ferry no es solamente un servicio turístico: es transporte cotidiano para residentes."], "arquitectura": [], "arte": [], "curiosidades": [], "consejos": ["Llegar con margen, especialmente en verano. Consultar restricciones para bicicletas, equipaje voluminoso y vehículos; el acceso de automóviles particulares a Monte Isola está muy limitado. Guardar el billete hasta finalizar el trayecto y confirmar el último regreso compatible con la ruta por carretera."]}}, {"name": "MONTE ISOLA", "fonetica": "MÓN-te Í-so-la", "lat": 45.715043, "lng": 10.07991, "type": "visita", "meta": {"tiempo": "3-5 horas para una aldea ribereña y un tramo de paseo; jornada completa para una exploración amplia."}, "sections": {"descripcion": ["Monte Isola se eleva casi seiscientos metros en el centro del lago y es una de las mayores islas lacustres habitadas de Europa. No es un único pueblo, sino un municipio formado por doce aldeas distribuidas entre la orilla y las laderas. Peschiera Maraglio y Carzano son los accesos más frecuentes, mientras Cure y el santuario de la Madonna della Ceriola ocupan cotas altas."], "historia": ["La vida insular se basó durante siglos en la pesca, la fabricación de redes, la construcción de barcas de madera y una agricultura adaptada a pendientes. Familias y talleres de Monte Isola alcanzaron gran reputación en la producción de redes, utilizadas no solo para pesca sino también para deportes y otros usos. El aislamiento relativo favoreció la conservación de costumbres y de una relación muy directa con el lago."], "arquitectura": ["Las aldeas ribereñas presentan casas estrechas, pasajes, escaleras, pequeños puertos y edificios vinculados al trabajo pesquero. En las cotas altas aparecen caminos entre olivos y núcleos más rurales. El santuario de la Madonna della Ceriola, en la cumbre, es el gran hito visual y espiritual. La arquitectura adquiere sentido al recorrer el desnivel entre agua y montaña."], "arte": ["Conviene observar los puertos tradicionales, las redes, las barcas llamadas naèt y las iglesias de las distintas aldeas. El paisaje cultural incluye olivares, senderos, muros y vistas hacia las islas privadas de Loreto y San Paolo. En 2016, The Floating Piers de Christo y Jeanne-Claude conectó temporalmente Sulzano, Monte Isola y San Paolo mediante pasarelas flotantes, atrayendo atención mundial."], "curiosidades": ["La circulación de vehículos privados está restringida, lo que cambia por completo la experiencia respecto a otros pueblos del lago. La isla parece pequeña en el mapa, pero el relieve hace que los desplazamientos sean más exigentes de lo previsto. Rodearla por carretera o sendero supone cerca de nueve kilómetros."], "consejos": ["No intentar abarcar toda la isla en una visita breve. Elegir entre un paseo ribereño tranquilo y la subida al santuario. Para la subida son necesarios tiempo, agua y calzado adecuado; también existen servicios locales de transporte, sujetos a horarios. Confirmar el ferry de regreso y evitar depender del último barco. En días calurosos, las pendientes pueden resultar duras."]}}, {"name": "FERRY A MONTE ISOLA · SULZANO", "fonetica": "sul-TSÁ-no", "lat": 45.690901, "lng": 10.099258, "type": "ferry", "meta": {"tiempo": "Cruce breve; añadir margen de espera y embarque."}, "sections": {"descripcion": ["El embarcadero de Sulzano es uno de los accesos principales a Monte Isola. La travesía hacia Peschiera Maraglio es corta, pero forma parte esencial de la experiencia porque permite percibir la altura de la isla, sus aldeas ribereñas y la escala del lago."], "historia": ["Las conexiones regulares sustituyen y continúan una red secular de barcas locales. Monte Isola dependió siempre del agua para transporte de personas, pescado, redes, madera y productos agrícolas. El ferry no es solamente un servicio turístico: es transporte cotidiano para residentes."], "arquitectura": [], "arte": [], "curiosidades": [], "consejos": ["Llegar con margen, especialmente en verano. Consultar restricciones para bicicletas, equipaje voluminoso y vehículos; el acceso de automóviles particulares a Monte Isola está muy limitado. Guardar el billete hasta finalizar el trayecto y confirmar el último regreso compatible con la ruta por carretera."]}}, {"name": "ISEO", "fonetica": "Í-se-o", "lat": 45.659751, "lng": 10.049568, "type": "visita", "meta": {"tiempo": "1,5-2,5 horas para el centro y el paseo; más si se visita una exposición."}, "sections": {"descripcion": ["Iseo es la principal localidad de la ribera suroriental y da nombre al lago. Su casco histórico combina plazas porticadas, iglesias, restos medievales y un paseo animado. Funciona como centro de servicios y como puerta de entrada a Monte Isola y a Franciacorta."], "historia": ["El lugar fue ocupado desde época antigua y se desarrolló como puerto y mercado. Durante la Edad Media estuvo bajo diversas jurisdicciones y conservó estructuras defensivas, entre ellas el castillo Oldofredi. La dominación veneciana dejó una fuerte impronta administrativa y cultural. En la época moderna, el ferrocarril y el turismo reforzaron su papel regional."], "arquitectura": ["La trama histórica se organiza alrededor de Piazza Garibaldi y de calles porticadas. El castillo Oldofredi representa la arquitectura defensiva medieval; la Pieve di Sant’Andrea reúne fases románicas y posteriores; los palacios y fachadas de la plaza muestran la evolución cívica del burgo. El paseo lacustre abre el tejido hacia el paisaje."], "arte": ["Piazza Garibaldi, el monumento al héroe de la unificación italiana, la pieve, el castillo y la cercana Fondazione L’Arsenale forman una secuencia compacta. Conviene mirar los soportales, los patios y los cambios de pavimento, además de buscar vistas de Monte Isola desde el puerto."], "curiosidades": [], "consejos": ["El centro es peatonal y se visita cómodamente. En días de mercado o fines de semana puede haber mucha actividad. Aparcar en áreas exteriores y no intentar entrar en las calles históricas. La luz de última hora resulta favorable en el lungolago, mientras la mañana es mejor para recorrer las plazas con menos gente."]}}, {"name": "PIAZZA GARIBALDI", "fonetica": "PIÁT-sa ga-ri-BÁL-di", "lat": 45.659857, "lng": 10.048772, "type": "visita", "meta": {"tiempo": "25-45 minutos."}, "sections": {"descripcion": ["Piazza Garibaldi es el corazón cívico de Iseo. Su forma alargada, los soportales y las fachadas de diferentes épocas crean un espacio vivido, más próximo a una plaza de mercado que a un escenario monumental rígido."], "historia": ["La plaza concentró funciones comerciales y administrativas. En su centro se levantó en 1883 uno de los primeros monumentos italianos dedicados a Giuseppe Garibaldi, obra que refleja la rápida incorporación del héroe del Risorgimento a la memoria pública."], "arquitectura": ["Los edificios perimetrales forman una composición heterogénea unificada por la continuidad de los pórticos. Conviene observar balcones, relojes, escudos y la manera en que las calles desembocan bajo los soportales."], "arte": [], "curiosidades": [], "consejos": ["Recorrerla también por debajo de los pórticos. La plaza cambia mucho con mercado, terrazas o eventos. Para fotografiar el conjunto conviene situarse en uno de los extremos, no junto al monumento central."]}}, {"name": "PIAZZA STATUTO", "fonetica": "PIÁT-sa sta-TÚ-to", "lat": 45.660372, "lng": 10.048586, "type": "visita", "meta": {"tiempo": "15-30 minutos."}, "sections": {"descripcion": ["Piazza Statuto es un espacio más recogido del centro de Iseo que ayuda a entender la continuidad entre plazas, calles comerciales y edificios históricos. Su valor está en la escala cotidiana y en la relación con el itinerario urbano."], "historia": ["El nombre remite a la cultura política del siglo XIX y al Estatuto Albertino, referencia constitucional del Reino de Cerdeña y después del Reino de Italia. Como muchas denominaciones urbanas, vincula el lugar con la construcción de la memoria nacional."], "arquitectura": [], "arte": [], "curiosidades": [], "consejos": ["No requiere una parada larga. Conviene integrarla en el paseo entre Piazza Garibaldi, el castillo y el frente lacustre, observando portales y fachadas en lugar de buscar un monumento central."]}}, {"name": "FONDAZIONE L’ARSENALE", "fonetica": "fon-da-TSIÓ-ne lar-se-NÁ-le", "lat": 45.660687, "lng": 10.048867, "type": "visita", "meta": {"tiempo": "30-75 minutos según exposición."}, "sections": {"descripcion": ["L’Arsenale es un espacio dedicado al arte y la cultura contemporánea en el centro de Iseo. Ocupa un edificio histórico adaptado a exposiciones y ofrece un contrapunto actual al patrimonio religioso y medieval del pueblo."], "historia": ["La institución nació para promover exposiciones, encuentros y proyectos culturales. El nombre conserva la memoria funcional del edificio o del área, mientras su uso actual refleja la tendencia a reutilizar arquitecturas históricas como contenedores culturales."], "arquitectura": ["La adaptación museográfica busca mantener la lectura de los volúmenes preexistentes y proporcionar salas flexibles. En este tipo de espacios conviene observar cómo se resuelven iluminación, circulación y relación entre obra contemporánea y muros antiguos."], "arte": [], "curiosidades": [], "consejos": ["No asumir que estará abierta: la actividad depende del calendario. Consultar la exposición concreta y valorar el tiempo según su interés. Si está cerrada, el edificio puede observarse dentro del recorrido por el centro, sin necesidad de reservar una parada larga."]}}, {"name": "BRESCIA", "fonetica": "BRÉ-sha", "lat": 45.541553, "lng": 10.211802, "type": "visita", "meta": {"tiempo": "3-5 horas para un recorrido exterior; un día completo si se visitan Santa Giulia y Brixia en jornada de apertura."}, "sections": {"descripcion": ["Brescia es una de las ciudades históricas más densas de Lombardía. Bajo una apariencia menos turística que Verona o Bérgamo, conserva un foro romano excepcional, un complejo monástico convertido en museo, dos catedrales enfrentadas, plazas renacentistas, arquitectura medieval y un castillo dominante. La continuidad entre restos romanos y ciudad contemporánea es una de sus grandes singularidades."], "historia": ["La antigua Brixia fue una ciudad importante de la Galia Cisalpina y recibió monumentalización romana a partir de la época republicana y augustea. Tras la caída del Imperio, Brescia fue centro del poder lombardo; el monasterio de San Salvatore-Santa Giulia, fundado en el siglo VIII por el rey Desiderio y Ansa, es testimonio de esa etapa. La ciudad pasó después por poderes comunales, visconteos y venecianos. En 1849, la resistencia de las Diez Jornadas frente a las tropas austríacas le valió el sobrenombre de Leonessa d’Italia."], "arquitectura": ["Pocas ciudades permiten leer capas tan variadas en un recorrido corto: el Capitolium y el teatro romano; las iglesias altomedievales de Santa Giulia; el Duomo Vecchio románico, de planta circular; el Duomo Nuovo barroco; Piazza della Loggia, de carácter veneciano; y el castillo, resultado de sucesivas fortificaciones. La piedra local clara y las plazas porticadas proporcionan cierta unidad a esta diversidad."], "arte": ["El corredor UNESCO que enlaza Brixia y Santa Giulia concentra mosaicos, esculturas, arquitectura romana, cruces lombardas y obras como la Vittoria Alata. El Museo de Santa Giulia es especialmente valioso porque presenta la historia de la ciudad dentro de edificios que forman parte del propio relato."], "curiosidades": ["El 28 de mayo de 1974 una bomba explotó durante una manifestación antifascista en Piazza della Loggia y causó ocho muertos. La plaza mantiene un memorial sonoro y cívico. Esta historia reciente convive con la imagen renacentista del espacio y recuerda que el patrimonio urbano no es solo artístico."], "consejos": ["El lunes 22 de junio de 2026, Santa Giulia y el área arqueológica de Brixia permanecen cerrados por ser lunes no festivo. La jornada debe plantearse principalmente como recorrido exterior: Piazza della Loggia, las dos catedrales, el área romana visible desde la calle, Torre della Pallata y castillo. Si los museos son prioritarios, habría que mover Brescia a otro día. El centro tiene ZTL; aparcar fuera y caminar."]}}, {"name": "PIAZZA DELLA LOGGIA", "fonetica": "PIÁT-sa DÉL-la LÓ-ya", "lat": 45.539979, "lng": 10.219828, "type": "visita", "meta": {"tiempo": "30-45 minutos."}, "sections": {"descripcion": ["Piazza della Loggia es el gran espacio renacentista de Brescia y la expresión más clara de la etapa veneciana. La plaza se organiza alrededor del Palazzo della Loggia, con su fachada de mármol, y queda cerrada por edificios porticados y por la torre del reloj."], "historia": ["Su construcción comenzó a finales del siglo XV para dotar a la ciudad de una sede de gobierno y de una plaza representativa. La obra se prolongó durante décadas y reunió aportaciones de arquitectos y escultores vinculados al mundo veneciano. En 1974 fue escenario del atentado neofascista durante una manifestación, una herida central en la memoria democrática italiana."], "arquitectura": ["El Palazzo della Loggia combina basamento porticado, rica decoración escultórica y una cubierta que fue modificada tras incendios y restauraciones. En el lado oriental, la torre con reloj astronómico y los autómatas conocidos como i Macc de le ure animan el espacio. La plaza busca una unidad escenográfica mediante pórticos y proporciones regulares."], "arte": ["Conviene observar la decoración del palacio, el reloj, las figuras mecánicas que golpean la campana y las trazas memoriales del atentado. La belleza del conjunto no debe ocultar su función política y cívica."], "curiosidades": [], "consejos": ["Dedicar tiempo a recorrer los cuatro lados y pasar bajo los pórticos. El mejor encuadre del Palazzo della Loggia se obtiene desde el lado opuesto. Mantener una actitud respetuosa ante los memoriales del atentado."]}}, {"name": "CASTELLO DI BRESCIA", "fonetica": "cas-TÉL-lo di BRÉ-sha", "lat": 45.542906, "lng": 10.225141, "type": "visita", "meta": {"tiempo": "1,5-2,5 horas para subir, recorrer exteriores y disfrutar de las vistas; más si se visitan museos."}, "sections": {"descripcion": ["El castillo ocupa el colle Cidneo y domina la ciudad desde una posición utilizada con fines defensivos desde la Antigüedad. Es una ciudadela compleja, formada por murallas, bastiones, puertas, torres, fosos y edificios de distintas épocas. Además de monumento militar, es parque urbano y mirador."], "historia": ["La colina estuvo relacionada con el asentamiento antiguo y con espacios religiosos romanos. Las fortificaciones se ampliaron durante la Edad Media, el dominio visconteo y especialmente bajo Venecia, que adaptó el sistema a la artillería. En época moderna fue cuartel, prisión y escenario de episodios militares. Durante las Diez Jornadas de Brescia de 1849 desempeñó un papel central."], "arquitectura": ["La fortaleza no responde a un único proyecto. La torre Mirabella conserva una estructura medieval; el Mastio visconteo representa el núcleo señorial; los bastiones venecianos y las obras exteriores responden a la defensa moderna. Los recorridos permiten observar troneras, rampas y cambios en el aparejo."], "arte": ["Dentro del recinto se encuentran el Museo de Armas Luigi Marzoli y el Museo del Risorgimento Leonessa d’Italia. Incluso sin entrar, merece atención la puerta monumental, los puentes, las murallas y las vistas sobre cúpulas, torres y llanura."], "curiosidades": [], "consejos": ["La subida desde el centro es pronunciada, aunque existen accesos por carretera y aparcamientos cercanos limitados. Llevar agua en verano. El lunes 22 de junio los museos cívicos estarán cerrados, pero el paseo exterior mantiene mucho interés. Reservar tiempo para bajar sin prisas."]}}, {"name": "DUOMO VECCHIO", "fonetica": "DUÓ-mo VÉK-kio", "lat": 45.538269, "lng": 10.2216, "type": "visita", "meta": {"tiempo": "30-50 minutos si está abierto."}, "sections": {"descripcion": ["El Duomo Vecchio, conocido también como Rotonda, es uno de los ejemplos románicos más singulares de Italia. Su planta circular y su volumen macizo contrastan con la gran fachada barroca del Duomo Nuovo, situado justo enfrente."], "historia": ["Fue construido entre los siglos XI y XII sobre una basílica paleocristiana anterior. Durante siglos funcionó como catedral de Brescia y conservó reliquias, tesoros y monumentos funerarios. Las transformaciones posteriores alteraron parte del conjunto, pero la rotonda mantuvo su identidad."], "arquitectura": ["La estructura circular, levantada con piedra local, se organiza alrededor de un espacio central cubierto por cúpula. La sobriedad de los muros, los ritmos de arcos y la iluminación limitada producen una atmósfera muy diferente de la del Duomo Nuovo. La cripta de San Filastrio conserva elementos de gran antigüedad."], "arte": ["En el interior se encuentran el sarcófago de Berardo Maggi, obras pictóricas, capillas y piezas del tesoro. Conviene descender a la cripta y observar cómo las distintas cotas revelan la superposición histórica."], "curiosidades": [], "consejos": ["No confundirlo con el Duomo Nuovo. La visita gana sentido al entrar en ambos consecutivamente y comparar planta, luz, materiales y concepción litúrgica. Mantener silencio y comprobar misas."]}}, {"name": "BRIXIA · FORO ROMANO", "fonetica": "BRÍK-sia", "lat": 45.528846, "lng": 10.172817, "type": "visita", "meta": {"tiempo": "30-60 minutos para lectura exterior; 1,5-2 horas con entrada al área arqueológica."}, "sections": {"descripcion": ["El foro de Brixia era el centro político, religioso y económico de la ciudad romana. La actual Via dei Musei cruza un área donde el Capitolium, el santuario republicano, el teatro y restos de edificios civiles permiten reconstruir una de las plazas forenses mejor conservadas del norte de Italia."], "historia": ["La monumentalización principal se produjo en época flavia, durante el siglo I d.C., aunque debajo se conservan estructuras republicanas más antiguas. Tras la Antigüedad, los edificios fueron abandonados, reutilizados y sepultados por derrumbes y construcciones. Las excavaciones modernas recuperaron progresivamente el conjunto."], "arquitectura": ["El foro se organizaba como una plaza rectangular con el Capitolium en el lado norte, la basílica civil al sur y pórticos laterales. La disposición sobre terrazas aprovechaba la pendiente del Cidneo. La fachada del templo, parcialmente reconstruida, permite comprender el impacto visual de columnas, escalinata y frontón."], "arte": ["En el área se halló la Vittoria Alata, gran bronce romano convertido en símbolo de Brescia. Los pavimentos, inscripciones y restos del santuario republicano muestran la riqueza decorativa previa al templo flavio."], "curiosidades": [], "consejos": ["Aunque el recinto esté cerrado el lunes, gran parte del Capitolium y del teatro puede contemplarse desde el espacio público. Recorrer Via dei Musei lentamente y buscar los paneles interpretativos. No planificar la entrada para este día concreto."]}}, {"name": "SANTA GIULIA", "fonetica": "SÁN-ta YÚ-lia", "lat": 45.531929, "lng": 10.12662, "type": "visita", "meta": {"tiempo": "15-30 minutos para exterior en lunes; 2,5-4 horas en jornada de apertura."}, "sections": {"descripcion": ["Santa Giulia es un extraordinario complejo monástico convertido en museo de la ciudad. El recorrido atraviesa edificios romanos, la basílica lombarda de San Salvatore, la iglesia románica de Santa Maria in Solario, coros, claustros y salas modernas. El contenedor es tan importante como las colecciones."], "historia": ["El monasterio fue fundado en el siglo VIII por el rey lombardo Desiderio y su esposa Ansa. Vinculado a la familia real, acumuló poder, reliquias y propiedades. A lo largo de más de mil años fue ampliado y transformado hasta su supresión en época napoleónica. La restauración y musealización contemporáneas permitieron reunir la historia de Brescia en un recorrido continuo. Desde 2011 forma parte del sitio UNESCO de los centros de poder de los longobardos en Italia."], "arquitectura": ["San Salvatore conserva columnas y capiteles reutilizados, estucos y una espacialidad altomedieval excepcional. Santa Maria in Solario presenta dos niveles y alberga el tesoro; el coro de las monjas muestra decoración renacentista. Claustros y antiguos edificios conventuales articulan el conjunto."], "arte": ["Entre las piezas más conocidas están la Cruz de Desiderio, la lipsanoteca, mosaicos romanos, frescos y objetos procedentes de toda la ciudad. El recorrido permite comprender la transformación desde Brixia romana hasta la ciudad medieval y moderna."], "curiosidades": [], "consejos": ["El museo requiere al menos dos horas y puede ocupar media jornada. Sin embargo, el lunes 22 de junio de 2026 estará cerrado. Solo será posible observar el exterior y el entorno de Via dei Musei. Si es una prioridad del viaje, debe trasladarse a otro día de martes a domingo."]}}, {"name": "PIAZZA DELLA LOGGIA", "fonetica": "PIÁT-sa DÉL-la LÓ-ya", "lat": 45.539979, "lng": 10.219828, "type": "visita", "meta": {"tiempo": "10-20 minutos como regreso o segundo paso por la plaza."}, "sections": {"descripcion": ["Este segundo marcador corresponde al mismo conjunto de Piazza della Loggia. Puede utilizarse como punto de retorno dentro del itinerario o eliminarse al montar la versión definitiva si genera duplicidad."], "historia": [], "arquitectura": [], "arte": [], "curiosidades": [], "consejos": ["Si se mantiene, conviene asociarlo a una función concreta: observación del reloj astronómico, memorial del atentado o enlace hacia Torre della Pallata. No es necesario repetir toda la visita."]}}, {"name": "CAPITOLIUM", "fonetica": "ca-pi-TÓ-li-um", "lat": 45.54, "lng": 10.225833, "type": "visita", "meta": {"tiempo": "30-45 minutos desde el exterior; 60-90 minutos con visita interior."}, "sections": {"descripcion": ["El Capitolium es el templo principal de la Brixia romana y la pieza más visible del parque arqueológico. Dedicado a Júpiter, Juno y Minerva, se alza sobre una terraza al pie del Cidneo y conserva escalinata, podio, columnas y tres cellae."], "historia": ["Fue reconstruido en el año 73 d.C. bajo el emperador Vespasiano, sobre un santuario republicano anterior. Tras el abandono, quedó parcialmente enterrado. Su redescubrimiento en el siglo XIX y las campañas arqueológicas posteriores convirtieron el lugar en símbolo de la recuperación de la ciudad antigua."], "arquitectura": ["La fachada corintia y la disposición tripartita de las cellae expresan el programa religioso oficial de Roma. La reconstrucción parcial permite leer el volumen sin ocultar la condición arqueológica. Bajo el templo flavio, los espacios republicanos conservan pinturas murales de gran calidad."], "arte": ["La Vittoria Alata, hallada en el área junto con otros bronces, es la obra emblemática. Tras su restauración fue instalada en una de las cellae con una museografía contemporánea de Juan Navarro Baldeweg."], "curiosidades": [], "consejos": ["El lunes solo se verá desde fuera. Acercarse desde Piazza del Foro y recorrer el perímetro accesible. La fachada recibe buena luz durante la mañana y primeras horas de la tarde."]}}, {"name": "TEATRO ROMANO", "fonetica": "te-Á-tro ro-MÁ-no", "lat": 45.53998, "lng": 10.226689, "type": "visita", "meta": {"tiempo": "20-35 minutos desde el exterior; más si se integra en la visita arqueológica."}, "sections": {"descripcion": ["El teatro romano se encuentra junto al Capitolium y aprovechaba la pendiente del Cidneo para apoyar parte de la cavea. Aunque conserva menos elementos verticales que el templo, su escala permite imaginar la importancia de los espectáculos públicos en Brixia."], "historia": ["El edificio tuvo una primera fase en época augustea y fue ampliado o renovado en siglos posteriores. Podía albergar a miles de espectadores. Tras su abandono, fue ocupado por construcciones medievales y modernas, entre ellas el Palazzo Maggi Gambara, que todavía se superpone parcialmente al yacimiento."], "arquitectura": ["Son legibles la cavea semicircular, sectores de circulación, el área de la orchestra y restos del frente escénico. La convivencia entre ruina romana y palacio posterior ilustra la reutilización continua del centro urbano."], "arte": [], "curiosidades": [], "consejos": ["El lunes se contempla desde los límites públicos del yacimiento. Buscar un punto elevado o lateral que permita entender la curva de la cavea. La vegetación puede ocultar parte de las estructuras según la estación."]}}, {"name": "DUOMO NUOVO", "fonetica": "DUÓ-mo NUÓ-vo", "lat": 45.538641, "lng": 10.221945, "type": "visita", "meta": {"tiempo": "30-50 minutos si está abierto."}, "sections": {"descripcion": ["El Duomo Nuovo domina Piazza Paolo VI con una gran fachada de mármol y una de las cúpulas más altas de Italia. Su monumentalidad barroca y neoclásica forma un contraste inmediato con la rotonda románica del Duomo Vecchio."], "historia": ["La construcción comenzó en 1604 y se prolongó durante más de dos siglos, afectada por dificultades económicas, cambios de proyecto y guerras. Diversos arquitectos intervinieron hasta la finalización de la cúpula en el siglo XIX. Esta larga cronología explica la mezcla de barroco y clasicismo."], "arquitectura": ["La planta de cruz griega, las grandes pilastras y la cúpula generan un espacio centralizado y luminoso. La fachada utiliza mármol de Botticino, material característico de Brescia. El interior evita la densidad decorativa de otros barrocos y confía el efecto a las proporciones y a la luz."], "arte": ["Conserva altares, monumentos funerarios y pinturas de distintas épocas. Conviene observar la transición hacia la cúpula y comparar la claridad espacial con la atmósfera más cerrada del Duomo Vecchio."], "curiosidades": [], "consejos": ["Visitar ambos duomos consecutivamente. La plaza ofrece la mejor comparación exterior. Es un templo activo y puede haber restricciones durante misas o ceremonias."]}}, {"name": "PARCO DELLE COLLINE DI BRESCIA", "fonetica": "PÁR-co DÉL-le col-LÍ-ne di BRÉ-sha", "lat": 45.553735, "lng": 10.171629, "type": "visita", "meta": {"tiempo": "30-90 minutos según el acceso y sendero elegido."}, "sections": {"descripcion": ["El Parco delle Colline protege un amplio sistema de colinas alrededor de Brescia. No es un jardín urbano único, sino una red de bosques, caminos, áreas agrícolas y miradores que muestran la relación entre la ciudad, el Cidneo y los relieves prealpinos."], "historia": ["El paisaje conserva huellas de cultivo, canteras, caminos y asentamientos. La protección del parque busca limitar la urbanización y mantener corredores ecológicos. Su valor es territorial: explica de dónde proceden materiales como el mármol de Botticino y cómo la ciudad se apoyó históricamente en las colinas."], "arquitectura": [], "arte": [], "curiosidades": [], "consejos": ["El marcador debe verificarse antes de ir, porque distintos accesos conducen a recorridos muy diferentes. No iniciar una ruta larga sin comprobar desnivel, sombra y tiempo disponible. Para una jornada ya cargada, puede bastar un mirador próximo al castillo. Llevar agua y calzado adecuado."]}}, {"name": "PARCO DELLE COLLINE DI BRESCIA", "fonetica": "PÁR-co DÉL-le col-LÍ-ne di BRÉ-sha", "lat": 45.568745, "lng": 10.201742, "type": "visita", "meta": {"tiempo": "30-90 minutos según el acceso y sendero elegido."}, "sections": {"descripcion": ["El Parco delle Colline protege un amplio sistema de colinas alrededor de Brescia. No es un jardín urbano único, sino una red de bosques, caminos, áreas agrícolas y miradores que muestran la relación entre la ciudad, el Cidneo y los relieves prealpinos."], "historia": ["El paisaje conserva huellas de cultivo, canteras, caminos y asentamientos. La protección del parque busca limitar la urbanización y mantener corredores ecológicos. Su valor es territorial: explica de dónde proceden materiales como el mármol de Botticino y cómo la ciudad se apoyó históricamente en las colinas."], "arquitectura": [], "arte": [], "curiosidades": [], "consejos": ["El marcador debe verificarse antes de ir, porque distintos accesos conducen a recorridos muy diferentes. No iniciar una ruta larga sin comprobar desnivel, sombra y tiempo disponible. Para una jornada ya cargada, puede bastar un mirador próximo al castillo. Llevar agua y calzado adecuado."]}}, {"name": "TORRE DELLA PALLATA", "fonetica": "TÓR-re DÉL-la pal-LÁ-ta", "lat": 45.540712, "lng": 10.215949, "type": "visita", "meta": {"tiempo": "20-30 minutos para exterior."}, "sections": {"descripcion": ["La Pallata es una gran torre cívica medieval situada en el centro de Brescia. Con unos treinta metros de altura y una base maciza, fue elemento defensivo, depósito, prisión y símbolo urbano. Su nombre se relaciona tradicionalmente con una empalizada o palizada defensiva."], "historia": ["Fue levantada en el siglo XIII utilizando piedra local y materiales romanos reutilizados. A lo largo de los siglos asumió diferentes funciones públicas. En su base se añadió en el siglo XVI una fuente monumental diseñada en el ambiente artístico veneciano."], "arquitectura": ["La torre presenta una masa casi cúbica, vanos limitados y coronamiento almenado. La fuente introduce esculturas y un lenguaje renacentista que contrasta con la severidad medieval. La combinación muestra cómo la ciudad reutilizó y ennobleció estructuras antiguas."], "arte": ["Conviene examinar la fuente, sus figuras alegóricas y la relación con la base de la torre. También son visibles fragmentos y materiales reaprovechados que conectan el edificio medieval con la Brixia romana."], "curiosidades": [], "consejos": ["La calle puede tener tráfico y poco espacio para alejarse. Buscar la perspectiva desde los cruces próximos y observar la torre desde varios lados. La visita interior no debe darse por supuesta."]}}, {"name": "MUSEO DI SANTA GIULIA", "fonetica": "mu-SÉ-o di SÁN-ta YÚ-lia", "lat": 45.539213, "lng": 10.229141, "type": "visita", "meta": {"tiempo": "15-30 minutos para exterior en este día; 2,5-4 horas en una futura visita."}, "sections": {"descripcion": ["Este marcador corresponde específicamente al acceso museístico de Santa Giulia. El museo narra la historia de Brescia mediante piezas arqueológicas, obras medievales y modernas, instaladas dentro del antiguo monasterio."], "historia": ["La institución museística es resultado de décadas de excavación, restauración y reorganización de colecciones cívicas. Su enfoque no separa objetos y arquitectura: mosaicos, casas romanas, iglesias y claustros forman un único recorrido histórico."], "arquitectura": [], "arte": ["La Cruz de Desiderio, la lipsanoteca, los frescos de San Salvatore, Santa Maria in Solario, las domus romanas y las colecciones arqueológicas justifican por sí solas una visita larga. Es uno de los museos urbanos más completos del norte de Italia."], "curiosidades": [], "consejos": ["No estará abierto el lunes de la ruta. Evitar perder tiempo esperando en la entrada. Si se reorganiza el viaje, comprar entrada anticipada y reservar un mínimo de tres horas. La visita combinada con Brixia requiere casi media jornada."]}}, {"name": "HOTEL FERRETTI MAJESTIC HOUSE", "fonetica": "", "lat": 45.482325, "lng": 10.284408, "type": "alojamiento", "meta": {}, "sections": {"descripcion": [], "historia": [], "arquitectura": [], "arte": [], "curiosidades": [], "consejos": ["Punto logístico de alojamiento. Antes de salir de Brescia conviene guardar la dirección exacta, el teléfono, la hora límite de llegada y las instrucciones de aparcamiento. Comprobar si la recepción permanece abierta durante toda la noche y avisar si el itinerario se retrasa. No se añaden historia, arquitectura ni curiosidades porque no se dispone de información relevante y verificada que aporte valor a la guía."]}}]}, {"name": "Día 4 · Garda+Verona", "color": "#3949AB", "points": [{"name": "DESENZANO DEL GARDA", "fonetica": "de-sen-TSÁ-no del GÁR-da", "lat": 45.469824, "lng": 10.536538, "type": "visita", "meta": {"tiempo": "1,5-2,5 horas para el casco histórico y el paseo; 3-4 horas si se añaden el castillo y la villa romana."}, "sections": {"descripcion": ["Desenzano del Garda es la localidad más urbana y activa de la ribera meridional del lago. No ofrece la imagen vertical y alpina de Limone o Riva, sino una relación más abierta con el agua: puerto, plazas comerciales, paseo lacustre y un casco histórico que asciende suavemente hacia el castillo. Su interés está en combinar vida cotidiana, patrimonio arqueológico y ambiente portuario sin dejar de funcionar como nudo ferroviario y de comunicaciones."], "historia": ["La zona estuvo habitada desde la Prehistoria, como demuestran los yacimientos palafíticos del entorno, pero el gran momento antiguo llegó con la romanización. A pocos metros del lago se construyó una villa de enormes dimensiones, reorganizada en época tardorromana y decorada con mosaicos de gran calidad. En la Edad Media el asentamiento quedó protegido por una fortaleza elevada. Durante el dominio veneciano, Desenzano se consolidó como mercado cerealista y puerto regional, conectado con Brescia, Verona y los pueblos del Garda."], "arquitectura": ["El tejido urbano se organiza alrededor del Porto Vecchio y de Piazza Malvezzi, con fachadas porticadas, edificios mercantiles y calles que suben hacia el castillo. La arquitectura no es uniforme: conviven restos romanos, estructura medieval, palacios de época veneciana, templos barrocos y ampliaciones de los siglos XIX y XX. La piedra clara, los pórticos y las perspectivas hacia el agua proporcionan continuidad visual."], "arte": ["El recorrido esencial enlaza el Porto Vecchio, Palazzo Todeschini, el Duomo, el castillo y la Villa Romana. El contraste entre la escala íntima del puerto histórico y la amplitud del paseo moderno permite entender cómo la ciudad pasó de centro comercial lacustre a destino turístico y residencial."], "curiosidades": ["El topónimo Desenzano podría relacionarse con Decentius, personaje de la corte imperial tardorromana al que se ha vinculado tradicionalmente con la gran villa. La atribución no es segura, pero refleja la importanc
