ia excepcional del conjunto arqueológico."], "consejos": ["Conviene aparcar fuera del núcleo inmediato y recorrerlo a pie. La estación ferroviaria está en una cota superior: desde allí se baja hacia el lago, pero el regreso implica pendiente. La mañana funciona mejor para la villa romana y el castillo; al final de la tarde, el puerto y el paseo ofrecen mejor luz y más ambiente."]}}, {"name": "CASTELLO DI DESENZANO DEL GARDA", "fonetica": "cas-TÉL-lo di de-sen-TSÁ-no del GÁR-da", "lat": 45.469901, "lng": 10.537902, "type": "visita", "meta": {"tiempo": "45-75 minutos."}, "sections": {"descripcion": ["El castillo ocupa la parte alta de Desenzano y funciona como el gran mirador urbano sobre el lago. Más que una fortaleza intacta, es un recinto reconstruido y recuperado que permite leer la forma del antiguo sistema defensivo y comprender por qué el núcleo medieval se desarrolló en esta cota."], "historia": ["La fortificación se levantó probablemente sobre defensas anteriores y fue modificada durante la Edad Media. No estaba concebida como residencia señorial monumental, sino como refugio de la población y punto de vigilancia. Con la pérdida de su función militar sufrió abandonos, transformaciones y ocupaciones diversas. Las restauraciones contemporáneas han consolidado murallas, torres y espacios interiores para usos culturales."], "arquitectura": ["El perímetro irregular se adapta a la colina. Las torres, los lienzos de mampostería y la entrada fortificada responden a una arquitectura defensiva pragmática. Desde las terrazas se observa el trazado urbano descendiendo hacia el Porto Vecchio y, en días claros, una amplia porción de la cuenca meridional del Garda."], "arte": ["El interés principal no reside en una colección permanente, sino en la lectura del paisaje y de la estructura fortificada. Las exposiciones temporales o actos culturales aprovechan los espacios restaurados, por lo que el contenido interior puede variar."], "curiosidades": [], "consejos": ["La subida desde el puerto es breve pero constante. Conviene entrar si la torre o las terrazas están abiertas; de lo contrario, el exterior y las vistas próximas siguen justificando el paseo. A última hora la orientación favorece fotografías del casco y del lago."]}}, {"name": "PALAZZO TODESCHINI", "fonetica": "pa-LÁT-so to-des-KÍ-ni", "lat": 45.470951, "lng": 10.540035, "type": "visita", "meta": {"tiempo": "15-30 minutos por el exterior y el entorno; más si hay una exposición abierta."}, "sections": {"descripcion": ["Palazzo Todeschini preside el frente del Porto Vecchio y es uno de los edificios que mejor expresan la dimensión cívica y mercantil de Desenzano. Su larga fachada porticada acompaña el agua y crea una transición protegida entre plaza, mercado y puerto."], "historia": ["El edificio fue proyectado a finales del siglo XVI por Giulio Todeschini, arquitecto activo en el territorio bresciano. Su implantación respondió al deseo de ordenar un área comercial estratégica. Los pórticos servían a las transacciones y al resguardo de personas y mercancías, mientras las plantas superiores acogían funciones administrativas."], "arquitectura": ["La composición horizontal, la repetición de arcos y la regularidad de huecos aportan una dignidad sobria, sin recurrir a una decoración excesiva. Conviene observar cómo la fachada curva o ligeramente adaptada sigue la forma del puerto y cómo los soportales producen una secuencia de encuadres hacia las barcas."], "arte": [], "curiosidades": ["En el entorno se conserva una piedra vinculada a antiguas medidas comerciales, recordatorio de que el puerto era ante todo un lugar de intercambio y control económico."], "consejos": ["Recorrer los pórticos y cruzar al lado opuesto del puerto para obtener la mejor vista completa. Si hay una exposición, el interior permite apreciar mejor la relación entre la estructura histórica y los usos culturales actuales."]}}, {"name": "PORTO VECCHIO", "fonetica": "PÓR-to VÉK-kio", "lat": 45.470943, "lng": 10.540691, "type": "visita", "meta": {"tiempo": "30-60 minutos."}, "sections": {"descripcion": ["El Porto Vecchio es el núcleo visual de Desenzano: una pequeña dársena interior rodeada de fachadas, soportales y terrazas. Su escala contenida contrasta con la amplitud del lago y crea uno de los ambientes más reconocibles del sur del Garda."], "historia": ["La dársena fue esencial para el comercio, especialmente durante el dominio veneciano. Por aquí circulaban cereales, productos agrícolas, madera y mercancías destinadas a los mercados regionales. La construcción del puente y las sucesivas reformas adaptaron el espacio a nuevas formas de movilidad sin eliminar su carácter portuario."], "arquitectura": ["El valor del lugar nace del conjunto: bordes de piedra, amarres, puente, Palazzo Todeschini y edificios que reflejan su color sobre el agua. La irregularidad controlada de las fachadas y la presencia de pequeñas embarcaciones mantienen una imagen histórica aunque el uso actual sea turístico y recreativo."], "arte": [], "curiosidades": [], "consejos": ["Es más fotogénico a primera hora, con menos terrazas ocupadas, o al anochecer, cuando se enciende la iluminación. Para una composición completa conviene situarse junto a la entrada de la dársena y mirar hacia Palazzo Todeschini."]}}, {"name": "DUOMO DI SANTA MARIA MADDALENA", "fonetica": "DUÓ-mo di SÁN-ta ma-RÍ-a mad-da-LÉ-na", "lat": 45.471517, "lng": 10.53891, "type": "visita", "meta": {"tiempo": "30-50 minutos."}, "sections": {"descripcion": ["La catedral de Desenzano es un edificio sobrio por fuera y mucho más rico en el interior. Está dedicada a Santa María Magdalena y forma parte del itinerario artístico porque conserva pintura veneciana y bresciana en un espacio de transición entre Renacimiento tardío y Barroco."], "historia": ["El templo actual se construyó entre finales del siglo XVI y comienzos del XVII sobre una iglesia anterior. El proyecto se atribuye a Giulio Todeschini. La obra coincidió con la renovación religiosa posterior al Concilio de Trento, que favoreció interiores claros, capillas ordenadas y programas artísticos comprensibles para los fieles."], "arquitectura": ["La fachada clásica es contenida, mientras el interior se estructura en nave principal y capillas laterales. La proporción, la iluminación y la sucesión de altares crean un ritmo sereno. Las reformas posteriores añadieron decoración sin borrar por completo la disciplina renacentista."], "arte": ["La obra más conocida es La Última Cena de Giambattista Tiepolo, conservada en una capilla lateral. Conviene no limitarse al altar mayor: hay pinturas, esculturas, mármoles y retablos que muestran la evolución del gusto local. La ubicación de cada obra dentro de su capilla es parte de su significado litúrgico."], "curiosidades": [], "consejos": ["Entrar con vestimenta adecuada y mantener silencio. La luz interior puede ser tenue; conviene dejar unos minutos para que la vista se adapte. Comprobar si el Tiepolo está accesible y no confundirlo con reproducciones o paneles informativos."]}}, {"name": "VILLA ROMANA E ANTIQUARIUM", "fonetica": "VÍL-la ro-MÁ-na e an-ti-KUÁ-ri-um", "lat": 45.473188, "lng": 10.538086, "type": "visita", "meta": {"tiempo": "60-90 minutos."}, "sections": {"descripcion": ["La Villa Romana de Desenzano es uno de los complejos residenciales tardorromanos más importantes del norte de Italia. Sus restos se encuentran en pleno casco urbano y conservan amplias superficies de mosaico, estancias de representación y sectores relacionados con la vida doméstica y productiva."], "historia": ["La villa se desarrolló en varias fases desde el siglo I a. C. hasta el IV d. C. La reorganización más monumental corresponde a la Antigüedad tardía, cuando una élite de enorme riqueza transformó el conjunto en residencia abierta hacia el lago. Se ha propuesto una relación con Flavius Magnus Decentius, hermano del emperador Magnencio, aunque la identificación del propietario no es definitiva."], "arquitectura": ["El edificio estaba organizado mediante patios, corredores, salas absidadas y espacios orientados hacia el paisaje. La posición original junto a la antigua línea de costa permitía integrar jardines y vistas en la arquitectura. Las cubiertas modernas protegen los pavimentos, pero también ayudan a comprender la extensión de las alas conservadas."], "arte": ["Los mosaicos constituyen el principal atractivo. Presentan motivos geométricos, vegetales, escenas figurativas y una gran variedad cromática. Conviene observar no solo los dibujos centrales, sino también cenefas, cambios de diseño y reparaciones, que permiten diferenciar fases y funciones. El Antiquarium expone esculturas, cerámicas, objetos y fragmentos arquitectónicos hallados durante las excavaciones."], "curiosidades": ["La villa quedó parcialmente oculta bajo la ciudad moderna y fue descubierta de forma gradual. Su relación con el origen del nombre Desenzano ha alimentado interpretaciones históricas, aunque la arqueología mantiene prudencia sobre la identidad exacta de sus propietarios."], "consejos": ["Es una visita especialmente recomendable antes de Sirmione, porque permite comparar una residencia romana con el enorme complejo de las Grotte di Catullo. El recorrido es parcialmente exterior y puede ser caluroso. Evitar prisas: los mosaicos se entienden mejor leyendo los paneles y observando las estancias desde varios ángulos."]}}, {"name": "SALÒ", "fonetica": "sa-LÓ", "lat": 45.608392, "lng": 10.510477, "type": "visita", "meta": {"tiempo": "45-90 minutos."}, "sections": {"descripcion": ["Salò se extiende a lo largo de una bahía amplia y protegida, con uno de los paseos lacustres más elegantes del Garda. Su centro combina soportales, plazas, palacios y una catedral de gran riqueza artística. Es una parada para caminar junto al agua y comprender la dimensión política y cultural de la Riviera dei Limoni."], "historia": ["De origen antiguo, Salò fue capital de la Magnifica Patria, federación de comunidades de la ribera occidental bajo tutela veneciana. Entre 1943 y 1945 su nombre quedó asociado a la República Social Italiana, régimen fascista dependiente de la Alemania nazi, aunque muchas instituciones se distribuyeron por diferentes localidades del lago. Esta memoria compleja convive con una historia mucho más larga de comercio, administración y cultura."], "arquitectura": ["La larga fachada urbana frente a la bahía es su rasgo principal. En el interior aparecen calles porticadas y palacios de tradición veneciana. El Duomo di Santa Maria Annunziata, de exterior gótico tardío y rico interior, es el monumento religioso más importante."], "arte": [], "curiosidades": [], "consejos": ["Recorrer el lungolago hasta la zona del Duomo y entrar en las calles paralelas. La visita no debería reducirse a la referencia histórica de 1943-45. Para fotografía, la curvatura de la bahía funciona mejor desde los extremos del paseo."]}}, {"name": "TOSCOLANO MADERNO", "fonetica": "tos-co-LÁ-no ma-DÉR-no", "lat": 45.636806, "lng": 10.605195, "type": "visita", "meta": {"tiempo": "45-90 minutos."}, "sections": {"descripcion": ["Toscolano Maderno reúne dos núcleos unidos administrativamente pero con identidades distintas. Maderno aporta puerto, paseo y restos de una villa romana; Toscolano se relaciona con el valle del río y con una antigua tradición papelera."], "historia": ["La abundancia de agua favoreció molinos y fábricas de papel desde la Edad Media. El Valle delle Cartiere llegó a ser uno de los centros papeleros más importantes de la República de Venecia. Maderno, por su parte, conserva huellas romanas y un papel portuario relevante."], "arquitectura": ["El paisaje urbano es menos compacto que el de otros pueblos del lago. Iglesias románicas, villas, instalaciones industriales históricas y paseos modernos forman un territorio disperso. La basílica de Sant’Andrea en Maderno es uno de los mejores ejemplos románicos de la ribera."], "arte": [], "curiosidades": [], "consejos": ["Con tiempo limitado, concentrarse en Maderno y el puerto. Para profundizar, el Valle delle Cartiere requiere una excursión propia. La carretera puede ser lenta y el aparcamiento escaso en verano."]}}, {"name": "GARGNANO", "fonetica": "gar-NIÁ-no", "lat": 45.688831, "lng": 10.662437, "type": "visita", "meta": {"tiempo": "45-90 minutos."}, "sections": {"descripcion": ["Gargnano conserva un ambiente más discreto y residencial que Limone. El pequeño puerto, las casas agrupadas junto al agua, los jardines y las limonaie de las laderas construyen una imagen refinada sin necesidad de grandes monumentos."], "historia": ["Fue puerto pesquero y centro agrícola, especialmente vinculado al cultivo de cítricos. Familias acomodadas levantaron villas y palacios. Entre 1943 y 1945, Benito Mussolini residió en Villa Feltrinelli y diversos edificios del municipio fueron utilizados por la República Social Italiana."], "arquitectura": ["La arquitectura se adapta a una franja estrecha entre lago y montaña. Muelles de piedra, fachadas altas, patios y jardines escalonados caracterizan el núcleo. Las estructuras de las limonaie, con pilares y travesaños, forman una arquitectura agrícola muy singular."], "arte": [], "curiosidades": [], "consejos": ["Pasear por el puerto y buscar perspectivas laterales, no solo frontales. El ambiente es mejor a primera hora. La carretera Gardesana atraviesa el municipio y puede producir retenciones; aparcar antes de entrar en el núcleo."]}}, {"name": "SANTUARIO DI MONTECASTELLO", "fonetica": "san-tu-Á-rio di mon-te-cas-TÉL-lo", "lat": 45.741955, "lng": 10.733473, "type": "visita", "meta": {"tiempo": "60-90 minutos, más el tiempo de acceso."}, "sections": {"descripcion": ["El Santuario di Montecastello se alza sobre un espolón rocoso de Tignale, aproximadamente 700 metros por encima del lago. La llegada es tan importante como el interior: la carretera asciende desde la Gardesana y abre vistas vertiginosas sobre el Garda, el Monte Baldo y la ribera opuesta."], "historia": ["El santuario se desarrolló alrededor de una pequeña estructura sagrada vinculada a apariciones y devociones marianas. La tradición local relaciona el lugar con un hecho milagroso durante un enfrentamiento medieval. El edificio fue ampliado en distintas fases, especialmente entre los siglos XVII y XX, y se convirtió en centro de peregrinación regional."], "arquitectura": ["La iglesia se adapta a una plataforma estrecha y está precedida por edificios de acogida y terrazas. Su imagen actual combina elementos históricos y restauraciones modernas. El interior, más íntimo de lo que su posición monumental podría sugerir, conserva frescos, exvotos y una imagen mariana venerada."], "arte": ["La llamada Casa Santa constituye el núcleo devocional. Conviene observar los frescos atribuidos a distintas fases, las inscripciones y los exvotos, documentos visuales de enfermedades, accidentes y agradecimientos. El paisaje exterior funciona casi como prolongación simbólica del santuario."], "curiosidades": [], "consejos": ["El acceso final es estrecho y con curvas; conducir despacio. El aparcamiento se encuentra antes del santuario y puede llenarse. Evitar niebla o tormenta, porque la vista es parte esencial de la visita. Respetar celebraciones y peregrinos. Calzado cómodo para rampas y escaleras."]}}, {"name": "LIMONE SUL GARDA", "fonetica": "li-MÓ-ne sul GÁR-da", "lat": 45.807725, "lng": 10.78803, "type": "visita", "meta": {"tiempo": "2-3 horas para el casco, el paseo y la limonaia."}, "sections": {"descripcion": ["Limone sul Garda es uno de los pueblos más escenográficos de la ribera occidental. El casco histórico se comprime entre el agua y una pared montañosa, con callejones, escaleras, pequeñas plazas y antiguas estructuras para el cultivo de cítricos. La intensa afluencia turística no elimina el interés de su implantación y de su paisaje agrícola."], "historia": ["Durante siglos Limone estuvo relativamente aislado y dependió de la navegación. La construcción de la Gardesana Occidentale en el siglo XX cambió radicalmente sus comunicaciones. La economía tradicional combinaba pesca, olivo y cítricos cultivados en limonaie, complejas estructuras que permitían proteger árboles en una latitud poco habitual para el limón."], "arquitectura": ["Las casas se escalonan sobre la ladera y se conectan mediante pasajes estrechos. Las limonaie se reconocen por sus altos pilares de piedra, vigas y terrazas orientadas al sol. En invierno se cerraban con tablones y cristales para crear un microclima protegido. Estas estructuras son una de las arquitecturas agrícolas más distintivas del Garda."], "arte": [], "curiosidades": ["El nombre Limone no procede necesariamente del fruto; puede relacionarse con términos antiguos vinculados a frontera o río. Sin embargo, la asociación con los limones se volvió inseparable de la identidad turística. La localidad también fue estudiada por una variante de apolipoproteína detectada en algunos habitantes, conocida como ApoA-I Milano."], "consejos": ["El martes 23 de junio de 2026 está prevista la actividad Arte nei vicoli, de 10:00 a 18:00, lo que puede añadir ambiente pero también ocupación de calles. Aparcar en los grandes estacionamientos de entrada y recorrer todo a pie. La mañana temprana evita grupos; al atardecer la luz llega desde la orilla oriental y favorece fachadas y puerto."]}}, {"name": "CHIESA PARROCCHIALE DI SAN BENEDETTO", "fonetica": "KIÉ-sa par-rok-KIÁ-le di san be-ne-DÉT-to", "lat": 45.814044, "lng": 10.792727, "type": "visita", "meta": {"tiempo": "25-45 minutos."}, "sections": {"descripcion": ["San Benedetto es la principal iglesia parroquial de Limone y domina el pueblo desde una cota ligeramente elevada. Su interior ofrece una pausa frente al carácter comercial de las calles y permite conocer la tradición artística local."], "historia": ["La iglesia actual fue reconstruida a finales del siglo XVII sobre un edificio anterior. La ampliación respondió al crecimiento de la comunidad y al deseo de crear un espacio acorde con la liturgia postridentina. La parroquia estuvo vinculada a la vida social, a las cofradías y a las familias que financiaron altares y obras."], "arquitectura": ["La fachada es sobria y el campanario sirve como referencia visual desde el lago. El interior barroco organiza capillas laterales y altares de mármol. La decoración se concentra en retablos, esculturas, pinturas y mobiliario litúrgico."], "arte": ["Conviene buscar obras atribuidas a Andrea Celesti y otros pintores del área veneciana, además del altar mayor y de las capillas dedicadas a santos protectores. Las piezas deben leerse como encargos devocionales y no como una colección museística."], "curiosidades": [], "consejos": ["El acceso implica subir desde el centro. Mantener silencio y no visitar durante misa. Desde el entorno se obtienen vistas parciales del caserío y del lago."]}}, {"name": "LIMONAIA DEL CASTÈL", "fonetica": "li-mo-NÁ-ia del cas-TÉL", "lat": 45.815468, "lng": 10.791894, "type": "visita", "meta": {"tiempo": "45-75 minutos."}, "sections": {"descripcion": ["La Limonaia del Castèl es el lugar más didáctico para comprender cómo se cultivaban cítricos en la ribera norte del Garda. No es simplemente un jardín de limoneros, sino una máquina agrícola construida con terrazas, muros, pilares, vigas, canales y cerramientos estacionales."], "historia": ["La producción de cítricos se documenta en el Garda desde la Edad Moderna y alcanzó gran importancia comercial entre los siglos XVIII y XIX. Los frutos viajaban hacia mercados del norte de Europa. La competencia de regiones más cálidas, las enfermedades y los cambios económicos provocaron el declive del sistema, pero algunas limonaie se conservaron como patrimonio."], "arquitectura": ["Los pilares verticales sostenían una retícula de madera. En invierno se instalaban tablones, ventanas y cubiertas para proteger los árboles del frío; en primavera se desmontaban. Los bancales aprovechan la pendiente y la orientación solar. El agua se distribuía cuidadosamente mediante canales y depósitos."], "arte": ["La visita permite distinguir variedades de cítricos, herramientas y sistemas de cultivo. Los puntos altos ofrecen una lectura magnífica de los tejados de Limone y del lago. Las estructuras desnudas producen una imagen casi monumental, aunque su origen sea estrictamente productivo."], "curiosidades": [], "consejos": ["Hay escaleras y desniveles. Conviene subir despacio y leer los paneles en orden. La apertura nocturna de verano permite una visita con menos calor, pero para entender la estructura y fotografiarla es preferible disponer todavía de luz natural."]}}, {"name": "CHIESA DI SAN ROCCO", "fonetica": "KIÉ-sa di san RÓK-ko", "lat": 45.817028, "lng": 10.793921, "type": "visita", "meta": {"tiempo": "20-35 minutos."}, "sections": {"descripcion": ["San Rocco es una pequeña iglesia situada en una posición elevada y tranquila, alejada del eje más concurrido de Limone. Su escala, el atrio y las vistas sobre el lago crean uno de los rincones más serenos del pueblo."], "historia": ["Fue construida por la comunidad en agradecimiento tras epidemias de peste, siguiendo una devoción muy extendida en el norte de Italia. San Roque era invocado como protector frente a la enfermedad. Las ampliaciones y decoraciones posteriores mantuvieron su carácter popular."], "arquitectura": ["El edificio es sencillo, con fachada encalada y campanario. En el interior pueden verse frescos y elementos de distintas épocas. El valor reside tanto en la arquitectura como en la relación con la terraza y el paisaje."], "arte": [], "curiosidades": [], "consejos": ["La subida por callejones y escaleras puede ser resbaladiza. Es un buen lugar para escapar de la masificación y obtener fotografías del caserío. Si está cerrada, el exterior sigue justificando la desviación."]}}, {"name": "BASTIONE DI RIVA", "fonetica": "bas-ti-Ó-ne di RÍ-va", "lat": 45.884974, "lng": 10.835941, "type": "visita", "meta": {"tiempo": "45-90 minutos, según se utilice ascensor o sendero."}, "sections": {"descripcion": ["El Bastione es una torre defensiva circular situada en la ladera del Monte Rocchetta, por encima de Riva del Garda. Su posición permite dominar la ciudad, el puerto y el extremo septentrional del lago. La subida es uno de los mejores puntos de lectura geográfica de toda la jornada."], "historia": ["Fue construido a comienzos del siglo XVI, en un periodo de tensiones entre Venecia, el principado episcopal de Trento y las potencias imperiales. Su emplazamiento complementaba las defensas urbanas y vigilaba accesos terrestres y lacustres. Las destrucciones militares posteriores lo dejaron parcialmente arruinado."], "arquitectura": ["La torre presenta muros de gran espesor y forma circular, adecuada para resistir artillería y reducir ángulos vulnerables. La restauración ha permitido consolidar el volumen sin ocultar su condición de ruina histórica. El ascensor inclinado contemporáneo crea un contraste evidente entre infraestructura tecnológica y fortificación renacentista."], "arte": [], "curiosidades": [], "consejos": ["El ascensor parte cerca del aparcamiento Monte Oro. Comprar en línea no garantiza acceso prioritario. Si se sube andando, el sendero es corto pero empinado. La mejor luz suele llegar por la tarde; por la noche, la vista urbana iluminada es atractiva. Evitar horas de máximo calor si se camina."]}}, {"name": "TORRE APPONALE", "fonetica": "TÓR-re ap-po-NÁ-le", "lat": 45.884798, "lng": 10.84009, "type": "visita", "meta": {"tiempo": "35-60 minutos."}, "sections": {"descripcion": ["La Torre Apponale es el gran símbolo vertical de Riva del Garda. Se levanta en Piazza III Novembre, junto al puerto, y ofrece una de las vistas más completas del centro histórico y del extremo norte del lago."], "historia": ["Su origen medieval está relacionado con la vigilancia del puerto y la representación del poder comunal. Fue elevada y modificada en distintas épocas. El remate actual y la figura conocida como Anzolim de la Tor forman parte de su imagen popular."], "arquitectura": ["La torre alcanza unos 34 metros y se construyó con piedra local. La masa vertical contrasta con los pórticos y fachadas de la plaza. La subida interior de 165 escalones permite observar la estructura y culmina en una terraza panorámica."], "arte": [], "curiosidades": ["El pequeño ángel de bronce situado en la cima gira con el viento y funciona como veleta. Su presencia humaniza un elemento originalmente militar y cívico."], "consejos": ["No hay ascensor y la escalera es exigente. Evitar subir con vértigo, problemas de movilidad o calzado inadecuado. La vista justifica el esfuerzo, especialmente para comprender la cuadrícula del centro y la relación con el puerto."]}}, {"name": "MAG · MUSEO ALTO GARDA", "fonetica": "mu-SÉ-o ÁL-to GÁR-da", "lat": 45.884505, "lng": 10.841928, "type": "visita", "meta": {"tiempo": "75-120 minutos."}, "sections": {"descripcion": ["El MAG ocupa la Rocca di Riva, una fortaleza rodeada de agua en pleno centro. Reúne arqueología, historia, pinacoteca y exposiciones temporales, y es la mejor visita para situar Riva dentro de la historia del Alto Garda."], "historia": ["La Rocca fue fundada en la Edad Media y transformada por sucesivos poderes, entre ellos los Scaligeri, Venecia y la administración de los Habsburgo. Pasó de fortaleza a cuartel y finalmente a museo. Esa continuidad de usos convierte al propio edificio en la principal pieza de la colección."], "arquitectura": ["El conjunto tiene planta compacta, patio central, torres y foso. Las restauraciones museísticas mantienen elementos defensivos y crean recorridos por diferentes niveles. Desde el mastio se obtiene una vista elevada del puerto y de la ciudad."], "arte": ["Las secciones arqueológicas incluyen testimonios prehistóricos y romanos del territorio. La pinacoteca conserva paisajes y obras vinculadas al Garda, útiles para comprender cómo el lago fue representado antes del turismo fotográfico. Las salas históricas explican fronteras, guerras y transformaciones sociales."], "curiosidades": [], "consejos": ["Es una visita que puede absorber más tiempo del previsto. Priorizar arqueología, historia local y subida al mastio si el itinerario está apretado. El museo ofrece sombra y descanso en las horas de calor."]}}, {"name": "BIBLIOTECA CIVICA DI RIVA DEL GARDA", "fonetica": "bi-blio-TÉ-ca CHÍ-vi-ca di RÍ-va del GÁR-da", "lat": 45.88519, "lng": 10.841555, "type": "visita", "meta": {"tiempo": "10-20 minutos por el exterior; más si se accede a una exposición o sala pública."}, "sections": {"descripcion": ["La Biblioteca Civica representa la dimensión cotidiana y cultural de Riva, más allá de los monumentos turísticos. Su inclusión permite identificar un edificio público activo y entender cómo se reutilizan espacios históricos para servicios contemporáneos."], "historia": ["Las bibliotecas municipales italianas suelen custodiar fondos locales, prensa histórica y documentación sobre la ciudad. En Riva, la institución cumple además una función de difusión cultural mediante encuentros y exposiciones."], "arquitectura": [], "arte": [], "curiosidades": [], "consejos": ["No es necesario entrar salvo que haya una actividad de interés. Respetar el uso silencioso del edificio y no tratar las salas de lectura como espacio turístico. Integrarla como referencia dentro del paseo urbano."]}}, {"name": "CENTRO STORICO DI RIVA DEL GARDA", "fonetica": "CHÉN-tro STÓ-ri-co di RÍ-va del GÁR-da", "lat": 45.88639, "lng": 10.839822, "type": "visita", "meta": {"tiempo": "1,5-2,5 horas, sin contar museos y Bastione."}, "sections": {"descripcion": ["El centro histórico de Riva del Garda concentra plazas porticadas, puertas, torres, iglesias y calles comerciales en el punto donde el lago se encuentra con las montañas. La sensación urbana es distinta a la de la ribera sur: el paisaje vertical domina cualquier perspectiva y recuerda la proximidad del Trentino y del mundo alpino."], "historia": ["Riva fue puerto estratégico y plaza fronteriza. Su control pasó por señores locales, los Scaligeri, Venecia, el principado episcopal de Trento y los Habsburgo. Esa historia explica las fortificaciones, la Rocca y una identidad cultural situada entre Lombardía, Véneto y Tirol histórico."], "arquitectura": ["Piazza III Novembre es el centro monumental, con la Torre Apponale, el Palazzo Pretorio y edificios porticados. Las calles interiores conservan fachadas pintadas, pasajes y plazas menores. La Rocca, el foso y las antiguas puertas muestran la relación entre defensa y puerto."], "arte": ["Conviene buscar frescos de fachada, escudos, relojes, soportales y detalles de hierro. La iglesia de Santa Maria Assunta y la Inviolata aportan dos modelos religiosos muy distintos: parroquia urbana y santuario barroco de planta central."], "curiosidades": [], "consejos": ["Recorrer primero el puerto y Piazza III Novembre, después internarse en calles paralelas y terminar en la Inviolata. La bicicleta tiene gran presencia; prestar atención en los carriles compartidos. En verano, las plazas más próximas al lago pueden estar muy concurridas."]}}, {"name": "CHIESA DI SANTA MARIA INVIOLATA", "fonetica": "KIÉ-sa di SÁN-ta ma-RÍ-a in-vio-LÁ-ta", "lat": 45.888782, "lng": 10.84299, "type": "visita", "meta": {"tiempo": "30-50 minutos."}, "sections": {"descripcion": ["Santa Maria Inviolata es una de las iglesias barrocas más importantes del Trentino. Su exterior relativamente compacto no anticipa la riqueza del interior, organizado como un espacio central cubierto por cúpula y rodeado de capillas."], "historia": ["Fue construida a comienzos del siglo XVII alrededor de una imagen mariana considerada milagrosa. La iniciativa contó con el patrocinio de Gaudenzio Madruzzo y se inscribe en la política religiosa de la Contrarreforma. El santuario atrajo peregrinaciones y recibió una decoración cuidadosamente coordinada."], "arquitectura": ["La planta central octogonal concentra la mirada hacia la cúpula y el altar. Pilastras, cornisas, mármoles y estucos crean una arquitectura unitaria. La claridad geométrica ayuda a ordenar una decoración muy abundante."], "arte": ["Frescos, estucos, pinturas y altares forman un programa dedicado a la Virgen. Conviene levantar la vista hacia la cúpula, observar las pechinas y recorrer las capillas en sentido circular. La integración entre arquitectura y artes decorativas es su principal valor."], "curiosidades": [], "consejos": ["Se encuentra algo apartada del lago, pero merece la desviación. Entrar con calma y evitar celebraciones. La iluminación puede variar mucho; los detalles superiores se ven mejor cuando hay luz natural."]}}, {"name": "RIVA DEL GARDA", "fonetica": "RÍ-va del GÁR-da", "lat": 45.889316, "lng": 10.843111, "type": "visita", "meta": {"tiempo": "2-4 horas según visitas interiores."}, "sections": {"descripcion": ["Riva del Garda es la gran ciudad del extremo norte del lago. Combina ambiente mediterráneo —olivos, agua, fachadas claras— con una envolvente alpina de paredes rocosas. Esta contradicción paisajística explica buena parte de su atractivo."], "historia": ["Su puerto fue estratégico para comunicaciones y comercio. La proximidad de fronteras políticas hizo que fuera fortificada y disputada. En el siglo XIX, bajo dominio austríaco, se desarrolló como destino climático y turístico; la llegada del ferrocarril y de visitantes centroeuropeos reforzó su carácter de balneario y ciudad de vacaciones."], "arquitectura": ["La Rocca, la Torre Apponale, el Bastione y las puertas urbanas forman una red defensiva de épocas distintas. Junto a ellas aparecen hoteles, villas y paseos de los siglos XIX y XX. El frente lacustre moderno prolonga el centro hacia playas y jardines."], "arte": [], "curiosidades": [], "consejos": ["Riva merece una pausa más larga que otros pueblos porque combina monumentos, museo, vistas y paseo. El tráfico de acceso puede ser lento. Aparcar en estructuras periféricas y no intentar cruzar el casco en coche. El viento suele intensificarse a determinadas horas y es parte del carácter del lugar."]}}, {"name": "CANALE DI TENNO", "fonetica": "ca-NÁ-le di TÉN-no", "lat": 45.929814, "lng": 10.825862, "type": "visita", "meta": {"tiempo": "60-90 minutos."}, "sections": {"descripcion": ["Canale di Tenno es un pequeño núcleo medieval extraordinariamente bien conservado, construido en pendiente con casas de piedra, pasajes cubiertos, patios y calles empedradas. Su escala reducida permite leer con claridad cómo se organizaba un asentamiento rural fortificado."], "historia": ["El pueblo está documentado desde la Edad Media y mantuvo durante siglos una economía agrícola. La despoblación amenazó su continuidad, pero en el siglo XX artistas y proyectos culturales contribuyeron a su recuperación. La Casa degli Artisti, vinculada al pintor Giacomo Vittone, consolidó esa identidad creativa."], "arquitectura": ["Las casas se apoyan unas en otras y se conectan mediante voladizos, escaleras y bóvedas. La piedra local, la madera y los revocos irregulares forman un conjunto auténtico, aunque restaurado. Los pasajes cubiertos responden tanto a necesidades defensivas como climáticas."], "arte": [], "curiosidades": ["Canale forma parte de la asociación I Borghi più belli d’Italia. Su fama navideña se debe a un mercado que utiliza patios y bodegas, pero en verano se aprecia mejor la estructura arquitectónica sin decoración estacional."], "consejos": ["El pavimento es irregular y puede resbalar. No entrar en patios privados ni bloquear puertas para hacer fotos. Aparcar en las zonas señalizadas fuera del núcleo. A primera hora hay menos visitantes y mejor sensación de silencio."]}}, {"name": "LAGO DI TENNO", "fonetica": "LÁ-go di TÉN-no", "lat": 45.93887, "lng": 10.815986, "type": "visita", "meta": {"tiempo": "60-120 minutos, más si se realiza el circuito completo."}, "sections": {"descripcion": ["El Lago di Tenno es un pequeño lago de color turquesa situado por encima del Garda. Su tonalidad procede de la composición mineral, la transparencia y la luz, y cambia según el nivel del agua y la estación."], "historia": ["Se formó por un gran deslizamiento de tierra que bloqueó el valle. No es, por tanto, un simple lago glaciar, sino el resultado de un acontecimiento geológico relativamente reciente en términos del paisaje. El nivel varía de manera notable y puede transformar la pequeña isla en península."], "arquitectura": ["El interés es natural, pero el acceso mediante senderos, escaleras y áreas de descanso muestra la presión turística sobre un entorno delicado. La ausencia de grandes edificios ayuda a conservar la percepción del lago como cuenca cerrada por bosque y montaña."], "arte": [], "curiosidades": [], "consejos": ["Hay que bajar y luego subir numerosos escalones desde algunos aparcamientos. Llevar agua y calzado adecuado. Respetar zonas de baño y restricciones; no dejar residuos. La luz central intensifica el color, mientras primeras y últimas horas ofrecen más calma."]}}, {"name": "CASTELLO SCALIGERO DI MALCESINE", "fonetica": "cas-TÉL-lo sca-LÍ-ye-ro di mal-CHÉ-si-ne", "lat": 45.766121, "lng": 10.808287, "type": "visita", "meta": {"tiempo": "75-120 minutos."}, "sections": {"descripcion": ["El castillo Scaligero domina Malcesine desde un promontorio rocoso que cae directamente hacia el lago. Es uno de los perfiles más famosos del Garda y combina fortificación medieval, museo, memoria literaria y vistas de 360 grados."], "historia": ["El lugar fue fortificado desde época antigua y pasó por lombardos, francos y señores medievales. Los Scaligeri de Verona lo ampliaron y le dieron buena parte de su imagen actual. Posteriormente estuvo bajo Venecia y los Habsburgo. Goethe visitó Malcesine en 1786 y fue detenido brevemente cuando dibujaba el castillo, sospechoso de espionaje; el episodio quedó narrado en su Viaje a Italia."], "arquitectura": ["El recinto se adapta a la roca mediante patios, murallas, terrazas y una alta torre. No responde a un proyecto único: es el resultado de adiciones sucesivas. La subida a la torre permite leer la posición defensiva frente al lago y el Monte Baldo."], "arte": ["El museo incluye secciones de historia natural del Garda y del Monte Baldo, además de espacios dedicados a Goethe. Conviene equilibrar salas y exteriores: las terrazas, el Rivellino y los caminos de ronda son esenciales."], "curiosidades": ["La sala dedicada a Goethe recuerda cómo una actividad hoy inocente —dibujar un castillo— podía interpretarse como levantamiento militar. El episodio ayudó a difundir Malcesine entre viajeros cultos europeos."], "consejos": ["Hay escaleras estrechas y desniveles. La torre no es adecuada para todas las personas. Visitar temprano o en apertura nocturna para evitar calor y grupos. La mejor fotografía exterior se obtiene desde el puerto o desde puntos del paseo al sur del casco."]}}, {"name": "PALAZZO DEI CAPITANI", "fonetica": "pa-LÁT-so dei ca-pi-TÁ-ni", "lat": 45.764313, "lng": 10.807151, "type": "visita", "meta": {"tiempo": "30-50 minutos."}, "sections": {"descripcion": ["El Palazzo dei Capitani es la gran arquitectura civil de Malcesine. Se encuentra junto al lago, ligeramente apartado de las calles más densas, y combina fachada veneciana, patio y jardín abierto al agua."], "historia": ["Los Scaligeri construyeron un palacio entre los siglos XIII y XIV sobre restos anteriores. Tras daños importantes, fue reconstruido en estilo veneciano. En 1618 Verona lo adquirió, por indicación de la Serenissima, como residencia del Capitano del Lago, autoridad encargada de la administración de la zona. Fue declarado Monumento Nacional en 1902."], "arquitectura": ["La fachada muestra ventanas de tradición gótica veneciana y una composición palaciega más refinada que la arquitectura militar del castillo. El jardín desciende hacia el lago y crea una relación directa entre representación política y paisaje."], "arte": ["En el interior y el patio pueden verse restos de decoración, escudos y elementos que recuerdan los sucesivos usos. El jardín es uno de los mejores espacios para apreciar la ribera y la silueta occidental del lago."], "curiosidades": [], "consejos": ["Puede cerrar por bodas civiles o actos. Entrar con discreción si hay actividad institucional. No limitarse a la fachada de calle: el jardín y la salida visual al lago son la parte más memorable."]}}, {"name": "PORTICCIOLO DI MALCESINE", "fonetica": "por-ti-CHÓ-lo di mal-CHÉ-si-ne", "lat": 45.763882, "lng": 10.807492, "type": "visita", "meta": {"tiempo": "30-60 minutos."}, "sections": {"descripcion": ["El pequeño puerto de Malcesine forma una escena compacta de barcas, terrazas y fachadas estrechas, enmarcada por la presencia del castillo. Es uno de los puntos donde el carácter medieval y la vida lacustre se perciben de manera más directa."], "historia": ["Durante siglos fue lugar de pesca, transporte y comunicación con la ribera opuesta. Antes de la carretera moderna, el lago era la vía más eficaz para mercancías y viajeros. El puerto mantiene esa función, hoy dominada por ferris, navegación turística y embarcaciones recreativas."], "arquitectura": ["Las casas se levantan muy cerca del agua y generan un espacio casi teatral. Los cambios de nivel, arcos y callejones conectan el puerto con el castillo y con el Palazzo dei Capitani."], "arte": [], "curiosidades": [], "consejos": ["Puede saturarse a mediodía. Para fotografiar el conjunto conviene llegar temprano o esperar a última hora. Vigilar horarios de ferris y no bloquear zonas de embarque."]}}, {"name": "PUNTA SAN VIGILIO", "fonetica": "PÚN-ta san vi-YÍ-lio", "lat": 45.573566, "lng": 10.672371, "type": "visita", "meta": {"tiempo": "45-90 minutos."}, "sections": {"descripcion": ["Punta San Vigilio es un promontorio arbolado que penetra en el lago al norte de Garda. Su pequeña bahía, cipreses, muros de piedra y edificios históricos forman uno de los paisajes más refinados del Garda."], "historia": ["El conjunto fue desarrollado en el siglo XVI por Agostino Brenzoni, con intervención del arquitecto Michele Sanmicheli. Desde entonces se convirtió en lugar de retiro y hospitalidad para viajeros, aristócratas, artistas y figuras políticas."], "arquitectura": ["La villa, la pequeña iglesia, la locanda y el puerto se integran con jardines y olivares. La arquitectura evita una monumentalidad frontal y utiliza recorridos, portales y alineaciones de cipreses para construir una experiencia gradual."], "arte": [], "curiosidades": ["Entre los huéspedes asociados al lugar aparecen nombres de la realeza europea, escritores y personalidades del siglo XX. Parte del encanto proviene precisamente de la mezcla entre exclusividad histórica y escala casi rural."], "consejos": ["El acceso en coche está restringido en el tramo final; aparcar en las zonas habilitadas. Respetar propiedades privadas. El atardecer es magnífico, pero también el momento de mayor demanda. Confirmar si se pretende usar la Baia delle Sirene."]}}, {"name": "VILLA SAN VIGILIO", "fonetica": "VÍL-la san vi-YÍ-lio", "lat": 45.573662, "lng": 10.671572, "type": "visita", "meta": {"tiempo": "20-40 minutos por el exterior y áreas accesibles."}, "sections": {"descripcion": ["Villa San Vigilio es el centro residencial del conjunto de Punta San Vigilio. Su interés se aprecia sobre todo desde los recorridos exteriores: muros, portales, jardín y relación con el pequeño puerto."], "historia": ["Fue concebida en el Renacimiento para Agostino Brenzoni y tradicionalmente relacionada con Michele Sanmicheli. La villa recibió visitantes ilustres y contribuyó a fijar la imagen de San Vigilio como lugar de retiro culto y privilegiado."], "arquitectura": ["La composición se integra en el terreno mediante patios, logias y jardines. La arquitectura se subordina a las vistas y a la secuencia de llegada. Los cipreses y muros forman parte esencial del proyecto paisajístico."], "arte": [], "curiosidades": [], "consejos": ["No intentar acceder a zonas reservadas. El valor para el visitante general está en la lectura del conjunto y en el entorno, no en una visita interior convencional."]}}, {"name": "SPIAGGIA PUNTA CORNICELLO", "fonetica": "SPIÁ-ya PÚN-ta cor-ni-CHÉL-lo", "lat": 45.549413, "lng": 10.715079, "type": "visita", "meta": {"tiempo": "30-90 minutos."}, "sections": {"descripcion": ["Punta Cornicello es una pequeña playa cercana al centro de Bardolino. Ofrece una pausa junto al agua y vistas abiertas sobre el lago, con un ambiente menos monumental que otros puntos de la jornada."], "historia": ["El acondicionamiento de playas y paseos forma parte de la transformación turística del Garda durante los siglos XIX y XX. Espacios antes vinculados a pesca y trabajo se convirtieron en áreas recreativas."], "arquitectura": [], "arte": [], "curiosidades": [], "consejos": ["La ribera puede ser de grava o piedra; llevar calzado adecuado para el agua. No dejar objetos sin vigilancia. En temporada alta se llena con rapidez. La visita puede reducirse a una parada fotográfica si el itinerario es intenso."]}}, {"name": "BARDOLINO", "fonetica": "bar-do-LÍ-no", "lat": 45.548155, "lng": 10.719089, "type": "visita", "meta": {"tiempo": "60-120 minutos."}, "sections": {"descripcion": ["Bardolino es una localidad abierta y luminosa de la ribera oriental, conocida por su paseo, su puerto y el vino tinto que lleva su nombre. Frente a la verticalidad del norte, aquí el paisaje se suaviza en colinas de viñedos y olivares."], "historia": ["El núcleo tiene origen antiguo y creció como puerto y centro agrícola. La producción vitivinícola se consolidó hasta convertirse en uno de los principales rasgos de identidad. El turismo moderno amplió el paseo y reforzó la relación con las localidades vecinas mediante itinerarios peatonales y ciclistas."], "arquitectura": ["El centro combina restos medievales, iglesias románicas, fachadas de colores y calles comerciales. La iglesia de San Severo conserva frescos medievales y es uno de los edificios más valiosos, aunque no figure como punto separado en el mapa."], "arte": [], "curiosidades": ["El vino Bardolino se produce con variedades locales, entre ellas Corvina, y existe también en versión Chiaretto, rosada. La cultura del vino condiciona fiestas, gastronomía y paisaje."], "consejos": ["Pasear por el puerto y entrar en las calles interiores. Si hay poco tiempo, evitar detenerse demasiado en terrazas y buscar San Severo. Aparcar fuera del frente lacustre. La última hora ofrece una luz cálida sobre la orilla occidental."]}}, {"name": "BARDOLINO", "fonetica": "bar-do-LÍ-no", "lat": 45.547608, "lng": 10.724313, "type": "visita", "meta": {"tiempo": "15-30 minutos como segundo punto o continuación del paseo."}, "sections": {"descripcion": ["Este segundo marcador de Bardolino puede utilizarse como referencia para completar el paseo, localizar un aparcamiento o señalar el extremo opuesto del centro. No requiere una explicación histórica independiente: forma parte de la misma lectura urbana."], "historia": [], "arquitectura": [], "arte": [], "curiosidades": [], "consejos": ["Aprovecharlo para recorrer un tramo diferente del lungolago y comprobar la continuidad del itinerario hacia Garda o Lazise. Si ambos marcadores quedan muy próximos, puede eliminarse uno al editar el mapa."]}}, {"name": "PALAZZINA STORICA", "fonetica": "pa-lat-TSÍ-na STÓ-ri-ca", "lat": 45.440071, "lng": 10.69376, "type": "visita", "meta": {"tiempo": "15-30 minutos."}, "sections": {"descripcion": ["La Palazzina Storica de Peschiera es una referencia institucional dentro del sistema fortificado. Su interés depende de su relación con el entorno militar y con los acontecimientos políticos del Risorgimento."], "historia": ["Peschiera desempeñó un papel estratégico dentro del Quadrilatero austríaco, junto con Verona, Mantua y Legnago. En edificios de la plaza fuerte se celebraron reuniones militares y políticas decisivas. La Palazzina Histórica está asociada al congreso de 1917 en el que los aliados analizaron la situación italiana tras la derrota de Caporetto."], "arquitectura": ["El edificio presenta una arquitectura sobria, más representativa que defensiva, integrada en el recinto militar. Su escala ayuda a comprender que una fortaleza era también centro administrativo, logístico y diplomático."], "arte": [], "curiosidades": [], "consejos": ["Leer los paneles exteriores y relacionar el edificio con los canales y murallas próximas. No requiere una visita larga salvo que haya exposición abierta."]}}, {"name": "PONTE DEI VOLTONI", "fonetica": "PÓN-te dei vol-TÓ-ni", "lat": 45.438557, "lng": 10.696397, "type": "visita", "meta": {"tiempo": "20-35 minutos."}, "sections": {"descripcion": ["El Ponte dei Voltoni cruza uno de los canales de Peschiera mediante una secuencia de grandes arcos. Es uno de los puntos más fotogénicos de la fortaleza y permite entender la compleja relación entre agua, murallas y circulación."], "historia": ["Los canales formaban parte esencial de las defensas venecianas y posteriores. Controlaban accesos, dificultaban asaltos y conectaban el lago con el río Mincio. El puente fue adaptado a necesidades militares y urbanas en distintas épocas."], "arquitectura": ["Los arcos de ladrillo y piedra crean una poderosa repetición visual. Las construcciones defensivas próximas muestran bastiones, terraplenes y puertas diseñados para artillería. La presencia de embarcaciones actuales añade una capa de uso recreativo."], "arte": [], "curiosidades": [], "consejos": ["Fotografiar desde los paseos laterales, no solo desde encima del puente. Prestar atención a bicicletas y tráfico local. Al atardecer, los arcos y el agua reciben una luz especialmente favorable."]}}, {"name": "PORTA BRESCIA", "fonetica": "PÓR-ta BRÉ-sha", "lat": 45.438121, "lng": 10.69207, "type": "visita", "meta": {"tiempo": "20-35 minutos."}, "sections": {"descripcion": ["Porta Brescia es una de las entradas monumentales al recinto fortificado de Peschiera. Atravesarla permite experimentar la fortaleza como sistema de control: puente, foso, muros, pasajes y cambio de escala entre exterior e interior."], "historia": ["Fue construida en época veneciana dentro de la modernización de la plaza fuerte. Su diseño se vincula al gran arquitecto militar Michele Sanmicheli, responsable de numerosas puertas y fortificaciones de la Serenissima."], "arquitectura": ["La puerta combina función defensiva y representación política. La fachada de piedra, los escudos y la composición clásica anuncian el poder veneciano, mientras el paso estrecho y las obras exteriores controlan el movimiento. La aproximación a través del puente es parte esencial de la experiencia."], "arte": [], "curiosidades": [], "consejos": ["Cruzarla a pie y observarla desde ambos lados. Buscar emblemas, marcas de cantero y la relación con los bastiones. Evitar quedarse en zonas de circulación rodada."]}}, {"name": "PESCHIERA DEL GARDA", "fonetica": "pes-KIÉ-ra del GÁR-da", "lat": 45.439648, "lng": 10.686844, "type": "visita", "meta": {"tiempo": "1,5-2,5 horas."}, "sections": {"descripcion": ["Peschiera del Garda es una ciudad fortaleza construida en el punto donde el lago desagua en el río Mincio. Canales, murallas y bastiones dividen el casco en islas y convierten el agua en parte de la arquitectura defensiva."], "historia": ["El lugar tuvo importancia desde la Antigüedad, pero su forma actual procede sobre todo de las fortificaciones venecianas de los siglos XVI y XVII y de ampliaciones napoleónicas y austríacas. Bajo Austria formó parte del Quadrilatero, uno de los sistemas militares clave del norte de Italia durante las guerras de independencia."], "arquitectura": ["Bastiones de tierra y piedra, puertas monumentales, fosos y canales responden a la guerra de artillería. Peschiera forma parte del sitio UNESCO Obras de defensa venecianas entre los siglos XVI y XVII. A diferencia de un castillo aislado, toda la ciudad está integrada en el sistema fortificado."], "arte": ["Los puntos principales son Porta Brescia, Porta Verona, el Ponte dei Voltoni, los paseos de ronda y los edificios militares reutilizados. Conviene mirar el trazado desde puentes y orillas para entender la geometría de la fortaleza."], "curiosidades": [], "consejos": ["Aparcar fuera de las murallas y entrar a pie. La navegación por canales puede completar la visita, pero requiere tiempo. En verano hay mucha actividad; primeras horas permiten ver mejor la arquitectura sin terrazas ni grupos."]}}, {"name": "SIRMIONE", "fonetica": "sir-mi-Ó-ne", "lat": 45.464833, "lng": 10.611828, "type": "visita", "meta": {"tiempo": "2-4 horas para el casco; 4-6 horas con castillo y Grotte di Catullo."}, "sections": {"descripcion": ["Sirmione ocupa una península estrecha que avanza varios kilómetros en el sur del Garda. La entrada al casco a través del castillo Scaligero, las calles rodeadas de agua, las termas y las ruinas romanas crean una concentración patrimonial excepcional."], "historia": ["La península fue ocupada desde época antigua. El poeta latino Catulo tuvo propiedades en la región, aunque no está demostrado que las grandes ruinas conocidas como Grotte di Catullo fueran su residencia. En la Edad Media, los Scaligeri fortificaron el acceso. Más tarde Sirmione quedó bajo Venecia y desarrolló su reputación termal gracias a las aguas sulfurosas."], "arquitectura": ["El castillo controla el único acceso terrestre al casco y conserva una dársena fortificada singular. Más al norte, la villa romana se organiza en terrazas sobre el promontorio. Entre ambos extremos se extiende un tejido de calles estrechas, iglesias, jardines y hoteles históricos."], "arte": ["Aunque este marcador es general, los elementos esenciales son el Castello Scaligero, Santa Maria Maggiore, San Pietro in Mavinas y las Grotte di Catullo. La iglesia de San Pietro conserva frescos y un ambiente mucho más tranquilo que el centro comercial."], "curiosidades": ["Maria Callas residió en Sirmione durante su matrimonio con Giovanni Battista Meneghini. Su presencia forma parte de la memoria cultural del lugar, aunque muchos relatos turísticos simplifican esa etapa de su vida."], "consejos": ["El acceso en coche al casco está restringido. Aparcar antes de la entrada y prever caminatas largas. Las colas y la masificación pueden ser intensas. Si se llega tarde en esta jornada, conviene limitarse al castillo exterior y a un paseo, reservando las Grotte di Catullo para otra ocasión."]}}, {"name": "VERONA", "fonetica": "ve-RÓ-na", "lat": 45.438366, "lng": 10.991714, "type": "visita", "meta": {"tiempo": "Este punto funciona como llegada y referencia general. La visita monumental se desarrolla principalmente en la jornada siguiente."}, "sections": {"descripcion": ["Verona es una ciudad de escala monumental situada a orillas del Adigio. Su patrimonio abarca restos romanos, iglesias románicas, palacios comunales, arquitectura scaligera, plazas venecianas y transformaciones austríacas. La llegada al final de la jornada debe servir para orientarse, no para intentar abarcar el centro."], "historia": ["La romana Verona fue un importante nudo viario y conserva la Arena, puertas, puente y teatro. En la Edad Media alcanzó gran poder bajo los Della Scala, cuya corte dejó castillos, tumbas y palacios. Después pasó a Venecia y, en el siglo XIX, fue pieza fundamental del sistema militar austríaco."], "arquitectura": ["El centro histórico se organiza dentro de los meandros del Adigio. Piazza Bra, Piazza delle Erbe y Piazza dei Signori forman una secuencia de espacios de origen romano y medieval. Las murallas, puertas y puentes permiten leer las sucesivas expansiones."], "arte": [], "curiosidades": [], "consejos": ["Al llegar, priorizar el alojamiento, el aparcamiento y un paseo breve por el entorno inmediato. No gastar energía en monumentos que se visitarán al día siguiente. Verificar ZTL y seguir exactamente las instrucciones del alojamiento para evitar sanciones."]}}, {"name": "ARSENALE SUITES", "fonetica": "ar-se-NÁ-le suíts", "lat": 45.442266, "lng": 10.987943, "type": "alojamiento", "meta": {"tiempo": "Punto logístico de alojamiento."}, "sections": {"descripcion": ["Arsenale Suites sirve como base para la estancia en Verona. La información útil debe centrarse en acceso, aparcamiento, entrega de llaves, restricciones de tráfico y distancia real al centro histórico."], "historia": [], "arquitectura": [], "arte": [], "curiosidades": [], "consejos": ["Confirmar con antelación el procedimiento de entrada, especialmente si la llegada es tardía. Guardar el teléfono del alojamiento y las instrucciones de aparcamiento. Comprobar si la dirección queda dentro o cerca de la ZTL y no seguir automáticamente al navegador por calles restringidas. Antes de salir al día siguiente, verificar dónde puede permanecer el coche y hasta qué hora."]}}]}, {"name": "Día 5 · Padua+Vicenza", "color": "#F9A825", "points": [{"name": "ARENA DE VERONA", "fonetica": "a-RÉ-na di ve-RÓ-na", "lat": 45.438996, "lng": 10.994357, "type": "visita", "meta": {"tiempo": "60-90 minutos"}, "sections": {"descripcion": ["La Arena domina Piazza Bra y sigue siendo el gran símbolo de Verona. Entrar permite comprender su escala real, muy distinta de la visión exterior, y observar cómo la circulación de decenas de miles de espectadores estaba resuelta mediante galerías, escaleras y accesos radiales."], "historia": ["Fue construida en la primera mitad del siglo I d. C., fuera de la muralla republicana. Acogió combates de gladiadores, cacerías y espectáculos. Un terremoto en 1117 destruyó buena parte del anillo exterior; sus sillares se reutilizaron en edificios de la ciudad. Desde 1913, con una Aida conmemorativa, se consolidó como escenario de ópera al aire libre."], "arquitectura": ["La planta elíptica mide aproximadamente 152 por 123 metros. La cavea se apoya en una estructura de bóvedas de piedra y hormigón romano. Del anillo exterior queda la llamada Ala, cuatro arcos superpuestos que permiten imaginar la altura original. La restauración y la instalación escénica contemporánea conviven con la fábrica antigua."], "arte": ["Conviene mirar la relación entre vomitorios, graderíos y arena; después, desde Piazza Bra, comparar la masa curva del anfiteatro con las fachadas neoclásicas. En temporada lírica, la maquinaria puede ocultar parte del interior, pero también muestra la continuidad de uso del monumento."], "curiosidades": [], "consejos": ["Reservar franja si se quiere entrar. En días de espectáculo pueden cambiar recorridos y horarios. La piedra refleja mucho calor; primera hora es más cómoda."]}}, {"name": "CASA DE JULIETA", "fonetica": "CÁ-sa di yu-LIÉT-ta", "lat": 45.441949, "lng": 10.998659, "type": "visita", "meta": {"tiempo": "45-75 minutos"}, "sections": {"descripcion": ["La Casa de Julieta es menos un documento sobre una persona real que un monumento a la capacidad de la literatura para transformar una ciudad. El patio, el balcón y las salas convierten la tragedia de Romeo y Julieta en una experiencia turística y afectiva."], "historia": ["La casa torre está documentada desde 1351 y perteneció a la familia Dal Cappello, cuyo nombre facilitó su asociación con los Capuleto. En el siglo XVIII empezó la identificación romántica; el museo fue configurado sobre todo en el siglo XX. El balcón se añadió en la década de 1930 con piezas pétreas antiguas."], "arquitectura": ["La fachada de ladrillo, el patio estrecho y la casa de varias plantas responden a una residencia urbana medieval muy restaurada. El interior recrea ambientes históricos con mobiliario, pinturas y objetos relacionados con adaptaciones teatrales y cinematográficas."], "arte": ["La estatua de Julieta del patio es una copia; el original se conserva protegido. Las cartas dirigidas al personaje son contestadas por el Club di Giulietta, fenómeno cultural que inspiró libros y películas."], "curiosidades": [], "consejos": ["Desde el 1 de abril de 2026 el acceso se realiza a través del Teatro Nuovo. La entrada está muy regulada y suele agotarse. Reservar y evitar horas centrales."]}}, {"name": "PIAZZA BRA", "fonetica": "PIÁT-sa BRÁ", "lat": 45.438476, "lng": 10.992958, "type": "visita", "meta": {"tiempo": "30-60 minutos"}, "sections": {"descripcion": ["Piazza Bra es la antesala monumental de Verona y una de las plazas más amplias de Italia. No funciona como un espacio cerrado de proporciones uniformes, sino como una secuencia de jardines, paseo, anfiteatro, palacios públicos y terrazas."], "historia": ["El área quedó fuera del núcleo romano y se urbanizó de manera gradual. En época veneciana y moderna se transformó en lugar de ferias, desfiles y representación pública. La sistematización del Liston y de los jardines fijó la imagen actual."], "arquitectura": ["La Arena introduce la escala antigua; Palazzo Barbieri aporta el neoclasicismo institucional; la Gran Guardia, la monumentalidad de los siglos XVII-XIX; y los Portoni della Bra marcan el acceso desde la ciudad medieval."], "arte": ["El nombre Bra deriva probablemente de braida, término de origen germánico para un espacio abierto. El Liston, pavimentado en piedra rosada, continúa siendo el paseo social por excelencia."], "curiosidades": [], "consejos": ["Recorrer primero el perímetro y luego cruzar los jardines. La fachada de la Arena se fotografía mejor desde el lado de Palazzo Barbieri."]}}, {"name": "PALAZZO BARBIERI", "fonetica": "pa-LÁT-so bar-BIÉ-ri", "lat": 45.438118, "lng": 10.99378, "type": "visita", "meta": {"tiempo": "10-20 minutos por el exterior"}, "sections": {"descripcion": ["Palazzo Barbieri, sede del ayuntamiento, cierra el lado oriental de Piazza Bra con una fachada solemne que contrasta con la textura arqueológica de la Arena."], "historia": ["Fue proyectado por Giuseppe Barbieri y construido entre 1836 y 1848 como sede de la Guardia Cívica austríaca. Tras la incorporación al Reino de Italia pasó a albergar funciones municipales. Sufrió graves daños durante la Segunda Guerra Mundial y fue reconstruido."], "arquitectura": ["Es un edificio neoclásico de orden monumental, con gran pronaos corintio, frontón y cuerpo central inspirado en el templo antiguo. La arquitectura utiliza la cita clásica como lenguaje de autoridad civil."], "arte": ["La fachada funciona mejor vista desde la Arena o desde el Liston. El interior no es una visita turística ordinaria; su interés principal es urbano y representativo."], "curiosidades": [], "consejos": ["Observar cómo el pórtico se alinea con la plaza y cómo la escala de las columnas compite deliberadamente con el anfiteatro."]}}, {"name": "PALAZZO DELLA GRAN GUARDIA", "fonetica": "pa-LÁT-so DÉL-la gran GUÁR-dia", "lat": 45.438122, "lng": 10.991908, "type": "visita", "meta": {"tiempo": "10-20 minutos por el exterior"}, "sections": {"descripcion": ["La Gran Guardia forma, junto con la Arena y Palazzo Barbieri, el gran telón arquitectónico de Piazza Bra. Su larga fachada porticada fue concebida para ejercicios militares y hoy alberga exposiciones y congresos."], "historia": ["El proyecto se inició a comienzos del siglo XVII, tradicionalmente vinculado a Domenico Curtoni, pero quedó incompleto durante siglos. La obra se concluyó en el siglo XIX bajo Giuseppe Barbieri."], "arquitectura": ["La planta baja desarrolla un profundo pórtico de arcos; sobre él se alza un piso de grandes ventanas y ritmo clásico. La enorme cubierta interior permitía reunir tropas en caso de lluvia."], "arte": ["La dilatada construcción explica la mezcla entre lenguaje manierista tardío y finalización neoclásica. Solo se accede cuando hay exposiciones o actos."], "curiosidades": [], "consejos": ["Consultar la programación; aunque esté cerrado, merece rodear el edificio y observar los Portoni della Bra adosados."]}}, {"name": "PORTONI DELLA BRA", "fonetica": "por-TÓ-ni DÉL-la BRÁ", "lat": 45.438111, "lng": 10.991539, "type": "visita", "meta": {"tiempo": "10 minutos"}, "sections": {"descripcion": ["Los Portoni della Bra son dos arcos almenados que marcan el paso entre Piazza Bra y Corso Porta Nuova. Aunque hoy parecen una puerta ceremonial, formaron parte de la cerca medieval."], "historia": ["La estructura se relaciona con las defensas comunales y escalígeras. Junto a ella se alza la torre del reloj, instalada y modificada en época moderna."], "arquitectura": ["Los arcos apuntados, el ladrillo y las almenas de cola de golondrina crean una imagen medieval muy reconocible. El paso actual conserva su función de articulación urbana."], "arte": ["Desde el exterior de la plaza se obtiene una composición con la torre, los arcos y el eje de Corso Porta Nuova."], "curiosidades": [], "consejos": ["Es una parada breve; hay tráfico peatonal y bicicletas. No bloquear los pasos al fotografiar."]}}, {"name": "PIAZZA DELLE ERBE", "fonetica": "PIÁT-sa DÉL-le ÉR-be", "lat": 45.443348, "lng": 10.996987, "type": "visita", "meta": {"tiempo": "30-60 minutos"}, "sections": {"descripcion": ["Piazza delle Erbe ocupa el antiguo foro romano y sigue siendo el corazón urbano más animado de Verona. Mercado, cafés, palacios, torres y fuentes se superponen en un espacio irregular lleno de referencias históricas."], "historia": ["El foro concentraba la vida política y comercial romana. En la Edad Media mantuvo su papel de mercado y fue rodeado por casas torre, sedes comunales y residencias aristocráticas. Las fachadas pintadas recuerdan la tradición veronesa de decorar los palacios."], "arquitectura": ["Destacan la Torre dei Lamberti, el Palazzo Maffei barroco, la Casa dei Mercanti, las Case Mazzanti con frescos, la columna de san Marcos y la fuente de Madonna Verona, cuya estatua reaprovecha una figura romana."], "arte": ["La columna con el león alado recuerda el dominio veneciano; el capitello servía para proclamas y castigos. Mirar también los restos de frescos y las diferencias de cota."], "curiosidades": [], "consejos": ["Ir temprano para apreciar la arquitectura antes de que se llene de puestos y terrazas; volver al atardecer para el ambiente."]}}, {"name": "TORRE DEI LAMBERTI", "fonetica": "TÓR-re dei lam-BÉR-ti", "lat": 45.442969, "lng": 10.997765, "type": "visita", "meta": {"tiempo": "45-60 minutos"}, "sections": {"descripcion": ["La Torre dei Lamberti es el mirador vertical del centro histórico. Su altura permite leer el trazado de plazas, tejados, campanarios y el meandro del Adigio."], "historia": ["La familia Lamberti inició la torre en 1172. Fue elevada y reparada en varias fases; un rayo causó daños en el siglo XV. Sus campanas tenían funciones distintas: la Marangona regulaba la jornada laboral y avisaba de incendios; el Rengo convocaba al consejo o llamaba a las armas."], "arquitectura": ["La fábrica muestra bandas de ladrillo y toba, huella de ampliaciones sucesivas. El reloj se añadió en el siglo XVIII. Se puede subir por escalera o ascensor, aunque el tramo final exige escalones."], "arte": ["La terraza ofrece las mejores vistas de Piazza delle Erbe, Piazza dei Signori y las colinas. Las campanas son enormes y siguen asociadas a la identidad cívica."], "curiosidades": [], "consejos": ["Comprar entrada combinada si incluye Palazzo della Ragione. Evitar horas centrales de calor y comprobar si hay cierres por meteorología."]}}, {"name": "PALAZZO DELLA RAGIONE", "fonetica": "pa-LÁT-so DÉL-la ra-YÓ-ne", "lat": 45.443088, "lng": 10.997771, "type": "visita", "meta": {"tiempo": "45-90 minutos"}, "sections": {"descripcion": ["El Palazzo della Ragione fue durante siglos el centro del poder comunal. Su patio, la Scala della Ragione y la relación con la Torre dei Lamberti forman uno de los conjuntos civiles medievales más importantes de Verona."], "historia": ["El complejo comenzó en el siglo XII y albergó tribunales, consejos, oficinas y espacios de comercio. Incendios y reformas alteraron su aspecto. Bajo Venecia mantuvo funciones judiciales y administrativas."], "arquitectura": ["El patio del Mercato Vecchio está rodeado por fachadas de ladrillo y piedra. La escalera exterior, construida en el siglo XV, asciende con elegancia hacia el gran nivel superior. En su fábrica conviven románico, gótico y restauraciones posteriores."], "arte": ["El edificio alberga la Galleria d’Arte Moderna Achille Forti. El acceso permite comprender la escala de las antiguas salas de gobierno, no solo ver una colección."], "curiosidades": [], "consejos": ["Hay dos marcadores del mismo palacio en el mapa; uno puede usarse para el exterior de Piazza delle Erbe y otro para el patio y la escalera."]}}, {"name": "PIAZZA DEI SIGNORI", "fonetica": "PIÁT-sa dei si-ÑÓ-ri", "lat": 45.443344, "lng": 10.998173, "type": "visita", "meta": {"tiempo": "20-40 minutos"}, "sections": {"descripcion": ["Piazza dei Signori es la plaza política de Verona, más recogida y solemne que Piazza delle Erbe. Los palacios de los Scaligeri y del gobierno veneciano la convirtieron en escenario del poder."], "historia": ["El espacio se configuró alrededor de las residencias de la familia della Scala. Después, Venecia reutilizó y transformó los edificios. La estatua de Dante, instalada en 1865, recuerda la acogida que el poeta recibió en la corte de Cangrande della Scala."], "arquitectura": ["La plaza reúne el Palazzo del Comune, la Loggia del Consiglio renacentista, el Palazzo del Capitanio y fachadas conectadas por arcos."], "arte": ["Dante aparece en el centro como figura intelectual y política. Conviene pasar bajo los arcos hacia las Arche Scaligere."], "curiosidades": [], "consejos": ["Es más tranquila temprano o por la noche. La luz de tarde ilumina mejor la Loggia del Consiglio."]}}, {"name": "PALAZZO DELLA RAGIONE", "fonetica": "pa-LÁT-so DÉL-la ra-YÓ-ne", "lat": 45.443088, "lng": 10.997771, "type": "visita", "meta": {"tiempo": "45-90 minutos"}, "sections": {"descripcion": ["El Palazzo della Ragione fue durante siglos el centro del poder comunal. Su patio, la Scala della Ragione y la relación con la Torre dei Lamberti forman uno de los conjuntos civiles medievales más importantes de Verona."], "historia": ["El complejo comenzó en el siglo XII y albergó tribunales, consejos, oficinas y espacios de comercio. Incendios y reformas alteraron su aspecto. Bajo Venecia mantuvo funciones judiciales y administrativas."], "arquitectura": ["El patio del Mercato Vecchio está rodeado por fachadas de ladrillo y piedra. La escalera exterior, construida en el siglo XV, asciende con elegancia hacia el gran nivel superior. En su fábrica conviven románico, gótico y restauraciones posteriores."], "arte": ["El edificio alberga la Galleria d’Arte Moderna Achille Forti. El acceso permite comprender la escala de las antiguas salas de gobierno, no solo ver una colección."], "curiosidades": [], "consejos": ["Hay dos marcadores del mismo palacio en el mapa; uno puede usarse para el exterior de Piazza delle Erbe y otro para el patio y la escalera."]}}, {"name": "SCALA DELLA RAGIONE", "fonetica": "SCÁ-la DÉL-la ra-YÓ-ne", "lat": 45.443001, "lng": 10.997961, "type": "visita", "meta": {"tiempo": "10-20 minutos"}, "sections": {"descripcion": ["La Scala della Ragione es la gran escalera gótica del patio del Palazzo della Ragione. Su presencia convierte un elemento de circulación en una pieza teatral de arquitectura civil."], "historia": ["Fue construida en el siglo XV, probablemente durante el dominio veneciano, para comunicar el patio con las salas superiores. Su nombre se asocia al palacio de justicia y gobierno."], "arquitectura": ["La escalera de piedra asciende sobre arcos y está protegida por una balaustrada calada. El rojo del ladrillo del patio realza su perfil."], "arte": ["Es uno de los mejores ejemplos de cómo la arquitectura pública medieval utilizaba recorridos exteriores para dar solemnidad al acceso."], "curiosidades": [], "consejos": ["Fotografiar desde una esquina del patio para incluir la torre. Evitar coincidir con grupos que bloqueen los escalones."]}}, {"name": "TORRE DEI LAMBERTI", "fonetica": "TÓR-re dei lam-BÉR-ti", "lat": 45.442969, "lng": 10.997765, "type": "visita", "meta": {"tiempo": "45-60 minutos"}, "sections": {"descripcion": ["La Torre dei Lamberti es el mirador vertical del centro histórico. Su altura permite leer el trazado de plazas, tejados, campanarios y el meandro del Adigio."], "historia": ["La familia Lamberti inició la torre en 1172. Fue elevada y reparada en varias fases; un rayo causó daños en el siglo XV. Sus campanas tenían funciones distintas: la Marangona regulaba la jornada laboral y avisaba de incendios; el Rengo convocaba al consejo o llamaba a las armas."], "arquitectura": ["La fábrica muestra bandas de ladrillo y toba, huella de ampliaciones sucesivas. El reloj se añadió en el siglo XVIII. Se puede subir por escalera o ascensor, aunque el tramo final exige escalones."], "arte": ["La terraza ofrece las mejores vistas de Piazza delle Erbe, Piazza dei Signori y las colinas. Las campanas son enormes y siguen asociadas a la identidad cívica."], "curiosidades": [], "consejos": ["Comprar entrada combinada si incluye Palazzo della Ragione. Evitar horas centrales de calor y comprobar si hay cierres por meteorología."]}}, {"name": "ARCO DELLA COSTA", "fonetica": "ÁR-co DÉL-la CÓS-ta", "lat": 45.443066, "lng": 10.997567, "type": "visita", "meta": {"tiempo": "5-10 minutos"}, "sections": {"descripcion": ["El Arco della Costa conecta Piazza delle Erbe con Piazza dei Signori. De su bóveda cuelga una costilla de gran cetáceo que se ha convertido en una de las curiosidades más conocidas de Verona."], "historia": ["El pasaje forma parte del sistema de conexiones entre edificios de gobierno. La costilla, documentada desde hace siglos, pudo llegar como objeto exótico de comerciantes o peregrinos."], "arquitectura": ["El arco de ladrillo enmarca una perspectiva muy eficaz hacia las plazas. El hueso suspendido introduce un elemento casi surrealista dentro del conjunto monumental."], "arte": ["La leyenda dice que caerá sobre la primera persona completamente honesta que pase debajo; su permanencia se interpreta con humor veronés."], "curiosidades": [], "consejos": ["Mirar hacia arriba: muchas personas cruzan sin advertir el hueso. La zona es estrecha y muy transitada."]}}, {"name": "ARCHE SCALIGERE", "fonetica": "ÁR-ke sca-LÍ-ye-re", "lat": 45.443596, "lng": 10.998836, "type": "visita", "meta": {"tiempo": "30-45 minutos"}, "sections": {"descripcion": ["Las Arche Scaligere forman el mausoleo monumental de los señores de Verona. Sus sepulcros góticos, cubiertos por baldaquinos y coronados por estatuas ecuestres, condensan la ambición política de la dinastía."], "historia": ["El cementerio se desarrolló junto a Santa Maria Antica entre los siglos XIII y XIV. Los monumentos más espectaculares pertenecen a Cangrande I, Mastino II y Cansignorio della Scala. La familia gobernó Verona y extendió su dominio por gran parte del Véneto."], "arquitectura": ["La piedra tallada crea agujas, arcos trilobulados, pináculos, relieves y rejas. Las figuras ecuestres presentan al difunto como guerrero y gobernante incluso después de la muerte."], "arte": ["La tumba de Cangrande es especialmente importante por su relación con Dante. Los originales de algunas esculturas han sido sustituidos por copias para protegerlos."], "curiosidades": [], "consejos": ["El recinto interior tiene horarios y entrada; el exterior ya permite una buena lectura. Llevar prismáticos pequeños o usar zoom para los detalles altos."]}}, {"name": "CASA DI ROMEO", "fonetica": "CÁ-sa di RÓ-me-o", "lat": 45.443552, "lng": 10.999286, "type": "visita", "meta": {"tiempo": "5-10 minutos"}, "sections": {"descripcion": ["La llamada Casa de Romeo es una residencia medieval fortificada vinculada por tradición a los Montecchi. Su interés principal es mostrar cómo vivían las familias nobles en casas torre urbanas."], "historia": ["La identificación con Romeo es literaria y tardía. El edificio perteneció a los Nogarola y conserva una poderosa imagen de ladrillo, patio y almenas, aunque no funciona como museo equivalente a la Casa de Julieta."], "arquitectura": ["La fachada cerrada, la torre y las almenas expresan una arquitectura doméstica defensiva, propia de una ciudad marcada por conflictos entre linajes."], "arte": ["La casa es propiedad privada y normalmente solo se observa desde la calle. La discreción del lugar contrasta con la teatralización turística de Julieta."], "curiosidades": [], "consejos": ["No intentar entrar ni molestar a residentes. Merece una parada breve al enlazar las Arche Scaligere con Santa Anastasia."]}}, {"name": "PONTE PIETRA", "fonetica": "PÓN-te PIÉ-tra", "lat": 45.4478, "lng": 11.000031, "type": "visita", "meta": {"tiempo": "20-30 minutos"}, "sections": {"descripcion": ["Ponte Pietra es el puente más antiguo y visualmente más complejo de Verona. Une el centro con la colina de San Pietro y permite leer el Adigio como eje defensivo y urbano."], "historia": ["Su origen se remonta a época romana, cuando conectaba el teatro y las vías de la margen izquierda con la ciudad. Sufrió avenidas, derrumbes y reconstrucciones. En 1945 las tropas alemanas lo volaron; fue reconstruido con materiales recuperados del río."], "arquitectura": ["La alternancia de piedra blanca y ladrillo revela fases distintas. Los arcos no son uniformes y las torres de acceso han desaparecido o cambiado. Esa irregularidad es parte de su autenticidad histórica."], "arte": ["Desde el puente se ven el Duomo, el Teatro Romano y Castel San Pietro. La reconstrucción de posguerra buscó recomponer el monumento con criterio histórico, no crear una copia completamente nueva."], "curiosidades": [], "consejos": ["Cruzar en ambos sentidos y bajar a la ribera si el nivel del río lo permite. Mejor luz al amanecer o al final de la tarde."]}}, {"name": "CASTEL SAN PIETRO", "fonetica": "cas-TÉL san PIÉ-tro", "lat": 45.447975, "lng": 11.002917, "type": "visita", "meta": {"tiempo": "30-60 minutos"}, "sections": {"descripcion": ["La terraza de Castel San Pietro ofrece la vista panorámica clásica de Verona: tejados, campanarios, puentes y la curva del Adigio. El edificio actual es un cuartel austríaco y normalmente no se visita por dentro."], "historia": ["La colina estuvo ocupada desde la Antigüedad y albergó un templo romano. En la Edad Media tuvo fortificaciones; el castillo visconteo fue transformado y finalmente sustituido en el siglo XIX por el cuartel habsbúrgico."], "arquitectura": ["La masa de ladrillo rojizo y las almenas reinterpretan lenguajes medievales dentro de una arquitectura militar del siglo XIX. El verdadero espacio público es la explanada-mirador."], "arte": ["La ubicación explica mejor que ningún plano la geografía defensiva de la ciudad. Desde aquí se entiende por qué el teatro romano se apoyó en la ladera."], "curiosidades": [], "consejos": ["Subir en funicular y bajar a pie, o al revés. Al atardecer se llena; llegar con margen y vigilar objetos personales."]}}, {"name": "FUNICOLARE DI CASTEL SAN PIETRO", "fonetica": "fu-ni-co-LÁ-re di cas-TÉL san PIÉ-tro", "lat": 45.448785, "lng": 11.00078, "type": "transporte", "meta": {"tiempo": "10-20 minutos"}, "sections": {"descripcion": ["El funicular salva rápidamente la pendiente entre la zona del Teatro Romano y la terraza de Castel San Pietro. Es un medio práctico y una pequeña experiencia panorámica."], "historia": ["Un funicular funcionó aquí entre 1941 y 1944. La instalación actual recuperó el enlace en 2017 con tecnología moderna."], "arquitectura": ["La línea es corta y utiliza cabinas acristaladas. La estación superior se integra junto al antiguo cuartel."], "arte": ["Durante el trayecto se abren vistas breves del río y la ciudad; no sustituye al paseo a pie, pero ahorra esfuerzo."], "curiosidades": [], "consejos": ["Puede haber cola al atardecer. Comprobar horario y llevar alternativa peatonal."]}}, {"name": "TEATRO ROMANO", "fonetica": "te-Á-tro ro-MÁ-no", "lat": 45.447167, "lng": 11.001777, "type": "visita", "meta": {"tiempo": "75-120 minutos"}, "sections": {"descripcion": ["El Teatro Romano muestra la importancia cultural de Verona en época imperial y su adaptación a la ladera de San Pietro. El museo arqueológico completa la visita con piezas procedentes de la ciudad y su territorio."], "historia": ["Fue construido a finales del siglo I a. C. y comienzos del I d. C. Después de la Antigüedad quedó ocupado por viviendas, conventos y otras estructuras. En el siglo XIX Andrea Monga compró propiedades y promovió excavaciones para recuperar el monumento."], "arquitectura": ["La cavea se apoya parcialmente en la pendiente; terrazas y galerías ascendían por la colina. El complejo actual mezcla restos romanos, iglesia, convento y museo, lo que permite leer siglos de reutilización."], "arte": ["En verano vuelve a acoger espectáculos, recuperando su función escénica. Las vistas desde las gradas añaden valor al recorrido."], "curiosidades": [], "consejos": ["Hay muchos escalones y superficies irregulares. Reservar al menos una hora y evitar las horas más calurosas."]}}, {"name": "DUOMO DI VERONA", "fonetica": "DUÓ-mo di ve-RÓ-na", "lat": 45.447115, "lng": 10.996708, "type": "visita", "meta": {"tiempo": "60-90 minutos"}, "sections": {"descripcion": ["El Duomo de Verona es un conjunto más complejo de lo que su fachada sugiere: catedral, baptisterio, claustro, restos paleocristianos y espacios canónicos forman una pequeña ciudad religiosa."], "historia": ["La catedral actual se levantó tras el terremoto de 1117 sobre edificios anteriores. Fue consagrada en 1187 y modificada durante el gótico, el Renacimiento y el Barroco."], "arquitectura": ["La portada románica de Nicolò conserva esculturas de gran calidad. El interior gótico fue transformado; las capillas reúnen obras de distintas épocas. En la capilla Cartolari-Nichesola se conserva la Asunción de Tiziano."], "arte": ["Los mosaicos y restos de las basílicas paleocristianas ayudan a entender la larga continuidad del lugar. No limitarse a la nave principal."], "curiosidades": [], "consejos": ["Verificar horarios litúrgicos y billete del circuito de iglesias. Vestimenta adecuada."]}}, {"name": "SANTA ANASTASIA", "fonetica": "SÁN-ta a-nas
