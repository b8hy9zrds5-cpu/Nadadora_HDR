-TA-sia", "lat": 45.445132, "lng": 10.99963, "type": "visita", "meta": {"tiempo": "60-90 minutos"}, "sections": {"descripcion": ["Santa Anastasia es la gran iglesia gótica de Verona. Su nave alta, los pilares de mármol y las capillas privadas reflejan el poder de la orden dominica y de las familias que financiaron el edificio."], "historia": ["La construcción comenzó a finales del siglo XIII y se prolongó durante dos siglos. El templo sustituyó a una iglesia anterior y nunca recibió el revestimiento previsto en la fachada."], "arquitectura": ["La planta basilical y las bóvedas de crucería crean una fuerte sensación vertical. Son célebres las pilas de agua bendita sostenidas por jorobados, especialmente el llamado gobbo de Gabriele Caliari."], "arte": ["La obra maestra es San Jorge y la princesa, fresco de Pisanello en la capilla Pellegrini. Su refinamiento cortesano y los detalles de animales, vestidos y paisaje justifican una observación lenta."], "curiosidades": [], "consejos": ["La capilla de Pisanello puede tener iluminación controlada. Llevar monedas o usar el sistema disponible. Evitar misas."]}}, {"name": "BASILICA DI SAN ZENO", "fonetica": "ba-SÍ-li-ca di san DSÉ-no", "lat": 45.442593, "lng": 10.979264, "type": "visita", "meta": {"tiempo": "75-120 minutos"}, "sections": {"descripcion": ["San Zeno Maggiore es una de las iglesias románicas más importantes del norte de Italia y está ligada al patrón de Verona. La fachada, el rosetón, el claustro y el retablo de Mantegna forman un conjunto excepcional."], "historia": ["La abadía se desarrolló sobre el lugar asociado a la tumba de san Zenón, obispo del siglo IV. El edificio actual es principalmente de los siglos XII y XIII, con reformas posteriores. Fue un centro monástico de gran influencia."], "arquitectura": ["La fachada alterna toba y ladrillo. El gran rosetón se conoce como Ruota della Fortuna. El pórtico presenta relieves románicos y puertas de bronce con paneles medievales. El interior se divide en iglesia superior, presbiterio elevado y cripta."], "arte": ["El retablo de Andrea Mantegna transformó la pintura renacentista del Véneto mediante una arquitectura ilusoria unificada. La cripta se vincula en la tradición local con el matrimonio de Romeo y Julieta."], "curiosidades": [], "consejos": ["Está algo alejada del centro principal. Merece desplazamiento específico y al menos una hora. Revisar billete conjunto de iglesias."]}}, {"name": "MUSEO DI CASTELVECCHIO", "fonetica": "mu-SÉ-o di cas-tel-VÉK-kio", "lat": 45.439347, "lng": 10.98766, "type": "visita", "meta": {"tiempo": "90-150 minutos"}, "sections": {"descripcion": ["Castelvecchio combina fortaleza escalígera, colección de arte y una de las restauraciones museográficas más influyentes del siglo XX, obra de Carlo Scarpa."], "historia": ["Cangrande II della Scala construyó el castillo entre 1354 y 1356 como residencia defensiva y vía de escape hacia el Adigio. Fue cuartel bajo Venecia, Francia y Austria. Tras daños bélicos, Carlo Scarpa desarrolló entre 1957 y 1975 una intervención que reinterpretó el conjunto."], "arquitectura": ["Scarpa utilizó hormigón, piedra, acero, agua y soportes diseñados a medida para separar lo nuevo de lo antiguo. El montaje de la estatua ecuestre de Cangrande es una lección de perspectiva y recorrido."], "arte": ["La colección incluye escultura medieval, pintura veronesa, obras de Pisanello, Mantegna, Bellini y otros maestros. El edificio y el montaje son tan importantes como las obras."], "curiosidades": [], "consejos": ["No hacer una visita rápida. Seguir el recorrido de Scarpa y observar suelos, barandillas, ventanas y encuadres. Reservar 90 minutos como mínimo."]}}, {"name": "PONTE SCALIGERO", "fonetica": "PÓN-te sca-LÍ-ye-ro", "lat": 45.440404, "lng": 10.987282, "type": "visita", "meta": {"tiempo": "20-40 minutos"}, "sections": {"descripcion": ["El Ponte Scaligero prolonga el castillo sobre el Adigio y fue concebido como vía de retirada segura para los señores de Verona. Sus arcos desiguales y almenas crean una de las imágenes más poderosas de la ciudad."], "historia": ["Se construyó hacia 1354-1356. Fue destruido en abril de 1945 y reconstruido después de la guerra mediante documentación y recuperación de materiales."], "arquitectura": ["Tres grandes arcos de ladrillo y piedra se apoyan en pilares defensivos. El arco principal alcanza una luz excepcional para su época. El camino almenado ofrece perspectivas cambiantes del río y del castillo."], "arte": ["Las pequeñas aberturas y cambios de nivel recuerdan su función militar. La reconstrucción es un ejemplo temprano de restitución monumental tras la guerra."], "curiosidades": [], "consejos": ["Cruzar hasta la otra orilla y volver; las mejores fotos del puente se obtienen desde el Lungadige o Ponte della Vittoria."]}}, {"name": "PONTE DELLA VITTORIA", "fonetica": "PÓN-te DÉL-la vit-TÓ-ria", "lat": 45.442946, "lng": 10.991446, "type": "visita", "meta": {"tiempo": "10-20 minutos"}, "sections": {"descripcion": ["Ponte della Vittoria es un puente urbano del siglo XX que conecta el centro con el barrio de Borgo Trento. Su valor reside en las vistas y en el programa conmemorativo de las esculturas ecuestres."], "historia": ["Fue proyectado después de la Primera Guerra Mundial como monumento a la victoria italiana y reconstruido tras la Segunda."], "arquitectura": ["La estructura moderna se reviste con lenguaje monumental. En los extremos, grupos escultóricos de caballos y figuras alegóricas convierten el cruce en espacio conmemorativo."], "arte": ["Desde aquí se obtiene una buena vista del Ponte Scaligero, Castelvecchio y la curva del Adigio."], "curiosidades": [], "consejos": ["Parada breve en ruta. Tener cuidado con tráfico y carriles bici."]}}, {"name": "PORTA BORSARI", "fonetica": "PÓR-ta bor-SÁ-ri", "lat": 45.441954, "lng": 10.993427, "type": "visita", "meta": {"tiempo": "15-25 minutos"}, "sections": {"descripcion": ["Porta Borsari conserva la fachada monumental de una puerta romana que daba acceso a la Via Postumia y al decumanus maximus."], "historia": ["En época romana se llamaba Porta Iovia, por un templo cercano de Júpiter. El nombre actual se relaciona con los bursarii, funcionarios que cobraban tasas en época medieval."], "arquitectura": ["La fachada de piedra blanca tiene dos arcos en la planta baja y dos niveles de ventanas enmarcadas por edículos. La parte posterior defensiva desapareció."], "arte": ["La inscripción menciona una reforma del año 265 bajo el emperador Galieno. La puerta quedó absorbida por la ciudad medieval y hoy aparece entre edificios comerciales."], "curiosidades": [], "consejos": ["Mirarla desde ambos lados y seguir Corso Porta Borsari hacia Piazza delle Erbe."]}}, {"name": "SOAVE", "fonetica": "so-Á-ve", "lat": 45.419799, "lng": 11.248025, "type": "visita", "meta": {"tiempo": "90-180 minutos"}, "sections": {"descripcion": ["Soave es uno de los recintos amurallados más reconocibles del Véneto. El castillo desciende visualmente hacia el pueblo mediante una muralla almenada, mientras el casco conserva puertas, palacios y calles vinculadas al comercio del vino."], "historia": ["El asentamiento creció en un territorio ocupado desde época romana. En la Edad Media fue disputado por familias y poderes regionales; los Scaligeri reforzaron castillo y murallas. Bajo Venecia prosperó como centro agrícola."], "arquitectura": ["El conjunto se adapta a la colina: fortaleza en la cumbre, murallas descendentes y núcleo urbano en la base. Las puertas controlaban los accesos y los palacios cívicos se situaron junto a las calles principales."], "arte": ["El nombre Soave se asocia popularmente a la suavidad, aunque puede proceder de los suevos. El vino Soave, elaborado principalmente con uva Garganega, ha dado fama internacional al territorio."], "curiosidades": [], "consejos": ["Aparcar fuera de las murallas. El casco se recorre en 60-90 minutos; añadir el castillo requiere subida y más tiempo."]}}, {"name": "CASTELLO DI SOAVE", "fonetica": "cas-TÉL-lo di so-Á-ve", "lat": 45.423017, "lng": 11.25075, "type": "visita", "meta": {"tiempo": "60-90 minutos"}, "sections": {"descripcion": ["El Castello di Soave corona una colina cubierta de viñedos y conserva un sistema completo de patios, torre del homenaje y murallas."], "historia": ["La primera fortificación se relaciona con las invasiones húngaras del siglo X. Fue ampliada por los Scaligeri y pasó por manos venecianas. La familia Camuzzoni lo restauró en el siglo XIX siguiendo criterios historicistas."], "arquitectura": ["Tres patios sucesivos conducen hacia la torre principal. Almenas gibelinas, caminos de ronda y puertas defensivas crean una lectura clara de la fortaleza. El interior conserva mobiliario, armas y ambientes reconstruidos."], "arte": ["La restauración decimonónica salvó el conjunto, aunque también idealizó ciertos espacios medievales. Las vistas sobre viñedos son parte esencial de la visita."], "curiosidades": [], "consejos": ["El 24 de junio de 2026 es miércoles: abre en horario de verano, 9:00-12:00 y 15:00-18:00; últimos accesos 11:15 y 17:15. La subida es pronunciada y puede hacer mucho calor."]}}, {"name": "DUOMO DI SAN LORENZO MARTIRE", "fonetica": "DUÓ-mo di san lo-RÉN-tso MÁR-ti-re", "lat": 45.421828, "lng": 11.248353, "type": "visita", "meta": {"tiempo": "25-40 minutos"}, "sections": {"descripcion": ["El Duomo de Soave es la principal iglesia del pueblo y muestra la continuidad de la comunidad religiosa más allá de la imagen medieval del castillo."], "historia": ["El edificio actual fue reconstruido y ampliado entre los siglos XVIII y XIX sobre templos anteriores, respondiendo al crecimiento de la población."], "arquitectura": ["La fachada neoclásica y el interior de nave amplia contrastan con las iglesias medievales más pequeñas. Conserva pinturas, altares y decoración de distintas épocas."], "arte": ["Conviene observar el órgano y las obras procedentes de edificios religiosos suprimidos o transformados."], "curiosidades": [], "consejos": ["Acceso condicionado por celebraciones. Vestimenta adecuada y visita breve si el día está cargado."]}}, {"name": "SANTA MARIA DEI DOMENICANI", "fonetica": "SÁN-ta ma-RÍ-a dei do-me-ni-CÁ-ni", "lat": 45.422207, "lng": 11.249401, "type": "visita", "meta": {"tiempo": "15-30 minutos"}, "sections": {"descripcion": ["Santa Maria dei Domenicani es una iglesia histórica vinculada a la presencia dominica y a la vida religiosa del borgo."], "historia": ["El conjunto tuvo funciones conventuales y fue modificado tras supresiones y cambios de uso."], "arquitectura": ["La arquitectura conserva una escala más sobria que el Duomo, con elementos góticos y reformas posteriores."], "arte": ["Su interés está en completar la lectura de Soave más allá del castillo y de las murallas."], "curiosidades": [], "consejos": ["Comprobar apertura local; si está cerrada, observar exterior y entorno."]}}, {"name": "PALAZZO DI GIUSTIZIA", "fonetica": "pa-LÁT-so di yus-TÍ-tsia", "lat": 45.422207, "lng": 11.24878, "type": "visita", "meta": {"tiempo": "10-20 minutos"}, "sections": {"descripcion": ["El antiguo Palazzo di Giustizia representa el gobierno civil de Soave y la administración de justicia en un centro sometido a poderes señoriales y venecianos."], "historia": ["Fue levantado en época escalígera y transformado durante el dominio de Venecia. Sus funciones públicas se reflejan en escudos e inscripciones."], "arquitectura": ["El pórtico inferior y la fachada de ladrillo crean un edificio cívico adecuado al mercado y a las reuniones."], "arte": ["Compararlo con los palacios de Verona ayuda a entender cómo los modelos urbanos se adaptaban a una escala menor."], "curiosidades": [], "consejos": ["Parada exterior breve en el recorrido por el centro."]}}, {"name": "VICENZA", "fonetica": "vi-CHÉN-tsa", "lat": 45.546182, "lng": 11.541378, "type": "visita", "meta": {"tiempo": "3-5 horas"}, "sections": {"descripcion": ["Vicenza es una ciudad para mirar fachadas y proporciones. Palladio transformó edificios preexistentes mediante logias, órdenes clásicos y composiciones capaces de dar unidad a calles medievales."], "historia": ["La antigua Vicetia romana se desarrolló como centro regional. Bajo Venecia, la prosperidad de familias nobles y mercantiles favoreció encargos a Andrea Palladio. En 1994 la ciudad y sus villas fueron inscritas por la UNESCO, ampliándose el sitio en 1996."], "arquitectura": ["El palladianismo no copia literalmente Roma: adapta frontones, columnas y logias a palacios estrechos, edificios públicos y villas. Junto a ello sobreviven gótico veneciano, barroco y arquitectura medieval."], "arte": ["El recorrido esencial une Piazza Matteotti, Teatro Olimpico, Corso Palladio, Santa Corona, Piazza dei Signori y Basilica Palladiana."], "curiosidades": [], "consejos": ["El itinerario completo del día es muy ambicioso al incluir Verona, Soave, Vicenza y Padua. En Vicenza conviene priorizar Teatro Olimpico, Basilica Palladiana y una sola iglesia o museo."]}}, {"name": "TEATRO OLIMPICO", "fonetica": "te-Á-tro o-LÍM-pi-co", "lat": 45.550151, "lng": 11.549321, "type": "visita", "meta": {"tiempo": "60-90 minutos"}, "sections": {"descripcion": ["El Teatro Olimpico es la última obra de Palladio y el primer teatro cubierto estable de la Edad Moderna. Su escenario de perspectivas permanentes produce una ilusión urbana extraordinaria."], "historia": ["La Accademia Olimpica encargó el teatro en 1580. Palladio murió ese año; Vincenzo Scamozzi completó la obra y diseñó las perspectivas para la inauguración con Edipo Rey en 1585."], "arquitectura": ["La cavea semicircular, la columnata y la scaenae frons reinterpretan el teatro romano. Detrás de las puertas, calles de madera y estuco se estrechan y elevan para simular una profundidad mucho mayor."], "arte": ["Las perspectivas representan Tebas, aunque suelen percibirse como una ciudad ideal renacentista. Son frágiles y no se pisan. El techo pintado simula cielo abierto."], "curiosidades": [], "consejos": ["El miércoles 24 de junio abre de 9:00 a 17:00, último acceso 16:30. Entrar al inicio de la visita a Vicenza y usar billete combinado."]}}, {"name": "BASILICA PALLADIANA", "fonetica": "ba-SÍ-li-ca pal-la-DIÁ-na", "lat": 45.546986, "lng": 11.54672, "type": "visita", "meta": {"tiempo": "45-90 minutos"}, "sections": {"descripcion": ["La Basilica Palladiana no es una iglesia, sino el antiguo Palazzo della Ragione envuelto por una doble logia diseñada por Palladio. Es la obra que consolidó su reputación."], "historia": ["El palacio gótico sufrió problemas estructurales. Tras un largo concurso, Palladio recibió el encargo en 1549. Las obras continuaron después de su muerte. El edificio fue gravemente dañado en 1945 y restaurado."], "arquitectura": ["Las llamadas serlianas —un arco central flanqueado por vanos adintelados— permiten adaptar un ritmo clásico regular a una estructura medieval irregular. La piedra blanca de Piovene contrasta con el cuerpo gótico."], "arte": ["La gran sala superior, con cubierta en forma de casco invertido, acoge exposiciones. La terraza ofrece vistas magníficas de Piazza dei Signori y los tejados."], "curiosidades": [], "consejos": ["Comprobar si hay exposición y acceso a terraza. Incluso sin entrar, recorrer los cuatro lados y observar cómo cambia el módulo."]}}, {"name": "VILLA LA ROTONDA", "fonetica": "VÍL-la la ro-TÓN-da", "lat": 45.531525, "lng": 11.56027, "type": "visita", "meta": {"tiempo": "60-90 minutos"}, "sections": {"descripcion": ["Villa Almerico Capra, conocida como La Rotonda, es uno de los edificios más influyentes de la historia de la arquitectura. Su simetría y sus cuatro pórticos convierten el paisaje en parte del proyecto."], "historia": ["Palladio la diseñó desde 1566 para Paolo Almerico, un eclesiástico retirado. Vincenzo Scamozzi completó trabajos tras la muerte del arquitecto. La familia Capra dio nombre posterior a la villa."], "arquitectura": ["Una sala central circular cubierta por cúpula organiza una planta cuadrada. Cada fachada posee un pórtico de templo y una escalinata orientada hacia un paisaje diferente. No existe una fachada principal única."], "arte": ["Inspiró casas y edificios en Europa y Estados Unidos, incluido Monticello de Thomas Jefferson. El interior conserva frescos y decoración de época."], "curiosidades": [], "consejos": ["Está fuera del centro y requiere coche, taxi o paseo largo. Los interiores tienen aperturas limitadas y deben verificarse. No confundir la vista exterior del jardín con acceso libre."]}}, {"name": "PIAZZA DEI SIGNORI", "fonetica": "PIÁT-sa dei si-ÑÓ-ri", "lat": 45.547302, "lng": 11.546638, "type": "visita", "meta": {"tiempo": "30-60 minutos"}, "sections": {"descripcion": ["En Vicenza, Piazza dei Signori es el centro cívico dominado por la Basilica Palladiana, la Torre Bissara y la Loggia del Capitaniato."], "historia": ["La plaza fue mercado y sede del poder comunal. Bajo Venecia recibió columnas y edificios que expresaban la relación con la Serenissima."], "arquitectura": ["La doble logia blanca de Palladio contrasta con el ladrillo rojo de la Loggia del Capitaniato. Las columnas de San Marcos y del Redentor organizan el extremo occidental."], "arte": ["Es una lección de arquitectura comparada: dos obras de Palladio, separadas por pocos años, utilizan materiales y escalas muy distintos."], "curiosidades": [], "consejos": ["Recorrerla desde varios ángulos y entrar bajo las logias. Al atardecer la piedra toma tonos cálidos."]}}, {"name": "PIAZZA MATTEOTTI", "fonetica": "PIÁT-sa mat-te-ÓT-ti", "lat": 45.548923, "lng": 11.549517, "type": "visita", "meta": {"tiempo": "20-30 minutos"}, "sections": {"descripcion": ["Piazza Matteotti funciona como acceso oriental al centro y reúne el Teatro Olimpico, Palazzo Chiericati y la oficina de turismo."], "historia": ["El área se desarrolló junto al antiguo puerto fluvial y fue transformada por los encargos palladianos del siglo XVI."], "arquitectura": ["Palazzo Chiericati presenta una fachada de logias abiertas, adaptada a un espacio que entonces estaba menos urbanizado. El Teatro Olimpico se oculta tras una fachada relativamente austera."], "arte": ["La plaza permite recoger información y billetes antes del recorrido."], "curiosidades": [], "consejos": ["La oficina turística suele abrir a diario. Es el mejor punto de inicio en Vicenza."]}}, {"name": "CATTEDRALE DI SANTA MARIA ANNUNCIATA", "fonetica": "cat-te-DRÁ-le di SÁN-ta ma-RÍ-a an-nun-CHIÁ-ta", "lat": 40.14582, "lng": 18.490772, "type": "visita", "meta": {"tiempo": "30-50 minutos"}, "sections": {"descripcion": ["La catedral de Vicenza ocupa un lugar de culto antiguo y combina una fachada vinculada a Palladio con una larga historia de reconstrucciones."], "historia": ["El templo medieval fue ampliado y reformado en los siglos XV y XVI. Palladio intervino en la cúpula y en el portal lateral. Los bombardeos de 1944 causaron graves daños."], "arquitectura": ["La fachada de ladrillo y mármol conserva un carácter gótico tardío; la cúpula introduce proporciones renacentistas. El subsuelo arqueológico documenta edificios anteriores."], "arte": ["La visita ayuda a ver un Palladio menos espectacular, trabajando sobre una estructura existente y religiosa."], "curiosidades": [], "consejos": ["Comprobar acceso a cripta arqueológica y horarios litúrgicos."]}}, {"name": "CHIESA DI SANTA CORONA", "fonetica": "KIÉ-sa di SÁN-ta co-RÓ-na", "lat": 45.549295, "lng": 11.547736, "type": "visita", "meta": {"tiempo": "45-75 minutos"}, "sections": {"descripcion": ["Santa Corona es una iglesia dominica fundada para custodiar una reliquia de la corona de espinas. Reúne arquitectura gótica y obras fundamentales del Renacimiento veneciano."], "historia": ["La construcción comenzó en 1261. Familias nobles financiaron capillas y altares. Palladio fue enterrado aquí inicialmente, aunque sus restos se trasladaron después."], "arquitectura": ["La fachada de ladrillo es sobria; el interior de tres naves conserva capillas laterales y un presbiterio reformado."], "arte": ["Destacan el Bautismo de Cristo de Giovanni Bellini y la Adoración de los Magos de Paolo Veronese. La capilla Valmarana fue diseñada por Palladio."], "curiosidades": [], "consejos": ["Forma parte del circuito museístico municipal y puede exigir entrada. Reservar 45 minutos y comprobar cierres por culto."]}}, {"name": "MONTE BERICO", "fonetica": "MÓN-te BÉ-ri-co", "lat": 45.535618, "lng": 11.545924, "type": "visita", "meta": {"tiempo": "60-90 minutos"}, "sections": {"descripcion": ["El santuario de Monte Berico domina Vicenza desde una colina y ofrece una vista extensa de la ciudad, la llanura y, en días claros, los Alpes."], "historia": ["La tradición sitúa apariciones de la Virgen en 1426 y 1428 durante una epidemia. Se construyó una primera iglesia gótica y, en el siglo XVII, Carlo Borella añadió el gran santuario barroco."], "arquitectura": ["La fachada simétrica y la planta centralizada barroca contrastan con los restos de la iglesia gótica. Los pórticos que suben desde la ciudad crean una vía procesional cubierta."], "arte": ["El refectorio conserva la Cena de san Gregorio Magno de Veronese, dañada y recompuesta tras la ocupación napoleónica."], "curiosidades": [], "consejos": ["El desplazamiento consume tiempo. Priorizarlo si se desea panorámica o devoción; aparcamiento disponible en la parte alta."]}}, {"name": "PALAZZO LEONI MONTANARI", "fonetica": "pa-LÁT-so le-Ó-ni mon-ta-NÁ-ri", "lat": 45.550152, "lng": 11.546724, "type": "visita", "meta": {"tiempo": "60-90 minutos"}, "sections": {"descripcion": ["Palazzo Leoni Montanari es uno de los interiores barrocos más sorprendentes de Vicenza y alberga las Gallerie d’Italia."], "historia": ["La familia Leoni Montanari, enriquecida con la producción y comercio textil, transformó varias casas medievales a finales del siglo XVII."], "arquitectura": ["La fachada urbana es relativamente contenida, pero patios, estucos, frescos y escaleras interiores despliegan un barroco exuberante poco habitual en la ciudad palladiana."], "arte": ["Las colecciones incluyen pintura veneciana del siglo XVIII, iconos rusos y exposiciones temporales. La arquitectura doméstica forma parte de la visita."], "curiosidades": [], "consejos": ["Comprobar exposición vigente y reservar al menos una hora. Es una buena alternativa si hace calor."]}}, {"name": "PADOVA", "fonetica": "PÁ-do-va", "lat": 45.410503, "lng": 11.878207, "type": "visita", "meta": {"tiempo": "4-8 horas"}, "sections": {"descripcion": ["Padua reúne en un centro compacto mercados medievales, universidad, grandes basílicas y pintura del Trecento. La ciudad se entiende mejor como red de instituciones que como una sucesión de monumentos aislados."], "historia": ["La antigua Patavium fue una de las ciudades más prósperas del norte romano. En la Edad Media, la universidad y los señores Carraresi impulsaron un extraordinario desarrollo artístico. Después pasó a Venecia, conservando fuerte identidad intelectual."], "arquitectura": ["Pórticos, ladrillo, plazas de mercado y palacios comunales dominan el tejido urbano. Los ciclos de frescos del siglo XIV, inscritos por la UNESCO en 2021, conectan iglesias, capillas y palacios."], "arte": ["La jornada propuesta llega a Padua después de Verona, Soave y Vicenza, por lo que es imposible visitar con profundidad los 20 puntos. La Cappella degli Scrovegni exige reserva y debe fijar el horario del resto."], "curiosidades": [], "consejos": ["Conviene escoger dos o tres interiores mayores y usar el resto de marcadores para un paseo exterior. La reserva de Scrovegni debe ser el ancla horaria."]}}, {"name": "BASILICA DI SANT’ANTONIO", "fonetica": "ba-SÍ-li-ca di sant an-TÓ-nio", "lat": 45.401394, "lng": 11.880773, "type": "visita", "meta": {"tiempo": "75-120 minutos"}, "sections": {"descripcion": ["La Basilica del Santo es uno de los grandes centros de peregrinación de Europa. Su silueta de cúpulas, campanarios y agujas combina referencias románicas, góticas, bizantinas e islámicas."], "historia": ["Se inició poco después de la muerte de san Antonio en 1231 para custodiar su tumba. El complejo creció con capillas, claustros y dependencias franciscanas."], "arquitectura": ["La fachada de ladrillo, las ocho cúpulas y las torres crean un perfil único. El interior conduce hacia la capilla del Arca, revestida de mármol y relieves renacentistas."], "arte": ["Destacan el altar mayor con bronces de Donatello, la capilla de las Reliquias y la tumba del santo, donde los peregrinos apoyan la mano."], "curiosidades": [], "consejos": ["Entrada gratuita, pero es un lugar de culto activo. Vestimenta adecuada, silencio y atención a misas. Las fotografías pueden estar restringidas."]}}, {"name": "PRATO DELLA VALLE", "fonetica": "PRÁ-to DÉL-la VÁL-le", "lat": 45.398619, "lng": 11.876217, "type": "visita", "meta": {"tiempo": "30-60 minutos"}, "sections": {"descripcion": ["Prato della Valle es una de las mayores plazas de Europa y un espacio urbano singular: una isla elíptica, canal, puentes y doble anillo de estatuas."], "historia": ["El área fue teatro romano, lugar de ferias y terreno pantanoso. En el siglo XVIII Andrea Memmo impulsó la gran transformación hidráulica y monumental para sanearla y dinamizarla."], "arquitectura": ["La Isola Memmia ocupa el centro y está rodeada por un canal. Las estatuas representan personajes relacionados con Padua; no incluyen figuras vivas ni santos según las reglas originales."], "arte": ["El número y posición de las esculturas cambiaron con guerras y regímenes. La plaza sigue acogiendo mercados y acontecimientos."], "curiosidades": [], "consejos": ["Recorrer el anillo completo lleva tiempo. Mejor luz al amanecer o atardecer; poca sombra en verano."]}}, {"name": "BASILICA DI SANTA GIUSTINA", "fonetica": "ba-SÍ-li-ca di SÁN-ta yus-TÍ-na", "lat": 45.396537, "lng": 11.879241, "type": "visita", "meta": {"tiempo": "45-75 minutos"}, "sections": {"descripcion": ["Santa Giustina es una de las basílicas más grandes del mundo cristiano y contrasta con la multitud de San Antonio por su interior amplio y sereno."], "historia": ["Se levanta sobre un área funeraria y cultual paleocristiana asociada a santa Justina y san Prosdocimo. La gran reconstrucción renacentista se desarrolló entre los siglos XVI y XVII bajo la poderosa abadía benedictina."], "arquitectura": ["La planta de cruz latina se cubre con numerosas cúpulas. La fachada quedó inacabada, dejando visible el ladrillo. El interior utiliza proporciones monumentales y luz clara."], "arte": ["Conserva la tumba de santa Justina, reliquias atribuidas a san Lucas evangelista y el Martirio de santa Justina de Paolo Veronese."], "curiosidades": [], "consejos": ["Está en Prato della Valle. Entrada gratuita y ambiente más tranquilo; comprobar oficio monástico."]}}, {"name": "BATTISTERO DEL DUOMO", "fonetica": "bat-tis-TÉ-ro del DUÓ-mo", "lat": 45.406828, "lng": 11.87183, "type": "visita", "meta": {"tiempo": "30-45 minutos"}, "sections": {"descripcion": ["El Baptisterio del Duomo conserva uno de los ciclos de pintura del siglo XIV más completos de Padua, obra de Giusto de’ Menabuoi."], "historia": ["Fue construido en el siglo XII y transformado como mausoleo de los Carraresi. Fina Buzzaccarini encargó la decoración alrededor de 1375-1378."], "arquitectura": ["El espacio relativamente pequeño queda completamente envuelto por frescos. La cúpula presenta a Cristo Pantocrátor rodeado por círculos concéntricos de ángeles y santos."], "arte": ["La continuidad visual entre cúpula, tambor y muros crea una experiencia inmersiva. El ciclo forma parte del sitio UNESCO Padua Urbs Picta."], "curiosidades": [], "consejos": ["Aforo limitado. Comprobar entrada y horarios; dedicar tiempo a mirar hacia arriba sin prisa."]}}, {"name": "CAPPELLA DEGLI SCROVEGNI", "fonetica": "cap-PÉL-la de-lli scro-VÉ-ñi", "lat": 45.411818, "lng": 11.879536, "type": "visita", "meta": {"tiempo": "45-60 minutos incluyendo aclimatación"}, "sections": {"descripcion": ["La Cappella degli Scrovegni contiene el ciclo de frescos con el que Giotto cambió la pintura occidental. La reserva es obligatoria y el acceso está controlado para proteger el microclima."], "historia": ["Enrico Scrovegni encargó la capilla, consagrada en 1305, junto a su palacio. El programa desarrolla la vida de la Virgen y de Cristo, culminando en el Juicio Final."], "arquitectura": ["La nave única cubierta por bóveda azul funciona como una caja pictórica. Giotto organiza escenas mediante arquitectura, gestos y emociones humanas, superando fórmulas bizantinas."], "arte": ["Observar el Beso de Judas, la Lamentación, los Vicios y Virtudes y el retrato de Enrico ofreciendo la capilla. Antes de entrar se pasa por una sala de aclimatación."], "curiosidades": [], "consejos": ["El miércoles 24 de junio abre de 9:00 a 19:00; visitas cada 15 minutos y último acceso 18:45. Llegar con antelación estricta; perder la franja puede implicar perder la visita."]}}, {"name": "ORATORIO DI SAN GIORGIO", "fonetica": "o-ra-TÓ-rio di san YÓR-yo", "lat": 45.401024, "lng": 11.880164, "type": "visita", "meta": {"tiempo": "30-45 minutos"}, "sections": {"descripcion": ["El Oratorio di San Giorgio es una pequeña capilla funeraria junto a la Basílica del Santo, cubierta por frescos de Altichiero da Zevio y Jacopo Avanzi."], "historia": ["Raimondino Lupi di Soragna lo encargó en el siglo XIV como mausoleo familiar."], "arquitectura": ["La nave única presenta ciclos sobre san Jorge, santa Catalina y santa Lucía. Las composiciones muestran espacios complejos, multitudes y narración dramática."], "arte": ["Se considera una de las cumbres de la pintura paduana posterior a Giotto y forma parte del sitio UNESCO."], "curiosidades": [], "consejos": ["La visita suele combinarse con la Scoletta del Santo. Confirmar billete y apertura."]}}, {"name": "GATTAMELATA", "fonetica": "gat-ta-me-LÁ-ta", "lat": 45.401578, "lng": 11.879994, "type": "visita", "meta": {"tiempo": "10-20 minutos"}, "sections": {"descripcion": ["El monumento ecuestre a Gattamelata, frente a la Basílica del Santo, es una obra fundamental de Donatello y el primer gran bronce ecuestre autónomo del Renacimiento."], "historia": ["Erasmo da Narni, llamado Gattamelata, fue un condottiero al servicio de Venecia. Tras su muerte en 1443, su familia encargó el monumento, ejecutado por Donatello en la década siguiente."], "arquitectura": ["Caballo y jinete se presentan con serenidad y control, inspirados en la estatua romana de Marco Aurelio. La elevada base simula un monumento funerario, aunque el condottiero está enterrado dentro de la basílica."], "arte": ["La esfera bajo la pata del caballo resuelve un apoyo estructural y simbólico. Mirarlo desde varios ángulos para apreciar el modelado."], "curiosidades": [], "consejos": ["Parada exterior breve; evitar el flujo de peregrinos y tráfico de la plaza."]}}, {"name": "LA SPECOLA", "fonetica": "la SPÉ-co-la", "lat": 45.401973, "lng": 11.868527, "type": "visita", "meta": {"tiempo": "60-90 minutos"}, "sections": {"descripcion": ["La Specola ocupa una torre del antiguo castillo carrarese y fue observatorio astronómico de la Universidad de Padua."], "historia": ["La torre medieval se convirtió en observatorio en el siglo XVIII, dentro del impulso científico de la universidad."], "arquitectura": ["Salas e instrumentos se distribuyen verticalmente hasta la plataforma de observación. La arquitectura militar fue adaptada a usos científicos."], "arte": ["La visita guiada explica telescopios, medición del tiempo y trabajo de los astrónomos."], "curiosidades": [], "consejos": ["Aperturas limitadas y normalmente con visita guiada. Reservar; hay muchas escaleras."]}}, {"name": "GHETTO DI PADOVA", "fonetica": "GUÉT-to di PÁ-do-va", "lat": 45.406059, "lng": 11.875968, "type": "visita", "meta": {"tiempo": "30-60 minutos"}, "sections": {"descripcion": ["El antiguo gueto conserva calles estrechas, patios y edificios altos que reflejan la concentración forzada de la comunidad judía entre los siglos XVII y XVIII."], "historia": ["El gueto fue establecido en 1603 y sus puertas se cerraban por la noche. La emancipación napoleónica puso fin al confinamiento, aunque la zona siguió siendo centro de vida judía."], "arquitectura": ["La falta de espacio favoreció viviendas elevadas y una trama densa. Las sinagogas se integraron discretamente en edificios residenciales."], "arte": ["Hoy es un área animada de galerías y locales, pero requiere una lectura respetuosa de su historia, incluida la persecución fascista y la Shoá."], "curiosidades": [], "consejos": ["Recorrer en silencio y combinar con Museo della Padova Ebraica y sinagoga mediante visita guiada."]}}, {"name": "SINAGOGA ITALIANA", "fonetica": "si-na-GÓ-ga i-ta-LIÁ-na", "lat": 45.405714, "lng": 11.875753, "type": "visita", "meta": {"tiempo": "45-60 minutos"}, "sections": {"descripcion": ["La Sinagoga Italiana es el principal espacio de culto histórico visitable de la comunidad judía de Padua. Su interior barroco contrasta con la discreción exterior."], "historia": ["Fue construida en el siglo XVI y sobrevivió a transformaciones del gueto. Tras daños y restauraciones sigue vinculada a la comunidad."], "arquitectura": ["El Aron ha-Kodesh y la bimah ocupan posiciones opuestas según el rito italiano. Maderas talladas, dorados y textiles crean un espacio íntimo."], "arte": ["La visita permite conocer un rito judío específicamente italiano, distinto de tradiciones asquenazíes y sefardíes."], "curiosidades": [], "consejos": ["Solo se visita en horarios y recorridos organizados; documento de identidad y controles pueden ser necesarios."]}}, {"name": "PALAZZO BO", "fonetica": "pa-LÁT-so BÓ", "lat": 45.406739, "lng": 11.877151, "type": "visita", "meta": {"tiempo": "60-90 minutos"}, "sections": {"descripcion": ["Palazzo Bo es la sede histórica de la Universidad de Padua, fundada en 1222. Sus patios, escudos y aulas condensan siglos de enseñanza y libertad académica."], "historia": ["La universidad se instaló aquí desde finales del siglo XV. Galileo Galilei enseñó en Padua entre 1592 y 1610. En el siglo XVI se construyó el célebre teatro anatómico."], "arquitectura": ["El Cortile Antico está cubierto por miles de escudos de estudiantes y rectores. El teatro anatómico, de forma elíptica y desarrollo vertical, permitía observar disecciones desde gradas estrechas."], "arte": ["También se visita el Aula Magna y la cátedra atribuida a Galileo. El lema Universa Universis Patavina Libertas resume la identidad universitaria."], "curiosidades": [], "consejos": ["Acceso mediante visita guiada con horarios concretos. Reservar con antelación y llegar antes."]}}, {"name": "PIAZZA DELLE ERBE", "fonetica": "PIÁT-sa DÉL-le ÉR-be", "lat": 45.406874, "lng": 11.874686, "type": "visita", "meta": {"tiempo": "20-40 minutos"}, "sections": {"descripcion": ["La Piazza delle Erbe de Padua forma, con Piazza della Frutta, el gran sistema de mercados alrededor del Palazzo della Ragione."], "historia": ["Desde la Edad Media se especializó en productos agrícolas y comercio. Las plantas bajas del Salone siguen ocupadas por tiendas alimentarias."], "arquitectura": ["La fachada del Palazzo della Ragione y los pórticos crean un borde monumental, mientras los toldos y puestos mantienen la función cotidiana."], "arte": ["La plaza cambia radicalmente entre la mañana de mercado y la tarde despejada."], "curiosidades": [], "consejos": ["Visitar temprano para ver actividad real y volver después para apreciar arquitectura."]}}, {"name": "PIAZZA DELLA FRUTTA", "fonetica": "PIÁT-sa DÉL-la FRÚT-ta", "lat": 45.407538, "lng": 11.875616, "type": "visita", "meta": {"tiempo": "20-40 minutos"}, "sections": {"descripcion": ["Piazza della Frutta es la otra gran plaza de mercado de Padua, más estrecha y alargada, conectada con Piazza delle Erbe por pasajes bajo el Palazzo della Ragione."], "historia": ["Su especialización histórica en fruta y otros alimentos se refleja en el nombre."], "arquitectura": ["Pórticos, casas mercantiles y la enorme cubierta del Salone forman un espacio de fuerte carácter medieval."], "arte": ["Los pasajes cubiertos contienen antiguos comercios y aromas que prolongan la tradición del mercado."], "curiosidades": [], "consejos": ["Cuidado con horarios de montaje y limpieza de puestos. Excelente zona para una pausa gastronómica."]}}, {"name": "PIAZZA DEI SIGNORI", "fonetica": "PIÁT-sa dei si-ÑÓ-ri", "lat": 45.40768, "lng": 11.873467, "type": "visita", "meta": {"tiempo": "20-40 minutos"}, "sections": {"descripcion": ["La Piazza dei Signori de Padua fue el espacio ceremonial del poder carrarese y veneciano. La Torre dell’Orologio domina su perspectiva."], "historia": ["Se abrió frente al palacio de los Carraresi y fue escenario de celebraciones, torneos y actos públicos."], "arquitectura": ["La torre, la Loggia della Gran Guardia y fachadas porticadas crean una plaza más regular que las de mercado."], "arte": ["La columna de san Marcos fue destruida con la caída de Venecia y reconstruida posteriormente."], "curiosidades": [], "consejos": ["Mejor al final de la tarde, cuando se vacía el mercado y se ilumina la torre."]}}, {"name": "TORRE DELL’OROLOGIO", "fonetica": "TÓR-re del-lo-RÓ-lo-yo", "lat": 45.407784, "lng": 11.872783, "type": "visita", "meta": {"tiempo": "15-30 minutos"}, "sections": {"descripcion": ["La Torre dell’Orologio alberga un reloj astronómico del siglo XV que muestra horas, fases lunares y signos zodiacales."], "historia": ["El mecanismo original fue diseñado por Jacopo Dondi en el siglo XIV; el reloj actual se reconstruyó en 1437 por Giovanni y Gian Pietro delle Caldiere."], "arquitectura": ["La esfera azul y dorada se integra en la torre de acceso al antiguo palacio. El arco inferior fue monumentalizado en época veneciana."], "arte": ["Falta el signo de Libra en la rueda zodiacal, explicado por cambios entre sistemas zodiacales o decisiones de reconstrucción."], "curiosidades": [], "consejos": ["Las visitas interiores son limitadas y con reserva; el exterior se aprecia mejor desde el centro de la plaza."]}}, {"name": "CHIESA DEGLI EREMITANI", "fonetica": "KIÉ-sa de-lli e-re-mi-TÁ-ni", "lat": 45.410642, "lng": 11.879313, "type": "visita", "meta": {"tiempo": "35-60 minutos"}, "sections": {"descripcion": ["La iglesia de los Eremitani es esencial para comprender la pintura paduana del siglo XIV y la tragedia de la destrucción bélica del patrimonio."], "historia": ["Fue construida desde el siglo XIII para los agustinos. El 11 de marzo de 1944 una bomba destruyó la capilla Ovetari y gran parte de los frescos de Mantegna."], "arquitectura": ["La amplia nave única, el techo de madera y las capillas góticas muestran austeridad mendicante. La reconstrucción de posguerra integró fragmentos recuperados."], "arte": ["En la capilla Ovetari sobreviven y se han recompuesto escenas de Mantegna, entre ellas el Martirio y traslado de san Cristóbal. La comparación entre originales, fragmentos y fotografías históricas es conmovedora."], "curiosidades": [], "consejos": ["Está junto a la Cappella degli Scrovegni. Entrada gratuita; evitar celebraciones y dedicar al menos media hora."]}}, {"name": "CAFFÈ PEDROCCHI", "fonetica": "caf-FÉ pe-DRÓK-ki", "lat": 45.407745, "lng": 11.877228, "type": "restaurante", "meta": {"tiempo": "30-60 minutos"}, "sections": {"descripcion": ["El Caffè Pedrocchi es un café histórico concebido como lugar de encuentro abierto día y noche, vinculado a estudiantes, políticos y viajeros."], "historia": ["Antonio Pedrocchi encargó a Giuseppe Jappelli el edificio, inaugurado en 1831. Durante el Risorgimento fue escenario de disturbios estudiantiles en 1848."], "arquitectura": ["La planta baja combina salas de distintos colores y referencias clásicas. El piano nobile reúne ambientes decorados en estilos egipcio, etrusco, griego y otros lenguajes historicistas."], "arte": ["La especialidad es el café Pedrocchi, servido con crema de menta y cacao y tradicionalmente sin remover."], "curiosidades": [], "consejos": ["Puede ser caro por su valor histórico. Entrar al menos a ver las salas; confirmar horario de la planta superior."]}}, {"name": "HOTEL GARIBALDI", "fonetica": "o-TÉL ga-ri-BÁL-di", "lat": 45.422068, "lng": 11.937691, "type": "alojamiento", "meta": {}, "sections": {"descripcion": ["El Hotel Garibaldi es un punto logístico para cerrar la jornada y acceder a Padua o al corredor hacia Venecia."], "historia": ["No se plantea como visita patrimonial. Su importancia está en organizar aparcamiento, equipaje, descanso y hora de salida."], "arquitectura": ["La información útil es la confirmación de reserva, recepción, aparcamiento, restricciones de acceso y desayuno."], "arte": ["Conviene guardar el teléfono y las instrucciones de llegada fuera de línea."], "curiosidades": [], "consejos": ["Verificar la dirección exacta, ya que existen alojamientos con nombres semejantes, y confirmar si el aparcamiento está incluido."]}}, {"name": "PALAZZO TETTA", "fonetica": "pa-LÁT-so TÉT-ta", "lat": 45.4383156, "lng": 12.3423357, "type": "visita", "meta": {"tiempo": "10-15 minutos"}, "sections": {"descripcion": ["Palazzo Tetta es una referencia veneciana situada junto a un canal, conocida por su relación visual con el singular Ponte Chiodo."], "historia": ["El edificio forma parte del tejido residencial de Cannaregio, desarrollado entre canales secundarios y rutas locales."], "arquitectura": ["Su fachada acuática y la pequeña escala del entorno muestran una Venecia doméstica, alejada de los grandes palacios del Gran Canal."], "arte": ["El interés está en el conjunto con el puente y el canal, no en una visita interior."], "curiosidades": [], "consejos": ["Es propiedad privada. Fotografiar con respeto y no bloquear el estrecho paso."]}}, {"name": "PONTE CHIODO", "fonetica": "PÓN-te KIÓ-do", "lat": 45.4428453, "lng": 12.3347316, "type": "visita", "meta": {"tiempo": "5-10 minutos"}, "sections": {"descripcion": ["Ponte Chiodo es uno de los últimos puentes venecianos sin parapetos, junto con el Ponte del Diavolo de Torcello."], "historia": ["Su nombre procede de la familia Chiodo, propietaria de edificios cercanos. Los puentes venecianos carecieron a menudo de barandillas hasta épocas relativamente recientes."], "arquitectura": ["Es un pequeño arco de piedra que conduce a una propiedad privada. La ausencia de protecciones permite imaginar la apariencia histórica de numerosos puentes."], "arte": ["No es un puente de paso público completo: el acceso termina en una entrada privada."], "curiosidades": [], "consejos": ["Acercarse con cuidado, especialmente con lluvia. No invadir la propiedad ni permanecer bloqueando el acceso."]}}]}, {"name": "Días 6-8 · Venecia", "color": "#0288D1", "points": [{"name": "TEATRO LA FENICE", "fonetica": "te-Á-tro la FÉ-ni-che", "lat": 45.433638, "lng": 12.333758, "type": "visita", "meta": {"tiempo": "45-60 minutos"}, "sections": {"descripcion": ["La Fenice no es únicamente el teatro de ópera más célebre de Venecia: es también una síntesis de la relación de la ciudad con el espectáculo, la representación social y la capacidad de renacer después de la destrucción. La visita permite acceder al foyer, la sala, el palco real y las Sale Apollinee, espacios que explican cómo la ópera funcionaba al mismo tiempo como arte, ceremonia pública y lugar de encuentro de las élites."], "historia": ["El teatro abrió en 1792, promovido por la aristocrática Nobile Società di Palchettisti después de perder el antiguo Teatro San Benedetto. Su nombre, “La Fenice”, resultó profético: sufrió un incendio en 1836 y otro, devastador, en 1996. La reconstrucción posterior siguió el principio “com’era, dov’era”, como era y donde estaba, y el teatro reabrió en 2003. En su escenario se estrenaron obras decisivas de Rossini, Bellini, Donizetti y Verdi, entre ellas Rigoletto y La traviata."], "arquitectura": ["La fachada neoclásica es relativamente discreta porque el edificio se inserta en una trama urbana estrecha y se relacionaba históricamente con el acceso por agua. El interior responde al modelo de teatro italiano de palcos superpuestos en forma de herradura. La ornamentación dorada, los estucos, las columnas fingidas, los espejos y los terciopelos no son mero lujo: producen una arquitectura teatral en la que el público se observa a sí mismo tanto como contempla el escenario."], "arte": ["Conviene fijarse en la continuidad visual de los palcos, en el palco real —incorporado durante la etapa napoleónica—, en la decoración de la bóveda y en las Sale Apollinee. La reconstrucción recurrió a fotografías, moldes, técnicas artesanales y documentación histórica, pero también incorporó instalaciones escénicas y de seguridad contemporáneas. Esa coexistencia entre réplica histórica y maquinaria moderna forma parte de su interés."], "curiosidades": ["El teatro ha convertido sus incendios en parte central de su identidad. El de 1996 fue provocado y tuvo una enorme repercusión internacional. La expresión “como era y donde estaba”, usada también en la reconstrucción del Campanile de San Marcos, resume una forma veneciana de entender la continuidad monumental."], "consejos": ["La visita con audioguía dura unos 45 minutos, pero puede sufrir cambios o cierres parciales por ensayos y funciones. Conviene consultar el calendario del día exacto. La sala se disfruta mejor cuando se puede entrar sin prisas y mirar también hacia los palcos y el techo, no solo hacia el escenario."]}}, {"name": "CANNAREGIO", "fonetica": "can-na-RÉ-yo", "lat": 45.443997, "lng": 12.328568, "type": "visita", "meta": {"tiempo": "2-4 horas para un recorrido de barrio"}, "sections": {"descripcion": ["Cannaregio es uno de los seis sestieri de Venecia y ofrece una de las lecturas más completas de la ciudad: concentra la gran vía de entrada desde la estación, calles comerciales muy transitadas, canales residenciales silenciosos, iglesias, palacios, antiguos conventos y el área del gueto judío. Alejarse unas pocas calles de la Strada Nova permite descubrir una Venecia cotidiana, todavía habitada y menos escenográfica que San Marco."], "historia": ["El nombre suele relacionarse con el antiguo Canal Regio, la vía acuática que comunicaba la laguna septentrional con el corazón de la ciudad. Cannaregio creció sobre terrenos ganados al agua y se consolidó como zona residencial y productiva. En 1516 la República estableció aquí el primer gueto judío institucional de Europa, en el Ghetto Nuovo. La comunidad quedó sometida a restricciones y cierres nocturnos, pero desarrolló una vida cultural, religiosa y comercial extraordinariamente rica."], "arquitectura": ["El barrio muestra una Venecia de escalas muy distintas. La Strada Nova es un eje urbano relativamente amplio; en cambio, las fondamente de la Misericordia y de los Ormesini se abren hacia canales largos y rectos. En el gueto, la falta de espacio obligó a crecer en altura, de modo que algunos edificios presentan más plantas y techos más bajos que las viviendas venecianas habituales. Las sinagogas se reconocen con dificultad desde la calle porque se integraron en las plantas superiores de las casas."], "arte": ["Entre los lugares destacados se encuentran el Ghetto Nuovo, la iglesia de la Madonna dell’Orto, el Palazzo Mastelli, el Campo dei Mori, Santa Maria dei Miracoli en el límite con Castello, la iglesia de los Gesuiti y numerosos palacios sobre el Gran Canal, como Ca’ d’Oro. También merece atención la arquitectura doméstica: pozos, patios, pasadizos bajo edificios y antiguos almacenes con accesos al agua."], "curiosidades": ["La palabra “gueto” se difundió internacionalmente desde este lugar. Se suele relacionar con el verbo veneciano getar, fundir, porque en la zona existieron fundiciones. La pronunciación original evolucionó al ser adaptada por la comunidad asquenazí. Cannaregio fue también el barrio de Tintoretto, enterrado en Madonna dell’Orto."], "consejos": ["Conviene recorrerlo a primera hora o al atardecer, cuando disminuye el tránsito de la Strada Nova. Para una experiencia más pausada, seguir las fondamente hacia la Misericordia y los Ormesini y entrar en el Ghetto Nuovo con actitud respetuosa. No todos los espacios religiosos tienen apertura continua."]}}, {"name": "SCUOLA GRANDE DI SAN ROCCO", "fonetica": "SCUÓ-la GRÁN-de di san RÓC-co", "lat": 45.436655, "lng": 12.325475, "type": "visita", "meta": {"tiempo": "90-120 minutos"}, "sections": {"descripcion": ["La Scuola Grande di San Rocco es uno de los interiores artísticos más intensos de Venecia. En lugar de reunir obras procedentes de distintos lugares, conserva un programa concebido para el propio edificio: decenas de lienzos de Tintoretto transforman salas, paredes y techos en una narración continua. La experiencia se parece más a entrar en un universo pictórico completo que a visitar una galería."], "historia": ["La confraternidad nació en 1478 bajo la protección de san Roque, invocado contra la peste, y recibió el cuerpo del santo en 1485. Su riqueza aumentó con donaciones y con el prestigio de su función asistencial. El edificio principal se levantó durante el siglo XVI. Tintoretto obtuvo el encargo de decorar la Scuola mediante una audaz maniobra: presentó instalada gratuitamente una pintura para el techo de la Sala dell’Albergo, condicionando el concurso. Trabajó en el conjunto durante más de veinte años."], "arquitectura": ["La arquitectura combina una fachada renacentista de mármoles claros con interiores ceremoniales organizados en Sala Terrena, escalera monumental, Sala Capitolare y Sala dell’Albergo. La arquitectura sirve como marco para la pintura, pero también merece observarse por sí misma: columnas, pavimentos, carpinterías talladas, grandes ventanales y la suntuosa escalera articulan el ascenso desde el espacio asistencial inferior hasta las salas de gobierno."], "arte": ["Entre las obras esenciales están La Crucifixión de la Sala dell’Albergo, considerada una de las cumbres de Tintoretto; las escenas del Antiguo Testamento del techo de la Sala Capitolare; y los episodios de la vida de Cristo de las paredes. Los espejos disponibles ayudan a contemplar los techos sin forzar el cuello. También hay obras de Tiziano, Giorgione y Tiepolo, además de esculturas de madera de Francesco Pianta."], "curiosidades": ["La Scuola sigue siendo una institución activa y no un museo creado artificialmente. Su tesoro fue uno de los más ricos de Venecia, aunque se redujo enormemente tras la caída de la República. La acumulación de pinturas oscuras, luces diagonales y escorzos hizo que algunos viajeros la llamasen la “Capilla Sixtina de Venecia”, comparación útil por su densidad, aunque el lenguaje de Tintoretto es completamente distinto."], "consejos": ["Reservar al menos una hora y media. Es aconsejable empezar por las salas superiores y dedicar tiempo a La Crucifixión. La iluminación puede ser tenue; conviene permitir que la vista se adapte. No confundir la Scuola con la iglesia de San Rocco, situada al lado."]}}, {"name": "PALAZZO CONTARINI DEL BOVOLO", "fonetica": "pa-LÁT-so con-ta-RÍ-ni del BÓ-vo-lo", "lat": 45.434858, "lng": 12.334534, "type": "visita", "meta": {"tiempo": "35-50 minutos"}, "sections": {"descripcion": ["El Palazzo Contarini del Bovolo es célebre por su escalera helicoidal exterior, una de las imágenes más singulares del Renacimiento veneciano. Oculto en una pequeña corte, combina la sorpresa del descubrimiento con una subida panorámica que permite leer tejados, campanarios y cúpulas desde una altura intermedia, más íntima que la del Campanile de San Marcos."], "historia": ["El palacio perteneció a una rama de la familia Contarini. La torre de la escalera fue añadida a finales del siglo XV, probablemente por Giovanni Candi. El término bovolo significa caracol en veneciano y acabó incorporándose al nombre de la familia. El edificio tuvo usos residenciales y más tarde alojó actividades diversas, incluida una pensión vinculada al pintor Tintoretto en la tradición local."], "arquitectura": ["La escalera se desarrolla en una torre cilíndrica abierta mediante una sucesión de logias ascendentes. Los arcos de medio punto, las columnas y la alternancia de ladrillo y piedra combinan tradición gótica veneciana y lenguaje renacentista. La solución no es solo decorativa: convierte la circulación vertical en fachada y crea una perspectiva rítmica muy fotogénica."], "arte": ["Además de la escalera, la visita incluye normalmente el pequeño belvedere y espacios expositivos. Desde arriba se distinguen el Campanile, las cúpulas de San Marcos, el perfil de Santa Maria della Salute y la masa irregular de cubiertas venecianas. Conviene mirar también el aljibe y la configuración de la corte."], "curiosidades": ["El palacio aparece en la película Otelo de Orson Welles, que utilizó distintos lugares venecianos para construir un espacio cinematográfico imaginario. La torre demuestra que algunos de los rincones más conocidos de Venecia no se descubren desde los canales principales, sino entrando por callejones casi anónimos."], "consejos": ["La corte es pequeña y puede saturarse. Conviene reservar entrada y acudir pronto. La escalera exige subir numerosos peldaños y puede resultar incómoda con lluvia. Hay un punto duplicado en el KML; ambas referencias corresponden al mismo edificio."]}}, {"name": "FONDACO DEI TEDESCHI", "fonetica": "FÓN-da-co dei te-DÉS-qui", "lat": 45.438318, "lng": 12.336471, "type": "visita", "meta": {"tiempo": "20-45 minutos"}, "sections": {"descripcion": ["El Fondaco dei Tedeschi ocupa una posición estratégica junto al Puente de Rialto. Durante siglos fue almacén, residencia y centro de control de los comerciantes germánicos; hoy funciona como edificio comercial. Aunque su uso contemporáneo ha cambiado por completo, su escala y su patio permiten comprender la importancia internacional del mercado de Rialto."], "historia": ["Existía un fondaco en el lugar desde la Edad Media. Tras un incendio, el edificio actual se reconstruyó a comienzos del siglo XVI bajo supervisión de las autoridades venecianas. Los mercaderes del Sacro Imperio debían alojarse y comerciar aquí, lo que facilitaba el control fiscal. Giorgione y el joven Tiziano pintaron frescos en las fachadas, hoy casi desaparecidos y conservados parcialmente en museos."], "arquitectura": ["El edificio se organiza alrededor de un gran patio cuadrado con galerías superpuestas. Su exterior sobre el Gran Canal es severo y regular, adecuado a una institución comercial sometida a vigilancia. La restauración contemporánea introdujo circulaciones mecánicas, un nuevo espacio superior y una terraza, intervenciones debatidas por su impacto en un edificio histórico."], "arte": ["La cubierta fue durante años uno de los miradores gratuitos más demandados de Venecia, con vistas privilegiadas sobre Rialto y el Gran Canal. El acceso y la operativa del edificio han cambiado en varias ocasiones, por lo que no debe darse por segura la visita a la terraza. Incluso sin subir, merece la pena observar el patio y la fachada desde el puente."], "curiosidades": ["La palabra fondaco procede del árabe funduq, término relacionado con posada y almacén de mercaderes. Venecia adaptó instituciones mediterráneas para organizar comunidades comerciales extranjeras. El edificio recuerda que la ciudad fue una potencia mercantil antes que un destino turístico."], "consejos": ["Comprobar con antelación si el interior y la terraza están abiertos al público. La zona de Rialto está muy masificada entre media mañana y media tarde. El mejor punto exterior es el propio Puente de Rialto o la orilla opuesta del Gran Canal."]}}, {"name": "PALAZZO DUCALE", "fonetica": "pa-LÁT-so du-CÁ-le", "lat": 45.433704, "lng": 12.340389, "type": "visita", "meta": {"tiempo": "2-3 horas"}, "sections": {"descripcion": ["El Palacio Ducal es el edificio político esencial de Venecia. La visita no consiste solo en recorrer salones decorados, sino en seguir el funcionamiento de una república aristocrática: residencia del dogo, consejos de gobierno, tribunales, archivos, armería y prisiones estaban conectados dentro de un mismo organismo monumental."], "historia": ["La sede ducal se estableció en el área de San Marcos en la Alta Edad Media. El palacio actual se configuró principalmente entre los siglos XIV y XVI, con reconstrucciones tras incendios. Aquí gobernaron el dogo y los complejos consejos de la República hasta 1797. Tras la caída de Venecia bajo Napoleón, el edificio tuvo usos administrativos y finalmente se convirtió en museo."], "arquitectura": ["La arquitectura exterior invierte la lógica de un palacio fortificado: las masas superiores parecen apoyarse sobre dos niveles de arcadas ligeras. El mármol blanco y rosado forma patrones geométricos, mientras que los capiteles del pórtico desarrollan un programa de virtudes, oficios, vicios y alegorías. El patio combina gótico tardío y Renacimiento; la Scala dei Giganti marca el espacio ceremonial de coronación de los dogos."], "arte": ["En el interior destacan la Scala d’Oro, los apartamentos ducales, la Sala del Maggior Consiglio con El Paraíso de Tintoretto, la Sala del Collegio, las salas del Consejo de los Diez, la armería y el recorrido por las prisiones. El Puente de los Suspiros conecta los tribunales con las Prigioni Nuove. Conviene fijarse en cómo la magnificencia pictórica convive con espacios de control y castigo."], "curiosidades": ["La República cultivó una imagen de estabilidad institucional, pero el palacio revela un sistema complejo de vigilancia mutua. Las bocche di leone permitían depositar denuncias, aunque no todas eran anónimas ni aceptadas sin requisitos. El robo del cuerpo de san Marcos, representado en el programa decorativo, legitimaba simbólicamente el poder de la ciudad."], "consejos": ["Reservar al menos dos horas y comprar entrada anticipada. La visita de itinerarios secretos, cuando está disponible, requiere reserva independiente y accede a espacios como las celdas de Casanova. Primera hora o última franja reducen la saturación."]}}, {"name": "PIAZZA SAN MARCO", "fonetica": "PIÁT-sa san MÁR-co", "lat": 45.434167, "lng": 12.338472, "type": "visita", "meta": {"tiempo": "45-90 minutos"}, "sections": {"descripcion": ["Piazza San Marco es el gran espacio ceremonial de Venecia y el único que la tradición local denomina piazza; los demás son campi. Su forma actual no es el resultado de un único proyecto, sino de siglos de ampliaciones y ajustes que reunieron poder religioso, gobierno, justicia, comercio, representación diplomática y vida urbana."], "historia": ["El espacio nació junto a la primera iglesia de San Marcos y fue ampliado en el siglo XII al cubrirse un canal. La República lo convirtió en escenario de procesiones, fiestas, recepciones de embajadores y proclamaciones. Las Procuratie alojaban a los procuradores de San Marcos, una de las magistraturas más prestigiosas. Napoleón transformó el extremo occidental con el Ala Napoleonica."], "arquitectura": ["La plaza principal se abre entre las Procuratie Vecchie y Nuove y culmina en la Basílica. La Piazzetta se prolonga hacia la laguna entre el Palacio Ducal y la Biblioteca Marciana. Las dos columnas de san Marcos y san Teodoro funcionaban como puerta simbólica desde el agua. La irregularidad del conjunto queda disimulada por las largas fachadas porticadas y el pavimento continuo."], "arte": ["Hay que mirar la Torre dell’Orologio, las Procuratie, el Campanile, la Libreria Sansoviniana, las columnas de la Piazzetta y la relación entre Basílica y Palacio Ducal. El mejor modo de comprenderla es recorrerla en distintos sentidos y salir hacia el Molo, donde la arquitectura se abre a la laguna."], "curiosidades": ["Napoleón fue asociado a la frase “el salón más bello de Europa”, aunque la atribución exacta es discutida. La plaza se inunda durante episodios de acqua alta; el sistema MOSE ha reducido muchos eventos, pero no elimina por completo el fenómeno. Dar de comer a las palomas está prohibido."], "consejos": ["Visitarla al amanecer permite verla casi vacía. A media mañana y durante grandes eventos puede estar extremadamente concurrida. En junio de 2026 hay conciertos programados en la plaza, por lo que pueden existir montajes, controles y cierres parciales."]}}, {"name": "BASILICA DI SAN MARCO", "fonetica": "ba-SÍ-li-ca di san MÁR-co", "lat": 45.434561, "lng": 12.339712, "type": "visita", "meta": {"tiempo": "60-90 minutos"}, "sections": {"descripcion": ["La Basílica de San Marcos es el núcleo religioso y simbólico de Venecia. Su aspecto, muy distinto de las iglesias occidentales habituales, responde a la relación de la República con Bizancio y con el Mediterráneo oriental. Mármoles, mosaicos de oro, cúpulas, columnas y piezas antiguas fueron reunidos para construir una imagen de riqueza, legitimidad y protección sagrada."], "historia": ["La primera iglesia se levantó en el siglo IX para custodiar las reliquias de san Marcos, trasladadas desde Alejandría por mercaderes venecianos. Tras un incendio, el edificio actual comenzó en el siglo XI. Durante siglos funcionó como capilla del dogo, no como catedral, condición que adquirió en 1807. La decoración se amplió continuamente con botines, compras y encargos vinculados a la expansión veneciana."], "arquitectura": ["La planta de cruz griega con cinco cúpulas deriva de modelos bizantinos. Las fachadas incorporan arcos, mosaicos, mármoles policromos y esculturas de procedencias diversas. El interior está revestido por miles de metros cuadrados de mosaicos, cuya luz cambia con la hora. El pavimento de opus sectile se ondula por los movimientos del terreno y la cimentación."], "arte": ["Entre los elementos esenciales están la Pala d’Oro, extraordinario retablo de esmaltes y piedras preciosas; el Museo y la Loggia dei Cavalli; los caballos de bronce, cuyos originales se conservan dentro; el icono de la Nicopeia; y el mosaico de la cúpula de la Ascensión. Conviene mirar hacia arriba, pero también el suelo, los canceles, capiteles y piezas antiguas incrustadas."], "curiosidades": ["La leyenda cuenta que el cuerpo de san Marcos fue ocultado bajo carne de cerdo para evitar la inspección musulmana en Alejandría. La fachada incluye los Tetrarcas, escultura romana traída de Constantinopla; una parte faltante apareció en Estambul, confirmando su procedencia. Los caballos fueron llevados a París por Napoleón y devueltos después."], "consejos": ["Es imprescindible reservar franja. Se exige vestimenta adecuada y no se permiten mochilas voluminosas. Los domingos por la mañana la basílica se dedica al culto y la visita turística del templo comienza más tarde, aunque el museo puede abrir antes. La luz interior puede ser tenue y el recorrido, rápido en horas punta."]}}, {"name": "CAMPANILE DI SAN MARCO", "fonetica": "cam-pa-NÍ-le di san MÁR-co", "lat": 45.434036, "lng": 12.339033, "type": "visita", "meta": {"tiempo": "35-50 minutos"}, "sections": {"descripcion": ["El Campanile es el gran punto de orientación de Venecia y ofrece una vista excepcional porque se alza de forma aislada, sin edificios cercanos que obstaculicen el panorama. Desde la plataforma se distinguen la laguna, San Giorgio Maggiore, la Salute, el Lido y, en días claros, los Alpes."], "historia": ["La torre deriva de una estructura iniciada en la Edad Media, usada como campanario y referencia para la navegación. Su forma se consolidó en el Renacimiento. El 14 de julio de 1902 se derrumbó casi por completo sin causar víctimas, después de que las grietas permitieran evacuar el entorno. Fue reconstruida “com’era, dov’era” y reabierta en 1912."], "arquitectura": ["La torre de ladrillo se eleva sobre una base cuadrada y culmina en una cámara de campanas de piedra, una aguja piramidal y la figura dorada del arcángel Gabriel. En la base, la Loggetta de Sansovino funciona como una delicada pantalla de mármoles y esculturas que contrasta con la masa vertical."], "arte": ["La subida se realiza en ascensor. Las campanas tenían funciones distintas: convocar al Senado, anunciar ejecuciones, marcar jornadas laborales o reuniones políticas. La vista permite entender mejor la forma insular de Venecia y el papel del Bacino di San Marco como entrada ceremonial."], "curiosidades": ["Galileo mostró aquí su telescopio a las autoridades venecianas en 1609. Durante el derrumbe de 1902 murió el gato del guardián, recordado a menudo como la única víctima. La reconstrucción se convirtió en símbolo de la capacidad de la ciudad para preservar su imagen histórica."], "consejos": ["Comprar entrada con horario. La plataforma puede ser ventosa y el sonido de las campanas muy intenso si coinciden con la visita. La visibilidad suele ser mejor por la mañana después de lluvia o viento."]}}, {"name": "BASILICA DI SAN GIORGIO MAGGIORE", "fonetica": "ba-SÍ-li-ca di san YÓR-yo may-YÓ-re", "lat": 45.429419, "lng": 12.343204, "type": "visita", "meta": {"tiempo": "60-90 minutos"}, "sections": {"descripcion": ["San Giorgio Maggiore ocupa una isla frente al Palacio Ducal y forma parte inseparable de la imagen de la Piazzetta. Cruzar el canal permite contemplar San Marco desde el lado contrario y entrar en una iglesia de Palladio donde la claridad, las proporciones y la luz ofrecen un descanso frente a la densidad ornamental de la basílica marciana."], "historia": ["La isla estuvo vinculada a una comunidad benedictina desde el siglo X. Andrea Palladio proyectó la iglesia en el siglo XVI; tras su muerte, la fachada fue completada por Vincenzo Scamozzi. El monasterio desempeñó un papel cultural y religioso importante y fue transformado tras las supresiones napoleónicas. Hoy parte del conjunto pertenece a la Fondazione Giorgio Cini."], "arquitectura": ["Palladio resolvió la fachada superponiendo dos frentes de templo clásico para expresar exteriormente la nave central alta y las laterales bajas. El interior, blanco y luminoso, utiliza grandes órdenes, arcos y bóvedas para crear una monumentalidad serena. El campanile actual es posterior y ofrece una de las mejores vistas de Venecia."], "arte": ["En el presbiterio se conservan La última cena y La caída del maná de Tintoretto. El coro de madera y el altar mayor merecen una observación lenta. Desde el campanile se obtiene la vista frontal más completa del Palacio Ducal, la Piazzetta y el perfil de San Marco."], "curiosidades": ["La fachada actúa casi como un decorado urbano diseñado para ser contemplado desde la orilla opuesta. Monet pintó repetidamente San Giorgio al final de su vida, fascinado por la variación de la luz sobre la iglesia y la laguna."], "consejos": ["Llegar en vaporetto. La iglesia suele ser más tranquila que San Marco. Subir al campanile si el tiempo está despejado; el punto de vista es distinto y, para muchos viajeros, superior al del Campanile de San Marcos."]}}, {"name": "BASILICA DI SANTA MARIA DELLA SALUTE", "fonetica": "ba-SÍ-li-ca di SÁN-ta ma-RÍ-a DÉL-la sa-LÚ-te", "lat": 45.430675, "lng": 12.334763, "type": "visita", "meta": {"tiempo": "45-75 minutos"}, "sections": {"descripcion": ["Santa Maria della Salute ocupa la entrada del Gran Canal y es uno de los grandes hitos visuales de Venecia. Su planta centralizada y su enorme cúpula fueron concebidas para ser vistas desde el agua. El interior, más sobrio que el exterior, funciona como un espacio votivo relacionado con la memoria de la peste."], "historia": ["La iglesia fue prometida por la República en 1630 durante una grave epidemia. El joven Baldassare Longhena ganó el concurso y dedicó décadas a la obra, consagrada en 1687. Cada 21 de noviembre, la Festa della Salute recuerda el final de la peste mediante un puente temporal de barcas y una peregrinación popular."], "arquitectura": ["Longhena diseñó una planta octogonal rodeada por capillas, con una gran cúpula apoyada sobre un tambor. Volutas gigantes, estatuas y contrafuertes convierten la estructura en una composición escultórica. La cimentación requirió una enorme cantidad de pilotes de madera. La sacristía conserva una importante colección pictórica."], "arte": ["Destacan las Bodas de Caná de Tintoretto y varias obras de Tiziano, entre ellas pinturas del techo. El altar mayor, con una escultura de la Virgen expulsando la peste, concentra el significado votivo. Desde las escalinatas se obtiene una vista excelente del Bacino y del Palacio Ducal."], "curiosidades": ["El nombre Salute alude tanto a la salud física como a la salvación. La iglesia es uno de los mejores ejemplos de cómo Venecia convirtió una catástrofe sanitaria en arquitectura pública y ritual colectivo."], "consejos": ["Combinar la visita con Punta della Dogana y el Puente de la Academia. La luz de última hora realza la piedra exterior. Durante oficios religiosos debe mantenerse silencio y pueden limitarse las visitas."]}}, {"name": "PONTE DELL’ACCADEMIA", "fonetica": "PÓN-te del-lac-ca-DÉ-mia", "lat": 45.431669, "lng": 12.328917, "type": "visita", "meta": {"tiempo": "15-30 minutos"}, "sections": {"descripcion": ["El Puente de la Academia cruza el Gran Canal en uno de sus puntos más fotogénicos. La vista hacia Santa Maria della Salute resume la imagen monumental de Venecia: palacios, embarcaciones, postes, cúpulas y la curva del canal se superponen en una perspectiva abierta."], "historia": ["El primer puente de hierro se inauguró en el siglo XIX, cuando se buscaban nuevas conexiones peatonales. La estructura actual deriva de un puente provisional de madera construido en 1933 por Eugenio Miozzi, tan apreciado que se mantuvo y fue reconstruido posteriormente."], "arquitectura": ["Es un gran arco de madera con apoyos metálicos y escalinatas pronunciadas. Su aspecto contrasta con los puentes de piedra de Rialto y degli Scalzi. La ligereza del arco permite salvar el canal con una silueta discreta."], "arte": ["La vista más conocida se orienta hacia la Salute. En sentido contrario se aprecia la secuencia de palacios hacia Ca’ Rezzonico. También es un buen lugar para observar el tráfico acuático y comprender que el Gran Canal funciona como avenida principal."], "curiosidades": ["Durante años se acumularon candados amorosos, retirados por dañar la estructura y obstaculizar el mantenimiento. El puente ha requerido diversas intervenciones por el desgaste de la madera y la intensidad de uso."], "consejos": ["Acudir temprano o al atardecer. Las escaleras dificultan el paso con equipaje y movilidad reducida. No detenerse en grupos grandes en el centro, porque es una conexión peatonal muy transitada."]}}, {"name": "CANAL GRANDE", "fonetica": "ca-NÁL GRÁN-de", "lat": 45.436357, "lng": 12.332249, "type": "visita", "meta": {"tiempo": "45-75 minutos para un recorrido amplio"}, "sections": {"descripcion": ["El Gran Canal es la principal vía urbana de Venecia. Recorrerlo en vaporetto no es un simple desplazamiento: permite leer siglos de arquitectura y comprender por qué las fachadas más representativas de los palacios miran al agua. Su trazado en forma de S atraviesa la ciudad desde la estación hasta el Bacino di San Marco."], "historia": ["El canal sigue probablemente un antiguo curso de agua de la laguna. A medida que Venecia se enriqueció, las familias patricias construyeron aquí sus residencias y almacenes. Cada fachada actuaba como tarjeta de presentación comercial y política. El canal concentró procesiones, regatas, entradas ceremoniales y tráfico de mercancías."], "arquitectura": ["Las fachadas muestran una secuencia extraordinaria de estilos: palacios véneto-bizantinos, góticos como Ca’ d’Oro, renacentistas como Palazzo Corner Spinelli, barrocos como Ca’ Pesaro y construcciones posteriores. Muchos edificios presentan un portego central que conectaba la entrada de agua con los espacios interiores."], "arte": ["Entre los hitos destacan Rialto, Ca’ d’Oro, Ca’ Pesaro, Ca’ Rezzonico, Palazzo Grassi, la Accademia, la Salute y Punta della Dogana. La línea 1 de vaporetto es la más adecuada para observarlos porque realiza numerosas paradas y avanza con menor velocidad."], "curiosidades": ["Solo cuatro puentes peatonales cruzan el Gran Canal. Los traghetti de góndola mantienen pasos tradicionales en otros puntos. Durante la Regata Storica, el canal recupera su papel de escenario ceremonial con embarcaciones históricas."], "consejos": ["Hacer al menos un recorrido completo en la línea 1, preferiblemente sentado junto a una ventana abierta o en cubierta. Evitar horas punta con equipaje. Repetir el trayecto al atardecer ofrece una lectura completamente distinta."]}}, {"name": "PONTE DI RIALTO", "fonetica": "PÓN-te di ri-ÁL-to", "lat": 45.437984, "lng": 12.335898, "type": "visita", "meta": {"tiempo": "20-40 minutos"}, "sections": {"descripcion": ["Rialto es el puente histórico más importante sobre el Gran Canal y uno de los puntos donde mejor se percibe la relación entre circulación, comercio y arquitectura. No fue concebido solo como paso: sus tiendas lo convierten en una pequeña calle elevada."], "historia": ["Durante siglos existió aquí un puente de madera, reconstruido varias veces tras incendios y derrumbes. El puente de piedra actual fue diseñado por Antonio da Ponte y terminado en 1591. Su construcción generó dudas por la audacia de un único arco de gran luz, pero la estructura ha resistido durante siglos."], "arquitectura": ["El puente se apoya sobre miles de pilotes de madera y presenta un arco rebajado flanqueado por escalinatas. Dos hileras de tiendas crean tres recorridos longitudinales: uno central y dos exteriores abiertos al canal. Los relieves de la Anunciación enmarcan el punto superior."], "arte": ["Desde las balaustradas se observan el Fondaco dei Tedeschi, los embarcaderos, los palacios y el intenso tráfico del canal. En la orilla de San Polo se extiende el mercado de Rialto, núcleo comercial de la ciudad desde la Edad Media."], "curiosidades": ["Proyectos de arquitectos como Palladio y Miguel Ángel fueron considerados o asociados al concurso, aunque el diseño construido fue el de Antonio da Ponte. El puente fue durante mucho tiempo el único cruce fijo del Gran Canal."], "consejos": ["Para fotografiarlo sin aglomeraciones, llegar antes de las 8:00. Las mejores vistas del propio puente se obtienen desde Riva del Vin, Riva del Ferro o desde un vaporetto. Cuidado con carteristas en horas punta."]}}, {"name": "BASILICA DEI SANTI GIOVANNI E PAOLO", "fonetica": "ba-SÍ-li-ca dei SÁN-ti yo-VÁN-ni e PÁ-o-lo", "lat": 45.439379, "lng": 12.341713, "type": "visita", "meta": {"tiempo": "60-90 minutos"}, "sections": {"descripcion": ["La basílica de Santi Giovanni e Paolo, conocida en veneciano como San Zanipolo, es uno de los grandes espacios góticos de la ciudad y el principal panteón de los dogos. Su escala, su desnudez estructural y la acumulación de monumentos funerarios ofrecen una imagen del poder aristocrático distinta de la magnificencia dorada de San Marcos."], "historia": ["Los dominicos se establecieron en el lugar en el siglo XIII. La iglesia actual se construyó principalmente entre los siglos XIV y XV. La República la utilizó para funerales de Estado y enterramientos de dogos y capitanes. Un incendio en 1867 destruyó importantes obras, incluida una célebre pintura de Tiziano."], "arquitectura": ["El edificio responde al gótico de ladrillo veneciano: gran nave central, laterales, crucero marcado y capillas. La fachada es severa y queda parcialmente condicionada por el campo. En el interior, las enormes dimensiones permiten albergar monumentos funerarios renacentistas y barrocos sin perder claridad espacial."], "arte": ["Destacan los monumentos de Pietro Mocenigo, Andrea Vendramin y otros dogos; la capilla del Rosario; el políptico de san Vicente Ferrer de Giovanni Bellini; y numerosas esculturas. En el exterior, la estatua ecuestre de Bartolomeo Colleoni, modelada por Verrocchio, es una obra fundamental del Renacimiento."], "curiosidades": ["La tradición afirma que el terreno fue donado a los dominicos después de que el dogo Jacopo Tiepolo soñara con palomas blancas y ángeles. La concentración de tumbas hace que se la compare con la abadía de Westminster, aunque su carácter es específicamente republicano y veneciano."], "consejos": ["Reservar al menos una hora. El campo permite observar la fachada, la Scuola Grande di San Marco y el monumento a Colleoni como un conjunto urbano. El horario puede variar por cultos."]}}, {"name": "PRIGIONI NUOVE", "fonetica": "pri-YÓ-ni NUÓ-ve", "lat": 45.433739, "lng": 12.341306, "type": "visita", "meta": {"tiempo": "Incluido en el recorrido del Palacio Ducal"}, "sections": {"descripcion": ["Las Prigioni Nuove completan la lectura del Palacio Ducal al mostrar cómo la justicia veneciana se extendió fuera del antiguo edificio de gobierno. Su fachada ordenada junto al canal contrasta con la función carcelaria del interior."], "historia": ["El aumento de la actividad judicial llevó a construir una prisión independiente entre finales del siglo XVI y comienzos del XVII. Antonio da Ponte inició el proyecto y Antonio Contin lo continuó. El edificio quedó conectado al Palacio Ducal por el Puente de los Suspiros."], "arquitectura": ["La arquitectura adopta un lenguaje clásico severo, con piedra de Istria, ventanas regulares y un patio interior. A diferencia de las húmedas celdas antiguas de los pozzi, las nuevas prisiones buscaban una organización más racional, aunque las condiciones seguían siendo duras."], "arte": ["El recorrido habitual del Palacio Ducal atraviesa algunas celdas y el Puente de los Suspiros. Visitas específicas o actividades culturales pueden permitir conocer otras zonas. Los grafitos de prisioneros constituyen un documento directo de la vida carcelaria."], "curiosidades": ["Casanova estuvo preso en los piombi, situados en el Palacio Ducal, no en las Prigioni Nuove, aunque su historia se asocia a todo el complejo. El nombre del Puente de los Suspiros fue popularizado por la literatura romántica y no parece proceder de una denominación antigua de los presos."], "consejos": ["La forma más segura de visitarlas es mediante el itinerario del Palacio Ducal o una visita autorizada. Desde el Ponte della Paglia se observa la conexión exterior."]}}, {"name": "CHIESA DELLA PIETÀ", "fonetica": "KIÉ-sa DÉL-la pie-TÁ", "lat": 45.434061, "lng": 12.344937, "type": "visita", "meta": {"tiempo": "30-50 minutos"}, "sections": {"descripcion": ["La iglesia de la Pietà, conocida también como Santa Maria della Visitazione o iglesia de Vivaldi, está vinculada al Ospedale della Pietà, institución que acogía niñas abandonadas y desarrolló una formación musical de enorme prestigio. El edificio permite conectar la arquitectura religiosa con la historia social y musical de Venecia."], "historia": ["El Ospedale existía desde la Edad Media. Antonio Vivaldi trabajó allí como maestro de violín y compositor durante buena parte de su carrera, escribiendo obras para las jóvenes intérpretes. La iglesia actual se construyó en el siglo XVIII según proyecto de Giorgio Massari y fue consagrada en 1760, después de la etapa principal de Vivaldi."], "arquitectura": ["La fachada clásica, terminada posteriormente, se orienta hacia la Riva degli Schiavoni. El interior de nave única adopta una forma ovalada y se organiza para favorecer la música y la visibilidad. Las tribunas recuerdan la presencia de las intérpretes, que tocaban parcialmente ocultas al público."], "arte": ["El techo conserva El triunfo de la Fe de Giambattista Tiepolo. La combinación de pintura, acústica y tribunas convierte el espacio en un documento de la cultura musical veneciana. Los conciertos actuales aprovechan esta asociación histórica."], "curiosidades": ["Las jóvenes del Ospedale alcanzaron fama internacional y atraían a viajeros europeos, aunque muchas permanecían detrás de celosías. Vivaldi no fue párroco de la iglesia: trabajó para la institución como sacerdote, profesor y compositor."], "consejos": ["Comprobar si la entrada cultural está disponible o si coincide con un concierto. Desde la Riva se entiende mejor su relación con el antiguo complejo asistencial."]}}, {"name": "SCUOLA DI SAN GIORGIO DEGLI SCHIAVONI", "fonetica": "SCUÓ-la di san YÓR
