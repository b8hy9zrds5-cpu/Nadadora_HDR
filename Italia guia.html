XVIII empezó a desarrollar un lenguaje luminoso y escenográfico que tendría difusión europea."], "curiosidades": ["La iglesia pertenece al circuito Chorus y tiene horarios reducidos en algunos periodos. Debe comprobarse la apertura antes de cruzar la ciudad expresamente. El mejor punto exterior es la orilla opuesta del Gran Canal o un vaporetto, desde donde se aprecia la fachada en relación con el agua."], "consejos": []}}, {"name": "RIVA DE L’OGIO", "fonetica": "RÍ-va de LÓ-yo", "lat": 45.4401508, "lng": 12.3334188, "type": "visita", "meta": {}, "sections": {"descripcion": [], "historia": ["La riva permite leer la logística histórica del mercado. Los productos llegaban por agua, se descargaban directamente en los muelles y se distribuían a puestos, almacenes y tiendas. La relación entre fachada, puerta de agua y espacio de venta es una de las claves para comprender el urbanismo veneciano."], "arquitectura": ["A primera hora hay más actividad comercial; después del cierre del mercado el lugar cambia de carácter y se convierte en zona de paseo. Conviene no obstaculizar cargas, carretillas ni accesos. Desde el borde se obtienen buenas vistas del Gran Canal y del movimiento de embarcaciones, pero hay que extremar la atención porque muchos tramos carecen de barandilla."], "arte": [], "curiosidades": [], "consejos": []}}, {"name": "CAMPO DELLA PESCARIA", "fonetica": "CÁM-po DÉL-la pes-ca-RÍ-a", "lat": 45.4395556, "lng": 12.3345723, "type": "visita", "meta": {"horario": "Actividad principalmente matinal. Los días de apertura dependen del mercado y de cada puesto; conviene acudir antes del mediodía.", "precio": "Acceso gratuito."}, "sections": {"descripcion": [], "historia": ["Rialto fue el principal centro mercantil de la República. Tras el gran incendio de 1514, la zona se reconstruyó y reorganizó. El edificio actual de la Pescheria es mucho más reciente: fue proyectado a comienzos del siglo XX por Domenico Rupolo y Cesare Laurenti en un estilo neogótico deliberadamente acorde con la imagen histórica de la ciudad."], "arquitectura": ["Las columnas, capiteles y arcos del mercado incorporan motivos marinos. Conviene observar los relieves de peces y criaturas acuáticas, así como la manera en que el edificio se abre hacia el canal para facilitar descarga, ventilación y limpieza. La arquitectura no imita un palacio, sino que ennoblece una infraestructura comercial."], "arte": ["La mejor hora es temprano por la mañana, cuando los puestos están activos. Los domingos y lunes la actividad puede ser menor o inexistente según el sector. Debe evitarse tocar productos, bloquear compradores o convertir el mercado en decorado fotográfico. Después del cierre, la zona pierde buena parte de su sentido."], "curiosidades": [], "consejos": []}}, {"name": "FERMATA SAN STAE", "fonetica": "fer-MÁ-ta san STÁ-e", "lat": 45.441746, "lng": 12.330798, "type": "ferry", "meta": {"horario": "Según horarios oficiales de ACTV o Alilaguna.", "precio": "Según billete sencillo, abono o servicio aeroportuario."}, "sections": {"descripcion": [], "historia": ["El embarcadero puede recibir servicios distintos según temporada y obras. No todas las líneas ACTV ni Alilaguna se detienen en cada sentido. En Venecia es importante leer el panel del embarcadero y comprobar destino final, no solo el número o color de la línea."], "arquitectura": ["Para llegar a un alojamiento conviene guardar el itinerario a pie desde la parada, ya que puentes y callejones pueden complicar el transporte de maletas. Los billetes deben validarse antes de embarcar. En caso de marea alta, algunas rutas peatonales cercanas pueden requerir pasarelas o alternativas."], "arte": [], "curiosidades": [], "consejos": []}}, {"name": "FERMATA RIALTO MERCATO", "fonetica": "fer-MÁ-ta ri-ÁL-to mer-CÁ-to", "lat": 45.43936, "lng": 12.335224, "type": "ferry", "meta": {"horario": "Según horarios ACTV.", "precio": "Según billete o abono vigente."}, "sections": {"descripcion": [], "historia": ["La parada no debe confundirse con Rialto, situada en la orilla opuesta y atendida por más líneas. Dependiendo del trayecto, bajar en una u otra puede ahorrar puentes y escaleras. Antes de embarcar conviene confirmar que la línea se detiene en Rialto Mercato y en qué sentido circula."], "arquitectura": ["La zona es muy activa por la mañana y puede resultar incómoda con maletas durante el horario de mercado. Los billetes deben validarse y mantenerse hasta la salida. Si se viaja con equipaje voluminoso, es aconsejable evitar horas punta."], "arte": [], "curiosidades": [], "consejos": []}}, {"name": "CHIESA DI SAN MOISÈ", "fonetica": "KIÉ-sa di san moi-SÉ", "lat": 45.4331461, "lng": 12.3359212, "type": "visita", "meta": {"horario": "Horario parroquial variable y sujeto al culto.", "precio": "Entrada normalmente gratuita; donativo voluntario."}, "sections": {"descripcion": [], "historia": ["El templo tiene orígenes medievales, pero fue reconstruido en varias fases. La fachada actual se levantó en la segunda mitad del siglo XVII gracias al patrocinio de Vincenzo Fini y de su familia. El proyecto se vincula a Alessandro Tremignon, y la escultura a Heinrich Meyring y otros talleres. La fachada funciona casi como monumento genealógico, con retratos y referencias a los donantes."], "arquitectura": ["La composición utiliza columnas, nichos, frontones partidos, guirnaldas y figuras para crear una superficie de fuerte claroscuro. En el interior destaca el monumental altar mayor, con Moisés recibiendo las Tablas de la Ley, una escenografía pétrea de gran teatralidad. También se conservan pinturas de Tintoretto, Palma il Giovane y otros autores."], "arte": ["Conviene observar la fachada desde el extremo opuesto del campo para entender su estructura completa. Después, acercarse para identificar retratos y detalles que desde lejos se confunden en una masa decorativa. La iglesia puede cerrar durante celebraciones o fuera de horarios parroquiales, por lo que no debe darse por segura la visita interior."], "curiosidades": [], "consejos": []}}, {"name": "HOTEL DANIELI", "fonetica": "o-TÉL da-ni-É-li", "lat": 45.4339662, "lng": 12.3420905, "type": "alojamiento", "meta": {}, "sections": {"descripcion": [], "historia": ["El núcleo principal ocupa el Palazzo Dandolo, construido en el siglo XIV para una rama de la poderosa familia Dandolo. En el siglo XIX Giuseppe Dal Niel, conocido como Danieli, transformó el palacio en hotel. Con el tiempo se incorporaron edificios contiguos, creando un complejo de diferentes épocas. Viajeros aristocráticos, escritores, músicos, actores y figuras políticas se alojaron aquí."], "arquitectura": ["El gran patio cubierto, las escaleras, los balcones de arcos y la decoración neogótica construyen una atmósfera palaciega. Parte de esa imagen corresponde a restauraciones y reinterpretaciones realizadas para el uso hotelero, de modo que no todo debe leerse como un interior medieval intacto. El valor está también en la historia de cómo Venecia convirtió sus palacios en escenarios de hospitalidad."], "arte": ["El acceso a zonas comunes puede depender de la política del hotel y de la ocupación. Lo más respetuoso es entrar con una reserva de restaurante, bar o alojamiento. La fachada se aprecia bien desde la riva y desde el agua. El hotel ha aparecido en películas y forma parte del imaginario de la Venecia elegante y literaria."], "curiosidades": [], "consejos": []}}, {"name": "GALLERIE DELL’ACCADEMIA", "fonetica": "gal-le-RÍ-e del-la-ca-DÉ-mia", "lat": 45.4310784, "lng": 12.3281394, "type": "visita", "meta": {"horario": "Martes a domingo, aproximadamente de 9:00 a 19:00; última entrada alrededor de las 18:00. Lunes cerrado. Confirmar ajustes oficiales.", "precio": "Entrada general de pago; desde mayo de 2026 puede existir suplemento por exposición temporal. Menores de 18 años gratuitos y reducciones reglamentarias."}, "sections": {"descripcion": [], "historia": ["La institución nació a comienzos del siglo XIX en el contexto de las reformas napoleónicas. ño, con madera y vistas al canal, por lo que la reserva es especialmente importante."], "arquitectura": ["Es una comida o cena completa, no una parada de cicchetti. Conviene revisar la carta si se busca una opción totalmente vegetariana o vegana, ya que algunos platos pueden contener carne, queso o caldo."], "arte": [], "curiosidades": [], "consejos": []}}, {"name": "ANTICO FORNO", "fonetica": "an-TÍ-co FÓR-no", "lat": 45.438174, "lng": 12.3335526, "type": "restaurante", "meta": {}, "sections": {"descripcion": [], "historia": ["El horno y la venta por porciones responden a una necesidad práctica en una zona de tránsito intenso. No es una experiencia monumental, sino una opción funcional para mantener el ritmo del itinerario."], "arquitectura": ["Puede haber cola y poco espacio para sentarse. Conviene consumir sin bloquear la calle y comprobar ingredientes si existen alergias. Resulta útil antes o después de cruzar Rialto."], "arte": [], "curiosidades": [], "consejos": []}}, {"name": "SALVMERIA", "fonetica": "sal-vme-RÍ-a", "lat": 45.4322861, "lng": 12.3524985, "type": "visita", "meta": {}, "sections": {"descripcion": [], "historia": ["Su interés es gastronómico y práctico más que histórico. Permite probar productos regionales sin sentarse en un restaurante y puede adaptarse bien a jornadas con muchas visitas."], "arquitectura": ["Conviene pedir recomendaciones, comprobar el tamaño de las porciones y evitar transportar alimentos durante demasiado tiempo con calor. Si el local está lleno, la compra para llevar reduce la espera."], "arte": [], "curiosidades": [], "consejos": []}}, {"name": "BAR ALLA TOLETTA", "fonetica": "bar ÁL-la to-LÉT-ta", "lat": 45.4317234, "lng": 12.3263584, "type": "restaurante", "meta": {}, "sections": {"descripcion": [], "historia": ["Los tramezzini se popularizaron en el norte de Italia durante el siglo XX. Su pan blando y su gran variedad de rellenos los convierten en comida de barra, desayuno tardío o tentempié. Alla Toletta mantiene una of /* ── CONSTANTES ── */
const TYPE_ICONS_PH = {
  visita:'ph-buildings',restaurante:'ph-fork-knife',alojamiento:'ph-bed',
  transporte:'ph-car',logistica:'ph-airplane',ferry:'ph-boat',
  parking:'ph-parking-sign',airbnb:'ph-house'
};
const TYPE_LABELS = {
  visita:'Visita',restaurante:'Restaurante / Bar',alojamiento:'Alojamiento',
  transporte:'Transporte',logistica:'Logística',ferry:'Ferry',
  parking:'Aparcamiento',airbnb:'Alojamiento'
};
const DAY_LABELS = ['Día 1 · Bérgamo','Día 2 · Como','Día 3 · Iseo+Brescia',
  'Día 4 · Garda+Verona','Día 5 · Padua','Días 6-8 · Venecia','Día 9 · Vuelta'];
const DAY_DATES  = ['Sáb 20','Dom 21','Lun 22','Mar 23','Mié 24','Jue–Sáb 25–27','Dom 28'];

// Config de cada bloque narrativo
const SEC_CONFIG = {
  descripcion:  {label:'Descripción',   icon:'ph-text-align-left'},
  historia:     {label:'Historia',      icon:'ph-clock-counter-clockwise'},
  arquitectura: {label:'Arquitectura',  icon:'ph-buildings'},
  arte:         {label:'Arte',          icon:'ph-paint-brush'},
  curiosidades: {label:'Curiosidades',  icon:'ph-sparkle'},
  consejos:     {label:'Consejos prácticos', icon:'ph-lightbulb'},
};
const SEC_ORDER = ['descripcion','historia','arquitectura','arte','curiosidades','consejos'];

const MARKER_SIZE    = {visita:14,restaurante:18,alojamiento:18,transporte:16,logistica:18,ferry:18,parking:16,airbnb:18};
const MARKER_ICON_SZ = {visita:7, restaurante:10,alojamiento:10,transporte:9, logistica:10,ferry:10,parking:9, airbnb:10};

/* ── ESTADO ── */
let map, markers=[], userMarker, accuracyCircle, watchId;
let activeDay='all', searchQ='', currentDetail=null, sheetOpen=false;

const audio = {
  sections:[],   // [{key, label, text}]
  idx:-1,
  playing:false,
  utterance:null,
  rate:0.92,
};

/* ── MAPA ── */
function makeMapMarker(color,type){
  const s=MARKER_SIZE[type]||14, is=MARKER_ICON_SZ[type]||7, ph=TYPE_ICONS_PH[type]||'ph-map-pin';
  return L.divIcon({
    className:'',
    html:`<div class="map-marker" style="width:${s}px;height:${s}px;background:${color}"><i class="ph ${ph}" style="font-size:${is}px"></i></div>`,
    iconSize:[s,s],iconAnchor:[s/2,s/2]
  });
}

function initMap(){
  map=L.map('map',{zoomControl:false}).setView([45.5,10.5],8);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);
  L.control.zoom({position:'bottomright'}).addTo(map);

  const bar=document.getElementById('day-bar');
  DAYS.forEach((day,i)=>{
    const btn=document.createElement('button');
    btn.className='day-pill'; btn.dataset.day=i;
    btn.innerHTML=`<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${day.color};flex-shrink:0"></span>${DAY_DATES[i]}`;
    btn.onclick=()=>filterDay(i,btn);
    bar.appendChild(btn);
  });

  DAYS.forEach((day,di)=>{
    day.points.forEach((pt,pi)=>{
      const hasContent=SEC_ORDER.some(k=>pt.sections[k]&&pt.sections[k].length);
      const icon=makeMapMarker(day.color,pt.type);
      const m=L.marker([pt.lat,pt.lng],{icon}).addTo(map)
        .bindTooltip(pt.name,{direction:'top',offset:[0,-4]});
      m.on('click',()=>openDetail(di,pi));
      markers.push({marker:m,point:pt,dayIdx:di,hasContent});
    });
  });
  renderList();
}

/* ── FILTRO / LISTA ── */
function filterDay(day,btn){
  activeDay=day;
  document.querySelectorAll('.day-pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  updateMarkersVisibility(); renderList();
  if(day!=='all'){
    const dm=markers.filter(m=>m.dayIdx===parseInt(day));
    if(dm.length){const g=L.featureGroup(dm.map(m=>m.marker));map.fitBounds(g.getBounds().pad(0.1),{maxZoom:14});}
  } else { map.setView([45.5,10.5],8); }
}
function updateMarkersVisibility(){
  markers.forEach(({marker,dayIdx})=>{
    const show=activeDay==='all'||parseInt(activeDay)===dayIdx;
    show?(map.hasLayer(marker)?null:marker.addTo(map)):(map.hasLayer(marker)?map.removeLayer(marker):null);
  });
}
function handleSearch(q){searchQ=q.toLowerCase().trim();renderList();}

function hasContent(pt){
  return SEC_ORDER.some(k=>pt.sections[k]&&pt.sections[k].length);
}

function renderList(){
  const list=document.getElementById('point-list');
  const noRes=document.getElementById('no-results');
  list.innerHTML=''; let total=0;
  const daysToShow=activeDay==='all'?DAYS.map((d,i)=>({...d,idx:i})):[{...DAYS[parseInt(activeDay)],idx:parseInt(activeDay)}];
  daysToShow.forEach(day=>{
    const filtered=day.points.filter(pt=>!searchQ||pt.name.toLowerCase().includes(searchQ));
    if(!filtered.length) return;
    total+=filtered.length;
    if(activeDay==='all'){
      const hdr=document.createElement('div');
      hdr.className='list-day-hdr'; hdr.style.setProperty('--dc',day.color);
      hdr.textContent=DAY_LABELS[day.idx]||day.name; list.appendChild(hdr);
    }
    filtered.forEach(pt=>{
      const origIdx=day.points.indexOf(pt);
      const el=document.createElement('div');
      el.className='pt-row'; el.style.setProperty('--dc',day.color);
      if(currentDetail&&currentDetail.pt===pt) el.classList.add('selected');
      const ph=TYPE_ICONS_PH[pt.type]||'ph-map-pin';
      const hc=hasContent(pt);
      el.innerHTML=
        `<div class="pt-badge" style="background:${day.color}"><i class="ph ${ph}"></i></div>`+
        `<div class="pt-info"><div class="pt-name">${pt.name}</div><div class="pt-type">${TYPE_LABELS[pt.type]||pt.type}</div></div>`+
        (hc?`<div class="pt-has-content" title="Tiene ficha"></div>`:'')+
        `<i class="ph ph-caret-right pt-chevron"></i>`;
      el.onclick=()=>{ openDetail(day.idx,origIdx); if(window.innerWidth<=700) openSheet(); };
      list.appendChild(el);
    });
  });
  document.getElementById('stats-bar').textContent=`${total} punto${total!==1?'s':''}`;
  noRes.style.display=total===0?'block':'none';
}

/* ── DETALLE ── */
function openDetail(dayIdx,pointIdx){
  audioStop();
  const day=DAYS[dayIdx], pt=day.points[pointIdx];
  currentDetail={dayIdx,pointIdx,pt,day};

  document.getElementById('detail-day-label').textContent=DAY_LABELS[dayIdx]||day.name;
  document.getElementById('detail-day-label').style.color=day.color;
  document.getElementById('detail-name').textContent=pt.name;
  document.getElementById('detail-phonetic').textContent=pt.fonetica?`/${pt.fonetica}/`:'';

  const ph=TYPE_ICONS_PH[pt.type]||'ph-map-pin';
  document.getElementById('detail-type-badge').innerHTML=
    `<div class="badge-circle" style="background:${day.color}"><i class="ph ${ph}"></i></div>${TYPE_LABELS[pt.type]||pt.type}`;

  // Meta
  const metaEl=document.getElementById('detail-meta');
  const meta=pt.meta||{};
  const metaRows=[];
  if(meta.tiempo) metaRows.push(`<div class="meta-row"><span class="meta-label">Tiempo</span><span class="meta-val">${meta.tiempo}</span></div>`);
  if(meta.horario) metaRows.push(`<div class="meta-row"><span class="meta-label">Horario</span><span class="meta-val">${meta.horario}</span></div>`);
  if(meta.precio) metaRows.push(`<div class="meta-row"><span class="meta-label">Precio</span><span class="meta-val">${meta.precio}</span></div>`);
  metaEl.innerHTML=metaRows.join('');
  metaEl.classList.toggle('visible', metaRows.length>0);

  // Secciones
  const content=document.getElementById('detail-content');
  const secs=pt.sections;
  const hasSomething=SEC_ORDER.some(k=>secs[k]&&secs[k].length);

  if(hasSomething){
    let html='';
    SEC_ORDER.forEach(k=>{
      if(!secs[k]||!secs[k].length) return;
      const cfg=SEC_CONFIG[k];
      const paras=secs[k].map(p=>`<p>${p}</p>`).join('');
      html+=`<div class="sec-block" data-sec="${k}"><div class="sec-label"><i class="ph ${cfg.icon}"></i>${cfg.label}</div><div class="sec-text">${paras}</div></div>`;
    });
    content.innerHTML=html;
  } else {
    content.innerHTML=
      `<div class="empty-desc"><div class="empty-icon" style="background:${day.color}"><i class="ph ${ph}"></i></div>`+
      `Ficha pendiente<br><small style="color:var(--mid)">${pt.lat.toFixed(5)}, ${pt.lng.toFixed(5)}</small></div>`;
  }

  buildAudioSections(pt.name, pt.sections);
  document.getElementById('detail').classList.add('open');
  map.setView([pt.lat,pt.lng],Math.max(map.getZoom(),15));
}

function closeDetail(){ audioStop(); document.getElementById('detail').classList.remove('open'); currentDetail=null; }
function goToOnMap(){ if(!currentDetail) return; map.setView([currentDetail.pt.lat,currentDetail.pt.lng],16); if(window.innerWidth<=700) closeSheet(); }
function openGMaps(){ if(!currentDetail) return; const {pt}=currentDetail; window.open(`https://www.google.com/maps/dir/?api=1&destination=${pt.lat},${pt.lng}&travelmode=driving`,'_blank'); }

/* ── AUDIO GUIDE ── */
function buildAudioSections(placeName, sections){
  audio.sections=[];
  audio.idx=-1;

  // Introducción: solo el nombre
  audio.sections.push({key:'intro', label:'Introducción', text:placeName});

  SEC_ORDER.forEach(k=>{
    if(!sections||!sections[k]||!sections[k].length) return;
    const text=sections[k].join(' ').trim();
    if(text.length<10) return;
    audio.sections.push({key:k, label:SEC_CONFIG[k].label, text});
  });

  const bar=document.getElementById('audio-bar');
  bar.classList.toggle('visible', audio.sections.length>0);
  updateAudioUI();
}

function updateAudioUI(){
  const total=audio.sections.length, idx=audio.idx;
  document.getElementById('audio-counter').textContent=total>0?`${Math.max(idx,0)+1}/${total}`:'—';
  document.getElementById('audio-section-label').textContent=(idx>=0&&audio.sections[idx])?audio.sections[idx].label:'—';
  document.getElementById('audio-progress-fill').style.width=total>0&&idx>=0?`${((idx+1)/total)*100}%`:'0%';
  document.getElementById('play-icon').className=audio.playing?'ph ph-pause':'ph ph-play';
  document.getElementById('btn-prev').style.opacity=idx>0?'1':'0.3';
  document.getElementById('btn-next').style.opacity=idx<total-1?'1':'0.3';

  // Highlight sección activa
  document.querySelectorAll('.sec-block').forEach(el=>el.classList.remove('speaking'));
  if(idx>=0&&audio.sections[idx]){
    const key=audio.sections[idx].key;
    const block=document.querySelector(`.sec-block[data-sec="${key}"]`);
    if(block){ block.classList.add('speaking'); block.scrollIntoView({behavior:'smooth',block:'nearest'}); }
  }
}

function audioToggle(){
  if(!window.speechSynthesis) return alert('Tu navegador no soporta síntesis de voz.');
  if(audio.playing){ audioPause(); }
  else { audio.idx<0 ? audioPlaySection(0) : audioResume(); }
}

function audioPlaySection(idx){
  if(idx<0||idx>=audio.sections.length) return;
  window.speechSynthesis.cancel();
  audio.idx=idx; audio.playing=true;
  const sec=audio.sections[idx];
  const utter=new SpeechSynthesisUtterance(sec.text);
  utter.lang='es-ES'; utter.rate=audio.rate; utter.pitch=1;
  utter.onend=()=>{
    if(idx+1<audio.sections.length){ audioPlaySection(idx+1); }
    else { audio.playing=false; audio.idx=audio.sections.length-1; updateAudioUI(); }
  };
  utter.onerror=(e)=>{ if(e.error!=='interrupted'){audio.playing=false;updateAudioUI();} };
  audio.utterance=utter;
  window.speechSynthesis.speak(utter);
  updateAudioUI();
}

function audioPause(){
  if(!audio.playing) return;
  window.speechSynthesis.pause(); audio.playing=false; updateAudioUI();
}
function audioResume(){
  if(audio.playing) return;
  if(/Safari/.test(navigator.userAgent)&&!/Chrome/.test(navigator.userAgent)){
    audioPlaySection(audio.idx);
  } else { window.speechSynthesis.resume(); audio.playing=true; updateAudioUI(); }
}
function audioStop(resetIdx=true){
  window.speechSynthesis.cancel(); audio.playing=false;
  if(resetIdx) audio.idx=-1;
  audio.utterance=null;
  document.querySelectorAll('.sec-block').forEach(el=>el.classList.remove('speaking'));
  updateAudioUI();
}
function audioPrev(){ if(audio.idx>0) audioPlaySection(audio.idx-1); }
function audioNext(){ if(audio.idx<audio.sections.length-1) audioPlaySection(audio.idx+1); }
function setRate(v){
  audio.rate=parseFloat(v);
  document.getElementById('rate-val')=`${parseFloat(v).toFixed(2)}×`;
  document.getElementById('rate-val').textContent=`${parseFloat(v).toFixed(2)}×`;
  if(audio.playing){ audioPlaySection(audio.idx); } // relanzar con nueva velocidad
}

/* ── PANEL MOBILE ── */
function toggleSheet(){ sheetOpen?closeSheet():openSheet(); }
function openSheet(){ document.getElementById('panel').classList.add('open'); sheetOpen=true; }
function closeSheet(){ document.getElementById('panel').classList.remove('open'); sheetOpen=false; }

/* ── GEOLOCALIZACIÓN ── */
let locating=false;
function toggleLocate(){ locating?stopLocate():startLocate(); }
function startLocate(){
  if(!navigator.geolocation){ alert('Geolocalización no disponible'); return; }
  locating=true; document.getElementById('btn-loc').classList.add('active');
  watchId=navigator.geolocation.watchPosition(pos=>{
    const {latitude:lat,longitude:lng,accuracy}=pos.coords;
    const icon=L.divIcon({className:'',html:`<div style="width:14px;height:14px;border-radius:50%;background:#1e6b3a;border:2.5px solid white;box-shadow:0 0 0 3px rgba(30,107,58,0.22),0 2px 6px rgba(0,0,0,0.25)"></div>`,iconSize:[14,14],iconAnchor:[7,7]});
    userMarker?userMarker.setLatLng([lat,lng]):(userMarker=L.marker([lat,lng],{icon,zIndexOffset:1000}).addTo(map));
    accuracyCircle?accuracyCircle.setLatLng([lat,lng]).setRadius(accuracy):(accuracyCircle=L.circle([lat,lng],{radius:accuracy,color:'#1e6b3a',fillColor:'#1e6b3a',fillOpacity:0.08,weight:1}).addTo(map));
    if(!map._locMoved){ map.setView([lat,lng],14); map._locMoved=true; }
  },err=>{ stopLocate(); if(err.code===1) alert('Permiso de ubicación denegado.'); },{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
}
function stopLocate(){
  locating=false; map._locMoved=false;
  if(watchId){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  document.getElementById('btn-loc').classList.remove('active');
}

document.addEventListener('visibilitychange',()=>{ if(document.hidden) audioPause(); });

initMap();
</script>
