<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Italia 2025">
<title>Italia 2025 · Guía de Viaje</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#d9d4c7;--sur:#e4dfd4;--ink:#18180f;--mid:#7c7b74;
  --faint:#c8c3b6;--acc:#1e6b3a;--acc-pale:#dff0e7;
  --warn:#8b3a14;
  --mono:'IBM Plex Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.55;-webkit-tap-highlight-color:transparent;overflow:hidden}

/* ── MASTHEAD ── */
.mast{display:grid;grid-template-columns:auto 1fr auto;align-items:center;border-bottom:2px solid var(--ink);flex-shrink:0}
.mast-flag{width:56px;height:56px;border-right:2px solid var(--ink);padding:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mast-text{padding:10px 14px}
.mast-kicker{font-size:9px;font-weight:300;letter-spacing:0.2em;text-transform:uppercase;color:var(--mid);margin-bottom:2px}
.mast-h1{font-size:20px;font-weight:500;letter-spacing:-0.03em;line-height:1}
.mast-sub{font-size:10px;color:var(--mid);margin-top:3px;letter-spacing:0.04em}
.mast-actions{padding:0 12px;display:flex;align-items:center;flex-shrink:0}
.btn-loc{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:3px;font-family:var(--mono);font-size:10px;font-weight:300;border:1px solid var(--faint);color:var(--mid);background:var(--bg);cursor:pointer;letter-spacing:0.04em;text-transform:uppercase;transition:all 0.15s;white-space:nowrap}
.btn-loc:hover{border-color:var(--acc);color:var(--acc)}
.btn-loc.active{border-color:var(--acc);color:var(--acc);background:var(--acc-pale)}
.btn-loc i{font-size:14px}

/* ── DAY BAR ── */
.day-bar{display:flex;align-items:center;border-bottom:1px solid var(--faint);overflow-x:auto;flex-shrink:0;scrollbar-width:none;background:var(--sur)}
.day-bar::-webkit-scrollbar{display:none}
.day-pill{flex-shrink:0;padding:8px 14px;font-size:10px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--mid);border-bottom:2px solid transparent;letter-spacing:0.04em;transition:all 0.15s;white-space:nowrap;text-transform:uppercase;display:flex;align-items:center;gap:5px;font-family:var(--mono)}
.day-pill:hover{color:var(--ink)}
.day-pill.active{color:var(--ink);border-bottom-color:var(--ink);background:var(--bg)}
.day-pill[data-day="all"].active{border-bottom-color:var(--acc);color:var(--acc)}

/* ── LAYOUT ── */
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column}
.mast,.day-bar{position:relative;z-index:10}
#app-body{flex:1;display:flex;overflow:hidden;position:relative}
#map{flex:1;height:100%}
#panel{width:360px;background:var(--sur);border-left:2px solid var(--ink);display:flex;flex-direction:column;overflow:hidden;position:relative}

@media(max-width:700px){
  #app-body{flex-direction:column}
  #map{flex:1;width:100%}
  #panel{position:fixed;bottom:0;left:0;right:0;width:100%;height:65vh;border-left:none;border-top:2px solid var(--ink);transform:translateY(calc(100% - 48px));transition:transform 0.3s cubic-bezier(0.32,0.72,0,1);z-index:500}
  #panel.open{transform:translateY(0)}
}
#panel-handle{display:none;align-items:center;justify-content:center;padding:10px 0 6px;cursor:pointer;flex-shrink:0;border-bottom:1px solid var(--faint)}
#panel-handle::before{content:'';width:32px;height:3px;background:var(--faint);border-radius:2px}
@media(max-width:700px){#panel-handle{display:flex}}

/* ── SEARCH ── */
.panel-search{padding:10px;border-bottom:1px solid var(--faint);flex-shrink:0;display:flex;align-items:center;gap:6px}
.panel-search i{font-size:16px;color:var(--mid);flex-shrink:0}
#search-input{flex:1;background:transparent;border:none;color:var(--ink);padding:4px 0;font-size:11px;font-family:var(--mono);outline:none;letter-spacing:0.02em}
#search-input::placeholder{color:var(--mid)}
.panel-stats{padding:6px 10px;font-size:9px;color:var(--mid);border-bottom:1px solid var(--faint);flex-shrink:0;letter-spacing:0.06em;text-transform:uppercase}

/* ── LIST ── */
#point-list{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
#point-list::-webkit-scrollbar{width:3px}
#point-list::-webkit-scrollbar-thumb{background:var(--faint)}
.list-day-hdr{font-size:9px;font-weight:300;letter-spacing:0.18em;text-transform:uppercase;color:var(--mid);padding:10px 10px 4px;display:flex;align-items:center;gap:7px}
.list-day-hdr::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--dc);flex-shrink:0}
.pt-row{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--faint);transition:background 0.1s}
.pt-row:hover{background:var(--bg)}
.pt-row.selected{background:var(--bg);border-left:2px solid var(--dc);padding-left:8px}
.pt-badge{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pt-badge i{font-size:11px;color:#fff}
.pt-info{flex:1;min-width:0}
.pt-name{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.pt-type{font-size:9px;color:var(--mid);margin-top:1px;text-transform:uppercase;letter-spacing:0.06em}
.pt-chevron{color:var(--faint);font-size:14px;flex-shrink:0}
.pt-has-content{width:5px;height:5px;border-radius:50%;background:var(--acc);flex-shrink:0}
#no-results{padding:24px 10px;text-align:center;font-size:10px;color:var(--mid);letter-spacing:0.06em;display:none}

/* ── DETAIL ── */
#detail{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--sur);display:flex;flex-direction:column;transform:translateX(100%);transition:transform 0.25s cubic-bezier(0.32,0.72,0,1);z-index:20}
#detail.open{transform:translateX(0)}

#detail-header{padding:12px 12px 10px;border-bottom:2px solid var(--ink);flex-shrink:0}
#detail-back{background:none;border:none;color:var(--mid);font-size:10px;cursor:pointer;display:flex;align-items:center;gap:5px;margin-bottom:10px;padding:0;font-family:var(--mono);letter-spacing:0.06em;text-transform:uppercase}
#detail-back:hover{color:var(--ink)}
#detail-back i{font-size:14px}
#detail-day-label{font-size:9px;font-weight:300;letter-spacing:0.18em;text-transform:uppercase;color:var(--mid);margin-bottom:3px}
#detail-name{font-size:16px;font-weight:500;color:var(--ink);line-height:1.2;margin-bottom:3px}
#detail-phonetic{font-size:10px;color:var(--mid);font-style:italic;margin-bottom:5px;letter-spacing:0.02em}
#detail-type-badge{display:inline-flex;align-items:center;gap:6px;font-size:9px;font-weight:300;color:var(--mid);letter-spacing:0.1em;text-transform:uppercase;margin-top:2px}
#detail-type-badge .badge-circle{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#detail-type-badge .badge-circle i{font-size:11px;color:#fff}

/* ── META BLOCK ── */
#detail-meta{padding:8px 12px;border-bottom:1px solid var(--faint);flex-shrink:0;display:none}
#detail-meta.visible{display:block}
.meta-row{display:flex;gap:8px;align-items:baseline;padding:2px 0;font-size:10px}
.meta-label{font-size:9px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--mid);flex-shrink:0;width:58px}
.meta-val{color:var(--ink);line-height:1.4}

/* ── AUDIO BAR ── */
#audio-bar{border-bottom:1px solid var(--faint);flex-shrink:0;background:var(--bg);display:none}
#audio-bar.visible{display:block}
#audio-progress-wrap{height:2px;background:var(--faint)}
#audio-progress-fill{height:2px;background:var(--acc);width:0%;transition:width 0.3s ease}
#audio-controls{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--faint)}
.ac-btn{display:flex;align-items:center;justify-content:center;padding:8px 11px;border:none;background:none;color:var(--mid);cursor:pointer;font-family:var(--mono);border-right:1px solid var(--faint);transition:color 0.15s,background 0.15s;flex-shrink:0}
.ac-btn:last-child{border-right:none}
.ac-btn:hover{color:var(--ink);background:var(--sur)}
.ac-btn.active{color:var(--acc)}
.ac-btn i{font-size:16px}
.ac-btn.play-pause i{font-size:18px}
#audio-section-label{flex:1;padding:0 8px;font-size:9px;font-weight:300;letter-spacing:0.14em;text-transform:uppercase;color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#audio-counter{padding:0 8px;font-size:9px;color:var(--mid);letter-spacing:0.06em;flex-shrink:0;border-left:1px solid var(--faint)}
#audio-rate{padding:4px 8px;border-top:1px solid var(--faint);display:flex;align-items:center;gap:8px;font-size:9px;color:var(--mid)}
#audio-rate label{letter-spacing:0.08em;text-transform:uppercase;flex-shrink:0}
#rate-slider{flex:1;accent-color:var(--acc)}
#rate-val{width:28px;text-align:right;flex-shrink:0}

/* ── DETAIL BODY ── */
#detail-body{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
#detail-body::-webkit-scrollbar{width:3px}
#detail-body::-webkit-scrollbar-thumb{background:var(--faint)}

/* Secciones del contenido */
.sec-block{padding:12px 12px 0}
.sec-block:last-child{padding-bottom:16px}
.sec-label{font-size:9px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.sec-label i{font-size:13px;color:var(--mid)}
.sec-text{font-size:13px;line-height:1.75;color:var(--mid)}
.sec-text p{margin-bottom:8px}
.sec-text p:last-child{margin-bottom:0}

/* Highlight sección hablando */
.sec-block.speaking .sec-label{color:var(--acc)}
.sec-block.speaking .sec-label i{color:var(--acc)}
.sec-block.speaking{background:var(--acc-pale);border-radius:2px;margin:0 4px;padding:10px 8px 10px}

/* Estado sin contenido */
.empty-desc{padding:24px 12px;text-align:center;font-size:10px;color:var(--mid);letter-spacing:0.06em}
.empty-desc .empty-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.empty-desc .empty-icon i{font-size:16px;color:#fff}

/* ── DETAIL NAV ── */
#detail-nav{padding:10px 12px;border-top:1px solid var(--faint);display:flex;gap:6px;flex-shrink:0}
.dnav-btn{flex:1;padding:8px;border-radius:2px;border:1px solid var(--faint);background:var(--bg);color:var(--mid);font-size:10px;cursor:pointer;font-family:var(--mono);font-weight:300;letter-spacing:0.04em;display:flex;align-items:center;justify-content:center;gap:6px;transition:all 0.15s;text-transform:uppercase}
.dnav-btn:hover{border-color:var(--acc);color:var(--acc)}
.dnav-btn i{font-size:15px}
.dnav-btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dnav-btn.primary:hover{background:var(--acc);border-color:var(--acc)}

/* ── MAP MARKERS ── */
.map-marker{display:flex;align-items:center;justify-content:center;border-radius:50%;border:1.5px solid rgba(24,24,15,0.45);box-shadow:0 1px 4px rgba(0,0,0,0.3);cursor:pointer;transition:transform 0.1s}
.map-marker:hover{transform:scale(1.25)}
.map-marker i{color:#fff;line-height:1}
.leaflet-control-zoom a{background:var(--sur)!important;color:var(--ink)!important;border-color:var(--faint)!important;font-family:var(--mono)!important}
.leaflet-control-attribution{background:rgba(217,212,199,0.85)!important;color:var(--mid)!important;font-size:9px!important;font-family:var(--mono)!important}
.leaflet-popup-content-wrapper{background:var(--sur)!important;border:1px solid var(--ink)!important;border-radius:2px!important;box-shadow:3px 3px 0 rgba(24,24,15,0.12)!important}
.leaflet-popup-tip{background:var(--sur)!important}
.leaflet-popup-content{margin:10px 12px!important;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink)}
.leaflet-tooltip{background:var(--sur)!important;color:var(--ink)!important;border-color:var(--ink)!important;font-family:var(--mono)!important;font-size:10px!important;border-radius:2px!important;box-shadow:2px 2px 0 rgba(24,24,15,0.08)!important}
</style>
</head>
<body>
<div id="app">
  <header class="mast">
    <div class="mast-flag"><svg version="1.1" style="display:block;width:40px;height:40px" id="Capa_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" viewBox="0 0 256 256" xml:space="preserve"><style type="text/css">.st0{fill:#FFFFFF;stroke:#000000;stroke-miterlimit:10;}.st1{clip-path:url(#SVGID_2_);fill:#009246;}.st2{clip-path:url(#SVGID_4_);fill:#009246;}.st3{clip-path:url(#SVGID_6_);fill:#CE2B37;}.st4{clip-path:url(#SVGID_8_);fill:#CE2B37;}.st5{fill:none;stroke:#000000;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;}</style><g id="Capa_2"></g><polygon class="st0" points="164,135.6 112,136 101.1,160 69.6,160 97.7,72.3 141.1,72 152,48 183.2,48 "/><g><g><g><defs><polygon id="SVGID_1_" points="28,72 141.1,72 152,48 232,48 192,136 192,136 112,136 101.1,160 28,160 68,116"/></defs><clipPath id="SVGID_2_"><use xlink:href="#SVGID_1_" style="overflow:visible;"/></clipPath><path class="st1" d="M28,48v112V48z"/></g><g><defs><polygon id="SVGID_3_" points="28,72 141.1,72 152,48 232,48 192,136 192,136 112,136 101.1,160 28,160 68,116"/></defs><clipPath id="SVGID_4_"><use xlink:href="#SVGID_3_" style="overflow:visible;"/></clipPath><polygon class="st2" points="114.1,72 69.6,160 28,160 28,72"/></g><g><defs><polygon id="SVGID_5_" points="28,72 141.1,72 152,48 232,48 192,136 192,136 112,136 101.1,160 28,160 68,116"/></defs><clipPath id="SVGID_6_"><use xlink:href="#SVGID_5_" style="overflow:visible;"/></clipPath><polygon class="st3" points="232,48 192,136 144.4,136 183.2,48"/></g><g><defs><polygon id="SVGID_7_" points="28,72 141.1,72 152,48 232,48 192,136 192,136 112,136 101.1,160 28,160 68,116"/></defs><clipPath id="SVGID_8_"><use xlink:href="#SVGID_7_" style="overflow:visible;"/></clipPath><path class="st4" d="M232,160V48V160z"/></g></g></g><polyline class="st5" points="152,224 232,48 152,48 112,136 192,136 "/><polyline class="st5" points="112,136 101.1,160 28,160 68,116 28,72 141.1,72 "/></svg></div>
    <div class="mast-text">
      <div class="mast-kicker">Guía de viaje</div>
      <div class="mast-h1">Italia 2025</div>
      <div class="mast-sub">290 puntos · 9 días · Lagos + Venecia</div>
    </div>
    <div class="mast-actions">
      <button class="btn-loc" id="btn-loc" onclick="toggleLocate()">
        <i class="ph ph-crosshair"></i>Ubicarme
      </button>
    </div>
  </header>

  <div class="day-bar" id="day-bar">
    <button class="day-pill active" data-day="all" onclick="filterDay('all',this)">
      <i class="ph ph-map-trifold"></i>Todos
    </button>
  </div>

  <div id="app-body">
    <div id="map"></div>
    <div id="panel">
      <div id="panel-handle" onclick="toggleSheet()"></div>
      <div class="panel-search">
        <i class="ph ph-magnifying-glass"></i>
        <input id="search-input" type="search" placeholder="Buscar lugar…" oninput="handleSearch(this.value)">
      </div>
      <div class="panel-stats" id="stats-bar">290 puntos</div>
      <div id="point-list"></div>
      <div id="no-results">Sin resultados</div>

      <div id="detail">
        <div id="detail-header">
          <button id="detail-back" onclick="closeDetail()">
            <i class="ph ph-arrow-left"></i>Volver
          </button>
          <div id="detail-day-label"></div>
          <div id="detail-name"></div>
          <div id="detail-phonetic"></div>
          <div id="detail-type-badge"></div>
        </div>

        <div id="detail-meta"><!-- horario/precio/tiempo --></div>

        <div id="audio-bar">
          <div id="audio-progress-wrap"><div id="audio-progress-fill"></div></div>
          <div id="audio-controls">
            <button class="ac-btn" id="btn-prev" onclick="audioPrev()"><i class="ph ph-skip-back"></i></button>
            <button class="ac-btn play-pause" id="btn-play" onclick="audioToggle()"><i class="ph ph-play" id="play-icon"></i></button>
            <button class="ac-btn" id="btn-next" onclick="audioNext()"><i class="ph ph-skip-forward"></i></button>
            <span id="audio-section-label">—</span>
            <span id="audio-counter">—</span>
          </div>
          <div id="audio-rate">
            <label>Velocidad</label>
            <input type="range" id="rate-slider" min="0.6" max="1.4" step="0.05" value="0.92"
              oninput="setRate(this.value)">
            <span id="rate-val">0.9×</span>
          </div>
        </div>

        <div id="detail-body"><div id="detail-content"></div></div>

        <div id="detail-nav">
          <button class="dnav-btn" onclick="goToOnMap()"><i class="ph ph-map-pin"></i>Ver en mapa</button>
          <button class="dnav-btn primary" onclick="openGMaps()"><i class="ph ph-navigation-arrow"></i>Navegar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const DAYS = [{"name": "Día 1 · Bérgamo", "color": "#E65100", "points": [{"name": "AEROPUERTO DE BÉRGAMO-ORIO AL SERIO", "fonetica": "a-e-ro-PUÉR-to de BÉR-ga-mo Ó-rio al SÉ-rio", "lat": 45.668978, "lng": 9.707406, "type": "logistica", "meta": {"tiempo": "Entre 30 y 60 minutos desde el aterrizaje hasta la salida, según equipaje y controles; añadir el tiempo necesario para recoger el coche."}, "sections": {"descripcion": ["El Aeropuerto Internacional de Milán-Bérgamo, identificado por el código BGY, es el punto de entrada del viaje. Aunque comercialmente se presenta como aeropuerto de Milán, se encuentra en Orio al Serio, junto a Bérgamo, y está mucho más cerca de esta ciudad que del centro de Milán. Para esta ruta resulta especialmente práctico porque permite comenzar la visita de Bérgamo casi inmediatamente después de recoger el vehículo.", "El aeropuerto dispone de una única terminal de pasajeros, pero el edificio ha sido ampliado y reorganizado en varias fases. Conviene seguir la señalización hacia la zona de alquiler de vehículos y comprobar en la reserva si la empresa entrega el coche dentro del recinto aeroportuario o mediante lanzadera desde una oficina exterior. Esta diferencia puede alterar bastante el tiempo real de salida.", "El aeropuerto nació como instalación militar y comenzó a desarrollar tráfico civil regular en la segunda mitad del siglo XX. Su crecimiento está ligado en gran medida a la expansión de las compañías de bajo coste, que lo convirtieron en una de las principales puertas aéreas del norte de Italia. Por ese motivo, pese a su tamaño relativamente compacto, puede concentrar un volumen elevado de pasajeros en determinadas franjas horarias, especialmente a primera hora de la mañana, por la tarde y durante los fines de semana."], "historia": [], "arquitectura": [], "arte": [], "curiosidades": [], "consejos": ["Antes de abandonar la terminal conviene comprobar el estado del vuelo, la ubicación exacta de la oficina de alquiler y las instrucciones de recogida. Si el coche se entrega fuera del aeropuerto, es importante localizar el punto de encuentro de la lanzadera antes de salir. También resulta útil descargar previamente el mapa de la terminal y llevar a mano el número de reserva, el permiso de conducir y la tarjeta empleada para la fianza.", "La web oficial ofrece mapas de la terminal, información de transporte terrestre, aparcamientos, alquiler de coches y servicios al pasajero. Para el regreso debe reservarse un margen amplio: devolución del vehículo, traslado a terminal, entrega de equipaje y controles de seguridad pueden requerir bastante más tiempo del previsto.", "Al recoger el coche conviene confirmar si la oficina se encuentra dentro de la terminal o en un recinto exterior comunicado mediante lanzadera. Antes de salir del aparcamiento deben revisarse el combustible, la política de devolución, el kilometraje, la matrícula, los daños anotados y la existencia de cualquier dispositivo de telepeaje. En Italia las zonas de tráfico limitado se controlan mediante cámaras y una reserva de alojamiento no siempre autoriza automáticamente el acceso, por lo que es preferible preguntar de forma expresa antes de entrar en un casco histórico."]}}, {"name": "APPARTAMENTO BORGOLUCE", "fonetica": "ap-par-ta-MÉN-to BÓR-go-LÚ-che", "lat": 45.69222, "lng": 9.687844, "type": "alojamiento", "meta": {}, "sections": {"descripcion": ["Alojamiento previsto para la primera noche. Este punto se conserva únicamente como referencia operativa para calcular el desplazamiento desde el aeropuerto, dejar el equipaje y organizar el acceso posterior a la Città Alta."], "historia": [], "arquitectura": [], "arte": [], "curiosidades": [], "consejos": ["Conviene guardar en el teléfono las instrucciones exactas de entrada, el contacto del anfitrión, la hora límite de llegada y la información sobre aparcamiento. Si el alojamiento se encuentra dentro o cerca de una zona de tráfico limitado, debe confirmarse de antemano si la matrícula necesita autorización. También es recomendable preguntar si existe consigna o posibilidad de dejar el equipaje antes del check-in.", "Antes de iniciar la visita conviene decidir si se deja el coche en el alojamiento o en un aparcamiento de la ciudad baja. Si el apartamento dispone de plaza privada, debe comprobarse el ancho del acceso y si requiere mando, código o autorización previa. También resulta útil descargar las instrucciones de llegada para consultarlas sin conexión, porque algunos portales y patios interiores de los edificios italianos no son evidentes desde la calle."]}}, {"name": "BÉRGAMO", "fonetica": "BÉR-ga-mo", "lat": 45.694197, "lng": 9.670746, "type": "visita", "meta": {"tiempo": "Entre 4 y 6 horas para una primera visita extensa de la Città Alta; más si se incorporan varios interiores y San Vigilio.", "horario": "La ciudad puede recorrerse libremente. Iglesias, museos, torres, palacios y funiculares tienen horarios propios.", "precio": "El paseo por la Città Alta, sus plazas y las murallas es gratuito. Funiculares, museos y monumentos de pago se abonan por separado."}, "sections": {"descripcion": ["Bérgamo es una de las ciudades históricas más singulares de Lombardía porque conserva dos centros urbanos superpuestos y claramente diferenciados. La Città Bassa se extiende por la llanura y reúne la ciudad moderna, comercial y administrativa; la Città Alta ocupa una colina fortificada y mantiene un tejido urbano medieval de calles estrechas, plazas monumentales, torres, palacios, iglesias y jardines. La relación visual entre ambas partes es esencial para comprender la ciudad: desde abajo, la silueta de torres y murallas domina el paisaje; desde arriba, la llanura lombarda se abre hasta el horizonte.", "La visita tiene como eje Piazza Vecchia y Piazza Duomo, pero Bérgamo no debe reducirse a esos dos espacios. Las murallas venecianas, Porta San Giacomo, la Rocca, los palacios de Via Porta Dipinta, la subida a San Vigilio y los pequeños rincones de la trama medieval forman una experiencia urbana continua. Es una ciudad para recorrer despacio, mirando cómo los edificios se adaptan a la pendiente y cómo cada calle abre una perspectiva distinta hacia campanarios, tejados o montañas."], "historia": ["El asentamiento tiene orígenes prerromanos y fue incorporado al mundo romano con el nombre de Bergomum. Su posición, en el contacto entre la llanura padana y los pasos hacia los Alpes, favoreció su desarrollo como enclave estratégico y comercial. Tras la caída del Imperio romano, la ciudad pasó por etapas ostrogodas, lombardas y carolingias. Durante la Edad Media se consolidó como comuna, con instituciones civiles propias, familias poderosas y una arquitectura urbana marcada por torres, palacios y espacios de representación.", "En 1428 Bérgamo quedó bajo el dominio de la República de Venecia. Esta etapa dejó la huella más visible en la imagen actual de la ciudad. Al encontrarse en el extremo occidental del territorio veneciano de tierra firme, Bérgamo fue transformada en una plaza fortificada de primer orden. A partir de 1561 se construyeron las grandes murallas bastionadas, concebidas para resistir la artillería moderna. El proyecto alteró profundamente la topografía y obligó a demoler numerosos edificios, pero creó el cinturón defensivo que hoy define la Città Alta.", "Tras el final de la República de Venecia en 1797, la ciudad pasó por las administraciones napoleónica y austriaca antes de incorporarse al Reino de Italia. Durante los siglos XIX y XX la Città Bassa creció con avenidas, edificios públicos y arquitectura burguesa, mientras la parte alta conservó gran parte de su trama histórica. Las murallas venecianas fueron inscritas en 2017 en la lista del Patrimonio Mundial de la UNESCO como parte del sistema transnacional de obras defensivas venecianas de los siglos XVI y XVII.", "La ciudad romana se organizó sobre la colina, probablemente siguiendo un trazado ortogonal adaptado a la topografía. Bajo numerosos edificios medievales y renacentistas han aparecido pavimentos, muros, conducciones y restos domésticos de Bergomum. La arqueología resulta especialmente visible en el Palazzo del Podestà, donde el recorrido museístico permite descender hasta niveles romanos y comprender que la ciudad actual se levantó literalmente sobre sucesivas capas de ocupación.", "Durante la Edad Media, Bérgamo participó de las tensiones políticas propias de las comunas lombardas. Familias poderosas levantaron torres privadas como expresión de prestigio y defensa, mientras el gobierno comunal consolidaba sus instituciones alrededor de la actual Piazza Vecchia. La oposición entre güelfos y gibelinos, las rivalidades nobiliarias y la intervención de poderes externos dejaron una huella profunda en la forma urbana. Muchas torres fueron rebajadas o absorbidas por edificios posteriores, pero su presencia todavía puede rastrearse en el perfil de la Città Alta.", "El dominio veneciano, iniciado en 1428, aportó un largo periodo de estabilidad política y orientó a Bérgamo hacia la Serenissima. La construcción de las murallas bastionadas comenzó en 1561, en un momento en que Venecia temía un ataque desde los territorios españoles de Milán. La obra obligó a derribar barrios, iglesias, conventos y viviendas situados en el perímetro previsto. Paradójicamente, las fortificaciones nunca tuvieron que resistir un gran asedio, lo que favoreció su excepcional conservación."], "arquitectura": ["La arquitectura de Bérgamo es el resultado de una superposición de épocas. El trazado de la Città Alta conserva el carácter medieval: calles estrechas, recorridos quebrados, pasajes cubiertos, pequeños ensanchamientos y edificios apoyados unos sobre otros. Sobre esa base aparecen palacios comunales, casas-torre, iglesias románicas, capillas renacentistas, interiores barrocos y fachadas neoclásicas. Esta mezcla no produce desorden, sino una continuidad urbana muy coherente gracias al uso recurrente de piedra, ladrillo, mármol y revoco.", "Las murallas representan la arquitectura militar moderna. Sus bastiones angulados, plataformas de artillería, puertas monumentales y recorridos elevados responden a una concepción defensiva muy distinta de la muralla medieval. En el centro cívico, el Palazzo della Ragione y el Campanone recuerdan la autonomía comunal; en Piazza Duomo, Santa Maria Maggiore, la Cappella Colleoni, el Baptisterio y la Catedral condensan siglos de arquitectura religiosa y mecenazgo.", "La relación entre Piazza Vecchia y Piazza Duomo resume la evolución institucional de la ciudad. Piazza Vecchia terminó convirtiéndose en el espacio civil y representativo, mientras Piazza Duomo mantuvo el núcleo religioso. El Palazzo della Ragione actúa como una bisagra entre ambas: sus soportales permiten atravesar el antiguo edificio comunal y pasar, en pocos pasos, del mundo político al religioso. Esta secuencia espacial, más compleja de lo que parece en un plano, es una de las experiencias urbanas más logradas de la ciudad."], "arte": ["Los principales elementos que conviene buscar son Piazza Vecchia, la Fontana Contarini, el Palazzo della Ragione, el Campanone, Piazza Duomo, la Basílica de Santa Maria Maggiore, la Cappella Colleoni, la Catedral, Porta San Giacomo, la Rocca y los panoramas desde San Vigilio. La riqueza de Bérgamo está tanto en estos monumentos como en los detalles menores: escudos venecianos, pavimentos, portales de piedra, patios interiores, frescos fragmentarios, relojes solares y perspectivas inesperadas entre callejones.", "Bérgamo ocupa además un lugar destacado en la historia del arte lombardo. Lorenzo Lotto trabajó para importantes clientes locales y dejó obras decisivas, entre ellas los diseños para las taraceas del coro de Santa Maria Maggiore. Giovan Battista Moroni, nacido en la provincia, desarrolló una pintura de retrato caracterizada por su extraordinaria atención psicológica y material. La tradición musical está representada por Johann Simon Mayr y Gaetano Donizetti, cuya presencia atraviesa iglesias, museos, teatros y celebraciones de la ciudad."], "curiosidades": ["El Campanone continúa haciendo sonar cien campanadas a las diez de la noche, recuerdo del antiguo cierre de las puertas de la ciudad. La tradición local también asocia la Città Alta con la invención del helado de stracciatella, creado en 1961 en la pastelería La Marianna, cerca de Colle Aperto. La ciudad mantiene además una relación muy intensa con Gaetano Donizetti, nacido en Bérgamo y convertido en una de sus figuras culturales más reconocibles.", "La gastronomía también forma parte de la identidad de Bérgamo. Los casoncelli alla bergamasca son una pasta rellena servida habitualmente con mantequilla, salvia, panceta y queso; la polenta aparece en numerosas preparaciones; y la polenta e osei, pese a su aspecto de plato salado, es un dulce de bizcocho, mazapán y chocolate. La stracciatella moderna fue creada por Enrico Panattoni en el restaurante La Marianna, cerca de Colle Aperto, al incorporar finos fragmentos de chocolate a una base de helado de crema."], "consejos": ["Para una primera visita conviene subir a la Città Alta en funicular o entrar caminando por Porta San Giacomo, recorrer Piazza Vecchia y Piazza Duomo, continuar hacia la Rocca y reservar el final de la tarde para las murallas o San Vigilio. La mejor luz para las vistas aparece a primera hora y al atardecer. En fines de semana y días festivos, la zona de Piazza Vecchia puede llenarse, por lo que los interiores más importantes se disfrutan mejor temprano.", "No es recomendable introducir el coche en la Città Alta sin conocer las restricciones de tráfico. La ZTL está controlada electrónicamente y los horarios pueden cambiar. Resulta más sencillo aparcar en la parte baja o en un estacionamiento autorizado y continuar a pie, en autobús o en funicular.", "Para comprender la ciudad conviene alternar los grandes monumentos con calles secundarias. Via Gombito y Via Colleoni concentran el tránsito y los comercios, pero los desvíos hacia Via San Lorenzo, Via Arena, Via Porta Dipinta o la zona de la Rocca revelan patios, huertos, casas medievales y vistas mucho más tranquilas. El pavimento irregular y las pendientes aconsejan calzado cómodo; en verano, las horas centrales pueden resultar calurosas, mientras las murallas y San Vigilio funcionan especialmente bien al final de la tarde."]}}, {"name": "BASÍLICA DE SANTA MARIA MAGGIORE", "fonetica": "ba-SÍ-li-ca de SÁN-ta ma-RÍ-a ma-YÓ-re", "lat": 45.703422, "lng": 9.662322, "type": "visita", "meta": {"tiempo": "Entre 35 y 60 minutos.", "horario": "El horario puede variar por celebraciones religiosas y actos culturales. Conviene consultarlo en la web oficial de la Fondazione MIA el día anterior.", "precio": "El acceso ordinario a la basílica suele ser gratuito; determinados espacios, exposiciones o el Tesoro pueden tener entrada propia."}, "sections": {"descripcion": ["La Basílica de Santa Maria Maggiore es uno de los edificios más importantes de Bérgamo y una visita imprescindible para comprender la ciudad. Su exterior románico, severo y construido con piedra clara y oscura, apenas anticipa la extraordinaria riqueza del interior. Entrar supone pasar de una arquitectura compacta y medieval a un espacio cubierto por tapices, estucos, pinturas, maderas talladas, dorados y mármoles acumulados durante siglos.", "La basílica carece de una gran fachada principal orientada hacia una plaza. Sus accesos más espectaculares son laterales, especialmente los portales de los Leones Rojos y de los Leones Blancos. Esta disposición responde a su inserción en una trama urbana muy densa y a su relación directa con Piazza Duomo y la Cappella Colleoni."], "historia": ["Según la tradición, la construcción se relaciona con un voto realizado por los habitantes de Bérgamo durante una epidemia. La primera piedra fue bendecida en 1137 por el obispo Gregorio, sobre el lugar de una iglesia anterior dedicada a la Virgen. La obra se prolongó durante generaciones y fue adquiriendo una función doble: religiosa, como gran santuario mariano, y cívica, como espacio profundamente ligado a la identidad de la comunidad bergamasca.", "La administración de la basílica quedó vinculada a la Misericordia Maggiore, institución fundada en el siglo XIII que tuvo un papel central en la asistencia social, la educación y el patronazgo artístico de la ciudad. Esta continuidad institucional explica la calidad de sus encargos y la presencia de algunos de los mejores artistas activos en Lombardía y el Véneto.", "En el siglo XV la construcción de la Cappella Colleoni alteró uno de sus accesos y añadió al conjunto una de las grandes obras del Renacimiento lombardo. Durante los siglos XVI y XVII el interior fue profundamente enriquecido y transformado hasta adquirir el aspecto barroco actual. La basílica conserva además la tumba de Gaetano Donizetti y la de su maestro Simon Mayr, reforzando su dimensión de memoria cívica.", "La elección de una planta centralizada de cruz griega, poco habitual frente a la planta basilical longitudinal, contribuye a la sensación de concentración espacial. El edificio fue ampliado y modificado durante siglos, y la ausencia de una fachada occidental independiente se explica por su integración en un tejido urbano muy denso y por la proximidad inmediata del antiguo palacio episcopal. Las entradas laterales se convirtieron así en auténticas fachadas ceremoniales."], "arquitectura": ["La estructura fundamental es románica lombarda, con planta de cruz griega, grandes masas murarias y un complejo juego de volúmenes. La piedra exterior y los ábsides transmiten solidez, mientras los protiros sobre leones, las logias y los detalles escultóricos introducen una decoración muy elaborada. Los portales medievales son obras de Giovanni da Campione y su taller, y constituyen por sí solos una lección de escultura y arquitectura gótica lombarda.", "El interior es el resultado de sucesivas campañas decorativas. La envolvente románica quedó cubierta por una escenografía barroca en la que se combinan tapices flamencos y florentinos, estucos, pinturas, dorados, mármoles y tallas. El contraste entre estructura y decoración es uno de los rasgos esenciales del edificio.", "Los protiros de los Leones Rojos y los Leones Blancos constituyen dos de los conjuntos escultóricos más reconocibles. Los animales sostienen columnas y crean un umbral simbólico entre la plaza y el interior sagrado. Sobre ellos se superponen arcos, logias, esculturas y relieves que muestran la evolución del gótico lombardo. Conviene detenerse también en los ábsides exteriores, donde el aparejo de piedra, las galerías y la articulación de los volúmenes permiten leer la estructura románica original."], "arte": ["El coro de madera es uno de los tesoros absolutos de la basílica. Sus taraceas fueron realizadas por Giovan Francesco Capoferri a partir de diseños de Lorenzo Lotto. Las escenas bíblicas y los paneles simbólicos muestran una extraordinaria combinación de perspectiva, naturalismo y cultura humanista. Muchos paneles disponen de cubiertas o 'coperti' con emblemas y jeroglíficos, concebidos como un recorrido intelectual complejo.", "Conviene observar también la tumba de Donizetti, el confesionario barroco diseñado por Andrea Fantoni, los tapices, las decoraciones del transepto y la relación espacial con la Cappella Colleoni. La visita gana mucho cuando se dedica tiempo a mirar hacia arriba: bóvedas, cornisas y tribunas concentran una parte importante del programa decorativo.", "Las taraceas del coro son mucho más que una decoración. Lorenzo Lotto proporcionó cartones con escenas bíblicas y complejos emblemas alegóricos; Giovan Francesco Capoferri y su taller los tradujeron a madera mediante una técnica minuciosa que combina distintas especies y tonalidades. Algunas composiciones poseen cubiertas móviles, llamadas coperti, que protegen las escenas y añaden un segundo nivel de lectura simbólica. La riqueza intelectual del programa ha provocado interpretaciones religiosas, humanistas y alquímicas.", "El monumento funerario de Gaetano Donizetti fue realizado por Vincenzo Vela y dialoga con el de su maestro Johann Simon Mayr. La presencia de ambos músicos dentro de la basílica subraya la función cívica del templo, entendido como panteón de la memoria bergamasca. El confesionario de Andrea Fantoni, tallado en madera con una extraordinaria complejidad escultórica, es otro punto esencial: sus figuras, relieves y arquitectura miniaturizada muestran hasta qué punto el mobiliario litúrgico podía convertirse en una obra monumental."], "curiosidades": ["La basílica no pertenece formalmente a la diócesis en el mismo sentido que la catedral vecina, sino que mantiene una historia institucional propia ligada a la Misericordia Maggiore. Esta singularidad explica que dos templos de gran importancia se encuentren literalmente uno junto al otro en Piazza Duomo.", "Una meridiana se encuentra bajo el pórtico del Palazzo della Ragione, muy cerca de la basílica, y marca el mediodía solar mediante un rayo de luz. Aunque no pertenece al interior del templo, ayuda a comprender el conjunto de Piazza Duomo como un lugar donde religión, gobierno, astronomía y vida cotidiana permanecían estrechamente relacionados."], "consejos": ["Conviene entrar incluso cuando el tiempo sea limitado, porque el contraste entre exterior e interior es uno de los grandes momentos de la visita a Bérgamo. Para apreciar las taraceas de Lotto es útil comprobar si el coro está accesible o si existe una visita específica. Durante celebraciones religiosas debe mantenerse silencio y puede restringirse el recorrido turístico.", "La iluminación interior es relativamente tenue y puede cambiar según la hora. Conviene dejar unos minutos para que la vista se adapte antes de recorrer las naves. Si se desea observar las taraceas con detalle, resulta útil llevar prismáticos compactos o utilizar el zoom del teléfono sin flash. Debe respetarse cualquier zona reservada al culto y evitar la visita durante celebraciones, conciertos o ensayos, momentos en los que el acceso puede limitarse."]}}, {"name": "CAMPANONE", "fonetica": "cam-pa-NÓ-ne", "lat": 45.704007, "lng": 9.662306, "type": "visita", "meta": {"tiempo": "Entre 20 y 35 minutos.", "horario": "Martes a viernes, de 10:00 a 18:00; sábados, domingos y festivos, de 10:00 a 19:00. Confirmar posibles cambios antes de la visita.", "precio": "Entrada combinada con Palazzo del Podestà y Museo del Cinquecento: 9 € general y 6 € reducida, según la tarifa oficial consultada."}, "sections": {"descripcion": ["El Campanone es la Torre Cívica de Bérgamo y domina Piazza Vecchia con sus 52,76 metros de altura. La subida permite observar de cerca los tejados, patios, iglesias y murallas de la Città Alta, además de comprender la densidad del tejido medieval. Es uno de los mejores miradores urbanos de la ciudad porque se encuentra en pleno centro histórico y ofrece una lectura inmediata de la relación entre Piazza Vecchia y Piazza Duomo."], "historia": ["La torre nació en la Edad Media como torre de una familia poderosa, probablemente los Suardi. Con el tiempo pasó a desempeñar funciones públicas y quedó integrada en el conjunto institucional de la ciudad. Su transformación en torre cívica refleja el paso desde el poder privado de las familias aristocráticas hacia la representación comunal.", "La gran campana fue fundida en el siglo XVII y se convirtió en la mayor de Lombardía. Cada noche, a las diez, la torre hace sonar cien campanadas. La tradición recuerda con ellas el momento en que se cerraban las puertas de la ciudad durante el dominio veneciano.", "La torre perteneció inicialmente a la poderosa familia Suardi y pasó después a manos del municipio, convirtiéndose en símbolo del poder comunal. Como otras torres medievales italianas, combinó funciones defensivas, representativas y de vigilancia. Su aspecto actual es resultado de varias transformaciones, recrecimientos y restauraciones, de modo que no debe imaginarse como una construcción inmóvil desde la Edad Media."], "arquitectura": ["La torre tiene una estructura maciza de piedra y ladrillo que fue modificada y elevada a lo largo del tiempo. La parte superior, más abierta, aloja la campana y permite la vista panorámica. La ascensión puede realizarse mediante escalera y, hasta la primera terraza, mediante ascensor, lo que facilita el acceso a una parte importante del recorrido.", "Con 52,76 metros, la torre sobresale claramente sobre el caserío. El volumen de piedra es austero, pensado para imponer presencia más que para desplegar ornamentación. En la parte superior se abre la cámara de campanas y una terraza panorámica. El ascenso puede realizarse mediante escaleras o ascensor, aunque el último tramo y el acceso a la terraza pueden exigir salvar peldaños."], "arte": ["Desde arriba se distinguen con claridad el Palazzo della Ragione, la Basílica de Santa Maria Maggiore, la Cappella Colleoni, el Baptisterio y la Catedral. Conviene girar lentamente alrededor de la terraza para identificar también la Rocca, San Vigilio, las murallas y la expansión de la Città Bassa."], "curiosidades": ["El nombre Campanone significa literalmente 'gran campana'. Sus cien toques nocturnos no son una recreación ocasional para turistas, sino una tradición todavía viva que forma parte del paisaje sonoro de Bérgamo.", "La gran campana, fundida en el siglo XVII, es considerada la mayor de Lombardía. Cada noche, a las diez, ejecuta más de cien golpes que recuerdan el toque con el que se anunciaba el cierre de las puertas durante el periodo veneciano. La tradición sigue viva aunque la ciudad ya no cierre físicamente sus accesos, convirtiendo un antiguo mecanismo de control urbano en ceremonia sonora."], "consejos": ["La subida merece especialmente la pena con buena visibilidad. A última hora de la tarde la luz sobre los tejados es muy favorable para fotografía. Si se tiene vértigo, la terraza es segura, pero la sensación de altura es notable. La entrada combinada con el Palazzo del Podestà permite visitar ambos espacios sin duplicar el pago.", "La terraza ofrece una de las mejores lecturas del conjunto monumental: desde arriba se distingue la relación entre Piazza Vecchia, Piazza Duomo, los tejados de Santa Maria Maggiore, la Cappella Colleoni, la Rocca y las colinas. En días despejados, la vista se extiende hacia la llanura y los Alpes. Conviene evitar coincidir junto a la campana durante el toque nocturno, porque el volumen es extremadamente intenso."]}}, {"name": "PORTA SAN GIACOMO", "fonetica": "PÓR-ta san YÁ-co-mo", "lat": 45.701229, "lng": 9.663029, "type": "visita", "meta": {"tiempo": "Entre 15 y 30 minutos; más si se continúa por las murallas.", "precio": "Acceso gratuito."}, "sections": {"descripcion": ["Porta San Giacomo es la entrada más escénica de la Città Alta y uno de los símbolos visuales de Bérgamo. Su fachada blanca destaca sobre la piedra gris de las murallas y se reconoce desde la Città Bassa. Llegar caminando por la rampa y atravesar la puerta ofrece una introducción especialmente clara a la condición fortificada de la ciudad."], "historia": ["La puerta forma parte del sistema de murallas construido por la República de Venecia a partir de 1561. Ocupaba el acceso principal para quienes llegaban desde Milán y sustituía a una entrada anterior de época medieval. El proyecto de las fortificaciones buscaba convertir Bérgamo en una plaza capaz de resistir la artillería y controlar el extremo occidental del territorio veneciano.", "La construcción de las murallas fue una operación de enorme impacto. Se derribaron edificios, iglesias y barrios situados en el trazado defensivo. Aunque nunca fueron sometidas a un gran asedio, las fortificaciones conservaron su integridad y hoy forman parte del sitio UNESCO dedicado a las obras defensivas venecianas.", "La puerta actual fue levantada en 1592 y sustituyó a un acceso anterior integrado en la nueva muralla veneciana. Su posición comunicaba la ciudad fortificada con la llanura y con las rutas hacia Milán. La monumentalidad de la fachada exterior no responde únicamente a necesidades militares: debía proyectar la autoridad de Venecia sobre quienes se aproximaban a Bérgamo."], "arquitectura": ["La fachada monumental está revestida con mármol blanco procedente de Zandobbio. Su composición responde a un lenguaje clasicista: gran arco central, pilastras, entablamento y el león de San Marcos, emblema de Venecia. A diferencia de otras puertas, la estructura se aprecia con gran claridad desde la llanura, lo que refuerza su función representativa además de defensiva.", "El puente de acceso y la rampa permiten observar los flancos de la muralla y la relación entre la puerta y el terreno. Desde el exterior se percibe mejor su carácter de fachada ceremonial; desde el interior se entiende su función de paso controlado hacia la ciudad.", "El revestimiento de mármol blanco de Zandobbio contrasta con la piedra oscura de los lienzos defensivos. La composición se organiza mediante un arco central, pilastras, frontón y el león alado de San Marcos, emblema de la República de Venecia. El puente de acceso actual, de fábrica, sustituyó a estructuras anteriores y permite contemplar la puerta frontalmente mientras se asciende desde la ciudad baja."], "arte": ["El punto fotográfico más conocido se encuentra en la rampa exterior, mirando hacia la fachada blanca con la Città Alta al fondo. También merece la pena fotografiar desde la puerta hacia la Città Bassa, especialmente al atardecer."], "curiosidades": ["Es la única de las grandes puertas venecianas de Bérgamo revestida de mármol blanco y la única concebida como acceso principalmente peatonal en su configuración actual.", "El león de San Marcos visible hoy forma parte de la recuperación simbólica del monumento. Tras la caída de la República de Venecia, muchos emblemas fueron destruidos o eliminados. La presencia actual recuerda la larga pertenencia de Bérgamo al dominio veneciano y convierte la puerta en una especie de carta de presentación histórica de la ciudad."], "consejos": ["La mejor experiencia es llegar a pie desde la parte baja. El ascenso tiene pendiente, pero permite ver cómo la puerta va apareciendo sobre la ciudad. A primera hora hay menos gente; al atardecer, la zona se llena por la vista y la luz. Conviene combinarla con un tramo del paseo de las murallas.", "La mejor fotografía general se obtiene desde el tramo inferior del viaducto, utilizando la ligera curva del camino como línea de entrada. Al amanecer suele haber poca gente y luz frontal suave; al atardecer, la vista hacia la llanura gana protagonismo. El pavimento puede estar resbaladizo con lluvia y el paso es compartido con residentes y vehículos autorizados."]}}, {"name": "FUNICOLARE DI SAN VIGILIO - ESTACIÓN INFERIOR", "fonetica": "fu-ni-co-LÁ-re di san vi-YÍ-lio", "lat": 45.7035, "lng": 9.6595, "type": "transporte", "meta": {"tiempo": "Trayecto de aproximadamente 2 minutos; reservar algo más por posibles colas.", "horario": "Los horarios cambian entre temporada de invierno y verano. Deben comprobarse en ATB el mismo día.", "precio": "Integrada en la red de transporte ATB. El billete urbano de una zona cuesta 1,70 € y es válido 75 minutos, según la tarifa oficial consultada."}, "sections": {"descripcion": ["La estación inferior se encuentra cerca de Porta Sant’Alessandro y Colle Aperto. Desde aquí parte el segundo funicular de Bérgamo, diferente del que comunica la Città Bassa con Piazza Mercato delle Scarpe. Su función es superar el último desnivel hasta la colina de San Vigilio, situada por encima de la propia Città Alta."], "historia": ["La línea fue inaugurada el 27 de agosto de 1912 y diseñada por el ingeniero Alessandro Ferretti, figura importante en el desarrollo de funiculares italianos. El trazado tiene unos 630 metros y salva aproximadamente 90 metros de desnivel, con pendientes que varían entre el 10 y el 22 por ciento.", "El funicular de San Vigilio entró en servicio en 1912 para comunicar la parte alta de la ciudad con la colina situada aún más arriba. Su construcción respondió tanto a necesidades de movilidad como al deseo de facilitar el acceso a una zona residencial y panorámica. Tras periodos de cierre y modernización, continúa integrado en la red de transporte público de Bérgamo."], "arquitectura": ["La infraestructura responde a la ingeniería de transporte de comienzos del siglo XX. El recorrido atraviesa una ladera verde y ofrece vistas progresivas sobre las colinas y la llanura. El interés no está solo en el vehículo, sino en la forma en que el trazado conecta el sistema urbano histórico con un paisaje más abierto y residencial.", "El trazado es corto pero salva una pendiente pronunciada mediante una vía que asciende entre muros, jardines y viviendas. La estación inferior, en la zona de Porta Sant’Alessandro, funciona como transición entre el tejido compacto de la Città Alta y el paisaje más abierto de las colinas. El viaje permite observar cómo el caserío se va separando y aparecen vistas hacia las murallas y los valles."], "arte": [], "curiosidades": ["Bérgamo conserva dos funiculares históricos dentro de la red pública: uno entre la ciudad baja y la ciudad alta, y otro entre la Città Alta y San Vigilio. Esta continuidad convierte el funicular en una parte real de la movilidad cotidiana, no únicamente en una atracción turística."], "consejos": ["En fines de semana puede haber cola. Conviene validar correctamente el billete y conservarlo hasta el final. Si el servicio está interrumpido o se quiere caminar, existe un recorrido por Via San Vigilio, aunque la pendiente es apreciable.", "En fines de semana y al atardecer pueden formarse colas. El billete debe validarse y su vigencia depende de la modalidad adquirida. Si la espera es larga, la subida a pie es posible, pero requiere afrontar una pendiente notable; puede reservarse el funicular para la subida y descender caminando por la carretera panorámica."]}}, {"name": "FUNICOLARE DI SAN VIGILIO - ESTACIÓN SUPERIOR", "fonetica": "fu-ni-co-LÁ-re di san vi-YÍ-lio", "lat": 45.7068, "lng": 9.6588, "type": "transporte", "meta": {"tiempo": "Parada breve de 10 a 15 minutos antes de continuar hacia el castillo.", "horario": "El acceso depende del horario de funcionamiento del funicular, variable según temporada.", "precio": "Incluido en el billete ATB válido utilizado para el trayecto."}, "sections": {"descripcion": ["La estación superior desemboca en una terraza panorámica que constituye uno de los miradores más agradables de Bérgamo. Desde aquí la Città Alta se percibe desde una cota superior y pueden distinguirse sus torres, cúpulas, murallas y la extensión de la llanura.", "La llegada marca un cambio de ambiente. Se abandona el centro monumental y se entra en un sector más verde, con villas, jardines, caminos y pequeñas calles en pendiente. El Castello di San Vigilio se encuentra a pocos minutos a pie.", "La estación superior desemboca en un ambiente mucho más tranquilo que el centro monumental. Desde aquí se accede al pequeño núcleo de San Vigilio, a terrazas, restaurantes, caminos y al castillo. La sensación cambia con rapidez: la ciudad compacta deja paso a jardines, villas, muros y vistas abiertas sobre los valles."], "historia": [], "arquitectura": [], "arte": [], "curiosidades": [], "consejos": ["Al salir conviene detenerse primero en la terraza antes de continuar. Para las fotografías, la luz de última hora suele ser especialmente favorable. El tramo hasta el castillo es corto, pero tiene pendiente y pavimento irregular en algunos puntos.", "Antes de alejarse conviene consultar el horario del último servicio, especialmente al final de la tarde. El regreso puede hacerse en funicular o a pie; la bajada ofrece perspectivas diferentes y permite enlazar con Porta Sant’Alessandro y Colle Aperto. En verano es una zona agradable para prolongar la visita cuando el centro histórico está más concurrido."]}}, {"name": "CASTELLO DI SAN VIGILIO", "fonetica": "cas-TÉL-lo di san vi-YÍ-lio", "lat": 45.709193, "lng": 9.651014, "type": "visita", "meta": {"tiempo": "Entre 30 y 50 minutos.", "precio": "Acceso exterior y parque generalmente gratuitos."}, "sections": {"descripcion": ["El Castello di San Vigilio ocupa el punto más alto del sistema de colinas de Bérgamo. Más que un castillo palaciego, es una fortaleza concebida para controlar visualmente la ciudad, las rutas hacia los valles y la llanura. Sus terrazas y restos defensivos ofrecen una de las panorámicas más amplias de todo el recorrido."], "historia": ["La colina tuvo valor estratégico desde época antigua. La fortaleza fue reforzada en la Edad Media y adquirió mayor importancia durante el dominio veneciano, cuando pasó a formar parte del dispositivo defensivo exterior de Bérgamo. Desde esta posición se podía vigilar el territorio antes de que un enemigo alcanzase las murallas de la Città Alta.", "El nombre de San Vigilio procede del santo al que estaba dedicada una antigua iglesia de la zona. La estructura sufrió transformaciones, abandonos y reutilizaciones, por lo que hoy se presenta como un conjunto de restos, torres, muros y espacios abiertos más que como un edificio completamente conservado.", "La colina de San Vigilio fue utilizada como punto fortificado desde época medieval debido a su dominio visual sobre Bérgamo y las rutas circundantes. El castillo fue reforzado por los distintos poderes que controlaron la ciudad, incluidos los Visconti y la República de Venecia. Su función era proteger el acceso septentrional y controlar desde una posición elevada el recinto urbano inferior."], "arquitectura": ["El castillo adopta una planta defensiva adaptada a la cima de la colina. Sus torres y cortinas aprovechan la topografía para dominar las pendientes. La vegetación ha suavizado el carácter militar del lugar, pero todavía se aprecia la lógica de control territorial y la conexión visual con las murallas de Bérgamo.", "La fortaleza conserva un recinto irregular con torres, murallas y espacios abiertos adaptados a la forma de la colina. Parte de las estructuras ha desaparecido o fue transformada, pero todavía se entiende la lógica defensiva: dominar las pendientes, controlar caminos y ofrecer amplios campos de visión. Los pasos interiores, túneles y plataformas crean una experiencia distinta de las plazas monumentales de la Città Alta."], "arte": ["Lo más importante es recorrer los distintos niveles de las terrazas y buscar las vistas hacia la Città Alta, los Prealpes Orobios y, en días despejados, la llanura hasta Milán. Los restos de muros y torres funcionan como marcos naturales para la fotografía."], "curiosidades": ["San Vigilio no es únicamente un mirador. El paisaje que se contempla explica por qué Bérgamo tuvo valor estratégico: hacia el sur se abre la llanura lombarda; hacia el norte aparecen valles y primeras elevaciones alpinas. En días claros puede percibirse la enorme distancia entre ambos ámbitos geográficos."], "consejos": ["Es un lugar especialmente recomendable al final de la tarde. El pavimento puede ser irregular y algunas zonas tienen escaleras, por lo que conviene llevar calzado cómodo. La visita gana mucho con buena visibilidad; en días de niebla o lluvia el interés panorámico disminuye.", "El castillo se disfruta mejor con luz de tarde. Algunos recorridos presentan peldaños, suelos irregulares y zonas sin sombra. Conviene llevar agua en verano y extremar la precaución si ha llovido. La visita puede combinarse con un paseo por las calles de San Vigilio y un regreso a pie hacia Colle Aperto."]}}, {"name": "ROCCA DI BERGAMO", "fonetica": "RÓC-ca di BÉR-ga-mo", "lat": 45.703894, "lng": 9.666691, "type": "visita", "meta": {"tiempo": "Entre 40 y 70 minutos.", "horario": "Museo: de martes a domingo y festivos, de 11:00 a 18:00. Parque: todos los días, de 8:00 a 21:00, según la información oficial consultada.", "precio": "Parque gratuito. Museo: 5 € tarifa general; entrada gratuita para menores de 18 años, según la tarifa oficial consultada."}, "sections": {"descripcion": ["La Rocca se alza sobre la colina de Sant’Eufemia, en el extremo oriental de la Città Alta. Su posición permite una vista de 360 grados sobre el casco histórico, los valles, los Prealpes y la llanura. El conjunto combina fortaleza medieval, parque conmemorativo y museo dedicado al siglo XIX y a la formación de la Italia contemporánea."], "historia": ["La fortaleza actual comenzó a construirse en 1331 por iniciativa de Juan de Luxemburgo, rey de Bohemia, en un momento de fuertes tensiones entre facciones urbanas. Posteriormente fue ampliada por los Visconti y adaptada por Venecia. La Rocca formaba un sistema defensivo complementario a la Cittadella, situada en el lado opuesto de la ciudad.", "Durante el Risorgimento y las guerras de independencia, Bérgamo adquirió fama por la elevada participación de sus habitantes en la expedición de los Mil de Garibaldi. El parque que rodea la fortaleza se convirtió en un espacio de memoria dedicado a los caídos, mientras el interior alberga una sección del Museo delle Storie centrada en el siglo XIX.", "La Rocca ocupa la colina de Sant’Eufemia, uno de los puntos más antiguos y estratégicos de Bérgamo. Las estructuras actuales se desarrollaron principalmente a partir del siglo XIV, durante el dominio de los Visconti, y fueron adaptadas posteriormente por Venecia. El lugar concentró funciones militares y de vigilancia hasta época moderna.", "En el siglo XX la fortaleza adquirió también un fuerte valor conmemorativo. El parque y el museo recuerdan el Risorgimento, la unificación italiana y la participación bergamasca en las campañas garibaldinas. Bérgamo es conocida como la “Città dei Mille” por el elevado número de voluntarios de la provincia que participaron en la expedición de los Mil de Garibaldi en 1860."], "arquitectura": ["La estructura conserva una poderosa masa de piedra con torres, patios y recorridos sobre las murallas. Su forma responde a varias fases constructivas y a la adaptación continua de una fortificación medieval. En el subsuelo y entorno se conservan también huellas de épocas anteriores, incluida una cisterna romana visitable dentro del complejo.", "El recinto presenta muros macizos, torres, plataformas y patios organizados sobre la cima. Su aspecto es más compacto que el de las murallas venecianas, porque responde a una fortificación medieval y bajomedieval adaptada gradualmente. Desde el camino de ronda se obtiene una lectura excepcional de tejados, campanarios, cúpulas y del perfil de San Vigilio."], "arte": ["El principal atractivo exterior es el paseo por la parte alta de la fortaleza. Desde allí se reconocen el Campanone, Santa Maria Maggiore, la cúpula de la Catedral, San Vigilio y el perfil de los Alpes. En el parque hay piezas de artillería y monumentos conmemorativos que muestran la transformación de una fortaleza en lugar de memoria nacional.", "El parque exterior contiene piezas de artillería, monumentos y elementos conmemorativos. En el interior, el Museo dell’Ottocento reúne documentos, armas, uniformes, retratos y objetos relacionados con el Risorgimento. Incluso sin visitar el museo, conviene recorrer el perímetro para entender el papel de la fortaleza dentro del sistema defensivo urbano."], "curiosidades": [], "consejos": ["Conviene subir con tiempo y recorrer todo el perímetro, no limitarse a la entrada. La subida desde Piazza Mercato delle Scarpe es corta pero empinada. Para fotografía, la mañana favorece las vistas hacia el casco histórico y la tarde ilumina mejor la llanura.", "Es uno de los mejores miradores gratuitos de la Città Alta. La luz de última hora favorece las vistas hacia las torres y montañas, mientras por la mañana se fotografía mejor la llanura. Los senderos del parque tienen desniveles y el acceso a determinados tramos puede cerrarse por mantenimiento o condiciones meteorológicas."]}}, {"name": "PALAZZO E GIARDINI MORONI", "fonetica": "pa-LÁT-tso e yar-DÍ-ni mo-RÓ-ni", "lat": 45.703312, "lng": 9.667798, "type": "visita", "meta": {"tiempo": "Entre 60 y 90 minutos.", "horario": "De miércoles a domingo, de 10:00 a 18:00; último acceso a las 17:00. Entre el 6 de abril y el 26 de octubre de 2026 abre también los lunes, según FAI.", "precio": "La tarifa puede variar según modalidad y exposiciones. Conviene consultar y reservar en la web oficial del FAI."}, "sections": {"descripcion": ["Palazzo Moroni es una de las residencias históricas mejor conservadas de Bérgamo y permite entrar en el mundo de una familia aristocrática del siglo XVII. El interés del conjunto reside en la continuidad entre salas decoradas, mobiliario, colección pictórica, jardín formal y una sorprendente 'ortaglia', una amplia zona agrícola escalonada dentro de la Città Alta.", "A diferencia de un museo formado por objetos trasladados, el palacio conserva una relación muy fuerte entre arquitectura, decoración y forma de vida. Los salones, escaleras y galerías ayudan a entender cómo una familia acomodada utilizaba el arte para construir prestigio y memoria."], "historia": ["La familia Moroni, enriquecida gracias al comercio y la producción textil, levantó el palacio durante el siglo XVII en Via Porta Dipinta. El edificio fue ampliado y decorado para expresar la posición social alcanzada por la familia. Durante generaciones se conservaron allí pinturas, documentos, mobiliario y objetos vinculados a la casa.", "El conjunto pasó al FAI, Fondo per l’Ambiente Italiano, que emprendió una restauración y apertura progresiva al público. La recuperación ha permitido mostrar no solo las salas nobles, sino también jardines, huertos, terrazas y áreas de servicio, ofreciendo una lectura más completa de la residencia.", "El palacio fue construido y transformado entre los siglos XVII y XVIII por la familia Moroni, enriquecida mediante actividades comerciales y agrícolas. La residencia permite comprender el modo de vida de una familia aristocrática bergamasca y la relación entre vivienda urbana, representación social y propiedad de tierras. A diferencia de muchos palacios convertidos en museos mediante colecciones ajenas, aquí se conserva una notable continuidad entre edificio, mobiliario, archivos y obras de arte familiares."], "arquitectura": ["El palacio presenta una arquitectura residencial barroca organizada alrededor de patios, escaleras y ejes visuales. En el interior destacan los frescos alegóricos del siglo XVII, realizados por Gian Giacomo Barbelli, que amplían ilusoriamente las salas mediante arquitecturas pintadas, figuras mitológicas y efectos teatrales.", "El jardín italiano se estructura mediante terrazas, setos, escaleras y perspectivas controladas. Más allá se extiende la ortaglia, una rara supervivencia de paisaje agrícola dentro de una ciudad histórica amurallada. Esta transición desde el salón decorado hacia el campo cultivado es uno de los aspectos más singulares del lugar.", "La secuencia de salas se organiza mediante perspectivas, puertas alineadas, escaleras y salones decorados. Los frescos de Gian Giacomo Barbelli crean arquitecturas fingidas, alegorías y escenas mitológicas que amplían visualmente los espacios. Estucos, tejidos, mobiliario y pinturas completan un interior concebido para impresionar a invitados y afirmar el rango de los propietarios.", "Detrás del palacio se extienden jardines en terrazas y una amplia ortaglia, combinación de huerto, vergel y espacio agrícola. Este paisaje constituye uno de los aspectos más singulares del conjunto: desde el centro amurallado se pasa a un ámbito verde que conserva vistas, cultivos y una escala casi rural. La relación entre arquitectura y terreno es tan importante como las salas interiores."], "arte": ["La colección conserva importantes retratos de Giovan Battista Moroni, uno de los grandes pintores lombardos del siglo XVI, entre ellos el célebre Caballero de rosa y el retrato de Isotta Brembati. Conviene observar la precisión con la que el artista representa tejidos, joyas, gestos y personalidad, rasgo que explica su fama como retratista.", "La colección incluye retratos de Giovan Battista Moroni, uno de los grandes pintores lombardos del siglo XVI y sin relación familiar directa con los propietarios pese a compartir apellido. Sus retratos se distinguen por la atención al carácter del modelo, la precisión de tejidos y objetos, y una sobriedad que evita la idealización excesiva. Verlos dentro de una residencia histórica permite apreciar mejor su función social."], "curiosidades": ["El apellido de la familia y el del pintor Giovan Battista Moroni coinciden, pero no deben confundirse: el artista no era miembro directo de la familia propietaria. La colección fue reunida por los Moroni y reforzó el prestigio cultural del palacio."], "consejos": ["Es recomendable reservar, especialmente en fin de semana. El recorrido incluye interiores y jardines, por lo que conviene calcular al menos una hora. El palacio se encuentra en ZTL; el FAI recomienda dejar el coche en la Città Bassa y subir en funicular. La entrada está a pocos minutos de la estación superior del funicular urbano.", "La visita requiere más tiempo del que sugiere la fachada. Conviene reservar al menos una hora y media si están abiertos tanto el palacio como los jardines. Los recorridos pueden variar según temporada y conservación. En días calurosos, el jardín resulta agradable, pero algunas terrazas tienen pendientes y pavimentos irregulares."]}}, {"name": "CAPPELLA COLLEONI", "fonetica": "cap-PÉL-la col-le-Ó-ni", "lat": 45.703492, "lng": 9.662171, "type": "visita", "meta": {"tiempo": "Entre 20 y 35 minutos.", "horario": "El horario puede variar por celebraciones. Conviene comprobarlo en la web oficial o en la información turística local.", "precio": "Acceso habitualmente gratuito; pueden solicitarse donativos."}, "sections": {"descripcion": ["La Cappella Colleoni es uno de los grandes manifiestos del Renacimiento lombardo. Su fachada de mármoles blancos, rojos y negros parece comprimirse entre la Basílica de Santa Maria Maggiore y los edificios de Piazza Duomo, pero su densidad escultórica y cromática la convierte en el punto visual dominante del conjunto.", "Fue concebida como mausoleo de Bartolomeo Colleoni, capitán mercenario al servicio de Venecia, y como capilla dedicada a los santos Bartolomé, Marcos y Juan Bautista. Todo el edificio expresa poder, prestigio militar, devoción y deseo de permanencia."], "historia": ["Bartolomeo Colleoni encargó la capilla en la década de 1470 a Giovanni Antonio Amadeo, uno de los arquitectos y escultores más destacados del Renacimiento lombardo. Para construirla se ocupó el lugar de una antigua sacristía de Santa Maria Maggiore, decisión que dio origen a tensiones con la institución responsable de la basílica.", "Colleoni murió en 1475. Su sepulcro monumental se convirtió en el centro simbólico del edificio. También se trasladó a la capilla la tumba de su hija Medea, fallecida joven, cuya presencia introduce una dimensión íntima dentro del programa de exaltación pública del condottiero.", "Bartolomeo Colleoni fue uno de los condotieros más célebres del siglo XV. Sirvió principalmente a la República de Venecia y acumuló riqueza, propiedades y prestigio militar. Al final de su vida quiso establecer en el corazón religioso de Bérgamo un mausoleo que asegurase su memoria y la de su hija Medea. La capilla fue construida a partir de 1472 por Giovanni Antonio Amadeo, uno de los grandes escultores y arquitectos del Renacimiento lombardo."], "arquitectura": ["La fachada combina mármoles policromos, geometrías, relieves, columnas, medallones y ventanas profundamente decoradas. La composición enlaza tradición gótica lombarda y lenguaje renacentista. Los motivos escultóricos incluyen escenas bíblicas, trabajos de Hércules, figuras alegóricas y emblemas asociados a Colleoni.", "El interior adopta una planta centralizada con cúpula, concebida para concentrar la atención en los monumentos funerarios. Las decoraciones posteriores, especialmente las pinturas de Giambattista Tiepolo en el siglo XVIII, enriquecieron el espacio sin borrar la estructura renacentista.", "La fachada combina mármoles blancos, rosados y negros en una superficie de extraordinaria densidad. Rombos, medallones, columnas, relieves, ventanas y motivos geométricos producen un efecto casi textil. El lenguaje renacentista convive con una exuberancia decorativa heredera del gótico lombardo. La fachada debe leerse de cerca, pero también desde el extremo de Piazza Duomo, donde se comprende su contraste con la piedra de Santa Maria Maggiore."], "arte": ["El monumento funerario de Bartolomeo Colleoni combina sarcófagos superpuestos, esculturas y una estatua ecuestre dorada. La tumba de Medea, obra delicada y contenida, contrasta con la imagen militar del padre. En la cúpula y pechinas deben buscarse los frescos de Tiepolo, de colores luminosos y movimiento aéreo.", "En el interior se encuentra el gran monumento funerario de Colleoni, con sarcófagos superpuestos y una estatua ecuestre de madera dorada. La tumba de Medea, trasladada desde otra iglesia, posee una delicadeza distinta y conserva la memoria de la hija fallecida prematuramente. Los frescos de la cúpula fueron realizados por Giambattista Tiepolo en el siglo XVIII y añaden una capa luminosa y aérea al espacio renacentista."], "curiosidades": ["En la reja exterior aparece el escudo de Colleoni con tres formas interpretadas tradicionalmente como testículos, un juego heráldico relacionado con su apellido. Tocarlas se ha convertido en una superstición turística asociada a la buena suerte, aunque conviene hacerlo con respeto y sin obstaculizar el acceso.", "Durante siglos se creyó que el cuerpo de Colleoni no estaba dentro del monumento porque las búsquedas no encontraban el féretro. En 1969 se descubrió finalmente detrás de una placa, dentro del propio conjunto funerario. En la reja exterior aparece el escudo del condotiero con tres testículos, un juego heráldico relacionado con su apellido. Tocarlos se ha convertido en un gesto popular asociado a la buena suerte, aunque debe hacerse con respeto y sin obstaculizar la entrada."], "consejos": ["La fachada merece observarse desde muy cerca para distinguir los relieves, pero también desde el extremo opuesto de Piazza Duomo para comprender su relación con la basílica. El interior es pequeño y puede llenarse rápidamente; conviene entrar a primera hora o aprovechar un momento de menor afluencia.", "La capilla es pequeña y puede llenarse con rapidez. Conviene entrar a primera hora o después de la pausa del mediodía. La fotografía interior suele estar restringida, por lo que es preferible observar con calma. En el exterior, la mejor luz para la fachada depende de la estación; la plaza estrecha obliga a utilizar un gran angular o a buscar una perspectiva oblicua."]}}, {"name": "BATTISTERO DI BERGAMO", "fonetica": "bat-tis-TÉ-ro di BÉR-ga-mo", "lat": 45.7038, "lng": 9.6634, "type": "visita", "meta": {"tiempo": "Entre 10 y 20 minutos.", "horario": "La apertura interior no siempre coincide con la del resto de monumentos de Piazza Duomo. Puede contemplarse exteriormente en cualquier momento.", "precio": "Exterior gratuito; el acceso interior depende de la modalidad de visita vigente."}, "sections": {"descripcion": ["El Baptisterio es un pequeño edificio octogonal situado frente a la Catedral. Su escala contenida contrasta con la densidad monumental de Piazza Duomo, pero constituye una pieza esencial para entender la evolución del conjunto religioso."], "historia": ["Fue realizado en 1340 por Giovanni da Campione para el interior de la Basílica de Santa Maria Maggiore. A lo largo de los siglos fue desmontado, trasladado y recompuesto varias veces. Finalmente se instaló en su ubicación actual a finales del siglo XIX, adaptando algunos elementos y creando una presencia autónoma en la plaza.", "Su historia de desplazamientos explica por qué, aunque parece concebido para el lugar que ocupa, no forma parte de la configuración medieval original de Piazza Duomo.", "El baptisterio fue realizado en 1340 por Giovanni da Campione para el interior de Santa Maria Maggiore. Cuando el edificio dejó de cumplir adecuadamente su función en aquella ubicación, fue desmontado y trasladado varias veces. Desde finales del siglo XIX ocupa el centro de Piazza Duomo, frente a la catedral, una posición que parece antigua pero es relativamente reciente."], "arquitectura": ["La planta octogonal alude a la tradición cristiana del 'octavo día', símbolo de resurrección y nueva vida a través del bautismo. El edificio combina mármol rojo de Verona, piedra clara, columnas y una galería de pequeñas figuras. El exterior presenta un ritmo muy cuidado de arcos, tracerías y esculturas.", "En el interior se conserva la pila bautismal y un programa escultórico relacionado con los sacramentos y la vida de Cristo. La escala íntima favorece una lectura cercana de los detalles.", "La construcción es octogonal, forma tradicionalmente asociada al bautismo y a la idea del “octavo día”, símbolo de resurrección y vida nueva. El mármol rojizo de Verona se combina con piedra clara, columnas, arcos y esculturas. En la parte superior, figuras de virtudes y otros elementos crean una corona escultórica que debe observarse rodeando el edificio."], "arte": ["Conviene observar las ocho estatuas de las Virtudes y los relieves de la vida de Cristo. El contraste entre el mármol rojizo y las piezas claras ayuda a destacar la geometría del edificio.", "Los relieves y esculturas muestran el refinamiento del taller de los Campionesi, maestros activos en numerosos edificios lombardos. El interior conserva la pila bautismal y una organización espacial concentrada. Aunque no siempre está abierto, el exterior ofrece suficiente información para comprender su función y su lenguaje gótico."], "curiosidades": ["Su historia de desmontajes y traslados explica algunas de las aparentes irregularidades del conjunto. Es un buen ejemplo de cómo un monumento puede cambiar de contexto y adquirir una lectura completamente distinta: de elemento interior de una basílica pasó a convertirse en pieza autónoma que ordena una plaza."], "consejos": ["Aunque esté cerrado, merece la pena rodearlo completamente. Desde el lado de la Catedral se obtiene una buena vista conjunta con la Cappella Colleoni y Santa Maria Maggiore."]}}, {"name": "CATTEDRALE DI SANT’ALESSANDRO", "fonetica": "cat-te-DRÁ-le di san-ta-les-SÁN-dro", "lat": 45.703464, "lng": 9.662711, "type": "visita", "meta": {"tiempo": "Entre 25 y 45 minutos.", "horario": "El horario puede variar por misas y celebraciones. Conviene comprobar la información de la diócesis antes de la visita.", "precio": "Acceso normalmente gratuito."}, "sections": {"descripcion": ["La Catedral de Bérgamo está dedicada a San Alejandro, patrón de la ciudad. Comparte Piazza Duomo con Santa Maria Maggiore y la Cappella Colleoni, lo que puede hacer que pase injustamente desapercibida. Su interior blanco, luminoso y de proporciones clasicistas ofrece un contraste marcado con la decoración más densa de la basílica vecina."], "historia": ["El edificio ocupa un área vinculada desde la Antigüedad al núcleo religioso de la ciudad. La catedral medieval estuvo dedicada inicialmente a San Vicente. Después de que la construcción de las murallas venecianas provocara la demolición de la antigua catedral de San Alejandro, ambas tradiciones se unificaron y el templo pasó a asumir la dedicación al patrón.", "La construcción y transformación se prolongaron durante siglos. El proyecto renacentista se asocia a Filarete, aunque el edificio fue modificado por numerosos arquitectos. La cúpula y la fachada adquirieron su forma definitiva en épocas posteriores, especialmente entre los siglos XVII y XIX.", "La catedral está dedicada a san Alejandro, patrón de Bérgamo y mártir según la tradición local. La sede episcopal actual se consolidó después de complejos cambios medievales y de la desaparición de antiguas iglesias catedralicias. El edificio fue reconstruido y ampliado desde el siglo XV, con intervenciones de Filarete, Carlo Fontana y otros arquitectos, y recibió su configuración definitiva a lo largo de varios siglos."], "arquitectura": ["La fachada es neoclásica y se organiza mediante columnas, frontón y esculturas. El interior presenta una nave única amplia con capillas laterales y cúpula sobre el crucero. El uso de mármoles claros, estucos y luz cenital crea una atmósfera más unitaria que la de Santa Maria Maggiore.", "La fachada neoclásica, terminada en el siglo XIX, contrasta con la variedad estilística del entorno. El interior presenta una nave amplia con capillas laterales, crucero y cúpula. Mármoles, estucos, pinturas y altares crean un espacio más regular y luminoso que Santa Maria Maggiore. La cúpula, visible desde diferentes puntos de la ciudad, es una referencia importante en el perfil de la Città Alta."], "arte": ["Entre las obras destacadas se encuentran pinturas de Giambattista Tiepolo y Giovan Battista Moroni, además de la capilla dedicada al papa san Juan XXIII, nacido en la provincia de Bérgamo. En la cripta y áreas arqueológicas se conservan testimonios de edificios anteriores, aunque el acceso puede depender de visitas específicas.", "Entre las obras principales se encuentran pinturas de Giambattista Tiepolo, Giovan Battista Moroni, Andrea Previtali y otros artistas vinculados a Lombardía y Venecia. Debe prestarse atención a la capilla de san Alejandro, a las reliquias del patrón y al tesoro catedralicio cuando sea accesible. Bajo el edificio se conservan restos arqueológicos que ayudan a reconstruir las fases anteriores del complejo episcopal."], "curiosidades": ["La cercanía entre catedral y basílica refleja una historia institucional compleja: durante siglos coexistieron espacios religiosos con funciones y administraciones diferentes dentro de una plaza muy reducida.", "La proximidad entre la c
